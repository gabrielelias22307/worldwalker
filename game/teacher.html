<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worldwalker · Teacher Console</title>
<link rel="stylesheet" href="engine/style.css">
<style>
  .tc{max-width:1280px;margin:0 auto;padding:12px 14px 40px;color:var(--text)}
  .tc-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .tc-top .logo{font-family:var(--pix);color:var(--gold);font-size:clamp(14px,2.6vw,20px);text-decoration:none}
  .tc-top .sub{font-family:var(--pix);font-size:9px;color:var(--muted)}
  .tc-top .right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
  .tc button,.tc .btn{font:inherit;font-size:14px;font-weight:700;padding:7px 11px;border:2px solid #000;border-radius:4px;cursor:pointer;background:var(--panel2);color:#fff;text-decoration:none;display:inline-block}
  .tc button.on,.tc .btn.gold{background:var(--gold);color:var(--ink)}
  .tc .btn.teal{background:var(--teal)}
  .tbox{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:14px}
  .muted{color:var(--muted);font-size:14px}
  .msg{font-size:14px;color:#7cc451}.msg.bad{color:#ff8f7a}
  .gate{max-width:420px;margin:40px auto}
  .gate input{font:inherit;font-size:16px;padding:8px 10px;border:2px solid #000;border-radius:4px;width:100%;margin:8px 0}
  .layout{display:grid;grid-template-columns:250px 1fr;gap:16px;align-items:start}
  @media (max-width:860px){.layout{grid-template-columns:1fr}}
  .side{position:sticky;top:10px;max-height:calc(100vh - 20px);overflow:auto}
  @media (max-width:860px){.side{position:static;max-height:none}}
  .realm{margin-bottom:10px}
  .realm h3{font-size:13px;margin:0 0 5px;padding:4px 8px;border-radius:4px;color:#fff}
  .realm .eps{display:grid;gap:4px}
  .ep{display:grid;grid-template-columns:40px 1fr;gap:6px;align-items:center;text-align:start;font-weight:400!important;font-size:13.5px!important;padding:6px 8px!important;background:#29264a!important;line-height:1.25}
  .ep .id{font-family:var(--pix);font-size:9px;color:var(--gold)}
  .ep.sel{background:#4a3d12!important;border-color:var(--gold)!important}
  @media (max-width:860px){.realm .eps{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
  h1.et{font-size:clamp(20px,3vw,28px);margin:0}
  .kicker{font-family:var(--pix);font-size:10px;color:var(--gold);line-height:1.6}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .chip{font-size:13px;background:#0b0a14;border:1px solid var(--line);border-radius:12px;padding:3px 10px}
  .jump{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 4px}
  .mapwrap{margin:12px 0;overflow:auto;border:3px solid #000;border-radius:6px;background:#000}
  #map{display:block;width:100%;height:auto;image-rendering:pixelated}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
  .legend b{display:inline-block;min-width:18px;text-align:center;border-radius:9px;color:#000;font-size:11px;padding:1px 4px;margin-inline-end:3px}
  section.part{margin-top:18px}
  section.part>h2{font-family:var(--pix);font-size:12px;color:var(--gold);margin:0 0 10px;line-height:1.6}
  .say{background:var(--paper);color:var(--ink);border-radius:6px;padding:10px 12px;margin:6px 0;font-size:15px;line-height:1.5}
  .word{background:#ffe9a6;border-bottom:2px solid var(--gold);padding:0 2px;border-radius:2px}
  .people{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  @media (max-width:420px){.people{grid-template-columns:1fr}}
  .person h3{margin:0 0 2px;font-size:17px;display:flex;gap:8px;align-items:center}
  .num{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:12px;background:var(--gold);color:var(--ink);font-size:13px;font-weight:700;flex:none}
  .q{font-weight:700;margin:10px 0 6px}
  ul.ans{list-style:none;padding:0;margin:0;display:grid;gap:5px}
  ul.ans li{padding:6px 9px;border-radius:5px;background:#29264a;font-size:14.5px;line-height:1.4}
  ul.ans li.ok{background:#1f3d2a;outline:2px solid #7cc451;color:#e4f9d8;font-weight:700}
  ul.ans li .why{display:block;font-size:13px;color:var(--muted);margin-top:2px}
  ul.ans li.ok::before{content:'✔ ';color:#7cc451;font-weight:700}
  table.k{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0}
  table.k th,table.k td{border:1px solid var(--line);padding:6px 8px;text-align:start;vertical-align:top}
  table.k th{background:#29264a}
  .tag{font-size:12px;font-weight:700;border-radius:4px;padding:1px 6px;background:#29264a;white-space:nowrap}
  .tag.ok{background:#1f3d2a;color:#9be07a}.tag.no{background:#4a1f1f;color:#ff9a8a}
  ol.order li{margin:4px 0}
  .bossq{margin-bottom:12px}
  .words{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));font-size:14px}
  .words div{background:#29264a;border-radius:5px;padding:6px 9px}
  [dir=rtl] .say,[dir=rtl] body{font-family:var(--read)}
  @media print{
    body{background:#fff;color:#000}
    .tc{color:#000;max-width:none;padding:0}
    .tc-top .right,.side,.jump,.noprint{display:none!important}
    .layout{display:block}
    .tbox{background:#fff;border:1px solid #999}
    .muted,ul.ans li .why{color:#333}
    .chip{background:#fff}
    ul.ans li,table.k th,.words div{background:#fff;border:1px solid #ccc}
    ul.ans li.ok{background:#e6f5df;outline:2px solid #3a8a2a;color:#000}
    .kicker,section.part>h2{color:#7a5a00}
    .person,.bossq{break-inside:avoid}
  }
</style>
</head>

  function gate() {
    $('body').innerHTML = `<div class="tbox gate"><p>${esc(HT('gate'))}</p><input id="tcode" autocomplete="off" aria-label="teacher code"><button class="btn gold" id="tgo">${esc(HT('open'))}</button>${msg ? `<p class="msg bad">${esc(msg)}</p>` : ''}</div>`;
    const go = () => {
      if ($('tcode').value.trim().toUpperCase() === String(WW.CONFIG.TEACHER_CODE).toUpperCase()) { WW.save.teacher = true; WW.store(); msg = ''; }
      else msg = HT('wrong');
      render();
    };
    $('tgo').onclick = go; $('tcode').onkeydown = e => { if (e.key === 'Enter') go(); }; $('tcode').focus();
  }

  function render() {
    document.documentElement.dir = WW.dir();
    top();
    if (!WW.save.teacher) return gate();
    let side = '';
    for (let r = 1; r <= 8; r++) {
      side += `<div class="realm"><h3 style="background:${REALM_COL[r]}">${r} · ${esc(L(WW.REALMS[r]))}</h3><div class="eps">`;
      WW.EPISODES.filter(e => e.realm === r).forEach(e => {
        const c = cat[e.id];
        side += `<button class="ep ${e.id === sel ? 'sel' : ''}" data-ep="${e.id}"><span class="id">${e.id}</span><span>${c ? esc(L(c.title)) : '…'}</span></button>`;
      });
      side += '</div></div>';
    }
    $('body').innerHTML = `<div class="layout"><aside class="tbox side">${side}</aside><main class="tbox" id="main"><p class="muted">${esc(HT('loading'))}</p></main></div>`;
    document.querySelectorAll('[data-ep]').forEach(b => (b.onclick = () => { sel = b.dataset.ep; history.replaceState(null, '', '#ep=' + sel); msg = ''; render(); }));
    loadEp(sel).then(ep => { if (ep.id === sel) showEp(ep); }).catch(e => { $('main').innerHTML = `<p class="msg bad">${esc(e.message)}</p>`; });
  }

  function answers(choices, isOk, why) {
    return `<ul class="ans">${choices.map((c, i) => `<li class="${isOk(c, i) ? 'ok' : ''}">${rich(c.t || c)}${why && why(c, i) ? `<span class="why">${rich(why(c, i))}</span>` : ''}</li>`).join('')}</ul>`;
  }

  const costTxt = c => Object.entries(c || {}).map(([k, n]) => `${n} ${k}`).join(' + ');
  const WBASE = { carry: 'sort', route: 'order', site: 'claim', survey: 'table', levers: 'combo' };
  function stoneKey(ch, ep) {
    let h = '';
    if (WBASE[ch.type]) {
      if (ch.type === 'carry') h += `<p class="muted">${(ch.zones || []).map(z => { const b = ch.bins.find(o => o.id === z.bin); return `${b.icon || ''} ${esc(L(b.label))}: (${z.x}, ${z.y}) ${z.w}×${z.h}`; }).join(' · ')}</p>`;
      return h + `<p class="muted">${esc(HT('worldNote'))}</p>` + stoneKey(Object.assign({}, ch, { type: WBASE[ch.type] }), ep);
    }
    if (ch.type === 'build') {
      const g = ch.grid, gl = t => (typeof t === 'string' ? t : L(t));
      h += `<table class="k"><tr><th>${esc(HT('sign'))}</th><th>${esc(HT('rightSpot'))}</th></tr>`;
      (ch.items || []).map(id => (ep.build || []).find(b => b.id === id)).filter(Boolean).forEach(b => {
        h += `<tr><td><b>${rich(b.text)}</b><div class="muted">${esc(HT('cost'))}: ${esc(costTxt(b.cost))}</div></td><td>${b.ok.map(p => '(' + p.join(', ') + ')').join(' ')}<span class="why">${rich(b.why)}</span></td></tr>`;
      });
      h += '</table>';
      if (g) h += `<p class="muted">🗺️ ${esc(HT('gridNote'))} (${g.x}, ${g.y}): ${g.rows.map(gl).map(esc).join(' / ')} × ${g.cols.map(gl).map(esc).join(' / ')}</p>`;
      if (ch.fallback) h += `<h3>${esc(HT('fallback'))}</h3>` + stoneKey(Object.assign({}, ch, ch.fallback), ep);
      return h;
    }
    if (ch.type === 'sort') {
      h += `<table class="k"><tr><th>${esc(HT('group'))}</th><th>${esc(HT('cards'))}</th></tr>`;
      ch.bins.forEach(b => {
        h += `<tr><td>${b.icon || ''} <b>${rich(b.label)}</b>${b.sub ? `<div class="muted">${rich(b.sub)}</div>` : ''}</td><td><ul class="ans">${ch.items.filter(it => it.bin === b.id).map(it => `<li>${rich(it.t)}${it.why ? `<span class="why">${rich(it.why)}</span>` : ''}</li>`).join('')}</ul></td></tr>`;
      });
      h += '</table>';
    } else if (ch.type === 'order') {
      h += `<p class="q">${esc(HT('rightOrder'))}</p><ol class="order">${ch.items.map(it => `<li>${it.icon || ''} ${rich(it.t)}</li>`).join('')}</ol>`;
      if (ch.why) h += `<p class="muted"><b>${esc(HT('ifWrong'))}:</b> ${rich(ch.why)}</p>`;
    } else if (ch.type === 'claim') {
      h += `<p class="q">${esc(HT('options'))}</p><ol>${ch.options.map(o => `<li>${o.icon || ''} <b>${rich(o.name)}</b>${o.desc ? ` — ${rich(o.desc)}` : ''}${o.result ? `<div class="muted">${rich(o.result)}</div>` : ''}</li>`).join('')}</ol>`;
      const kindName = id => { const k = (ch.kinds || []).find(k => k.id === id); return k ? L(k.label) : id; };
      h += `<p class="q">${esc(HT('reasons'))}</p><table class="k"><tr><th>${esc(HT('kind'))}</th><th>${esc(HT('reasons'))}</th><th>${esc(HT('fits'))}</th></tr>`;
      ch.reasons.forEach(r => {
        const fits = (r.fits || []).length ? r.fits.map(i => `<span class="tag ok">${i + 1}</span>`).join(' ') : `<span class="tag no">${esc(HT('fitsNone'))}</span>`;
        h += `<tr><td>${esc(kindName(r.kind))}</td><td>${rich(r.t)}${r.why ? `<div class="muted">${rich(r.why)}</div>` : ''}</td><td>${fits}</td></tr>`;
      });
      h += '</table>';
      if (ch.mismatch) h += `<p class="muted"><b>${esc(HT('mismatch'))}:</b> ${rich(ch.mismatch)}</p>`;
    } else if (ch.type === 'combo') {
      h += `<p class="q">${esc(HT('switches'))}</p><ul>${ch.switches.map(s => `<li>${s.icon || ''} <b>${rich(s.name)}</b>: ${s.states.map((st, i) => `${i === (s.start || 0) ? '<u>' : ''}${rich(st)}${i === (s.start || 0) ? '</u>' : ''}`).join(' / ')}</li>`).join('')}</ul>`;
      h += `<p class="q">${esc(HT('settings'))}</p><table class="k"><tr>${ch.switches.map(s => `<th>${rich(s.name)}</th>`).join('')}<th></th></tr>`;
      Object.entries(ch.results || {}).forEach(([key, res]) => {
        const st = key.split(',').map(Number);
        h += `<tr>${ch.switches.map((s, i) => `<td>${rich(s.states[st[i]])}</td>`).join('')}<td><span class="tag ${res.ok ? 'ok' : 'no'}">${esc(HT(res.ok ? 'works' : 'fails'))}</span> ${rich(res.t)}</td></tr>`;
      });
      if (ch.otherwise) h += `<tr><td colspan="${ch.switches.length}"><i>${esc(HT('otherwise'))}</i></td><td><span class="tag ${ch.otherwise.ok ? 'ok' : 'no'}">${esc(HT(ch.otherwise.ok ? 'works' : 'fails'))}</span> ${rich(ch.otherwise.t)}</td></tr>`;
      h += '</table>';
    } else if (ch.type === 'table') {
      const t = ch.table;
      h += `<table class="k"><tr>${t.head.map(c => `<th>${rich(c)}</th>`).join('')}</tr>${t.rows.map(r => `<tr>${r.map(c => `<td>${rich(c)}</td>`).join('')}</tr>`).join('')}</table>`;
      if (t.note) h += `<p class="muted">${rich(t.note)}</p>`;
      ch.questions.forEach((q, i) => {
        h += `<div class="bossq"><p class="q">${i + 1}. ${rich(q.q)}</p>${answers(q.choices, (c, j) => j === q.answer)}${q.why ? `<p class="muted">${rich(q.why)}</p>` : ''}</div>`;
      });
    }
    return h;
  }

  function drawMap(ep) {
    const m = ep.map, cv = $('map'), S = 16;
    cv.width = m[0].length * S; cv.height = m.length * S;
    const x = cv.getContext('2d'); x.imageSmoothingEnabled = false;
    WW.style.realm = ep.realm || +ep.id[0];
    WW.drawMap(x, m, { t: 0 });
    (ep.scraps || []).forEach(s => WW.sprite(x, 'page', s[0] * S + 1, s[1] * S + 2, {}));
    (ep.smudges || []).forEach((s, i) => { const type = WW.foeType(ep, i); WW.drawFoe(x, { type, phase: i, hp: WW.FOES[type].hp }, s[0] * S, s[1] * S, 0); });
    WW.sprite(x, 'stone', ep.challenge.at[0] * S, ep.challenge.at[1] * S, { pal: { W: '#9aa3ad', G: '#5e636b', y: '#f2c14e', r: '#e04848', n: '#2f6fd6' } });
    const chw = ep.challenge, wspots = chw.type === 'carry' ? [] : (chw.spots || []);
    wspots.forEach((p, i) => { x.fillStyle = '#2f6fd6'; x.strokeStyle = '#000'; x.lineWidth = 1.5; x.beginPath(); x.arc(p[0] * S + 8, p[1] * S + 8, 6, 0, 7); x.fill(); x.stroke(); x.fillStyle = '#fff'; x.font = 'bold 9px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(String(i + 1), p[0] * S + 8, p[1] * S + 8.5); });
    if (chw.type === 'carry') (chw.zones || []).forEach((z, i) => { x.strokeStyle = ['#f2c14e', '#2f7fd1', '#e04848', '#3fa34d', '#8e5bd6', '#d98e2b'][chw.bins.findIndex(b => b.id === z.bin) % 6]; x.lineWidth = 3; x.setLineDash([5, 3]); x.strokeRect(z.x * S + 1, z.y * S + 1, z.w * S - 2, z.h * S - 2); x.setLineDash([]); });
    (ep.finds || []).forEach(f => { x.font = '12px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('📜', f.clueAt[0] * S + 8, f.clueAt[1] * S + 8); x.strokeStyle = '#f2c14e'; x.lineWidth = 2; x.setLineDash([2, 2]); x.strokeRect(f.at[0] * S + 2, f.at[1] * S + 2, S - 4, S - 4); x.setLineDash([]); });
    if (ep.secret) { const [sx, sy] = ep.secret.at; x.font = '14px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText('🎁', sx * S + 8, sy * S + 8); }
    (ep.build || []).forEach(b => {
      if (b.kind === 'repair') b.at.forEach(p => { x.strokeStyle = '#ff8f7a'; x.lineWidth = 2; x.setLineDash([3, 2]); x.strokeRect(p[0] * S + 1, p[1] * S + 1, S - 2, S - 2); x.setLineDash([]); });
      if (b.kind === 'signpost') b.ok.forEach(p => { x.strokeStyle = '#3fa34d'; x.lineWidth = 2; x.strokeRect(p[0] * S + 2, p[1] * S + 2, S - 4, S - 4); });
    });
    x.globalAlpha = .75; WW.sprite(x, 'smudge', ep.boss.at[0] * S - 8, ep.boss.at[1] * S - 16, { scale: 2 }); x.globalAlpha = 1;
    WW.sprite(x, 'hero', ep.start[0] * S, ep.start[1] * S - 3, { pal: WW.heroPal() });
    ep.npcs.forEach((n, i) => {
      WW.drawPerson(x, n, n.x * S, n.y * S - 2, 0);
      x.fillStyle = '#f2c14e'; x.strokeStyle = '#000'; x.lineWidth = 1.5;
      x.beginPath(); x.arc(n.x * S + 14, n.y * S - 4, 6, 0, 7); x.fill(); x.stroke();
      x.fillStyle = '#22202e'; x.font = 'bold 9px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(String(i + 1), n.x * S + 14, n.y * S - 3.5);
    });
    const q = ep.quest;
    if (q) { // quest people get a gold letter: G giver, C contact, T trader; the thief and the secret spot are marked too
      const badge = (px, py, t, col) => { x.fillStyle = col; x.strokeStyle = '#000'; x.lineWidth = 1.5; x.beginPath(); x.arc(px * S + 14, py * S - 4, 6, 0, 7); x.fill(); x.stroke(); x.fillStyle = '#22202e'; x.font = 'bold 9px sans-serif'; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(t, px * S + 14, py * S - 3.5); };
      const people = [[q.giver, 'G'], [q.contact, 'C']].concat(q.action.type === 'trade' ? [[q.action.trader, 'T']] : []);
      people.forEach(([p, t]) => { WW.drawPerson(x, p, p.x * S, p.y * S - 2, 0); badge(p.x, p.y, t, '#8fc3ff'); });
      const a = q.action;
      if (a.type === 'chase') { WW.sprite(x, 'smudge', a.at[0] * S, a.at[1] * S, { pal: WW.quest ? WW.quest.THIEF : { g: '#a04848', G: '#6e2c2c' } }); badge(a.at[0], a.at[1], '!', '#ff8f7a'); a.clues.forEach((c, i) => c.zones.forEach(z => { x.strokeStyle = '#8fc3ff'; x.lineWidth = 2; x.setLineDash([3, 3]); x.strokeRect(z.x * S, z.y * S, z.w * S, z.h * S); x.setLineDash([]); badge(z.x, z.y + 1, String(i + 1), '#8fc3ff'); })); }
      if (a.type === 'trade') (a.choices || []).filter(c => c.at).forEach(c => badge(c.at[0], c.at[1], c.ok ? '✓' : '✗', c.ok ? '#7fd17f' : '#ff8f7a'));
      if (a.type === 'fight') { WW.sprite(x, 'smudge', a.at[0] * S, a.at[1] * S, { pal: WW.quest ? WW.quest.THIEF : { g: '#a04848', G: '#6e2c2c' } }); badge(a.at[0], a.at[1], '!', '#ff8f7a'); }
      if (a.type === 'find') { x.fillStyle = '#fff3b0'; x.fillRect(a.at[0] * S + 7, a.at[1] * S + 3, 2, 10); x.fillRect(a.at[0] * S + 3, a.at[1] * S + 7, 10, 2); x.strokeStyle = '#f2c14e'; x.lineWidth = 2; x.setLineDash([]); x.strokeRect(a.at[0] * S + 1, a.at[1] * S + 1, 14, 14); }
    }
    x.strokeStyle = 'rgba(255,255,255,.4)'; x.setLineDash([4, 4]);
    for (let i = 16; i < m[0].length; i += 16) { x.beginPath(); x.moveTo(i * S, 0); x.lineTo(i * S, cv.height); x.stroke(); }
    for (let j = 11; j < m.length; j += 11) { x.beginPath(); x.moveTo(0, j * S); x.lineTo(cv.width, j * S); x.stroke(); }
  }

    if (ep.quest) {
      const q = ep.quest, a = q.action, person = (p, t) => `<div class="tbox person"><h3><span class="num" style="background:#8fc3ff">${t}</span>${esc(L(p.name))}</h3><div class="muted">${esc(L(p.role))}</div>`;
      h += `<section class="part"><h2>${esc(HT('pQuest'))} · ${esc(L(q.title))}</h2><p class="muted">${esc(HT('questHow'))} ${themeTag(q.stat)}</p><div class="people">`;
      h += person(q.giver, 'G') + q.giver.lines.map(l => `<div class="say">${rich(l)}</div>`).join('') + `<p class="muted"><b>${esc(HT('qWait'))}:</b> ${rich(q.giver.wait)}</p><p class="muted"><b>${esc(HT('qThanks'))}:</b> ${rich(q.giver.thanks)}</p></div>`;
      h += person(q.contact, 'C') + q.contact.lines.map(l => `<div class="say">${rich(l)}</div>`).join('') + '</div>';
      h += '</div>';
      h += `<p class="q">${esc(HT('qAction'))}: ${esc(L(H['qa_' + a.type]))}</p>`;
      if (a.type === 'find') h += `<p>${esc(HT('qSpot'))} (${a.at[0]}, ${a.at[1]}) · <i>${rich(a.hint)}</i></p><div class="say">${rich(a.found)}</div>`;
      if (a.type === 'fight') { h += `<p><b>${esc(L(a.name))}</b> · ${a.need || 2} ${esc(HT('bossNeed'))}</p><div class="say">${rich(a.taunt)}</div>`; a.questions.forEach((qq, i) => { h += `<div class="bossq"><p class="q">${i + 1}. ${rich(qq.q)}</p>${answers(qq.choices, (c, j) => j === qq.answer)}${qq.why ? `<p class="muted">${rich(qq.why)}</p>` : ''}</div>`; }); }
      if (a.type === 'chase') { h += `<p><b>${esc(L(a.name))}</b></p><div class="say">${rich(a.taunt)}</div>`; a.clues.forEach((c, i) => { h += `<div class="bossq"><p class="q">🧩 ${i + 1}. ${rich(c.t)}</p><p>✓ ${rich(c.found)}</p>${(c.noBy || []).map(b => `<p class="muted">✗ ${rich(b.t)}</p>`).join('')}</div>`; }); h += `<div class="say">${rich(a.win)}</div>`; }
      if (a.type === 'trade' && (a.choices || []).every(c => c.at)) h += `<p class="muted">${esc(HT('qGoodsAt'))}</p>`;
      if (a.type === 'trade') h += person(a.trader, 'T') + a.trader.lines.map(l => `<div class="say">${rich(l)}</div>`).join('') + `<p class="q">${rich(a.q)}</p>${answers(a.choices, c => c.ok, c => c.why)}</div>`;
      if (a.item) h += `<p class="muted">🎒 ${a.item.icon} ${rich(a.item.name)}</p>`;
      h += '</section>';
    }
    h += `<section class="part"><h2>${esc(HT('pStone'))} · ${esc(L(TYPE[ch.type]))}</h2><p><b>${rich(ch.title)}</b> ${themeTag(ch.stat)}</p>${ch.intro ? `<div class="say">${rich(ch.intro)}</div>` : ''}${stoneKey(ch, ep)}${ch.success ? `<p class="muted"><b>${esc(HT('success'))}:</b> ${rich(ch.success)}</p>` : ''}</section>`;

    h += `<section class="part"><h2>${esc(HT('pBoss'))} · ${esc(L(b.name))}</h2><p class="muted">${b.need || 3} ${esc(HT('bossNeed'))} · ${themeTag(b.stat)}</p>${b.taunt ? `<div class="say">${rich(b.taunt)}</div>` : ''}`;
    b.questions.forEach((q, i) => { h += `<div class="bossq"><p class="q">${i + 1}. ${rich(q.q)}</p>${answers(q.choices, (c, j) => j === q.answer)}${q.why ? `<p class="muted">${rich(q.why)}</p>` : ''}</div>`; });
    h += '</section>';

    h += `<section class="part"><h2>${esc(HT('pFinish'))}</h2><p class="q">${esc(HT('learned'))}</p><ul>${(ep.learned || []).map(l => `<li>${rich(l)}</li>`).join('')}</ul>
      <p class="q">${esc(HT('reflect'))}</p><div class="say">${rich(ep.reflect.q)}</div><p class="muted"><b>${esc(HT('starter'))}:</b> ${rich(ep.reflect.starter)}…</p></section>`;

    if ((ep.signs || []).length) h += `<section class="part"><h2>${esc(HT('pSigns'))}</h2>${ep.signs.map(s => `<div class="say">🪧 ${rich(s.text)}</div>`).join('')}</section>`;
    const words = Object.entries(ep.words || {});
    if (words.length) h += `<section class="part"><h2>${esc(HT('pWords'))}</h2><div class="words">${words.map(([k, v]) => `<div><b>${esc(k)}</b> — ${esc(L(v))}</div>`).join('')}</div></section>`;

    $('main').innerHTML = h;
    drawMap(ep);
    $('copyLink').onclick = () => {
      const url = new URL(file, location.href).href;
      const done = () => { msg = HT('copied'); showEp(ep); };
      if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(url).then(done, done); else { prompt(url, url); }
    };
    msg = '';
  }

  WW.onLang(render);
  WW.setLang(WW.lang);
})();
</script>
</body>
</html>
