<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worldwalker · World Map</title>
<link rel="stylesheet" href="engine/style.css">
<style>
  .hub{max-width:1180px;margin:0 auto;padding:12px 14px 40px}
  .hub-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .hub-top .logo{font-family:var(--pix);color:var(--gold);font-size:clamp(16px,3vw,24px);text-decoration:none}
  .hub-top .sub{font-family:var(--pix);font-size:9px;color:var(--muted)}
  .hub-top .langs{margin-left:auto;display:flex;gap:5px}
  .hub-top button{font-size:13px;padding:6px 10px;background:var(--panel2);color:#fff;border:2px solid #000;border-radius:4px;cursor:pointer}
  .hub-top button.on{background:var(--gold);color:var(--ink);font-weight:700}
  #banner{display:block;width:100%;height:auto;image-rendering:pixelated;border:3px solid #000;outline:3px solid var(--line);border-radius:6px;margin:12px 0}
  .layout{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
  @media (max-width:880px){.layout{grid-template-columns:1fr}}
  .mecard{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:14px;color:var(--text)}
  .hero{display:flex;gap:12px;align-items:center}
  .hero canvas{image-rendering:pixelated;width:80px;height:80px;background:#cfe8ff;border:3px solid #000;border-radius:4px}
  .hero .nm{font-size:20px;font-weight:700}
  .muted{color:var(--muted);font-size:14px}
  .hpw{display:grid;grid-template-columns:24px 1fr 30px;gap:6px;align-items:center;margin:5px 0;font-size:14px;color:var(--text)}
  .hpw .hbar{height:10px;border:2px solid #000;background:#2a2840}
  .hpw .hbar b{display:block;height:100%}
  .hpw .n{text-align:right;font-weight:700}
  .code{font-family:var(--pix);font-size:11px;background:#0b0a14;color:var(--gold);padding:8px;border-radius:4px;display:inline-block;margin:4px 0;direction:ltr;word-break:break-all}
  .hub input{font:inherit;font-size:15px;padding:7px 9px;border:2px solid #000;border-radius:4px;width:100%;margin:4px 0}
  .btn{font-weight:700;font-size:14px;padding:8px 12px;border:3px solid #000;border-radius:4px;cursor:pointer;background:var(--gold);color:var(--ink)}
  .btn.ghost{background:var(--panel2);color:#fff}
  .msg{font-size:14px;margin:4px 0;color:#7cc451}.msg.bad{color:#ff8f7a}
  details summary{cursor:pointer;color:var(--muted);font-size:14px;margin-top:10px}
  h2.sec{font-family:var(--pix);font-size:12px;color:var(--gold);margin:0 0 10px;line-height:1.6}
  .world{display:grid;gap:10px;grid-template-columns:repeat(4,1fr);grid-template-areas:
    "r1 r3 r3 r7" "r2 r5 r6 r7" "r2 r4 r6 r8"}
  @media (max-width:1050px){.world{grid-template-columns:repeat(2,1fr);grid-template-areas:"r1 r3" "r2 r3" "r2 r5" "r4 r6" "r7 r8"}}
  @media (max-width:560px){.world{grid-template-columns:1fr;grid-template-areas:"r1" "r2" "r3" "r4" "r5" "r6" "r7" "r8"}}
  .realm{border:3px solid #000;border-radius:8px;overflow:hidden;background:var(--panel);display:flex;flex-direction:column}
  .realm .rh{padding:8px 10px;color:#fff;font-weight:700;display:flex;justify-content:space-between;gap:6px;align-items:center}
  .realm .rh small{font-weight:400;opacity:.9}
  .realm .eps{padding:8px;display:grid;gap:6px;flex:1;align-content:start}
  .ep{display:grid;grid-template-columns:44px 1fr auto;gap:8px;align-items:center;padding:7px 8px;border-radius:5px;background:#29264a;border:2px solid #000;color:#fff;text-decoration:none;font-size:14.5px;line-height:1.3;text-align:start;cursor:pointer}
  .ep .id{font-family:var(--pix);font-size:10px;color:var(--gold)}
  .ep .st{font-size:14px;white-space:nowrap}
  .ep.done{background:#1f3d2a}
  .ep.next{background:#4a3d12;border-color:var(--gold);animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{50%{border-color:#fff}}
  .ep.locked{opacity:.55;cursor:not-allowed}
  .ep .pl{display:block;font-size:12.5px;color:var(--muted)}
  .note{margin-top:12px;font-size:14px;color:var(--muted)}
  [dir=rtl] .hpw .n{text-align:left}
</style>
</head>
<body>
<div class="hub" id="hub">
  <div class="hub-top">
    <a class="logo" href="../index.html">WORLDWALKER</a><span class="sub">THE TORN ATLAS</span>
    <span class="langs"><button data-l="en">EN</button><button data-l="es">ES</button><button data-l="fa">دری</button></span>
  </div>
  <canvas id="banner" aria-hidden="true"></canvas>
  <div class="layout">
    <aside class="mecard" id="me"></aside>
    <main>
      <h2 class="sec" id="worldTitle"></h2>
      <div class="world" id="world"></div>
      <p class="note" id="note"></p>
    </main>
  </div>
</div>
<script src="config.js"></script>
<script src="engine/art.js"></script>
<script src="engine/art2.js"></script>
<script src="engine/save.js"></script>
<script src="episodes/catalog.js"></script>
<script>
(function () {
  const L = t => WW.L(t), T = k => WW.T(k);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const H = {
    world: { en: 'THE WORLD · 8 REALMS · 24 ATLAS PAGES', es: 'EL MUNDO · 8 REINOS · 24 PÁGINAS', fa: 'جهان · ۸ سرزمین · ۲۴ صفحه' },
    noHero: { en: 'No hero yet. Start Episode 1.1 to make one, or paste your Passport Code.', es: 'Todavía no hay héroe. Empieza el episodio 1.1 para crear uno, o pega tu código de pasaporte.', fa: 'هنوز قهرمانی نیست. قسمت ۱.۱ را شروع کن یا کد پاسپورت خود را بگذار.' },
    locked: { en: 'Finish the episode before it first — or open it from your Canvas module.', es: 'Primero termina el episodio anterior, o ábrelo desde tu módulo de Canvas.', fa: 'اول قسمت قبلی را تمام کن، یا آن را از ماژول کانواس باز کن.' },
    teacher: { en: 'For teachers', es: 'Para maestros', fa: 'برای معلمان' },
    teacherOk: { en: 'Every episode is open on this computer.', es: 'Todos los episodios están abiertos en esta computadora.', fa: 'همهٔ قسمت‌ها در این کمپیوتر باز است.' },
    console: { en: 'Open the teacher console', es: 'Abrir la consola del maestro', fa: 'کنسول معلم را باز کن' },
    wrongCode: { en: 'That is not the teacher code.', es: 'Ese no es el código del maestro.', fa: 'این کد معلم نیست.' },
    open: { en: 'Open', es: 'Abrir', fa: 'باز کن' },
    soon: { en: 'coming soon', es: 'muy pronto', fa: 'به زودی' },
    note: { en: 'Each episode is one Canvas assignment. Your progress is saved in this browser, in your Passport Code, and in the class sheet when your teacher turns it on.', es: 'Cada episodio es una tarea de Canvas. Tu progreso se guarda en este navegador, en tu código de pasaporte y en la hoja de la clase cuando tu maestro la active.', fa: 'هر قسمت یک تکلیف کانواس است. پیشرفتت در این مرورگر، در کد پاسپورت و در جدول صنف (وقتی معلم روشن کند) ذخیره می‌شود.' }
  };
  const HT = k => L(H[k]);
  const REALM_COL = [null, '#c0392b', '#2f7fd1', '#8e5bd6', '#d98e2b', '#b8902a', '#3fa34d', '#b03a2e', '#2aa198'];
  let msg = '', bad = false;
  const cat = {}; (window.WW_CATALOG || []).forEach(e => (cat[e.id] = e));

  function openable(i) {
    const s = WW.save;
    if (s.teacher) return true;
    if (i === 0) return true;
    const id = WW.EPISODES[i].id;
    if (s.episodes[id]) return true;
    const prev = WW.EPISODES[i - 1].id;
    return !!(s.episodes[prev] && s.episodes[prev].done);
  }
  function render() {
    document.documentElement.dir = WW.dir();
    document.querySelectorAll('[data-l]').forEach(b => b.classList.toggle('on', b.dataset.l === WW.lang));
    const s = WW.save;
    // me
    const me = document.getElementById('me');
    let h = '';
    h += `<div class="hero"><canvas id="heroCv" width="96" height="96"></canvas><div><div class="nm">${esc(s.name || '—')}</div><div class="muted">${esc(s.cls || '')}</div>
      <div class="muted">📄 ${esc(T('pages'))}: <b>${WW.doneCount()} / 24</b></div><div class="muted">● ${esc(T('coins'))}: <b>${s.coins || 0}</b></div></div></div>`;
    if (!s.name) h += `<p class="muted">${esc(HT('noHero'))}</p>`;
    h += `<h2 class="sec" style="margin-top:14px">${esc(T('powers'))}</h2>`;
    WW.THEMES.forEach(th => { const v = s.stats[th.k] || 0; h += `<div class="hpw"><span>${th.icon}</span><div><div>${esc(L(th.name))}</div><div class="hbar"><b style="width:${Math.min(100, v / 30 * 100)}%;background:${th.col}"></b></div></div><span class="n">${v}</span></div>`; });
    h += `<h2 class="sec" style="margin-top:14px">${esc(T('bag'))}</h2><div style="display:flex;gap:6px;flex-wrap:wrap">${WW.TOOLS.map(t => `<span title="${esc(L(t.name))}" style="font-size:22px;opacity:${WW.hasTool(t.id) ? 1 : .25}">${t.icon}</span>`).join('')}</div>`;
    h += `<h2 class="sec" style="margin-top:14px">${esc(T('yourCode'))}</h2><span class="code" id="code">${WW.passportCode()}</span> <button class="btn ghost" id="copy">${esc(T('copyCode'))}</button>
      <p class="muted">${esc(T('codeHelp'))}</p>
      <input id="codeIn" placeholder="WW-XXXXX-XXXXX-XXXXX" aria-label="${esc(T('haveCode'))}"><button class="btn" id="useCode">${esc(T('useCode'))}</button>`;
    if (msg) h += `<p class="msg ${bad ? 'bad' : ''}">${esc(msg)}</p>`;
    h += `<details ${s.teacher ? 'open' : ''}><summary>${esc(HT('teacher'))}</summary>${s.teacher ? `<p class="msg">${esc(HT('teacherOk'))}</p><a class="btn" href="teacher.html">🎓 ${esc(HT('console'))}</a>` : `<input id="tcode" placeholder="${esc(T('teacherCode'))}"><button class="btn ghost" id="tgo">${esc(HT('open'))}</button>`}</details>`;
    me.innerHTML = h;
    const hc = document.getElementById('heroCv').getContext('2d'); hc.imageSmoothingEnabled = false; WW.sprite(hc, 'hero', 0, 0, { pal: WW.heroPal(), scale: 6 });
    document.getElementById('copy').onclick = () => { navigator.clipboard && navigator.clipboard.writeText(WW.passportCode()); msg = '✓'; bad = false; render(); };
    document.getElementById('useCode').onclick = () => { const d = WW.readCode(document.getElementById('codeIn').value); if (!d) { msg = T('badCode'); bad = true; } else { WW.merge(d); if (!s.name) s.look = d.look; WW.store(); msg = T('codeOk'); bad = false; } render(); };
    const tg = document.getElementById('tgo'); if (tg) tg.onclick = () => { if (document.getElementById('tcode').value.trim().toUpperCase() === String(WW.CONFIG.TEACHER_CODE).toUpperCase()) { s.teacher = true; WW.store(); msg = ''; } else { msg = HT('wrongCode'); bad = true; } render(); };
    // world
    document.getElementById('worldTitle').textContent = HT('world');
    const nextIdx = WW.EPISODES.findIndex((e, i) => !(s.episodes[e.id] && s.episodes[e.id].done));
    let w = '';
    for (let r = 1; r <= 8; r++) {
      const tool = WW.TOOLS[r - 1];
      w += `<section class="realm" style="grid-area:r${r}"><div class="rh" style="background:${REALM_COL[r]}"><span>${r} · ${esc(L(WW.REALMS[r]))}</span><small title="${esc(L(tool.name))}">${tool.icon}</small></div><div class="eps">`;
      WW.EPISODES.forEach((e, i) => {
        if (e.realm !== r) return;
        const c = cat[e.id], d = s.episodes[e.id], can = openable(i) && !!c;
        const cls = d && d.done ? 'done' : i === nextIdx && can ? 'next' : can ? '' : 'locked';
        const st = d && d.done ? '★'.repeat(d.stars || 1) : !c ? HT('soon') : can ? '▶' : '🔒';
        w += `<a class="ep ${cls}" ${can ? `href="${WW.epFile(e.id)}"` : `role="button" data-locked="1"`}><span class="id">${e.id}</span><span>${c ? esc(L(c.title)) : '…'}<span class="pl">${c ? esc(L(c.place)) : ''}</span></span><span class="st">${st}</span></a>`;
      });
      w += '</div></section>';
    }
    document.getElementById('world').innerHTML = w;
    document.querySelectorAll('[data-locked]').forEach(a => (a.onclick = () => { msg = HT('locked'); bad = true; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }));
    document.getElementById('note').textContent = HT('note');
  }
  document.querySelectorAll('[data-l]').forEach(b => (b.onclick = () => { WW.setLang(b.dataset.l); }));
  WW.onLang(render);

  // pixel banner: a strip of the world with the hero and Pip walking across
  const cv = document.getElementById('banner'); cv.width = 48 * 16; cv.height = 4 * 16;
  const c = cv.getContext('2d'); c.imageSmoothingEnabled = false;
  const strip = [
    'AAMMM..TT~~~~ss.uuuuug.aa.qqqq.V..pp~~~~..KKK...',
    'nAM...T.,.~~~:::::uug.....qqqq..t..p~~k~,..UU.X.',
    'nn..,..::::bb::.......::::::::::::::::bb:::::::.',
    'zz.....T..~~..T..c..ggOg..jjj..ttt...~~~~..T...C'];
  WW.loop(t => {
    WW.drawMap(c, strip, { t });
    const x = ((t / 40) % (48 * 16 + 40)) - 20;
    WW.sprite(c, Math.floor(t / 160) % 2 ? 'heroSideWalk' : 'heroSide', Math.round(x), 2 * 16 - 3, { pal: WW.heroPal() });
    WW.sprite(c, 'pip', Math.round(x) - 18, 2 * 16 - 8, { bob: true, t });
  });
  WW.setLang(WW.lang);
})();
</script>
</body>
</html>
