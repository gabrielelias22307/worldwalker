<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worldwalker 6.2</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Atkinson+Hyperlegible:wght@400;700&display=swap');
:root{
--bg:#141322; --panel:#1f1d33; --panel2:#29264a; --line:#3b3866; --text:#f3f1ff; --muted:#b9b5dc;
--gold:#f2c14e; --teal:#2aa198; --red:#e04848; --paper:#fffbe8; --ink:#22202e;
--pix:'Press Start 2P', ui-monospace, monospace;
--read:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--read);font-size:17px;line-height:1.5}
button{font-family:inherit}
html.ww-game,html.ww-game body{height:100%;overflow:hidden}
.ww-frame{max-width:1200px;height:100vh;height:100dvh;margin:0 auto;padding:6px 8px;background:var(--bg);display:flex;flex-direction:column;gap:0}
.ww-frame:fullscreen{max-width:none}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-bottom:2px;position:relative}
.ww-frame>.ww-bar,.ww-frame>.hud,.ww-frame>.quest{width:100%;max-width:max(var(--gw,100%),min(100%,560px));margin-left:auto;margin-right:auto}
.ww-frame.narrow .stage>.toolbar{position:static;transform:none;margin:5px auto 0;width:max-content;max-width:100%}
.cbubble.dock{max-width:none}
.cbubble.dock::after{bottom:auto;top:-10px;left:var(--tx,50%);border:7px solid transparent;border-bottom-color:var(--ink);border-top:0}
.ww-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.ww-logo{font-family:var(--pix);font-size:12px;color:var(--gold);text-decoration:none;margin-right:auto}
.ww-bar button{font-size:13px;padding:5px 8px;background:var(--panel2);color:#fff;border:2px solid #000;border-radius:4px;cursor:pointer;line-height:1.3}
@media (max-width:820px){.ww-bar .lbl{display:none}.ww-bar button{padding:5px 7px}}
@media (max-width:520px){.ww-logo{display:none}.ww-bar{gap:4px;justify-content:center}.ww-bar .langs,.ww-bar .tools{gap:3px}.ww-bar button{font-size:12px;padding:4px 6px}}
.ww-bar .langs button.on{background:var(--gold);color:var(--ink);font-weight:700}
.ww-bar .langs,.ww-bar .tools{display:flex;gap:5px;flex-wrap:wrap}
.ww-preview{font-size:12px;font-weight:700;padding:5px 8px;background:var(--teal);color:#fff;border:2px solid #000;border-radius:4px;text-decoration:none}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;background:#0b0a14;padding:5px 10px;font-family:var(--pix);font-size:10px;border:3px solid #000;border-bottom:0;border-radius:6px 6px 0 0}
.hud-left,.hud-right{display:flex;align-items:center;gap:6px}
.hrt{color:var(--red);font-size:16px;line-height:1}
.hrt.empty{color:#4a2630}
.hud-coin{color:var(--gold);margin-left:6px}
.hud-mid{color:var(--muted);font-family:var(--read);font-weight:700;font-size:13px}
.meter{display:inline-flex;align-items:center;gap:2px}
.meter i{font-style:normal;font-size:12px}
.track{display:block;width:40px;height:9px;background:#2a2840;border:2px solid #000}
.track b{display:block;height:100%}
.quest{background:#0b0a14;border:3px solid #000;border-top:1px solid #2a2840;border-bottom:0;padding:3px 8px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;min-width:0}
.quest .qgoal{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.quest .qlist{background:var(--panel2);color:#fff;border:2px solid #000;border-radius:4px;font-size:13px;padding:1px 7px;cursor:pointer}
.qpop{position:absolute;z-index:7;left:8px;top:8px;max-width:calc(100% - 16px);background:rgba(11,10,20,.94);color:var(--text);border:3px solid #000;outline:2px solid var(--gold);border-radius:6px;padding:8px 12px;font-size:14px;line-height:1.5;display:none}
.qpop.on{display:block}
.qpop ol{margin:4px 0 0;padding-inline-start:20px}
.qpop .qdone{color:#7cc451}.qpop .qnow{color:#fff;font-weight:700}.qpop li{color:var(--muted)}
.quest b{color:var(--gold)}
.quest i{font-style:normal;color:#5a5680}
.quest .qnow{color:#fff;font-weight:700}
.quest .qdone{color:#7cc451}
.quest .qscr{color:#c9b064}
.screen{position:relative;background:#000;border:3px solid #000;outline:3px solid var(--line);border-radius:0 0 6px 6px;overflow:hidden;user-select:none;flex:none;width:100%}
.screen:focus{outline-color:var(--gold)}
.screen canvas#ww-cv{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.toast{position:absolute;right:10px;top:10px;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:5px;max-width:70%;pointer-events:none}
.toast .tst{color:#fff;font-weight:700;font-size:15px;padding:7px 11px;border:3px solid #000;border-radius:4px;animation:pop .2s ease-out}
.toast .tst.big{font-size:16px;padding:10px 14px;outline:3px solid #fff3b0;max-width:100%}
.toast .tst small{display:block;font-weight:400;font-size:13px;opacity:.95}
.defpop{position:absolute;z-index:9;max-width:300px;background:var(--ink);color:#fff;border:3px solid #ffe36e;border-radius:4px;padding:8px 12px;font-size:15px;line-height:1.4;display:none}
.defpop b{color:#ffe36e}
.ov{position:absolute;inset:0;z-index:5;overflow:auto;background:rgba(10,9,20,.55);padding:12px}
.ov.hidden{display:none}
.ov-box{background:var(--paper);color:var(--ink);border:4px solid var(--ink);outline:3px solid var(--paper);border-radius:4px;padding:14px 16px;max-width:760px;margin:0 auto}
.ov[dir=rtl] .ov-box{text-align:right}
.ov h2{margin:4px 0 6px;font-size:22px;line-height:1.25}
.ov h3{margin:12px 0 6px;font-size:17px;color:#7a3b12}
.ov h4{margin:10px 0 6px;font-size:15px;color:#5a4a7a}
.say{font-size:clamp(15px,1.8vw,18px);margin:6px 0}
.say.q{font-weight:700}
.say.taunt{font-style:italic;color:#4b3f63}
.hint,.small{font-size:13.5px;color:#5c5874;margin:4px 0}
.ov .small a{color:#2f6fd6}
.word{background:#ffe36e;border-bottom:2px dotted #7a3b12;padding:0 2px;cursor:help;border-radius:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.acts.center{justify-content:center}
.pbtn{font-size:14px;font-weight:700;padding:9px 14px;background:#29264a;color:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;min-height:42px}
.pbtn.gold{background:var(--gold);color:var(--ink)}
.pbtn.teal{background:var(--teal);color:#fff}
.pbtn.ghost{background:#fff;color:var(--ink)}
.pbtn.big{font-size:17px;padding:11px 22px}
.pbtn:disabled{opacity:.45;cursor:not-allowed}
.pbtn:focus-visible,.choices button:focus-visible,.card:focus-visible{outline:3px solid #2f6fd6;outline-offset:2px}
.choices{display:grid;gap:7px;margin-top:8px}
.choices.two{grid-template-columns:1fr 1fr}
@media (max-width:640px){.choices.two{grid-template-columns:1fr}}
.choices button{text-align:start;font-size:clamp(14px,1.6vw,16.5px);padding:9px 12px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);min-height:44px}
.choices button i{font-style:normal;font-weight:700;color:#7a3b12;margin-inline-end:6px}
.choices button.right{background:#d9f5dd;border-color:#1f7a3a}
.choices button.wrong{background:#fde2de;border-color:#b0392b}
.choices button:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:10px;padding:9px 12px;border-radius:4px;border:2px solid}
.fb.right{background:#e3f6e6;border-color:#1f7a3a;color:#174f27}
.fb.wrong{background:#fdeae6;border-color:#b0392b;color:#7a2318}
.err{color:#b0392b;font-weight:700;text-align:center}
.talk-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.talk-head .face{width:64px;height:44px;border:3px solid var(--ink);background:#cfe8ff;image-rendering:pixelated;flex:0 0 auto}
.who{font-weight:700;color:#7a3b12;font-size:16px}
.role{font-size:13.5px;color:#5c5874}
.startov .logo{font-family:var(--pix);color:#c08a1e;text-align:center;font-size:clamp(18px,4vw,30px);margin-top:4px}
.startov .sublogo{font-family:var(--pix);text-align:center;font-size:10px;color:#5a4a7a;margin:6px 0 10px}
.epcard{background:#f3e3b5;border:3px solid var(--ink);border-radius:4px;padding:8px 12px;text-align:center}
.epcard h2{margin:2px 0}
.epn{font-size:13px;font-weight:700;color:#5a4a7a}
.place{color:#5c5874}
.langrow{display:flex;gap:6px;justify-content:center;margin:10px 0}
.langrow .pbtn{min-height:36px;padding:6px 12px}
.wb{text-align:center;font-size:18px}
.signin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.signin h3{grid-column:1/-1;margin-bottom:0}
@media (max-width:640px){.signin{grid-template-columns:1fr}}
.signin label,.codein label{display:flex;flex-direction:column;font-size:13.5px;font-weight:700;gap:3px}
.ov input,.ov textarea{font:inherit;font-size:16px;padding:8px 10px;border:3px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);width:100%}
.ov textarea{resize:vertical;min-height:80px;margin-top:6px}
.looks{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.heroprev{border:3px solid var(--ink);background:#cfe8ff;image-rendering:pixelated;width:96px;height:96px}
.lrow{display:flex;align-items:center;gap:5px;margin:3px 0}
.lrow span{width:52px;font-size:13px;font-weight:700}
.sw{width:28px;height:28px;border:3px solid #fff;outline:2px solid var(--ink);border-radius:3px;cursor:pointer;padding:0}
.sw.on{border-color:#c08a1e;outline:3px solid #c08a1e}
.codein{display:flex;gap:8px;align-items:end;margin-top:12px;flex-wrap:wrap}
.codein label{flex:1;min-width:220px}
.pipface{float:right;image-rendering:pixelated;width:64px;height:64px;margin-inline-start:10px}
.ov[dir=rtl] .pipface{float:left}
.pp-top{display:flex;gap:14px;align-items:center}
.pp-hero{border:3px solid var(--ink);background:#cfe8ff;image-rendering:pixelated;width:90px;height:90px}
.pp-name{font-size:22px;font-weight:700}
.pp-nums{display:flex;gap:14px;flex-wrap:wrap;font-size:15px}
.powers{display:grid;gap:6px}
.pw{display:grid;grid-template-columns:30px 1fr 34px;gap:8px;align-items:center}
.pwi{font-size:20px}
.pwn{font-weight:700;text-align:end}
.bar{height:12px;border:2px solid var(--ink);background:#e9dfc0}
.bar b{display:block;height:100%}
.bag{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:520px){.bag{grid-template-columns:repeat(2,1fr)}}
.slot{border:3px solid #b7a77e;background:#e9dfc0;border-radius:4px;padding:6px;text-align:center;font-size:12.5px;color:#8a7c58}
.slot.has{background:#fff;border-color:var(--ink);color:var(--ink);font-weight:700}
.slot .ti{display:block;font-size:24px}
.stamps{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
@media (max-width:560px){.stamps{grid-template-columns:repeat(4,1fr)}}
.scol{display:flex;flex-direction:column;gap:4px;align-items:center;border:2px dashed #b7a77e;border-radius:4px;padding:4px}
.stamp{width:44px;height:44px;border-radius:50%;border:2px dashed #b7a77e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:#b7a77e;font-weight:700;line-height:1}
.stamp i{font-style:normal;font-size:8px;color:#c08a1e}
.stamp.on{border:3px solid var(--ink);color:#fff}
.stamp.on i{color:#fff}
.stamp.r1{background:#e04848}.stamp.r2{background:#2f7fd1}.stamp.r3{background:#8e5bd6}.stamp.r4{background:#d98e2b}
.stamp.r5{background:#c9a227}.stamp.r6{background:#3fa34d}.stamp.r7{background:#c0392b}.stamp.r8{background:#2aa198}
.coderow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pcode{font-family:var(--pix);font-size:12px;background:var(--ink);color:var(--gold);padding:8px 10px;border-radius:3px;letter-spacing:1px;direction:ltr;display:inline-block}
.ok{color:#1f7a3a;font-weight:700}.bad{color:#b0392b;font-weight:700}.pending{color:#5a4a7a;font-weight:700}
.ch-head{display:flex;gap:10px;align-items:flex-start}
.chface{image-rendering:pixelated;width:48px;height:48px;flex:0 0 auto}
.ch-head h3{margin-top:2px}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;min-height:10px}
.card{font-size:14.5px;padding:7px 10px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);text-align:start;line-height:1.3}
.card .ic{margin-inline-end:5px}
.card.sel{background:#ffe36e;border-color:#c08a1e;outline:2px solid #c08a1e}
.card.right{background:#d9f5dd;border-color:#1f7a3a}
.card.wrong{background:#fde2de;border-color:#b0392b}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.bins.bands{grid-template-columns:1fr}
.bin{border:3px dashed #8a7c58;border-radius:6px;padding:6px;background:#f6edd2;min-height:70px;cursor:pointer;overflow:hidden}
.bin.target{border-color:#c08a1e;background:#fff3c4}
.bins.bands .bin{min-height:54px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.bintile{grid-row:1/3;width:96px;height:32px;image-rendering:pixelated;border:2px solid var(--ink)}
.binlabel{font-weight:700;font-size:14.5px}
.binin{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.seq{padding-inline-start:26px;margin:8px 0;display:grid;gap:5px}
.seq li.card{cursor:default}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;gap:3px;text-align:start;padding:9px 11px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);font-size:14.5px}
.opt span{font-size:13.5px;color:#5c5874}
.opt.sel{background:#ffe36e;border-color:#c08a1e}
.kind,.sw-g{margin:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.klabel{width:100%;font-weight:700;font-size:14px;color:#5a4a7a}
.reason{font-size:14px;padding:7px 10px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);text-align:start}
.reason.sel{background:#ffe36e;border-color:#c08a1e}
.reason.right{background:#d9f5dd;border-color:#1f7a3a}
.reason.wrong{background:#fde2de;border-color:#b0392b}
.outs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.out{padding:5px 10px;border-radius:20px;border:2px solid;font-size:14px;font-weight:700}
.out.good{background:#d9f5dd;border-color:#1f7a3a;color:#174f27}
.out.badp{background:#fbe2c8;border-color:#b5651d;color:#7a3b12}
.tblwrap{overflow-x:auto}
.dtbl{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0}
.dtbl th,.dtbl td{border:2px solid var(--ink);padding:5px 8px;text-align:start}
.dtbl th{background:#f3e3b5}
.bossov .ov-box{background:#f1ecff}
.boss-top{display:flex;gap:14px;align-items:center}
.bossface{image-rendering:pixelated;width:90px;height:90px;background:#2b2140;border:3px solid var(--ink);border-radius:6px}
.bossface.hit{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bname{font-weight:700;font-size:19px;color:#4b3f63}
.shield{display:flex;gap:4px;margin:3px 0}
.shield span{width:44px;height:14px;border:2px solid var(--ink);background:#ddd}
.shield span.on{background:#8fc3ff}
.hearts .hrt{font-size:18px}
.fin-head{display:flex;gap:14px;align-items:center}
.pagebig canvas{image-rendering:pixelated;width:80px;height:80px;animation:glow 1.6s ease-in-out infinite;border-radius:6px}
@keyframes glow{50%{filter:drop-shadow(0 0 10px #f2c14e)}}
.stars{font-size:28px;color:#e0a81e;letter-spacing:3px}
.stars .dim{color:#d8cfb0}
.newtool{margin-top:8px;padding:8px 12px;background:#fff3c4;border:2px solid #c08a1e;border-radius:4px}
.learned{margin:4px 0;padding-inline-start:22px}
.starter{background:#ffe36e;border:2px solid #c08a1e;border-radius:4px;padding:5px 10px;font-size:14px;cursor:pointer;color:var(--ink)}
.savebox{margin-top:10px;padding:8px 12px;background:#efe8d2;border:2px solid #b7a77e;border-radius:4px;display:grid;gap:4px}
.dpad{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,44px);gap:4px;justify-content:center;margin:6px auto 0;touch-action:none;flex:none}
.dpad button{background:var(--panel2);color:#fff;border:3px solid #000;border-radius:8px;font-size:22px;cursor:pointer}
.dpad [data-d=up]{grid-column:2;grid-row:1}.dpad [data-d=left]{grid-column:1;grid-row:2}.dpad .act{grid-column:2;grid-row:2;background:var(--gold);color:var(--ink)}
.dpad [data-d=right]{grid-column:3;grid-row:2}.dpad [data-d=down]{grid-column:2;grid-row:3}
@media (pointer:coarse){.dpad{display:grid}}
.ww-foot{display:none}
@media (max-width:640px){
.track{width:22px}.hud{font-size:9px;padding:4px 6px}.hud-mid{display:none}
.ov{padding:6px}.ov-box{padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.ov.talkov,.ov.msgov{background:rgba(10,9,20,.18);display:flex;flex-direction:column;justify-content:flex-end}
.ov.talkov .ov-box,.ov.msgov .ov-box{width:100%;margin:0 auto}
.stamp{font-family:var(--read)}
.touch .dpad{display:grid}
.screen canvas#ww-cv{animation:fadein .7s ease-out}
@keyframes fadein{from{opacity:0;filter:brightness(2)}to{opacity:1;filter:none}}
.ov-box{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.bossface.crack{animation:flash .45s}
@keyframes flash{0%,60%{filter:brightness(2.4) saturate(.3)}30%{transform:scale(.9) rotate(-4deg)}100%{filter:none;transform:none}}
.shield span.cracked{animation:crack .6s ease-out;position:relative}
@keyframes crack{0%{background:#ffffff;transform:scale(1.25)}40%{background:#8fc3ff;transform:scale(1.1) rotate(6deg)}100%{background:#ddd;transform:none}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:7}
.confetti i{position:absolute;top:-12px;width:7px;height:10px;border-radius:1px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.9}}
.goals{background:#fff3c4;border:3px solid var(--ink);border-radius:6px;padding:8px 12px;margin:10px 0;text-align:start}
.goals ol{margin:6px 0 6px 22px;padding:0}.goals li{margin:2px 0}
[dir=rtl] .goals ol{margin:6px 22px 6px 0}
ul.earned{list-style:none;padding:0;margin:4px 0;display:grid;gap:3px}
ul.earned li{background:#f3eedc;border-radius:4px;padding:4px 8px}
.grow{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grow .gw{background:#f3eedc;border-radius:6px;padding:6px 9px}
.grow ul{list-style:none;padding:0;margin:4px 0 0}
.grow li{font-size:14px;color:#8a8370;margin:2px 0}.grow li.on{color:#1f6a2e;font-weight:700}
.hintbtn{font-size:14px!important}
.bossov .ov-box.roar{animation:roar .45s}
@keyframes roar{0%{box-shadow:0 0 0 0 rgba(220,40,40,.0)}20%{transform:translate(-6px,2px);box-shadow:0 0 0 8px rgba(220,40,40,.55)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}100%{transform:none;box-shadow:0 0 0 0 rgba(220,40,40,0)}}
.bossface.furious{animation:fury .5s infinite;border-color:#b0392b}
@keyframes fury{25%{transform:translate(-2px,0) rotate(-2deg)}75%{transform:translate(2px,0) rotate(2deg)}}
.furious-tag{display:inline-block;background:#b0392b;color:#fff;font-size:12px;padding:2px 6px;border-radius:3px;animation:fury .5s infinite}
.say.grr{color:#8a1c24;font-weight:700;font-style:italic}
.screen:has(.ov:not(.hidden)) .toast{top:auto;bottom:10px}
.boss-top{position:relative}

 Build a new home on the south coast, next to the village, on the sand by the sea. Roof on top, walls below.",es:"Esta isla está en el [[ring of fire|Cinturón de Fuego]]. La ceniza del volcán hace que la tierra sea [[fertile|fértil]], y por eso se cultiva arroz en sus laderas. Pero la gente construye sus casas lejos del volcán. Construye una casa nueva en la costa sur, junto al pueblo, en la arena al lado del mar. El techo arriba y las paredes abajo.",fa:"این جزیره روی [[ring of fire|حلقهٔ آتش]] است. خاکستر آتشفشان خاک را [[fertile|حاصل‌خیز]] می‌سازد، پس دهقانان روی دامنه‌های آن برنج می‌کارند. اما مردم خانه‌های خود را دور از آتشفشان می‌سازند. یک خانهٔ نو در ساحل جنوب، کنار قریه، روی ریگ کنار بحر بساز. بام بالا، دیوارها پایین."},why:{en:"Good: far from the volcano, next to the village and the sea.",es:"Bien: lejos del volcán, junto al pueblo y el mar.",fa:"خوب: دور از آتشفشان، کنار قریه و بحر."},wrong:{en:"Not here. The new home goes on the south coast of the island, on the sand next to the village, far from the volcano.",es:"Aquí no. La casa nueva va en la costa sur de la isla, en la arena junto al pueblo, lejos del volcán.",fa:"این جا نه. خانهٔ نو در ساحل جنوب جزیره، روی ریگ کنار قریه، دور از آتشفشان می‌رود."},wrongBy:[{x:2,y:13,w:9,h:3,t:{en:"Too close to the volcano! Lava and ash reach here. Farms can be on the slopes, but homes go far away.",es:"¡Muy cerca del volcán! La lava y la ceniza llegan hasta aquí. Puede haber cultivos en las laderas, pero las casas van lejos.",fa:"به آتشفشان خیلی نزدیک است! لاوا و خاکستر تا این جا می‌رسند. کشت می‌تواند روی دامنه باشد، اما خانه‌ها دور می‌روند."}},{x:19,y:13,w:10,h:3,t:{en:"Too close to the volcano! Lava and ash reach here. Farms can be on the slopes, but homes go far away.",es:"¡Muy cerca del volcán! La lava y la ceniza llegan hasta aquí. Puede haber cultivos en las laderas, pero las casas van lejos.",fa:"به آتشفشان خیلی نزدیک است! لاوا و خاکستر تا این جا می‌رسند. کشت می‌تواند روی دامنه باشد، اما خانه‌ها دور می‌روند."}}],done:{en:"The new home is safe, far from the volcano. Millions of people live on the Ring of Fire. The ash makes rich soil, but people must live a safe distance away.",es:"La casa nueva está segura, lejos del volcán. Millones de personas viven en el Cinturón de Fuego. La ceniza da tierra rica, pero la gente debe vivir a una distancia segura.",fa:"خانهٔ نو امن است، دور از آتشفشان. میلیون‌ها نفر روی حلقهٔ آتش زندگی می‌کنند. خاکستر خاک پرمایه می‌سازد، اما مردم باید در فاصلهٔ امن زندگی کنند."}}],finds:[{clueAt:[2,9],at:[6,8],decor:"drum",clue:{en:"From this note, walk 1 step north, then 4 steps east. You will reach the bank of the Mekong River.",es:"Desde esta nota, camina 1 paso al norte y luego 4 pasos al este. Llegarás a la orilla del río Mekong.",fa:"از این یادداشت، ۱ قدم به شمال برو، بعد ۴ قدم به شرق. به کنار دریای میکانگ می‌رسی."},text:{en:"You followed the compass! Over 2,000 years ago, people in Vietnam made bronze drums like this one.",es:"¡Seguiste la brújula! Hace más de 2,000 años, la gente de Vietnam hacía tambores de bronce como este.",fa:"تو قطب‌نما را دنبال کردی! بیش از ۲۰۰۰ سال پیش، مردم ویتنام دهل‌های برنجی مثل این می‌ساختند."}},{clueAt:[2,12],at:[6,15],decor:"gem",clue:{en:"Farmers grow rice on the volcano's slopes. Stand on the terrace square straight south of its peak.",es:"Los agricultores cultivan arroz en las laderas del volcán. Párate en el cuadro de terraza justo al sur de su cima.",fa:"دهقانان در دامنهٔ آتشفشان برنج می‌کارند. روی خانهٔ زینه‌ای بایست که درست جنوبِ قلهٔ آن است."},text:{en:"Volcanic ash makes rich soil, so Java's farmers grow rice on the slopes. A shiny volcano stone was here!",es:"La ceniza volcánica da suelo rico, por eso los agricultores de Java cultivan arroz en las laderas. ¡Aquí había una piedra brillante del volcán!",fa:"خاکستر آتشفشان خاک پربار می‌سازد، پس دهقانان جاوه در دامنه‌ها برنج می‌کارند. یک سنگ براق آتشفشان این‌جا بود!"}}],secret:{tool:"canoe",at:[28,2],text:{en:"The canoe found the tiny island! Indonesia has more active volcanoes than any other country, about 130 of them.",es:"¡La canoa encontró la islita! Indonesia tiene más volcanes activos que cualquier otro país, unos 130.",fa:"قایق کوچک جزیرهٔ خُرد را پیدا کرد! اندونیزیا از هر کشور دیگر آتشفشان فعال بیشتر دارد، حدود ۱۳۰ آتشفشان."}},words:{"mainland southeast asia":{en:"the part of Southeast Asia joined to the rest of Asia: Myanmar, Thailand, Laos, Cambodia and Vietnam",es:"la parte del sudeste asiático unida al resto de Asia: Myanmar, Tailandia, Laos, Camboya y Vietnam",fa:"بخشی از جنوب شرق آسیا که به باقی آسیا وصل است: میانمار، تایلند، لائوس، کمبودیا و ویتنام"},"maritime southeast asia":{en:"the island part of Southeast Asia, out in the sea: Indonesia, the Philippines, Singapore, Brunei, and most of Malaysia",es:"la parte de islas del sudeste asiático, en el mar: Indonesia, Filipinas, Singapur, Brunéi y la mayor parte de Malasia",fa:"بخش جزیره‌ای جنوب شرق آسیا در بحر: اندونیزیا، فیلیپین، سنگاپور، برونئی و بیشتر مالیزیا"},archipelago:{en:"a large group of islands close together in the sea",es:"un grupo grande de islas cercanas en el mar",fa:"گروه بزرگی از جزیره‌های نزدیک به هم در بحر"},"ring of fire":{en:"a band around the edge of the Pacific Ocean where volcanoes and earthquakes are common",es:"una franja alrededor del borde del océano Pacífico donde son comunes los volcanes y los terremotos",fa:"کمربندی دور کنارهٔ اقیانوس آرام که آتشفشان و زلزله در آن زیاد است"},plate:{en:"one of the huge pieces of the Earth's hard outer shell; plates move very slowly",es:"uno de los enormes pedazos de la capa dura exterior de la Tierra; las placas se mueven muy despacio",fa:"یکی از تکه‌های بزرگ پوستهٔ سخت زمین؛ این تکه‌ها بسیار آهسته حرکت می‌کنند"},fertile:{en:"full of the minerals plants need, so crops grow well",es:"lleno de los minerales que necesitan las plantas, así que los cultivos crecen bien",fa:"پر از موادی که گیاه لازم دارد، پس کشت خوب می‌روید"},terrace:{en:"a flat step cut into a steep hill so crops like rice can grow there",es:"un escalón plano cortado en un cerro empinado para que crezcan cultivos como el arroz",fa:"یک زینهٔ هموار که در تپهٔ سرازیر کنده می‌شود تا کشتی مثل برنج در آن بروید"}},npcs:[{x:6,y:5,name:{en:"Linh",es:"Linh",fa:"لین"},role:{en:"Boat seller on the Mekong",es:"Vendedora en bote del Mekong",fa:"فروشندهٔ قایقی در میکانگ"},look:{skin:1,hair:"#14100c",shirt:"#d8c040",pants:"#2a4a3a"},lines:[{en:"Xin chào! I sell fruit from my boat on the Mekong River.",es:"¡Xin chào! Vendo fruta desde mi bote en el río Mekong.",fa:"سین چاو! من از قایقم در دریای میکانگ میوه می‌فروشم."},{en:"It is the longest river in Mainland Southeast Asia. It runs from China to Vietnam.",es:"Es el río más largo del sudeste asiático continental. Va desde China hasta Vietnam.",fa:"میکانگ درازترین دریای خشکهٔ جنوب شرق آسیا است. از چین تا ویتنام می‌رود."},{en:"[[mainland southeast asia|Mainland Southeast Asia]] is joined to Asia: Myanmar, Thailand, Laos, Cambodia and Vietnam.",es:"El [[mainland southeast asia|sudeste asiático continental]] está unido a Asia: Myanmar, Tailandia, Laos, Camboya y Vietnam.",fa:"[[mainland southeast asia|خشکهٔ جنوب شرق آسیا]] به آسیا وصل است: میانمار، تایلند، لائوس، کمبودیا و ویتنام."},{en:"[[maritime southeast asia|Maritime (Island) Southeast Asia]] is in the sea. Walk east, or cross the bridge south!",es:"El [[maritime southeast asia|sudeste asiático marítimo (insular)]] está en el mar. ¡Camina al este o cruza el puente al sur!",fa:"[[maritime southeast asia|جنوب شرق آسیای بحری (جزیره‌ای)]] در بحر است. به طرف شرق برو، یا از پل به طرف جنوب!"}],ask:{stat:"loc",q:{en:"Which river is the longest in Mainland Southeast Asia?",es:"¿Cuál es el río más largo del sudeste asiático continental?",fa:"درازترین دریای خشکهٔ جنوب شرق آسیا کدام است؟"},choices:[{ok:true,t:{en:"The Mekong",es:"El Mekong",fa:"میکانگ"},why:{en:"Yes. The Mekong flows from China all the way to the sea in Vietnam.",es:"Sí. El Mekong va desde China hasta el mar en Vietnam.",fa:"بلی. میکانگ از چین تا بحر در ویتنام می‌رود."}},{t:{en:"The Ganges",es:"El Ganges",fa:"گنگا"},why:{en:"The Ganges is in South Asia, not Southeast Asia.",es:"El Ganges está en Asia del Sur, no en el sudeste asiático.",fa:"گنگا در جنوب آسیا است، نه جنوب شرق آسیا."}},{t:{en:"The Nile",es:"El Nilo",fa:"نیل"},why:{en:"The Nile is in Africa.",es:"El Nilo está en África.",fa:"نیل در افریقا است."}}]}},{x:2,y:15,name:{en:"Siti",es:"Siti",fa:"سیتی"},role:{en:"Rice farmer on Java",es:"Agricultora de arroz en Java",fa:"دهقان برنج در جاوه"},remember:{ep:"6.1",t:{en:"Hello! My friend Lakshmi grows rice by the Ganges. She wrote to me that you found Nani Kamala's rain gauge in the river. Now the farmers know when the monsoon rain comes. Thank you!",es:"¡Hola! Mi amiga Lakshmi cultiva arroz junto al Ganges. Me escribió que encontraste el pluviómetro de la abuela Kamala en el río. Ahora los agricultores saben cuándo llega la lluvia del monzón. ¡Gracias!",fa:"سلام! دوستم لکشمی کنار گنگا برنج می‌کارد. او برایم نوشت که تو باران‌سنج مادرکلان کمالا را در دریا پیدا کردی. حالا دهقانان می‌دانند باران موسمی کی می‌آید. تشکر!"}},look:{skin:3,hair:"#120e0a",shirt:"#3a9a5a",pants:"#6a3a2a",robe:true},lines:[{en:"Selamat datang! Welcome to Java, an island of Indonesia.",es:"¡Selamat datang! Bienvenido a Java, una isla de Indonesia.",fa:"سلامت داتانگ! به جاوه، یک جزیرهٔ اندونیزیا، خوش آمدی."},{en:"Indonesia has more than 17,000 islands. A big group like this is an [[archipelago|archipelago]].",es:"Indonesia tiene más de 17,000 islas. Un grupo grande así es un [[archipelago|archipiélago]].",fa:"اندونیزیا بیش از ۱۷۰۰۰ جزیره دارد. گروه بزرگ جزیره‌ها مثل این را [[archipelago|مجمع‌الجزایر]] می‌گویند."},{en:"Ash from the volcano above my farm makes [[fertile|fertile]] soil, full of minerals for plants.",es:"La ceniza del volcán arriba de mi granja hace un suelo [[fertile|fértil]], lleno de minerales para las plantas.",fa:"خاکستر آتشفشان بالای کشتزارم خاک را [[fertile|حاصلخیز]] می‌کند، پر از موادی که گیاه لازم دارد."},{en:"We cut [[terrace|terraces]], like giant steps that hold water. Rice grows here and feeds millions.",es:"Cortamos [[terrace|terrazas]], como escalones gigantes que guardan agua. Aquí crece arroz que alimenta a millones.",fa:"ما [[terrace|زمین‌های زینه‌ای]] می‌سازیم، مثل زینه‌های بزرگ که آب را نگه می‌دارند. برنج این‌جا میلیون‌ها نفر را نان می‌دهد."}],ask:{stat:"hei",q:{en:"Java is on the Ring of Fire, and very crowded. Why do so many people farm there?",es:"Java está en el Cinturón de Fuego y tiene muchísima gente. ¿Por qué tanta gente cultiva ahí?",fa:"جاوه روی حلقهٔ آتش است و بسیار پرجمعیت است. چرا این‌قدر مردم آن‌جا کشت می‌کنند؟"},choices:[{ok:true,t:{en:"Volcanic ash makes the soil rich for growing food",es:"La ceniza volcánica hace el suelo rico para cultivar comida",fa:"خاکستر آتشفشان خاک را برای کشت غذا پربار می‌کند"},why:{en:"Right. People weigh the danger against the good soil.",es:"Correcto. La gente compara el peligro con el buen suelo.",fa:"درست است. مردم خطر را با خاک خوب مقایسه می‌کنند."}},{t:{en:"The island has no volcanoes and no earthquakes",es:"La isla no tiene volcanes ni terremotos",fa:"جزیره هیچ آتشفشان و زلزله ندارد"},why:{en:"Java has many volcanoes. It sits right on the Ring of Fire.",es:"Java tiene muchos volcanes. Está justo en el Cinturón de Fuego.",fa:"جاوه آتشفشان‌های زیادی دارد. درست روی حلقهٔ آتش است."}},{t:{en:"Volcano soil is poor, so the land there is very cheap",es:"El suelo del volcán es pobre, así que la tierra ahí es muy barata",fa:"خاک آتشفشان ضعیف است، پس زمین آن‌جا بسیار ارزان است"},why:{en:"It is the opposite: volcanic soil is very fertile.",es:"Es al revés: el suelo volcánico es muy fértil.",fa:"برعکس است: خاک آتشفشانی بسیار حاصلخیز است."}}]}},{x:19,y:18,name:{en:"Ramon",es:"Ramón",fa:"رامون"},role:{en:"Volcano watcher in the Philippines",es:"Vigilante de volcanes en Filipinas",fa:"نگهبان آتشفشان در فیلیپین"},look:{skin:2,hair:"#1c1612",shirt:"#e05a2a",pants:"#24304a"},lines:[{en:"Mabuhay! I watch this volcano. The Philippines has more than 7,000 islands.",es:"¡Mabuhay! Yo vigilo este volcán. Filipinas tiene más de 7,000 islas.",fa:"مابوهای! من این آتشفشان را نگهبانی می‌کنم. فیلیپین بیش از ۷۰۰۰ جزیره دارد."},{en:"We are on the [[ring of fire|Ring of Fire]]. It circles the edge of the Pacific Ocean.",es:"Estamos en el [[ring of fire|Cinturón de Fuego]]. Rodea el borde del océano Pacífico.",fa:"ما روی [[ring of fire|حلقهٔ آتش]] هستیم. این حلقه دور کنارهٔ اقیانوس آرام است."},{en:"Earth's shell is broken into huge [[plate|plates]]. Where they grind, we get earthquakes and volcanoes.",es:"La capa de la Tierra está rota en enormes [[plate|placas]]. Donde se rozan, hay terremotos y volcanes.",fa:"پوستهٔ زمین به [[plate|صفحه‌های]] بزرگ شکسته است. جایی که به هم ساییده می‌شوند، زلزله و آتشفشان است."},{en:"Sensors watch day and night. Before an eruption, warnings and drills show where to go.",es:"Unos sensores vigilan día y noche. Antes de una erupción, las alertas y los simulacros muestran adónde ir.",fa:"دستگاه‌ها شب و روز می‌پایند. پیش از فوران، هشدارها و تمرین‌ها نشان می‌دهند کجا بروند."}],ask:{stat:"pla",q:{en:"Where is the Ring of Fire?",es:"¿Dónde está el Cinturón de Fuego?",fa:"حلقهٔ آتش کجاست؟"},choices:[{ok:true,t:{en:"Around the edge of the Pacific Ocean",es:"Alrededor del borde del océano Pacífico",fa:"دور کنارهٔ اقیانوس آرام"},why:{en:"Yes. Indonesia, the Philippines, Japan, Chile and Mexico are all on it.",es:"Sí. Indonesia, Filipinas, Japón, Chile y México están en él.",fa:"بلی. اندونیزیا، فیلیپین، جاپان، چیلی و مکزیک همه روی آن هستند."}},{t:{en:"Across the middle of the Indian Ocean",es:"En el medio del océano Índico",fa:"در وسط اقیانوس هند"},why:{en:"The Ring of Fire circles the Pacific, not the Indian Ocean.",es:"El Cinturón de Fuego rodea el Pacífico, no el Índico.",fa:"حلقهٔ آتش دور اقیانوس آرام است، نه اقیانوس هند."}},{t:{en:"Under the coldest part of the Arctic",es:"Bajo la parte más fría del Ártico",fa:"زیر سردترین بخش قطب شمال"},why:{en:"The Ring of Fire is a band around the Pacific Ocean.",es:"El Cinturón de Fuego es una franja alrededor del Pacífico.",fa:"حلقهٔ آتش کمربندی دور اقیانوس آرام است."}}]}}],signs:[{x:12,y:8,text:{en:"SEA ROUTE · Ships carry rice, rubber and palm oil through the Strait of Malacca, between the Indian and Pacific Oceans.",es:"RUTA DEL MAR · Los barcos llevan arroz, caucho y aceite de palma por el estrecho de Malaca, entre el océano Índico y el Pacífico.",fa:"راه بحری · کشتی‌ها برنج، رابر و روغن نخل را از تنگهٔ مالاکا، میان اقیانوس هند و اقیانوس آرام، می‌برند."}},{x:24,y:18,text:{en:"VOLCANO SAFETY · Green = calm. Yellow = watch closely. Red = leave now. Know your way out, and practice it with your family.",es:"SEGURIDAD DEL VOLCÁN · Verde = calma. Amarillo = vigilar de cerca. Rojo = salir ya. Conoce tu camino de salida y practícalo con tu familia.",fa:"ایمنی آتشفشان · سبز = آرام. زرد = با دقت بپا. سرخ = همین حالا برو. راه بیرون رفتن خود را بدان و با خانواده‌ات تمرین کن."}}],quest:{stat:"mov",title:{en:"Rice for the Island",es:"Arroz para la isla",fa:"برنج برای جزیره"},giver:{x:21,y:3,name:{en:"Ibu Dewi",es:"Doña Dewi",fa:"بی‌بی دیوی"},role:{en:"Cook on the little island",es:"Cocinera de la islita",fa:"آشپز جزیرهٔ کوچک"},look:{skin:4,hair:"#16100c",shirt:"#e0607a",pants:"#2a3a5a",style:"bun"},lines:[{en:"Welcome to our little island! We have lots of fish and coconuts.",es:"¡Bienvenido a nuestra islita! Tenemos mucho pescado y muchos cocos.",fa:"به جزیرهٔ کوچک ما خوش آمدی! ما ماهی و نارگیل زیاد داریم."},{en:"But there is only sand and palm trees. No flat, wet land for rice.",es:"Pero solo hay arena y palmeras. No hay tierra plana y húmeda para el arroz.",fa:"اما فقط ریگ و درخت نخل است. هیچ زمین هموار و تر برای برنج نیست."},{en:"The Quake Grump sank our rice boat, and the festival is soon!",es:"¡El Gruñón Temblor hundió nuestro bote de arroz, y la fiesta es pronto!",fa:"غرغروی زلزله قایق برنج ما را غرق کرد و جشن نزدیک است!"},{en:"Ask Lola Nena, who farms the island to the south. Take the long bridge!",es:"Pregúntale a Lola Nena, que cultiva en la isla del sur. ¡Toma el puente largo!",fa:"از لولا ننا بپرس که در جزیرهٔ جنوبی کشت می‌کند. از پل دراز برو!"}],wait:{en:"Lola Nena is on the rice [[terrace|terraces]], south across the long bridge.",es:"Lola Nena está en las [[terrace|terrazas]] de arroz, al sur, cruzando el puente largo.",fa:"لولا ننا روی [[terrace|زمین‌های زینه‌ای]] برنج است، جنوب، آن طرف پل دراز."},thanks:{en:"Thank you! We have extra fish, the mainland has extra rice. Trade lets us share.",es:"¡Gracias! Nosotros tenemos pescado de sobra y el continente tiene arroz de sobra. El comercio nos deja compartir.",fa:"تشکر! ما ماهی اضافه داریم، خشکه برنج اضافه دارد. تجارت به ما کمک می‌کند شریک کنیم."}},contact:{x:26,y:15,name:{en:"Lola Nena",es:"Lola Nena",fa:"لولا ننا"},role:{en:"Rice terrace farmer",es:"Agricultora de terrazas de arroz",fa:"دهقان زمین‌های زینه‌ای برنج"},look:{skin:2,hair:"#cfc8bd",shirt:"#2a8ac0",pants:"#5a3a2a",style:"bun",hat:"#d8b060"},lines:[{en:"We grow rice on these [[terrace|terraces]]. But the steps on the mountain are small.",es:"Cultivamos arroz en estas [[terrace|terrazas]]. Pero los escalones de la montaña son pequeños.",fa:"ما در این [[terrace|زمین‌های زینه‌ای]] برنج می‌کاریم. اما زینه‌های کوه کوچک هستند."},{en:"They grow just enough rice for our village. Flat river plains grow much more.",es:"Dan solo el arroz justo para nuestro pueblo. Las llanuras planas de los ríos dan mucho más.",fa:"فقط برای قریهٔ ما برنج کافی می‌دهند. دشت‌های هموار کنار دریا خیلی بیشتر می‌دهند."},{en:"Find the Mekong rice trader on the [[mainland southeast asia|mainland]], north-west. Offer what your island has extra.",es:"Busca al comerciante de arroz del Mekong en el [[mainland southeast asia|continente]], al noroeste. Ofrécele lo que le sobra a tu isla.",fa:"تاجر برنج میکانگ را در [[mainland southeast asia|خشکه]]، شمال غرب، پیدا کن. چیزی را پیشنهاد کن که جزیره‌ات اضافه دارد."}]},action:{type:"trade",trader:{x:11,y:6,name:{en:"Uncle Bao",es:"Don Bao",fa:"کاکا بائو"},role:{en:"Rice trader on the Mekong",es:"Comerciante de arroz del Mekong",fa:"تاجر برنج میکانگ"},look:{skin:1,hair:"#2a2420",shirt:"#3a6a3a",pants:"#2a2a2a",style:"short",hat:"#d8c890"},lines:[{en:"The Mekong floods these flat fields every year. It leaves rich mud behind.",es:"El Mekong inunda estos campos planos cada año. Deja lodo rico.",fa:"میکانگ هر سال این کشتزارهای هموار را زیر آب می‌برد. گِل پربار به جا می‌گذارد."},{en:"So we grow more rice than we can eat!",es:"¡Por eso cultivamos más arroz del que podemos comer!",fa:"به همین خاطر بیشتر از آنچه می‌خوریم برنج می‌کاریم!"}]},q:{en:"I will give you a big sack of rice. What will you bring me for it?",es:"Te daré un saco grande de arroz. ¿Qué me traes a cambio?",fa:"یک بوجی کلان برنج به تو می‌دهم. در عوض آن چه برایم می‌آوری؟"},choices:[{ok:true,at:[21,7],icon:"🐟",t:{en:"Dried fish and coconuts from the little island",es:"Pescado seco y cocos de la islita",fa:"ماهی خشک و نارگیل از جزیرهٔ کوچک"},why:{en:"Good trade! Your little island has plenty of fish and coconuts. My Mekong fields have plenty of rice. Each side gives what it has extra.",es:"¡Buen trato! Tu islita tiene mucho pescado y cocos. Mis campos del Mekong tienen mucho arroz. Cada lado da lo que le sobra.",fa:"معاملهٔ خوب! جزیرهٔ کوچک شما ماهی و نارگیل زیاد دارد. کشتزارهای میکانگ من برنج زیاد دارد. هر طرف چیزی را می‌دهد که اضافه دارد."}},{at:[10,8],icon:"🍚",t:{en:"A sack of rice from the Mekong fields",es:"Un saco de arroz de los campos del Mekong",fa:"یک بوجی برنج از کشتزارهای میکانگ"},why:{en:"That rice is from my own fields! I already have more rice than I need.",es:"¡Ese arroz es de mis propios campos! Ya tengo más arroz del que necesito.",fa:"این برنج از کشتزارهای خود من است! من همین حالا بیشتر از ضرورتم برنج دارم."}},{at:[20,15],icon:"🌾",t:{en:"A basket of rice from the terraces",es:"Una canasta de arroz de las terrazas",fa:"یک سبد برنج از زمین‌های زینه‌ای"},why:{en:"That rice feeds Lola Nena's village. The small [[terrace|terraces]] grow just enough for them. And I have plenty of rice! Bring what your island has extra.",es:"Ese arroz alimenta al pueblo de Lola Nena. Las [[terrace|terrazas]] pequeñas dan solo lo justo para ellos. ¡Y yo tengo mucho arroz! Trae lo que a tu isla le sobra.",fa:"این برنج نان ده لولا ننا است. [[terrace|زمین‌های زینه‌ای]] کوچک فقط برای خودشان کافی می‌دهند. و من برنج زیاد دارم! چیزی را بیاور که جزیره‌ات اضافه دارد."}}],item:{icon:"🍚",name:{en:"A sack of Mekong rice",es:"Un saco de arroz del Mekong",fa:"یک بوجی برنج میکانگ"}}}},scraps:[[14,1],[28,6],[3,20]],smudges:[[10,2],[9,15],[23,16]],challenge:{at:[24,4],type:"carry",zones:[{bin:"main",x:2,y:6,w:5,h:2},{bin:"isle",x:24,y:5,w:2,h:2},{bin:"isle",x:24,y:12,w:2,h:1}],style:"bands",stat:"reg",title:{en:"Mainland or islands?",es:"¿Continente o islas?",fa:"خشکه یا جزیره؟"},intro:{en:"The Grump shook the country names loose! Sort each country. Is it on the mainland, joined to Asia, or is it an island country out in the sea? (Malaysia is not here because it is both: part is on the mainland and part is on the island of Borneo.)",es:"¡El Gruñón soltó los nombres de los países! Ordena cada país. ¿Está en el continente, unido a Asia, o es un país de islas en el mar? (Malasia no está aquí porque es las dos cosas: una parte está en el continente y otra en la isla de Borneo.)",fa:"غرغرو نام کشورها را تکان داد و جدا کرد! هر کشور را جدا کن. آیا روی خشکه و وصل به آسیا است، یا یک کشور جزیره‌ای در بحر است؟ (مالیزیا این‌جا نیست چون هر دو است: یک بخش آن روی خشکه و بخش دیگر در جزیرهٔ بورنئو است.)"},bins:[{id:"main",icon:"🏞️",tile:"q",label:{en:"Mainland Southeast Asia",es:"Sudeste asiático continental",fa:"خشکهٔ جنوب شرق آسیا"},sub:{en:"joined to the rest of Asia",es:"unido al resto de Asia",fa:"وصل به باقی آسیا"}},{id:"isle",icon:"🏝️",tile:"p",label:{en:"Island (Maritime) Southeast Asia",es:"Sudeste asiático insular (marítimo)",fa:"جنوب شرق آسیای جزیره‌ای"},sub:{en:"out in the sea",es:"en el mar",fa:"در بحر"}}],items:[{bin:"main",t:{en:"Vietnam",es:"Vietnam",fa:"ویتنام"},why:{en:"Vietnam is on the mainland, along the east coast. The Mekong reaches the sea there.",es:"Vietnam está en el continente, en la costa este. El Mekong llega al mar ahí.",fa:"ویتنام روی خشکه، در کنار ساحل شرقی است. میکانگ آن‌جا به بحر می‌رسد."}},{bin:"main",t:{en:"Thailand",es:"Tailandia",fa:"تایلند"},why:{en:"Thailand is in the middle of the mainland.",es:"Tailandia está en el medio del continente.",fa:"تایلند در وسط خشکه است."}},{bin:"main",t:{en:"Laos",es:"Laos",fa:"لائوس"},why:{en:"Laos has no coast at all. It is the only Southeast Asian country with no sea.",es:"Laos no tiene costa. Es el único país del sudeste asiático sin mar.",fa:"لائوس هیچ ساحلی ندارد. تنها کشور جنوب شرق آسیا است که بحر ندارد."}},{bin:"main",t:{en:"Cambodia",es:"Camboya",fa:"کمبودیا"},why:{en:"Cambodia is on the mainland. The Mekong flows right through it.",es:"Camboya está en el continente. El Mekong pasa por en medio.",fa:"کمبودیا روی خشکه است. میکانگ از میان آن می‌گذرد."}},{bin:"main",t:{en:"Myanmar",es:"Myanmar",fa:"میانمار"},why:{en:"Myanmar is the farthest west on the mainland, next to India and Bangladesh.",es:"Myanmar es el país más al oeste del continente, junto a la India y Bangladés.",fa:"میانمار غربی‌ترین کشور خشکه است، کنار هند و بنگله‌دیش."}},{bin:"isle",t:{en:"Indonesia",es:"Indonesia",fa:"اندونیزیا"},why:{en:"Indonesia is an archipelago of more than 17,000 islands.",es:"Indonesia es un archipiélago de más de 17,000 islas.",fa:"اندونیزیا مجمع‌الجزایری با بیش از ۱۷۰۰۰ جزیره است."}},{bin:"isle",t:{en:"The Philippines",es:"Filipinas",fa:"فیلیپین"},why:{en:"The Philippines is made of more than 7,000 islands.",es:"Filipinas está formada por más de 7,000 islas.",fa:"فیلیپین از بیش از ۷۰۰۰ جزیره ساخته شده است."}},{bin:"isle",t:{en:"Singapore",es:"Singapur",fa:"سنگاپور"},why:{en:"Singapore is a small island country at the tip of the Malay Peninsula. It is not part of the mainland.",es:"Singapur es un país isla pequeño en la punta de la península malaya. No es parte del continente.",fa:"سنگاپور یک کشور جزیره‌ای کوچک در نوک شبه‌جزیرهٔ مالایا است. بخشی از خشکه نیست."}},{bin:"isle",t:{en:"Brunei",es:"Brunéi",fa:"برونئی"},why:{en:"Brunei is on the island of Borneo.",es:"Brunéi está en la isla de Borneo.",fa:"برونئی در جزیرهٔ بورنئو است."}}],success:{en:"The map holds still again: five countries on the mainland, and island countries out across the sea!",es:"¡El mapa vuelve a estar quieto: cinco países en el continente y países de islas en el mar!",fa:"نقشه دوباره آرام شد: پنج کشور روی خشکه و کشورهای جزیره‌ای در بحر!"}},boss:{at:[27,19],stat:"mov",need:3,name:{en:"The Quake Grump",es:"El Gruñón Temblor",fa:"غرغروی زلزله"},appear:{en:"The Quake Grump is shaking the town under the volcano!",es:"¡El Gruñón Temblor está sacudiendo el pueblo bajo el volcán!",fa:"غرغروی زلزله شهر زیر آتشفشان را تکان می‌دهد!"},taunt:{en:"Rumble rumble! I will shake every island loose and mix up the whole map!",es:"¡Brrrum brrrum! ¡Voy a soltar cada isla y revolver todo el mapa!",fa:"غُرّ غُرّ! هر جزیره را تکان می‌دهم و تمام نقشه را به هم می‌زنم!"},win:{en:"The shaking stops. The islands settle back in place, and atlas page 6.2 lands in your hands!",es:"El temblor se detiene. Las islas vuelven a su lugar, ¡y la página 6.2 del atlas cae en tus manos!",fa:"لرزش می‌ایستد. جزیره‌ها سر جایشان برمی‌گردند و صفحهٔ ۶.۲ اطلس به دستت می‌افتد!"},questions:[{q:{en:"Where is the Ring of Fire?",es:"¿Dónde está el Cinturón de Fuego?",fa:"حلقهٔ آتش کجاست؟"},choices:[{en:"Around the edge of the Pacific Ocean",es:"Alrededor del borde del océano Pacífico",fa:"دور کنارهٔ اقیانوس آرام"},{en:"Across the middle of the Indian Ocean",es:"En el medio del océano Índico",fa:"در وسط اقیانوس هند"},{en:"Along the equator in Central Africa",es:"En el ecuador, en África central",fa:"در امتداد خط استوا در افریقای مرکزی"},{en:"Under the coldest part of the Arctic",es:"Bajo la parte más fría del Ártico",fa:"زیر سردترین بخش قطب شمال"}],answer:0,why:{en:"The [[ring of fire|Ring of Fire]] is a band of volcanoes and earthquakes around the Pacific Ocean.",es:"El [[ring of fire|Cinturón de Fuego]] es una franja de volcanes y terremotos alrededor del Pacífico.",fa:"[[ring of fire|حلقهٔ آتش]] کمربندی از آتشفشان و زلزله دور اقیانوس آرام است."}},{q:{en:"Which five countries make up Mainland Southeast Asia?",es:"¿Qué cinco países forman el sudeste asiático continental?",fa:"کدام پنج کشور خشکهٔ جنوب شرق آسیا را می‌سازند؟"},choices:[{en:"Myanmar, Thailand, Laos, Cambodia and Vietnam",es:"Myanmar, Tailandia, Laos, Camboya y Vietnam",fa:"میانمار، تایلند، لائوس، کمبودیا و ویتنام"},{en:"Indonesia, the Philippines, Malaysia, Singapore and Brunei",es:"Indonesia, Filipinas, Malasia, Singapur y Brunéi",fa:"اندونیزیا، فیلیپین، مالیزیا، سنگاپور و برونئی"},{en:"India, Pakistan, Bangladesh, Nepal and Bhutan",es:"India, Pakistán, Bangladés, Nepal y Bután",fa:"هند، پاکستان، بنگله‌دیش، نیپال و بوتان"},{en:"China, Japan, Korea, Mongolia and Taiwan",es:"China, Japón, Corea, Mongolia y Taiwán",fa:"چین، جاپان، کوریا، مغولستان و تایوان"}],answer:0,why:{en:"Those five are joined to the rest of Asia. The second list is mostly island countries.",es:"Esos cinco están unidos al resto de Asia. La segunda lista es casi toda de países de islas.",fa:"این پنج کشور به باقی آسیا وصل هستند. فهرست دوم بیشتر کشورهای جزیره‌ای است."}},{q:{en:"Is Singapore part of Mainland Southeast Asia?",es:"¿Singapur es parte del sudeste asiático continental?",fa:"آیا سنگاپور بخشی از خشکهٔ جنوب شرق آسیا است؟"},choices:[{en:"No. It is a small island country.",es:"No. Es un país isla pequeño.",fa:"نه. یک کشور جزیره‌ای کوچک است."},{en:"Yes. It is next to Laos.",es:"Sí. Está junto a Laos.",fa:"بلی. کنار لائوس است."},{en:"Yes. It is the biggest mainland country.",es:"Sí. Es el país continental más grande.",fa:"بلی. بزرگ‌ترین کشور خشکه است."},{en:"No. It is in South Asia.",es:"No. Está en Asia del Sur.",fa:"نه. در جنوب آسیا است."}],answer:0,why:{en:"Singapore is an island at the tip of the Malay Peninsula, by the Strait of Malacca.",es:"Singapur es una isla en la punta de la península malaya, junto al estrecho de Malaca.",fa:"سنگاپور جزیره‌ای در نوک شبه‌جزیرهٔ مالایا، کنار تنگهٔ مالاکا است."}},{q:{en:"What does fertile soil mean?",es:"¿Qué significa suelo fértil?",fa:"خاک حاصلخیز یعنی چه؟"},choices:[{en:"Soil full of the minerals plants need",es:"Suelo lleno de los minerales que necesitan las plantas",fa:"خاکی پر از موادی که گیاه لازم دارد"},{en:"Soil that is very dry and full of sand",es:"Suelo muy seco y lleno de arena",fa:"خاکی که بسیار خشک و پر از ریگ است"},{en:"Soil washed away by floods",es:"Suelo que se llevaron las inundaciones",fa:"خاکی که سیلاب برده است"},{en:"Soil that stays frozen most of the year",es:"Suelo que está congelado casi todo el año",fa:"خاکی که بیشتر سال یخ‌زده است"}],answer:0,why:{en:"[[fertile|Fertile]] soil helps crops grow well. Volcanic ash makes soil fertile.",es:"El suelo [[fertile|fértil]] ayuda a que los cultivos crezcan bien. La ceniza volcánica lo hace fértil.",fa:"خاک [[fertile|حاصلخیز]] به خوب روییدن کشت کمک می‌کند. خاکستر آتشفشان خاک را حاصلخیز می‌کند."}},{q:{en:"Java is very crowded and full of volcanoes. Why do so many people farm there?",es:"Java tiene mucha gente y muchos volcanes. ¿Por qué tanta gente cultiva ahí?",fa:"جاوه بسیار پرجمعیت و پر از آتشفشان است. چرا این‌قدر مردم آن‌جا کشاورزی می‌کنند؟"},choices:[{en:"Volcanic ash makes the soil rich for growing food",es:"La ceniza volcánica hace el suelo rico para cultivar comida",fa:"خاکستر آتشفشان خاک را برای کشت غذا پربار می‌کند"},{en:"The island has no earthquakes and no volcanoes",es:"La isla no tiene terremotos ni volcanes",fa:"جزیره هیچ زلزله و آتشفشان ندارد"},{en:"The government makes people live near the volcanoes",es:"El gobierno obliga a la gente a vivir cerca de los volcanes",fa:"حکومت مردم را مجبور می‌کند نزدیک آتشفشان‌ها زندگی کنند"},{en:"Java is the only land Indonesia has",es:"Java es la única tierra que tiene Indonesia",fa:"جاوه تنها زمینی است که اندونیزیا دارد"}],answer:0,why:{en:"People weigh a real danger against real benefits: rich soil grows more rice.",es:"La gente compara un peligro real con beneficios reales: el suelo rico produce más arroz.",fa:"مردم یک خطر واقعی را با فایده‌های واقعی مقایسه می‌کنند: خاک پربار برنج بیشتر می‌دهد."}},{q:{en:"What is an archipelago?",es:"¿Qué es un archipiélago?",fa:"مجمع‌الجزایر چیست؟"},choices:[{en:"A large group of islands close together",es:"Un grupo grande de islas cercanas",fa:"گروه بزرگی از جزیره‌های نزدیک به هم"},{en:"A band of volcanoes around an ocean",es:"Una franja de volcanes alrededor de un océano",fa:"کمربندی از آتشفشان دور یک اقیانوس"},{en:"A wind that changes with the season",es:"Un viento que cambia con la estación",fa:"بادی که با فصل تغییر می‌کند"},{en:"A high, wide area of land with a flat top",es:"Una zona alta y ancha de tierra con la cima plana",fa:"یک زمین بلند و پهن با سر هموار"}],answer:0,why:{en:"Indonesia and the Philippines are both [[archipelago|archipelagos]].",es:"Indonesia y Filipinas son [[archipelago|archipiélagos]].",fa:"اندونیزیا و فیلیپین هر دو [[archipelago|مجمع‌الجزایر]] هستند."}},{q:{en:"How does Japan make earthquakes less dangerous?",es:"¿Cómo hace Japón que los terremotos sean menos peligrosos?",fa:"جاپان چطور زلزله را کم‌خطرتر می‌کند؟"},choices:[{en:"Its buildings sway in a quake instead of cracking",es:"Sus edificios se mecen en un terremoto en vez de romperse",fa:"ساختمان‌هایش در زلزله به جای کفیدن تاب می‌خورند"},{en:"It moves every big city far away from the coast",es:"Muda todas las ciudades grandes lejos de la costa",fa:"همهٔ شهرهای بزرگ را از ساحل دور می‌برد"},{en:"It stops all farming on the slopes of volcanoes",es:"Prohíbe toda la agricultura en las laderas de los volcanes",fa:"همهٔ کشت را در دامنهٔ آتشفشان‌ها منع می‌کند"},{en:"It closes its ports in the rainy season",es:"Cierra sus puertos en la temporada de lluvias",fa:"بندرهای خود را در فصل باران می‌بندد"}],answer:0,why:{en:"Buildings that bend and sway are less likely to fall. Warnings and drills help too.",es:"Los edificios que se doblan y se mecen tienen menos riesgo de caerse. Las alertas y los simulacros también ayudan.",fa:"ساختمان‌هایی که خم می‌شوند و تاب می‌خورند کمتر فرو می‌ریزند. هشدارها و تمرین‌ها هم کمک می‌کنند."}},{q:{en:"A mapmaker groups Indonesia, the Philippines and Malaysia together. What is that group called?",es:"Un cartógrafo agrupa a Indonesia, Filipinas y Malasia. ¿Cómo se llama ese grupo?",fa:"یک نقشه‌کش اندونیزیا، فیلیپین و مالیزیا را در یک گروه می‌گذارد. نام آن گروه چیست؟"},choices:[{en:"Maritime (Island) Southeast Asia",es:"Sudeste asiático marítimo (insular)",fa:"جنوب شرق آسیای بحری (جزیره‌ای)"},{en:"Mainland Southeast Asia, joined to Asia",es:"Sudeste asiático continental, unido a Asia",fa:"خشکهٔ جنوب شرق آسیا، وصل به آسیا"},{en:"The Indian subcontinent of South Asia",es:"El subcontinente indio, en Asia del Sur",fa:"نیم‌قارهٔ هند در جنوب آسیا"},{en:"The Ring of Fire",es:"El Cinturón de Fuego",fa:"حلقهٔ آتش"}],answer:0,why:{en:'"Maritime" means "of the sea". Malaysia has land on the mainland and on Borneo, but mapmakers often put it in this group.',es:'"Marítimo" significa "del mar". Malasia tiene tierra en el continente y en Borneo, pero los cartógrafos suelen ponerla en este grupo.',fa:"«بحری» یعنی «مربوط به بحر». مالیزیا هم روی خشکه و هم در بورنئو زمین دارد، اما نقشه‌کش‌ها اکثراً آن را در همین گروه می‌گذارند."}}]},learned:[{en:"[[mainland southeast asia|Mainland Southeast Asia]] is joined to Asia: Myanmar, Thailand, Laos, Cambodia and Vietnam. The Mekong is its longest river.",es:"El [[mainland southeast asia|sudeste asiático continental]] está unido a Asia: Myanmar, Tailandia, Laos, Camboya y Vietnam. El Mekong es su río más largo.",fa:"[[mainland southeast asia|خشکهٔ جنوب شرق آسیا]] به آسیا وصل است: میانمار، تایلند، لائوس، کمبودیا و ویتنام. میکانگ درازترین دریای آن است."},{en:"Island Southeast Asia is made of [[archipelago|archipelagos]]: Indonesia has more than 17,000 islands, and the Philippines has more than 7,000.",es:"El sudeste asiático insular está hecho de [[archipelago|archipiélagos]]: Indonesia tiene más de 17,000 islas y Filipinas más de 7,000.",fa:"جنوب شرق آسیای جزیره‌ای از [[archipelago|مجمع‌الجزایر]] ساخته شده است: اندونیزیا بیش از ۱۷۰۰۰ جزیره و فیلیپین بیش از ۷۰۰۰ جزیره دارد."},{en:"The [[ring of fire|Ring of Fire]] brings volcanoes and earthquakes, but volcanic ash makes [[fertile|fertile]] soil. People farm [[terrace|terraces]] and plan to stay safe.",es:"El [[ring of fire|Cinturón de Fuego]] trae volcanes y terremotos, pero la ceniza volcánica hace el suelo [[fertile|fértil]]. La gente cultiva en [[terrace|terrazas]] y se prepara para estar a salvo.",fa:"[[ring of fire|حلقهٔ آتش]] آتشفشان و زلزله می‌آورد، اما خاکستر آتشفشان خاک را [[fertile|حاصلخیز]] می‌کند. مردم در [[terrace|زمین‌های زینه‌ای]] کشت می‌کنند و برای در امان ماندن برنامه می‌ریزند."}],reflect:{q:{en:"Would you live near a volcano if its soil grew lots of food? What good things and what dangers would you weigh?",es:"¿Vivirías cerca de un volcán si su suelo diera mucha comida? ¿Qué cosas buenas y qué peligros compararías?",fa:"آیا نزدیک یک آتشفشان زندگی می‌کردی اگر خاکش غذای زیاد می‌داد؟ کدام چیزهای خوب و کدام خطرها را مقایسه می‌کردی؟"},starter:{en:"I would choose to live",es:"Yo elegiría vivir",fa:"من انتخاب می‌کردم که"}}};
