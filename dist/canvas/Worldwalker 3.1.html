      a.x += Math.sign(a.tx - a.x) * 0.25 * k; a.y += Math.sign(a.ty - a.y) * 0.18 * k + Math.sin(t / 200 + a.ph) * 0.2;
      const x = Math.round(a.x - ox), y = Math.round(a.y - oy), open = Math.floor(t / 120 + a.ph) % 2;
      c.fillStyle = a.c; if (open) { c.fillRect(x - 2, y - 1, 2, 2); c.fillRect(x + 1, y - 1, 2, 2); } else { c.fillRect(x - 1, y - 2, 1, 2); c.fillRect(x + 1, y - 2, 1, 2); }
      c.fillStyle = '#22202e'; c.fillRect(x, y - 1, 1, 2);
    } else if (a.k === 'fly') {
      const x = Math.round(a.x - ox + Math.sin(t / 900 + a.ph) * 14), y = Math.round(a.y - oy + Math.cos(t / 700 + a.ph) * 9);
      const on = (Math.sin(t / 300 + a.ph * 3) + 1) / 2;
      c.fillStyle = `rgba(230,255,140,${0.25 + on * 0.75})`; c.fillRect(x, y, 1, 1);
      c.fillStyle = `rgba(230,255,140,${on * 0.25})`; c.fillRect(x - 1, y - 1, 3, 3);
    } else if (a.k === 'birds') {
      if (!a.fly) { a.next -= dt; if (a.next < 0) a.fly = { x: -10, y: 10 + rnd() * 40, v: 0.6 + rnd() * 0.3, n: 2 + ((rnd() * 2) | 0) }; return; }
      const f = a.fly; f.x += f.v * k;
      for (let i = 0; i < f.n; i++) {
        const x = Math.round(f.x - i * 9), y = Math.round(f.y + i * 5 + Math.sin(t / 300 + i) * 2), up = Math.floor(t / 150 + i) % 2;
        c.fillStyle = '#2b2b3a';
        c.fillRect(x, y, 1, 1); c.fillRect(x - 2, y - (up ? 1 : -1), 2, 1); c.fillRect(x + 1, y - (up ? 1 : -1), 2, 1);
      }
      if (f.x > VW + 40) { a.fly = null; a.next = 6000 + rnd() * 8000; }
    } else if (a.k === 'fishspot') {
      a.next -= dt;
      if (a.next < 0 && !a.jump) {
        const s = a.spots[(rnd() * a.spots.length) | 0];
        a.jump = { x: s[0] * TS + 8, y: s[1] * TS + 10, age: 0 }; a.next = 2500 + rnd() * 4000;
      }
      if (a.jump) {
        const j = a.jump; j.age += k;
        const p = j.age / 40, x = Math.round(j.x - ox + p * 10 - 5), y = Math.round(j.y - oy - Math.sin(p * Math.PI) * 10);
        if (p < 1) { c.fillStyle = '#e0e8f0'; c.fillRect(x, y, 3, 2); c.fillStyle = '#9fb4c8'; c.fillRect(x - 1, y + (p < .5 ? 1 : -1), 1, 1); }
        if (j.age === k || (p >= 1 && !j.splashed)) { burst((j.x + (p >= 1 ? 5 : -5)) / TS - 0.5, j.y / TS - 0.5, 'splash'); if (p >= 1) j.splashed = true; }
        if (p > 1.4) a.jump = null;
      }
    } else if (a.k === 'chimney') {
      a.next -= dt;
      if (a.next < 0) { a.next = 450 + rnd() * 250; parts.push({ x: a.x, y: a.y, vx: wind * 0.25, vy: -0.25, g: 0, life: 90, age: 0, kind: 'smoke', size: 2 }); }
    }
  }

  function weather(c, t, dt, k) {
    const s = sky.sky;
    if (!drops.length || calm()) { if (s === 'rain' || s === 'drizzle') { c.fillStyle = 'rgba(30,45,70,.05)'; c.fillRect(0, 0, VW, VH); } return; }
    if (s === 'rain' || s === 'drizzle') {
      c.fillStyle = s === 'rain' ? 'rgba(30,45,70,.06)' : 'rgba(40,55,80,.03)'; c.fillRect(0, 0, VW, VH);
      c.fillStyle = s === 'rain' ? 'rgba(210,228,255,.7)' : 'rgba(215,230,255,.55)';
      drops.forEach(d => {
        d.y += (s === 'rain' ? 5 : 3.2) * d.s * k; d.x -= (s === 'rain' ? 1.4 : 0.8) * k;
        c.fillRect(Math.round(d.x), Math.round(d.y), 1, s === 'rain' ? 5 : 3);
        if (d.y > VH || d.x < -10) {
          if (rnd() < 0.5) { c.fillStyle = 'rgba(220,235,255,.6)'; c.fillRect(Math.round(d.x) - 1, VH - 2 - ((rnd() * VH * 0.9) | 0), 3, 1); c.fillStyle = s === 'rain' ? 'rgba(200,220,255,.55)' : 'rgba(210,225,255,.45)'; }
          Object.assign(d, newDrop(false));
        }
      });
      // splashes on the ground
      for (let i = 0; i < (s === 'rain' ? 4 : 2); i++) { const x = (hash(i, (t / 120) | 0, 1) * VW) | 0, y = (hash(i, (t / 120) | 0, 2) * VH) | 0; c.fillStyle = 'rgba(220,235,255,.5)'; c.fillRect(x - 1, y, 3, 1); c.fillRect(x, y - 1, 1, 1); }
    } else if (s === 'snow') {
      drops.forEach(d => {
        d.y += 0.45 * d.s * k; d.x += (Math.sin(t / 800 + d.ph) * 0.3 + wind * 0.3) * k;
        c.fillStyle = 'rgba(255,255,255,.9)'; c.fillRect(Math.round(d.x), Math.round(d.y), d.s > 1 ? 2 : 1, d.s > 1 ? 2 : 1);
        if (d.y > VH || d.x > VW + 10) Object.assign(d, newDrop(false), { x: rnd() * VW - 20 });
      });
    } else if (s === 'petals' || s === 'leaves') {
      const cols = s === 'petals' ? ['#ffc4d6', '#ffb0c8', '#ffe0ea', '#ff9ab8'] : ['#d9822b', '#c0392b', '#e0b030', '#a85a2a'];
      drops.forEach(d => {
        d.y += 0.35 * d.s * k; d.x += (Math.sin(t / 600 + d.ph) * 0.5 + 0.25) * k;
        const flip = Math.sin(t / 250 + d.ph) > 0;
        c.fillStyle = cols[d.c]; c.fillRect(Math.round(d.x), Math.round(d.y), flip ? 2 : 1, flip ? 1 : 2);
        if (s === 'leaves') c.fillRect(Math.round(d.x) + 1, Math.round(d.y) + 1, 1, 1);
        if (d.y > VH || d.x > VW + 10) Object.assign(d, newDrop(false), { x: rnd() * VW - 30 });
      });
    } else if (s === 'heat' || s === 'dust') {
      // shimmer: faint wavy light bands, plus sand blowing past
      for (let i = 0; i < 4; i++) {
        const y = ((t / 40 + i * 47) % (VH + 20)) - 10;
        c.fillStyle = 'rgba(255,240,200,.06)';
        for (let x = 0; x < VW; x += 8) c.fillRect(x, Math.round(y + Math.sin(x / 20 + t / 300) * 2), 8, 2);
      }
      drops.forEach(d => {
        d.x += (1.2 + d.s) * wind * k; d.y += Math.sin(t / 300 + d.ph) * 0.15 * k;
        c.fillStyle = s === 'dust' ? 'rgba(214,180,110,.55)' : 'rgba(232,209,138,.45)'; c.fillRect(Math.round(d.x), Math.round(d.y), 2, 1);
        if (d.x > VW + 4) { d.x = -4 - rnd() * 30; d.y = rnd() * VH; }
      });
    }
  }

  // sunset glow, dusk, or night with lit windows and a small light around the hero
  function light(c, sx, sy, hero, t) {
    const tm = sky.time;
    if (tm === 'sunset') {
      const g = c.createLinearGradient(0, 0, 0, VH);
      g.addColorStop(0, 'rgba(255,120,50,.20)'); g.addColorStop(0.5, 'rgba(255,160,70,.06)'); g.addColorStop(1, 'rgba(255,160,70,0)');
      c.fillStyle = g; c.fillRect(0, 0, VW, VH);
    } else if (tm === 'night') {
      if (!dark) { dark = document.createElement('canvas'); dark.width = VW; dark.height = VH; }
      const d = dark.getContext('2d');
      d.globalCompositeOperation = 'source-over'; d.clearRect(0, 0, VW, VH);
      d.fillStyle = 'rgba(12,18,52,.32)'; d.fillRect(0, 0, VW, VH);
      d.globalCompositeOperation = 'destination-out';
      const hole = (x, y, r, a) => { const g = d.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)'); d.fillStyle = g; d.fillRect(x - r, y - r, r * 2, r * 2); };
      if (hero) hole(hero.x + 8, hero.y + 6, 44, 0.85);
      for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
        const ch = tileAt(sx * SW + x, sy * SH + y);
        if (ch === 'h' || ch === 'U' || ch === 'J' || ch === 'X' || ch === 'm') hole(x * TS + 8, y * TS + 8, 22, 0.7);
      }
      c.drawImage(dark, 0, 0);
      // warm glow on the lit windows
      c.globalCompositeOperation = 'lighter';
      for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
        const ch = tileAt(sx * SW + x, sy * SH + y);
        if (ch === 'h' || ch === 'U') { const g = c.createRadialGradient(x * TS + 8, y * TS + 8, 0, x * TS + 8, y * TS + 8, 14); g.addColorStop(0, 'rgba(255,200,90,.22)'); g.addColorStop(1, 'rgba(255,200,90,0)'); c.fillStyle = g; c.fillRect(x * TS - 6, y * TS - 6, 28, 28); }
      }
      c.globalCompositeOperation = 'source-over';
    }
  }

  WW.fx = { setup, draw, burst, step, lift, get sky() { return sky; }, SKY };
})();

/* quest.js */
/* WORLDWALKER engine · the episode quest
   A quest giver (gold !) asks for help -> you talk to a contact (?) -> you do one action -> you go back to the giver.
   The action is one of:
     find  – use the contact's clue to find a secret spot and walk onto it
     fight – beat an Ink Thief in a short question duel
     trade – offer the right goods to a trader
   The compass stone stays shut until the quest is done. See docs/EPISODE-FORMAT.md ("quest"). */
(function () {
  const L = t => WW.L(t), T = k => WW.T(k);
  // quest steps: 0 not started · 1 go to the contact · 2 do the action · 3 go back to the giver · 4 done
  const Q = WW.quest = {};
  const THIEF = { g: '#a04848', G: '#6e2c2c', w: '#ffffff', r: '#2b1414' };
  Q.THIEF = THIEF;

  Q.on = () => !!(WW.ep && WW.ep.quest);
  Q.step = () => (WW.run && WW.run.quest) || 0;
  Q.done = () => !Q.on() || Q.step() >= 4;
  function set(n) { WW.run.quest = n; WW.ui.quest(); }

  /* make the map entities for the quest */
  Q.ents = (ep) => {
    const q = ep.quest, out = [];
    if (!q) return out;
    q.giver.id = 'qgiver'; q.contact.id = 'qcontact';
    out.push({ kind: 'qnpc', role: 'giver', x: q.giver.x, y: q.giver.y, ref: q.giver, phase: 7 });
    out.push({ kind: 'qnpc', role: 'contact', x: q.contact.x, y: q.contact.y, ref: q.contact, phase: 11 });
    const a = q.action;
    if (a.type === 'trade') { a.trader.id = 'qtrader'; out.push({ kind: 'qnpc', role: 'trader', x: a.trader.x, y: a.trader.y, ref: a.trader, phase: 13 }); }
    if (a.type === 'fight') out.push({ kind: 'qfoe', x: a.at[0], y: a.at[1], visible: false });
    if (a.type === 'find') out.push({ kind: 'qspot', x: a.at[0], y: a.at[1] });
    return out;
  };

  const item = () => WW.ep.quest.action.item;
  const itemName = () => (item() ? `${item().icon || '🎁'} ${WW.plain(item().name)}` : '');
  const say = (who, text, after) => WW.ui.talk({ id: who.id, name: who.name, role: who.role, look: who.look, lines: [text] }, after);

  /* walking into a quest person or the thief */
  Q.interact = (e, ents) => {
    const q = WW.ep.quest, s = Q.step();
    if (e.kind === 'qfoe') return fight(e);
    const who = e.ref;
    if (e.role === 'giver') {
      if (s === 0) WW.ui.talk(Object.assign({}, who, { lines: q.giver.lines, doneLabel: T('accept') }), () => { set(1); WW.sfx('good'); WW.toast('📜 ' + WW.esc(T('newQuest')) + ': ' + WW.esc(WW.plain(q.title)), '#c08a1e'); });
      else if (s < 3) say(who, q.giver.wait);
      else if (s === 3) say(who, q.giver.thanks, () => finish());
      else say(who, T('thanksAgain'));
    } else if (e.role === 'contact') {
      if (s === 1) WW.ui.talk(Object.assign({}, who, { lines: q.contact.lines }), () => { set(2); showAction(ents); });
      else if (s === 0) say(who, T('busy'));
      else if (s === 2) say(who, q.contact.lines[q.contact.lines.length - 1]);
      else say(who, T('goodLuck'));
    } else if (e.role === 'trader') {
      if (s !== 2) return say(who, s < 2 ? T('busy') : T('goodLuck'));
      const a = q.action;
      WW.ui.talk(Object.assign({}, who, { lines: a.trader.lines, ask: { stat: q.stat, q: a.q, choices: a.choices } }), () => {
        set(3); WW.sfx('coin'); WW.fx.burst(e.x, e.y, 'gold');
        WW.toast(`🤝 ${WW.esc(T('traded'))}${item() ? ' · ' + WW.esc(itemName()) : ''}`, '#2aa198');
      });
    }
    return true;
  };

  function showAction(ents) {
    const a = WW.ep.quest.action;
    if (a.type === 'fight') {
      const f = ents.find(e => e.kind === 'qfoe'); f.visible = true;
      WW.fx.burst(f.x, f.y, 'purple');
    }
    WW.ui.quest();
  }

  function fight(e) {
    const q = WW.ep.quest, a = q.action, r = WW.run;
    r.questMissed = r.questMissed || [];
    WW.bossTrial({ name: a.name, need: a.need || 2, taunt: a.taunt, win: a.win, questions: a.questions, pal: THIEF, minor: true, missedList: r.questMissed }, () => {
      e.gone = true; WW.fx.burst(e.x, e.y, 'poof'); set(3);
      WW.music.play('realm' + WW.ep.realm);
      if (item()) WW.toast(WW.esc(itemName()), '#2aa198');
    });
    return true;
  }

  /* stepping onto a tile: is it the secret spot? */
  Q.onStep = (x, y) => {
    if (!Q.on() || Q.step() !== 2) return;
    const a = WW.ep.quest.action;
    if (a.type !== 'find' || a.at[0] !== x || a.at[1] !== y) return;
    WW.sfx('win'); WW.fx.burst(x, y, 'gold'); set(3);
    WW.ui.message('✨ ' + T('foundIt'), a.found);
  };

  function finish() {
    const q = WW.ep.quest;
    set(4);
    WW.fx.burst(q.giver.x, q.giver.y, 'gold');
    WW.gain(q.stat || 'reg', 2, (q.reward && q.reward.coins) || 10, T('why_quest') + ': ' + WW.plain(q.title));
    WW.toast('🏅 ' + WW.esc(T('questDone')), '#c08a1e');
    WW.sheetSync();
  }

  /* what to draw above people's heads, and the secret spot's twinkle */
  Q.mark = e => {
    const s = Q.step();
    if (e.role === 'giver') return s === 0 || s === 3 ? '!' : '';
    if (e.role === 'contact') return s === 1 ? '?' : '';
    if (e.role === 'trader') return s === 2 ? '?' : '';
    return '';
  };
  Q.draw = (c, e, x, y, t) => {
    if (e.kind === 'qnpc') {
      WW.drawPerson(c, e.ref, x, y - 2, t, e.phase);
      const m = Q.mark(e);
      if (m) {
        const b = Math.round(Math.sin(t / 220 + e.phase) * 1.5);
        c.fillStyle = '#22202e'; c.fillRect(x + 5, y - 13 + b, 7, 9);
        c.fillStyle = m === '!' ? '#f2c14e' : '#8fc3ff'; c.fillRect(x + 6, y - 12 + b, 5, 7);
        c.fillStyle = '#22202e';
        if (m === '!') { c.fillRect(x + 8, y - 11 + b, 1, 3); c.fillRect(x + 8, y - 7 + b, 1, 1); }
        else { c.fillRect(x + 7, y - 11 + b, 3, 1); c.fillRect(x + 9, y - 10 + b, 1, 1); c.fillRect(x + 8, y - 9 + b, 1, 1); c.fillRect(x + 8, y - 7 + b, 1, 1); }
      }
    } else if (e.kind === 'qfoe') {
      WW.shadow(c, x, y + 13, 10);
      WW.sprite(c, 'smudge', x, y, { bob: true, t, phase: 2, pal: THIEF });
      c.fillStyle = '#22202e'; c.fillRect(x + 3, y + 7, 10, 2); // a bandit mask
      c.fillStyle = '#ffffff'; c.fillRect(x + 4, y + 7, 2, 1); c.fillRect(x + 10, y + 7, 2, 1);
    } else if (e.kind === 'qspot' && Q.step() === 2) {
      const k = (Math.sin(t / 260) + 1) / 2;
      c.fillStyle = `rgba(255,243,176,${0.25 + k * 0.6})`;
      c.fillRect(x + 7, y + 4, 2, 8); c.fillRect(x + 4, y + 7, 8, 2);
      c.fillStyle = `rgba(255,255,255,${k})`; c.fillRect(x + 7, y + 7, 2, 2);
    }
  };

  /* the words in the quest bar */
  Q.bar = () => {
    const q = WW.ep.quest, s = Q.step(), a = q.action;
    if (s >= 4) return WW.plain(q.title);
    const now = s === 0 ? T('qFindGiver') : s === 1 ? T('qTalkTo') + ' ' + WW.plain(q.contact.name)
      : s === 3 ? T('qReturn') + ' ' + WW.plain(q.giver.name)
        : a.type === 'find' ? WW.plain(a.hint) : a.type === 'fight' ? T('qBeat') + ' ' + WW.plain(a.name) : T('qTrade') + ' ' + WW.plain(a.trader.name);
    // Spanish: "vence a El Ladrón" -> "vence al Ladrón"
    return `📜 ${WW.plain(q.title)}: ${now.replace(/\ba El\b/, 'al')}`;
  };
  Q.log = () => {
    if (!Q.on()) return '';
    const q = WW.ep.quest, r = WW.run;
    const extra = q.action.type === 'fight' ? ` (${(r.questMissed || []).length} missed)` : q.action.type === 'trade' ? ` (${(r.tries.qtrader || 0) + 1} ${(r.tries.qtrader || 0) ? 'tries' : 'try'})` : '';
    return `QUEST: ${WW.plain({ en: q.title.en })} — ${Q.done() ? 'done' : 'not finished'}${extra}`;
  };
})();

/* foes.js */
/* WORLDWALKER engine · the Grump's helpers: the bad guys that roam each map (1 to 3 per map)
   An episode lists them in smudges: [[x, y], [x, y, 'bat'], ...]. Without a type, the realm picks a fitting mix.
     grump  Grumpling   – wanders, and sometimes flies into a rage and charges (1 star)
     bat    Ink Bat     – fast and twitchy, flies over water, trees and rocks (1 star)
     blob   Mud Blob    – slow but stubborn: it takes 2 stars
     whirl  Dust Devil  – zooms in straight lines and bounces off walls (1 star) */
(function () {
  const { SPR } = WW;
  WW.FOES = {
    grump: { hp: 1, ms: 650, fly: false, name: { en: 'Grumpling', es: 'Gruñoncito', fa: 'غرغروی کوچک' } },
    bat: { hp: 1, ms: 230, fly: true, name: { en: 'Ink Bat', es: 'Murciélago de Tinta', fa: 'شب‌پرهٔ رنگ' } },
    blob: { hp: 2, ms: 1050, fly: false, name: { en: 'Mud Blob', es: 'Bola de Lodo', fa: 'گلولهٔ گِل' } },
    whirl: { hp: 1, ms: 170, fly: false, name: { en: 'Dust Devil', es: 'Remolino de Polvo', fa: 'گردباد خاک' } }
  };
  // which helpers live in each realm (the first spot on every map is always a Grumpling)
  WW.REALM_FOES = { 1: ['bat', 'blob'], 2: ['bat', 'whirl'], 3: ['whirl', 'bat'], 4: ['whirl', 'blob'], 5: ['whirl', 'bat'], 6: ['blob', 'bat'], 7: ['bat', 'whirl'], 8: ['blob', 'whirl'] };
  WW.foeType = (ep, i) => {
    const s = (ep.smudges || [])[i] || [];
    if (s[2] && WW.FOES[s[2]]) return s[2];
    if (i === 0) return 'grump';
    const list = WW.REALM_FOES[ep.realm || +String(ep.id)[0]] || ['bat', 'blob'];
    return list[(i - 1) % list.length];
  };

  SPR.bat = [ // wings up
    '................', '................', 'kk............kk', 'kGk..........kGk', 'kGGk..k..k..kGGk', 'kGGGkkgkkgkkGGGk',
    '.kGGGggggggGGGk.', '..kGgEeggeEgGk..', '...kggggggggk...', '....kgmtmtgk....', '.....kggggk.....', '......kkkk......',
    '................', '................', '................', '................'];
  SPR.batDown = [ // wings down
    '................', '................', '................', '................', '......k..k......', '.....kgkkgk.....',
    '....kggggggk....', '...kgEeggeEgk...', '..kGggggggggGk..', '.kGGkmtmtmkGGk..', 'kGGk.kggggk.kGGk', 'kGk...kkkk...kGk',
    'kk............kk', '................', '................', '................'];
  SPR.blob = [
    '................', '................', '................', '................', '......kkkk......', '....kkggggkk....',
    '...kggggggggk...', '..kgggEgggEggk..', '..kggEegggeEgk..', '.kggggggggggggk.', '.kgggmmmmmmgggk.', '.kggggggggggggk.',
    'kGgggggggggggGGk', 'kGGGgggggggGGGGk', '.kkkkkkkkkkkkkk.', '................'];
  SPR.whirl = [
    '................', '..kkkkkkkkkkkk..', '.kggggggggggggk.', '..kGGGGGGGGGGk..', '...kggggggggk...', '....kgEggEgk....',
    '....kGGGGGGk....', '.....kggggk.....', '.....kGmmGk.....', '......kggk......', '......kGGk......', '.......kk.......',
    '......k.........', '.......k........', '................', '................'];
  // colors for each helper
  WW.FOE_PAL = {
    grump: null,
    bat: { g: '#4a3a6e', G: '#2a1f45', E: '#ffe08a', e: '#ff3b2f', m: '#170c22', t: '#f4efe0' },
    blob: { g: '#6fae2a', G: '#3f6e16', E: '#ffffff', e: '#d4153a', m: '#1c3008' }, // a bright green slime
    whirl: { g: '#e2683a', G: '#9e3418', E: '#ffffff', e: '#2b0d06', m: '#4a1404' }  // a red-orange dust devil
  };

    window.addEventListener('keyup', e => { if (keys[e.key] === held) held = null; });
    window.addEventListener('blur', () => (held = null));
    const pad = $('ww-dpad');
    pad.querySelectorAll('button').forEach(b => {
      const d = b.dataset.d;
      const down = e => { e.preventDefault(); WW.audioInit(); if (d === 'act') actFacing(); else { held = d; heldSince = performance.now(); } };
      const up = e => { e.preventDefault(); if (held === d) held = null; };
      b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
    });
    // click on the map next to the hero = step that way (mouse users)
    $('ww-cv').addEventListener('click', e => {
      WW.audioInit(); $('ww-screen').focus();
      if (WW.paused || trans) return;
      const r = e.target.getBoundingClientRect();
      const [sx, sy] = screenOf(player.x, player.y);
      const tx = sx * SW + Math.floor((e.clientX - r.left) / r.width * SW), ty = sy * SH + Math.floor((e.clientY - r.top) / r.height * SH);
      const dx = tx - player.x, dy = ty - player.y;
      if (!dx && !dy) return;
      const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      const e2 = entAt(tx, ty);
      if (e2 && !['scrap', 'smudge', 'qspot', 'atlas'].includes(e2.kind) && Math.abs(dx) + Math.abs(dy) === 1) { player.dir = d; interact(e2); return; }
      clickTarget = [tx, ty];
    });
  }
  let clickTarget = null;

  /* ---------------- smudges wander ---------------- */
  function moveSmudges(now) {
    if (WW.paused || trans || G.noSmudges) return;
    const [psx, psy] = screenOf(player.x, player.y);
    const calmer = WW.tier('hei') ? 1.6 : 1; // People & land power: calmer bad guys
    ents.forEach(e => {
      if (e.kind !== 'smudge' || e.visible === false || e.home[0] !== psx || e.home[1] !== psy) return;
      const F = WW.FOES[e.type] || WW.FOES.grump;
      // every so often a Grumpling flies into a rage: it turns red and charges at the hero for a moment
      let rage = false;
      if (e.type === 'grump') {
        if (!e.nextRage) e.nextRage = now + 4000 + Math.random() * 5000;
        if (now > e.nextRage) { e.rageUntil = now + 1900; e.nextRage = now + 7000 + Math.random() * 5000; WW.sfx('growl'); shakeT = now; }
        rage = now < (e.rageUntil || 0);
      }
      if (now < e.next) return;
      e.next = now + (rage ? 260 : F.ms + (e.phase % 3) * (F.ms / 6)) * calmer;
      const dirs = Object.values(DIRS);
      const toward = [[Math.sign(player.x - e.x), 0], [0, Math.sign(player.y - e.y)]].filter(([a, b]) => a || b);
      const towardOne = () => toward[(Math.random() * toward.length) | 0];
      let pick;
      if (e.type === 'whirl') pick = e.dir; // straight lines; turns when it bumps into something
      else if (e.type === 'blob') pick = Math.random() < .6 && toward.length ? towardOne() : dirs[(Math.random() * 4) | 0]; // slow but follows you
      else if (e.type === 'bat') pick = Math.random() < .3 && toward.length ? towardOne() : dirs[(Math.random() * 4) | 0]; // twitchy
      else pick = (rage || Math.random() < .35) && toward.length ? towardOne() : dirs[(Math.random() * 4) | 0];
      const nx = e.x + pick[0], ny = e.y + pick[1];
      const [hx, hy] = screenOf(nx, ny);
      const edge = nx <= 0 || ny <= 0 || nx >= W - 1 || ny >= H - 1;
      const blocked = hx !== e.home[0] || hy !== e.home[1] || edge || (!F.fly && WW.solid(tileAt(nx, ny))) || (() => { const o = entAt(nx, ny); return o && o !== e && o.kind !== 'scrap' && o.kind !== 'qspot'; })();
      if (blocked) { if (e.type === 'whirl') e.dir = dirs[(Math.random() * 4) | 0]; return; }
      e.x = nx; e.y = ny;
      if (e.x === player.x && e.y === player.y) touchSmudge(e);
    });
  }


  /* ---------------- drawing ---------------- */
  function drawScreen(c, sx, sy, ox, oy, t) {
    c.save(); c.translate(ox, oy);
    // tiles get their global position so edges and ground match the real map around them
    for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
      const gx = sx * SW + x, gy = sy * SH + y, ch = tileAt(gx, gy);
      (WW.tiles[ch] || WW.tiles['.'])(c, x * TS, y * TS, gx, gy, t, map);
    }
    const inScreen = e => { const [ex, ey] = screenOf(e.x, e.y); return ex === sx && ey === sy; };
    const px = e => (e.x - sx * SW) * TS, py = e => (e.y - sy * SH) * TS;
    ents.forEach(e => {
      if (e.gone || e.visible === false || !inScreen(e)) return;
      if (e.kind === 'scrap') WW.sprite(c, 'page', px(e) + 1, py(e) + 2, { bob: true, t, phase: e.id });
      if (e.kind === 'stone') {
        const glow = WW.run.challengeDone ? 0 : (Math.sin(t / 300) + 1) / 2;
        if (glow) { c.fillStyle = `rgba(242,193,78,${.15 + glow * .25})`; c.fillRect(px(e) - 2, py(e) - 2, 20, 20); }
        WW.sprite(c, 'stone', px(e), py(e), { pal: { W: '#9aa3ad', G: '#5e636b', y: WW.run.challengeDone ? '#3fa34d' : '#f2c14e', r: '#e04848', n: '#2f6fd6' } });
      }
    });
    ents.forEach(e => {
      if (e.gone || e.visible === false || !inScreen(e)) return;
      if (e.kind === 'npc') {
        WW.drawPerson(c, e.ref, px(e), py(e) - 2, t, e.phase);
        if (!WW.run.talked.has(e.ref.id)) { // speech bubble
          const b = Math.round(Math.sin(t / 250 + e.phase) * 1.5);
          c.fillStyle = '#fffbe8'; c.fillRect(px(e) + 10, py(e) - 9 + b, 7, 6); c.fillStyle = '#22202e'; c.fillRect(px(e) + 12, py(e) - 7 + b, 1, 1); c.fillRect(px(e) + 14, py(e) - 7 + b, 1, 1);
        }
      }
      if (e.kind === 'qnpc' || e.kind === 'qfoe' || e.kind === 'qspot') WW.quest.draw(c, e, px(e), py(e), t);
      if (e.kind === 'atlas') {
        const a = (Math.sin(t / 250) + 1) / 2;
        c.fillStyle = `rgba(255,230,140,${.25 + a * .35})`; c.beginPath(); c.arc(px(e) + 8, py(e) + 6, 10 + a * 3, 0, 7); c.fill();
        c.fillStyle = '#22202e'; c.fillRect(px(e) + 2, py(e) + 10, 12, 6); c.fillStyle = '#9aa3ad'; c.fillRect(px(e) + 3, py(e) + 11, 10, 4); c.fillStyle = '#c3c8ce'; c.fillRect(px(e) + 3, py(e) + 11, 10, 1);
        WW.sprite(c, 'page', px(e) + 1, py(e) - 6, { bob: true, t });
      }
      if (e.kind === 'smudge') {
        const rage = t < (e.rageUntil || 0), j = rage ? Math.round(Math.sin(t / 30)) : 0;
        if (rage) { c.fillStyle = 'rgba(255,60,40,.35)'; c.beginPath(); c.arc(px(e) + 8, py(e) + 8, 10, 0, 7); c.fill(); }
        WW.drawFoe(c, e, px(e) + j, py(e), t, rage);
      }
      if (e.kind === 'boss') {
        const a = (Math.sin(t / 200) + 1) / 2, roar = t - (e.roarT || 0) < 700;
        // a dark, spiky cloud around the Grump
        for (let k = 0; k < 10; k++) {
          const ang = k / 10 * Math.PI * 2 + t / 900, rr = 13 + a * 3 + (k % 2) * 4 + (roar ? 4 : 0);
          c.fillStyle = roar ? 'rgba(170,30,40,.55)' : `rgba(40,25,60,${.35 + a * .2})`;
          c.beginPath(); c.arc(px(e) + 8 + Math.cos(ang) * rr * .55, py(e) + 4 + Math.sin(ang) * rr * .45, 5, 0, 7); c.fill();
        }
        const j = roar ? Math.round(Math.sin(t / 25) * 2) : 0;
        WW.sprite(c, 'smudge', px(e) - 8 + j, py(e) - 16, { bob: true, t, scale: 2, pal: roar ? { g: '#7a2a40', e: '#fff070' } : null });
      }
    });
    c.restore();
  }

  function frame(now) {
    requestAnimationFrame(frame);
    const c = G.ctx; if (!c || !WW.run) return;
    // movement timing
    if (player.moving && now - player.moving >= stepMs()) { player.moving = 0; player.from = null; WW.fx.step(player.x, player.y); pickup(); }
    const dt = Math.min(100, now - (lastFrame || now)); lastFrame = now;
    if (!player.moving && !trans && !WW.paused) {
      if (held) tryStep(held, now);
      else if (clickTarget) {
        const dx = clickTarget[0] - player.x, dy = clickTarget[1] - player.y;
        if (!dx && !dy) clickTarget = null;
        else {
          const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
          const bx = player.x, by = player.y; tryStep(d, now);
          if (player.x === bx && player.y === by) {
            const d2 = Math.abs(dx) > Math.abs(dy) ? (dy ? (dy > 0 ? 'down' : 'up') : null) : (dx ? (dx > 0 ? 'right' : 'left') : null);
            if (d2) tryStep(d2, now);
            if (player.x === bx && player.y === by) clickTarget = null;
          }
        }
      }
    }
    moveSmudges(now);
    if (!WW.paused) moveStars(dt);
    const bossE = ents.find(e => e.kind === 'boss' && e.visible && !e.gone);
    if (bossE && !WW.paused && Math.abs(bossE.x - player.x) + Math.abs(bossE.y - player.y) <= 5 && now - (bossE.roarT || 0) > 5500) {
      bossE.roarT = now; shakeT = now; WW.sfx('growl'); G.flashT = now; // the Grump roars when you come near
    }
    // pip trails one tile behind
    if (pip.tx != null && !player.moving) { pip.x = pip.tx; pip.y = pip.ty; pip.tx = null; }
    // where to draw the hero inside the screen
    const k = player.moving ? Math.min(1, (now - player.moving) / stepMs()) : 1;
    const fx = player.from ? player.from[0] + (player.x - player.from[0]) * k : player.x;
    const fy = player.from ? player.from[1] + (player.y - player.from[1]) * k : player.y;
    let [sx, sy] = screenOf(player.x, player.y);
    c.save();
    if (now - shakeT < 250) c.translate(Math.round(Math.sin(now / 20) * 2), 0);
    if (trans) {
      const p = Math.min(1, (now - trans.t0) / 380);
      const [dx, dy] = trans.d;
      const offX = -dx * p * SW * TS, offY = -dy * p * SH * TS;
      drawScreen(c, trans.from[0], trans.from[1], offX, offY, now);
      drawScreen(c, trans.to[0], trans.to[1], offX + dx * SW * TS, offY + dy * SH * TS, now);
      const hx = (fx - trans.from[0] * SW) * TS + offX, hy = (fy - trans.from[1] * SH) * TS + offY;
      drawHero(c, hx, hy, now);
      WW.fx.draw(c, trans.to[0], trans.to[1], null, now, dt);
      if (p >= 1) trans = null;
    } else {
      drawScreen(c, sx, sy, 0, 0, now);
      // pip
      const [psx, psy] = screenOf(pip.x, pip.y);
      if (psx === sx && psy === sy) WW.shadow(c, (pip.x - sx * SW) * TS, (pip.y - sy * SH) * TS + 13, 6);
      if (psx === sx && psy === sy) WW.sprite(c, 'pip', (pip.x - sx * SW) * TS + 2, (pip.y - sy * SH) * TS - 4, { bob: true, t: now, phase: 1 });
      drawHero(c, (fx - sx * SW) * TS, (fy - sy * SH) * TS, now);
      drawStars(c, sx, sy, now);
      WW.fx.draw(c, sx, sy, { x: (fx - sx * SW) * TS, y: (fy - sy * SH) * TS }, now, dt);
      drawArrows(c, sx, sy, (fx - sx * SW) * TS, (fy - sy * SH) * TS, now);
    }
    if (now - (G.flashT || 0) < 300) { c.fillStyle = `rgba(200,30,30,${0.25 * (1 - (now - G.flashT) / 300)})`; c.fillRect(0, 0, SW * TS, SH * TS); }
    c.restore();
  }
  /* the goal right now (for the Location power's arrow and for the dimness) */
  G.goal = () => {
    const r = WW.run, ep = WW.ep, near = list => list.sort((a, b) => Math.abs(a.x - player.x) + Math.abs(a.y - player.y) - Math.abs(b.x - player.x) - Math.abs(b.y - player.y))[0];
    if (r.bossDone) return r.claimed ? null : ep.boss.at;
    const left = ents.filter(e => e.kind === 'npc' && !r.talked.has(e.ref.id));
    if (left.length) { const n = near(left); return [n.x, n.y]; }
    if (WW.quest.on() && !WW.quest.done()) {
      const q = ep.quest, st = WW.quest.step(), a = q.action;
      if (st === 0 || st === 3) return [q.giver.x, q.giver.y];
      if (st === 1) return [q.contact.x, q.contact.y];
      return a.type === 'fight' ? a.at : a.type === 'trade' ? [a.trader.x, a.trader.y] : null; // a secret spot is found with the clue, not the arrow
    }
    return r.challengeDone ? ep.boss.at : ep.challenge.at;
  };
  G.progress = () => { // 0..1: how much of the episode is done (the land's color comes back with it)
    const r = WW.run, ep = WW.ep;
    const parts = [r.talked.size >= ep.npcs.length, WW.quest.done(), r.challengeDone, r.bossDone];
    return parts.filter(Boolean).length / parts.length;
  };
  function arrow(c, hx, hy, tx, ty, col, rad) {
    const dx = tx - hx, dy = ty - hy, d = Math.hypot(dx, dy); if (d < 20) return;
    const ux = dx / d, uy = dy / d, ax = hx + ux * rad, ay = hy + uy * rad, px = -uy, py = ux;
    c.fillStyle = '#22202e'; c.beginPath(); c.moveTo(ax + ux * 7, ay + uy * 7); c.lineTo(ax + px * 5 - ux * 2, ay + py * 5 - uy * 2); c.lineTo(ax - px * 5 - ux * 2, ay - py * 5 - uy * 2); c.fill();
    c.fillStyle = col; c.beginPath(); c.moveTo(ax + ux * 5, ay + uy * 5); c.lineTo(ax + px * 3.4 - ux, ay + py * 3.4 - uy); c.lineTo(ax - px * 3.4 - ux, ay - py * 3.4 - uy); c.fill();
  }
  function drawArrows(c, sx, sy, hx, hy, now) {
    if (WW.paused || !WW.tier('loc')) return;
    const cx = hx + 8, cy = hy + 6, pos = p => [(p[0] - sx * SW) * TS + 8, (p[1] - sy * SH) * TS + 8];
    const g = G.goal();
    if (g) { const [tx, ty] = pos(g); arrow(c, cx, cy, tx, ty + Math.sin(now / 200) * 1.5, '#f2c14e', 15); }
    if (WW.tier('loc') >= 2) {
      const left = ents.filter(e => e.kind === 'scrap' && !e.gone);
      if (left.length) { const n = left.sort((a, b) => Math.hypot(a.x - player.x, a.y - player.y) - Math.hypot(b.x - player.x, b.y - player.y))[0]; const [tx, ty] = pos([n.x, n.y]); arrow(c, cx, cy, tx, ty, '#fff3b0', 22); }
    }
  }
  function drawHero(c, x, y, now) {
    if (performance.now() < inv && Math.floor(now / 90) % 2) return; // blink after a hit
    const walk = player.moving && Math.floor(now / 75) % 2;
    const d = player.dir;
    const name = d === 'up' ? (walk ? 'heroUpWalk' : 'heroUp') : d === 'down' ? (walk ? 'heroWalk' : 'hero') : (walk ? 'heroSideWalk' : 'heroSide');
    WW.shadow(c, Math.round(x), Math.round(y) + 12, 10);
    WW.sprite(c, name, Math.round(x), Math.round(y) - 3, { pal: WW.heroPal(), flip: d === 'left' });
  }

  /* ---------------- hooks for the automatic play-tests ---------------- */
  WW.dbg = {
    teleport(x, y) { player.x = x; player.y = y; player.from = null; player.moving = 0; trans = null; pip.x = x; pip.y = y; },
    face(d) { player.dir = d; },
    act() { actFacing(); },
    bumpInto(x, y) { // stand next to (x,y) on a walkable tile and interact
      for (const [d, [dx, dy]] of Object.entries(DIRS)) {
        const sx = x - dx, sy = y - dy;
        if (walkable(sx, sy)) { this.teleport(sx, sy); player.dir = d; interact(entAt(x, y)); return true; }
      }
      return false;
    },
    standOn(x, y) { this.teleport(x, y); pickup(); },
    fire() { lastShot = 0; throwStar(); },
    get stars() { return stars; },
    get goal() { return G.goal(); },
    collect(i) { const e = ents.find(e => e.kind === 'scrap' && e.id === i); this.teleport(e.x, e.y); pickup(); },
    get ents() { return ents; }, get player() { return player; },
    noSmudges() { G.noSmudges = true; }
  };
})();
