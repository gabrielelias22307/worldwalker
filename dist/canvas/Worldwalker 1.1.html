    while (nextT < ac.currentTime + 0.15) {
      if (song.once && step >= song.len) { const after = song.after; stop(); if (after) play(after); return; }
      schedule(song, step, nextT, sd);
      nextT += sd; step++;
    }
  }
  function stop() { if (timer) clearInterval(timer); timer = null; song = null; songName = ''; }
  function start() {
    if (!WW.save.music || !wanted || !setup()) return;
    if (ac.state === 'suspended') ac.resume();
    song = Object.assign({}, SONGS[wanted]); songName = wanted; step = 0; nextT = ac.currentTime + 0.08;
    if (song.once) song.after = wantedAfter;
    if (timer) clearInterval(timer);
    timer = setInterval(tick, 30); tick();
  }
  let wanted = '', wantedAfter = '';
  // play a song by name ('realm4', 'boss', 'win'); 'then' = the song to go back to after a one-time jingle
  function play(name, then) {
    wanted = name; wantedAfter = then || '';
    if (songName === name && timer) return;
    stop(); start();
  }
  document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) ac.suspend(); else ac.resume(); });

  WW.music = {
    SONGS, play,
    stop() { wanted = ''; stop(); },
    wake() { if (wanted && !timer) start(); },          // call after the first tap/click, when sound is allowed
    toggle() { WW.save.music = !WW.save.music; WW.store(); if (WW.save.music) start(); else stop(); },
    get playing() { return songName; },
    // for tests/music.js: write a whole song into an OfflineAudioContext
    renderInto(ctx, name, loops = 1) {
      const keep = [ac, out, noise]; ac = ctx; out = null; WW.ac = ctx; setup();
      const s = SONGS[name], sd = 60 / s.bpm / 2;
      for (let i = 0; i < s.len * loops; i++) schedule(s, i, 0.05 + i * sd, sd);
      [ac, out, noise] = keep; WW.ac = ac;
    }
  };
})();

/* fx.js */
/* WORLDWALKER engine · the living world: butterflies, birds, fish, chimney smoke, cloud shadows,
   weather and time of day for each episode, and little bursts of sparkle and dust.
   Everything is drawn on top of the map canvas each frame. */
(function () {
  const TS = 16, SW = 16, SH = 11, VW = SW * TS, VH = SH * TS;
  const { hash } = WW;
  const calm = () => WW.calm;

  /* weather and time of day for each episode (an episode file can also set its own: weather: { sky, time }) */
  const SKY = {
    '1.1': { life: 1 }, '1.2': { life: 1 }, '1.3': { life: 1 },
    '2.1': { sky: 'leaves' }, '2.2': { sky: 'drizzle' }, '2.3': { time: 'sunset' },
    '3.1': { sky: 'drizzle' }, '3.2': { sky: 'snow' }, '3.3': { time: 'sunset', sky: 'dust' },
    '4.1': { sky: 'heat' }, '4.2': { time: 'sunset' }, '4.3': { life: 1 },
    '5.1': { sky: 'heat' }, '5.2': { time: 'sunset' }, '5.3': { sky: 'heat' },
    '6.1': { sky: 'rain' }, '6.2': { sky: 'drizzle' }, '6.3': { life: 1 },
    '7.1': { sky: 'petals' }, '7.2': { life: 1 }, '7.3': { time: 'night' },
    '8.1': { sky: 'heat' }, '8.2': { life: 1 }, '8.3': { time: 'sunset' }
  };
  let sky = {}, map = null, parts = [], drops = [], amb = [], cur = '', clouds = [], dark = null, wind = 0.3;

  const rnd = Math.random;
  const tileAt = (x, y) => (map[y] || '')[x];

  function setup(ep) {
    sky = Object.assign({ sky: 'clear', time: 'day' }, SKY[ep.id] || {}, ep.weather || {});
    map = ep.map; parts = []; amb = []; cur = '';
    WW.style.realm = ep.realm || +ep.id[0];
    WW.style.night = sky.time === 'night';
    wind = sky.sky === 'snow' ? 0.25 : sky.sky === 'dust' || sky.sky === 'heat' ? 0.9 : 0.35;
    drops = [];
    const n = { rain: 90, drizzle: 40, snow: 70, petals: 18, leaves: 14, dust: 26, heat: 14 }[sky.sky] || 0;
    for (let i = 0; i < n; i++) drops.push(newDrop(true));
    clouds = [];
    if (sky.time === 'day' && (sky.sky === 'clear' || sky.sky === 'heat' || sky.sky === 'leaves' || sky.sky === 'petals'))
      for (let i = 0; i < 2; i++) clouds.push({ x: rnd() * VW * 2 - VW / 2, y: rnd() * VH, r: 40 + rnd() * 30, v: 0.006 + rnd() * 0.004 });
  }
  function newDrop(anywhere) {
    return { x: rnd() * (VW + 40) - 20, y: anywhere ? rnd() * VH : -8 - rnd() * 20, s: 0.6 + rnd() * 0.8, ph: rnd() * 6, c: (rnd() * 4) | 0 };
  }

  /* things that live on one screen: made fresh each time the hero walks onto a new screen */
  function enterScreen(sx, sy) {
    const key = sx + ',' + sy; if (key === cur) return; cur = key;
    amb = [];
    const grass = [], water = [], chim = [];
    for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
      const gx = sx * SW + x, gy = sy * SH + y, ch = tileAt(gx, gy);
      if ('.,"'.includes(ch)) grass.push([gx, gy]);
      if (ch === '~' || ch === '=') water.push([gx, gy]);
      if (WW.hasChimney && WW.hasChimney(map, gx, gy)) chim.push([gx, gy]);
    }
    const ox = sx * VW, oy = sy * VH;
    const clear = !['rain', 'drizzle', 'snow'].includes(sky.sky);
    if (sky.time === 'night') {
      grass.length > 20 && [0, 1, 2, 3, 4].forEach(i => { const g = grass[(hash(sx, sy, i) * grass.length) | 0]; amb.push({ k: 'fly', x: g[0] * TS + 8, y: g[1] * TS + 8, ph: i * 1.7 }); });
    } else if (clear && grass.length > 30) {
      [0, 1].forEach(i => { const g = grass[(hash(sx, sy, i + 3) * grass.length) | 0]; amb.push({ k: 'butterfly', x: g[0] * TS + 8, y: g[1] * TS + 8, tx: 0, ty: 0, c: ['#ffe36e', '#ff8fb1', '#ffffff', '#8fc3ff'][(i + sx + sy) % 4], ph: i * 2 }); });
    }
    if (water.length > 12) amb.push({ k: 'fishspot', spots: water, next: 0 });
    if (clear && sky.time !== 'night') amb.push({ k: 'birds', next: 2000 + rnd() * 4000, ox, oy });
    chim.forEach(([gx, gy]) => amb.push({ k: 'chimney', x: gx * TS + 11, y: gy * TS, next: 0 }));
  }

  /* bursts: sparkles, dust, smoke */
  function burst(gx, gy, kind) {
    if (calm() && kind !== 'gold') return;
    const x = gx * TS + 8, y = gy * TS + 8;
    const n = { gold: 16, purple: 22, dust: 4, snow: 4, splash: 6, poof: 30 }[kind] || 8;
    for (let i = 0; i < n; i++) {
      const a = rnd() * Math.PI * 2, sp = kind === 'dust' || kind === 'snow' ? 0.15 + rnd() * 0.2 : kind === 'splash' ? 0.4 + rnd() * 0.3 : 0.5 + rnd() * 1.1;
      parts.push({
        x: kind === 'dust' || kind === 'snow' ? x + (rnd() - 0.5) * 8 : x, y: kind === 'dust' || kind === 'snow' ? y + 6 : y,
        vx: Math.cos(a) * sp, vy: kind === 'dust' || kind === 'snow' ? -0.1 - rnd() * 0.15 : kind === 'splash' ? -0.8 - rnd() * 0.6 : Math.sin(a) * sp,
        g: kind === 'splash' ? 0.06 : kind === 'gold' ? 0.02 : 0, life: kind === 'poof' ? 70 : kind === 'dust' || kind === 'snow' ? 26 : 45, age: 0, kind,
        size: kind === 'poof' ? 2 + ((rnd() * 3) | 0) : kind === 'dust' || kind === 'snow' ? 2 : 1 + ((rnd() * 2) | 0)
      });
    }
  }
  // a little dust when you walk on dry ground or snow
  function step(gx, gy) {
    const ch = tileAt(gx, gy);
    if ('su:g'.includes(ch)) burst(gx, gy, 'dust');
    else if ('nzi'.includes(ch)) burst(gx, gy, 'snow');
  }

  const PCOL = { gold: ['#fff3b0', '#f2c14e', '#ffffff'], purple: ['#a08cc8', '#6d5f8c', '#4b3f63'], poof: ['#a08cc8', '#6d5f8c', '#d8d0ec'], dust: ['rgba(201,176,100,.7)'], snow: ['rgba(255,255,255,.85)'], splash: ['#d8f0ff', '#ffffff'] };

  /* ---------------- drawing ---------------- */
  // c: the map canvas. sx, sy: the screen being shown. hero: {x, y} in pixels on that screen. t: time in ms
  function draw(c, sx, sy, hero, t, dt) {
    enterScreen(sx, sy);
    const ox = sx * VW, oy = sy * VH, k = Math.min(3, dt / 16.7);
    if (!calm()) {
      // cloud shadows drift over the whole world
      clouds.forEach(cl => {
        cl.x += cl.v * dt; if (cl.x - cl.r > VW * 2) cl.x = -cl.r * 2;
        c.fillStyle = 'rgba(30,50,60,.06)';
        c.beginPath(); c.ellipse(cl.x - VW / 2, cl.y, cl.r, cl.r * 0.55, 0, 0, 7); c.fill();
        c.beginPath(); c.ellipse(cl.x - VW / 2 + cl.r * 0.6, cl.y + cl.r * 0.15, cl.r * 0.7, cl.r * 0.4, 0, 0, 7); c.fill();
      });
      amb.forEach(a => ambient(c, a, ox, oy, t, dt, k));
    }
    // bursts
    parts = parts.filter(p => p.age < p.life);
    parts.forEach(p => {
      p.age += k; p.x += p.vx * k; p.y += p.vy * k; p.vy += p.g * k;
      if (p.kind === 'gold' || p.kind === 'purple' || p.kind === 'poof') { p.vx *= 0.96; p.vy *= 0.96; }
      const cols = PCOL[p.kind] || PCOL.gold, col = cols[(p.age / 6 | 0) % cols.length];
      const fade = 1 - p.age / p.life;
      if (p.kind === 'smoke') { // smoke puffs grow as they rise
        c.fillStyle = `rgba(230,230,235,${0.55 * fade})`;
        c.beginPath(); c.arc(p.x - ox, p.y - oy, 1.5 + p.age / 22, 0, 7); c.fill();
        return;
      }
      c.globalAlpha = Math.max(0, Math.min(1, fade * 1.5));
      c.fillStyle = col;
      const px = Math.round(p.x - ox), py = Math.round(p.y - oy);
      if (p.kind === 'gold' && p.size > 1) { c.fillRect(px - 1, py, 3, 1); c.fillRect(px, py - 1, 1, 3); }
      else c.fillRect(px, py, p.size, p.size);
      c.globalAlpha = 1;
    });
    weather(c, t, dt, k);
    light(c, sx, sy, hero, t);
  }

  function ambient(c, a, ox, oy, t, dt, k) {
    if (a.k === 'butterfly') {
      if (!a.tx || Math.hypot(a.tx - a.x, a.ty - a.y) < 3) { a.tx = ox + 16 + rnd() * (VW - 32); a.ty = oy + 16 + rnd() * (VH - 32); }
      a.x += Math.sign(a.tx - a.x) * 0.25 * k; a.y += Math.sign(a.ty - a.y) * 0.18 * k + Math.sin(t / 200 + a.ph) * 0.2;
      const x = Math.round(a.x - ox), y = Math.round(a.y - oy), open = Math.floor(t / 120 + a.ph) % 2;
      c.fillStyle = a.c; if (open) { c.fillRect(x - 2, y - 1, 2, 2); c.fillRect(x + 1, y - 1, 2, 2); } else { c.fillRect(x - 1, y - 2, 1, 2); c.fillRect(x + 1, y - 2, 1, 2); }
      c.fillStyle = '#22202e'; c.fillRect(x, y - 1, 1, 2);
    } else if (a.k === 'fly') {
      const x = Math.round(a.x - ox + Math.sin(t / 900 + a.ph) * 14), y = Math.round(a.y - oy + Math.cos(t / 700 + a.ph) * 9);
      const on = (Math.sin(t / 300 + a.ph * 3) + 1) / 2;
      c.fillStyle = `rgba(230,255,140,${0.25 + on * 0.75})`; c.fillRect(x, y, 1, 1);
      c.fillStyle = `rgba(230,255,140,${on * 0.25})`; c.fillRect(x - 1, y - 1, 3, 3);
    } else if (a.k === 'birds') {
      if (!a.fly) { a.next -= dt; if (a.next < 0) a.fly = { x: -10, y: 10 + rnd() * 40, v: 0.6 + rnd() * 0.3, n: 2 + ((rnd() * 2) | 0) }; return; }
      const f = a.fly; f.x += f.v * k;
      for (let i = 0; i < f.n; i++) {
        const x = Math.round(f.x - i * 9), y = Math.round(f.y + i * 5 + Math.sin(t / 300 + i) * 2), up = Math.floor(t / 150 + i) % 2;
        c.fillStyle = '#2b2b3a';
        c.fillRect(x, y, 1, 1); c.fillRect(x - 2, y - (up ? 1 : -1), 2, 1); c.fillRect(x + 1, y - (up ? 1 : -1), 2, 1);
      }
      if (f.x > VW + 40) { a.fly = null; a.next = 6000 + rnd() * 8000; }
    } else if (a.k === 'fishspot') {
      a.next -= dt;
      if (a.next < 0 && !a.jump) {
        const s = a.spots[(rnd() * a.spots.length) | 0];
        a.jump = { x: s[0] * TS + 8, y: s[1] * TS + 10, age: 0 }; a.next = 2500 + rnd() * 4000;
      }
      if (a.jump) {
        const j = a.jump; j.age += k;
        const p = j.age / 40, x = Math.round(j.x - ox + p * 10 - 5), y = Math.round(j.y - oy - Math.sin(p * Math.PI) * 10);
        if (p < 1) { c.fillStyle = '#e0e8f0'; c.fillRect(x, y, 3, 2); c.fillStyle = '#9fb4c8'; c.fillRect(x - 1, y + (p < .5 ? 1 : -1), 1, 1); }
        if (j.age === k || (p >= 1 && !j.splashed)) { burst((j.x + (p >= 1 ? 5 : -5)) / TS - 0.5, j.y / TS - 0.5, 'splash'); if (p >= 1) j.splashed = true; }
        if (p > 1.4) a.jump = null;
      }
    } else if (a.k === 'chimney') {
      a.next -= dt;
      if (a.next < 0) { a.next = 450 + rnd() * 250; parts.push({ x: a.x, y: a.y, vx: wind * 0.25, vy: -0.25, g: 0, life: 90, age: 0, kind: 'smoke', size: 2 }); }
    }
  }

  function weather(c, t, dt, k) {
    const s = sky.sky;
    if (!drops.length || calm()) { if (s === 'rain' || s === 'drizzle') { c.fillStyle = 'rgba(30,45,70,.14)'; c.fillRect(0, 0, VW, VH); } return; }
    if (s === 'rain' || s === 'drizzle') {
      c.fillStyle = s === 'rain' ? 'rgba(30,45,70,.16)' : 'rgba(40,55,80,.08)'; c.fillRect(0, 0, VW, VH);
      c.fillStyle = s === 'rain' ? 'rgba(210,228,255,.7)' : 'rgba(215,230,255,.55)';
      drops.forEach(d => {
        d.y += (s === 'rain' ? 5 : 3.2) * d.s * k; d.x -= (s === 'rain' ? 1.4 : 0.8) * k;
        c.fillRect(Math.round(d.x), Math.round(d.y), 1, s === 'rain' ? 5 : 3);
        if (d.y > VH || d.x < -10) {
          if (rnd() < 0.5) { c.fillStyle = 'rgba(220,235,255,.6)'; c.fillRect(Math.round(d.x) - 1, VH - 2 - ((rnd() * VH * 0.9) | 0), 3, 1); c.fillStyle = s === 'rain' ? 'rgba(200,220,255,.55)' : 'rgba(210,225,255,.45)'; }
          Object.assign(d, newDrop(false));
        }
      });
      // splashes on the ground
      for (let i = 0; i < (s === 'rain' ? 4 : 2); i++) { const x = (hash(i, (t / 120) | 0, 1) * VW) | 0, y = (hash(i, (t / 120) | 0, 2) * VH) | 0; c.fillStyle = 'rgba(220,235,255,.5)'; c.fillRect(x - 1, y, 3, 1); c.fillRect(x, y - 1, 1, 1); }
    } else if (s === 'snow') {
      drops.forEach(d => {
        d.y += 0.45 * d.s * k; d.x += (Math.sin(t / 800 + d.ph) * 0.3 + wind * 0.3) * k;
        c.fillStyle = 'rgba(255,255,255,.9)'; c.fillRect(Math.round(d.x), Math.round(d.y), d.s > 1 ? 2 : 1, d.s > 1 ? 2 : 1);
        if (d.y > VH || d.x > VW + 10) Object.assign(d, newDrop(false), { x: rnd() * VW - 20 });
      });
    } else if (s === 'petals' || s === 'leaves') {
      const cols = s === 'petals' ? ['#ffc4d6', '#ffb0c8', '#ffe0ea', '#ff9ab8'] : ['#d9822b', '#c0392b', '#e0b030', '#a85a2a'];
      drops.forEach(d => {
        d.y += 0.35 * d.s * k; d.x += (Math.sin(t / 600 + d.ph) * 0.5 + 0.25) * k;
        const flip = Math.sin(t / 250 + d.ph) > 0;
        c.fillStyle = cols[d.c]; c.fillRect(Math.round(d.x), Math.round(d.y), flip ? 2 : 1, flip ? 1 : 2);
        if (s === 'leaves') c.fillRect(Math.round(d.x) + 1, Math.round(d.y) + 1, 1, 1);
        if (d.y > VH || d.x > VW + 10) Object.assign(d, newDrop(false), { x: rnd() * VW - 30 });
      });
    } else if (s === 'heat' || s === 'dust') {
      // shimmer: faint wavy light bands, plus sand blowing past
      for (let i = 0; i < 4; i++) {
        const y = ((t / 40 + i * 47) % (VH + 20)) - 10;
        c.fillStyle = 'rgba(255,240,200,.06)';
        for (let x = 0; x < VW; x += 8) c.fillRect(x, Math.round(y + Math.sin(x / 20 + t / 300) * 2), 8, 2);
      }
      drops.forEach(d => {
        d.x += (1.2 + d.s) * wind * k; d.y += Math.sin(t / 300 + d.ph) * 0.15 * k;
        c.fillStyle = s === 'dust' ? 'rgba(214,180,110,.55)' : 'rgba(232,209,138,.45)'; c.fillRect(Math.round(d.x), Math.round(d.y), 2, 1);
        if (d.x > VW + 4) { d.x = -4 - rnd() * 30; d.y = rnd() * VH; }
      });
      if (s === 'heat') { c.fillStyle = 'rgba(255,200,90,.05)'; c.fillRect(0, 0, VW, VH); }
    }
  }

  // sunset glow, dusk, or night with lit windows and a small light around the hero
  function light(c, sx, sy, hero, t) {
    const tm = sky.time;
    if (tm === 'sunset') {
      const g = c.createLinearGradient(0, 0, 0, VH);
      g.addColorStop(0, 'rgba(255,110,50,.30)'); g.addColorStop(0.6, 'rgba(255,150,70,.16)'); g.addColorStop(1, 'rgba(120,60,140,.14)');
      c.fillStyle = g; c.fillRect(0, 0, VW, VH);
    } else if (tm === 'night') {
      if (!dark) { dark = document.createElement('canvas'); dark.width = VW; dark.height = VH; }
      const d = dark.getContext('2d');
      d.globalCompositeOperation = 'source-over'; d.clearRect(0, 0, VW, VH);
      d.fillStyle = 'rgba(12,18,52,.5)'; d.fillRect(0, 0, VW, VH);
      d.globalCompositeOperation = 'destination-out';
      const hole = (x, y, r, a) => { const g = d.createRadialGradient(x, y, 0, x, y, r); g.addColorStop(0, `rgba(0,0,0,${a})`); g.addColorStop(1, 'rgba(0,0,0,0)'); d.fillStyle = g; d.fillRect(x - r, y - r, r * 2, r * 2); };
      if (hero) hole(hero.x + 8, hero.y + 6, 44, 0.85);
      for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
        const ch = tileAt(sx * SW + x, sy * SH + y);
        if (ch === 'h' || ch === 'U' || ch === 'J' || ch === 'X' || ch === 'm') hole(x * TS + 8, y * TS + 8, 22, 0.7);
      }
      c.drawImage(dark, 0, 0);
      // warm glow on the lit windows
      c.globalCompositeOperation = 'lighter';
      for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
        const ch = tileAt(sx * SW + x, sy * SH + y);
        if (ch === 'h' || ch === 'U') { const g = c.createRadialGradient(x * TS + 8, y * TS + 8, 0, x * TS + 8, y * TS + 8, 14); g.addColorStop(0, 'rgba(255,200,90,.22)'); g.addColorStop(1, 'rgba(255,200,90,0)'); c.fillStyle = g; c.fillRect(x * TS - 6, y * TS - 6, 28, 28); }
      }
      c.globalCompositeOperation = 'source-over';
    }
  }

  WW.fx = { setup, draw, burst, step, get sky() { return sky; }, SKY };
})();

/* quest.js */
/* WORLDWALKER engine · the episode quest
   A quest giver (gold !) asks for help -> you talk to a contact (?) -> you do one action -> you go back to the giver.
   The action is one of:
     find  – use the contact's clue to find a secret spot and walk onto it
     fight – beat an Ink Thief in a short question duel
     trade – offer the right goods to a trader
   The compass stone stays shut until the quest is done. See docs/EPISODE-FORMAT.md ("quest"). */
(function () {
  const L = t => WW.L(t), T = k => WW.T(k);
  // quest steps: 0 not started · 1 go to the contact · 2 do the action · 3 go back to the giver · 4 done
  const Q = WW.quest = {};
  const THIEF = { g: '#a04848', G: '#6e2c2c', w: '#ffffff', r: '#2b1414' };
  Q.THIEF = THIEF;

  Q.on = () => !!(WW.ep && WW.ep.quest);
  Q.step = () => (WW.run && WW.run.quest) || 0;
  Q.done = () => !Q.on() || Q.step() >= 4;
  function set(n) { WW.run.quest = n; WW.ui.quest(); }

  /* make the map entities for the quest */
  Q.ents = (ep) => {
    const q = ep.quest, out = [];
    if (!q) return out;
    q.giver.id = 'qgiver'; q.contact.id = 'qcontact';
    out.push({ kind: 'qnpc', role: 'giver', x: q.giver.x, y: q.giver.y, ref: q.giver, phase: 7 });
    out.push({ kind: 'qnpc', role: 'contact', x: q.contact.x, y: q.contact.y, ref: q.contact, phase: 11 });
    const a = q.action;
    if (a.type === 'trade') { a.trader.id = 'qtrader'; out.push({ kind: 'qnpc', role: 'trader', x: a.trader.x, y: a.trader.y, ref: a.trader, phase: 13 }); }
    if (a.type === 'fight') out.push({ kind: 'qfoe', x: a.at[0], y: a.at[1], visible: false });
    if (a.type === 'find') out.push({ kind: 'qspot', x: a.at[0], y: a.at[1] });
    return out;
  };

  const item = () => WW.ep.quest.action.item;
  const itemName = () => (item() ? `${item().icon || '🎁'} ${WW.plain(item().name)}` : '');
  const say = (who, text, after) => WW.ui.talk({ id: who.id, name: who.name, role: who.role, look: who.look, lines: [text] }, after);

  /* walking into a quest person or the thief */
  Q.interact = (e, ents) => {
    const q = WW.ep.quest, s = Q.step();
    if (e.kind === 'qfoe') return fight(e);
    const who = e.ref;
    if (e.role === 'giver') {
      if (s === 0) WW.ui.talk(Object.assign({}, who, { lines: q.giver.lines, doneLabel: T('accept') }), () => { set(1); WW.sfx('good'); WW.toast('📜 ' + WW.esc(T('newQuest')) + ': ' + WW.esc(WW.plain(q.title)), '#c08a1e'); });
      else if (s < 3) say(who, q.giver.wait);
      else if (s === 3) say(who, q.giver.thanks, () => finish());
      else say(who, T('thanksAgain'));
    } else if (e.role === 'contact') {
      if (s === 1) WW.ui.talk(Object.assign({}, who, { lines: q.contact.lines }), () => { set(2); showAction(ents); });
      else if (s === 0) say(who, T('busy'));
      else if (s === 2) say(who, q.contact.lines[q.contact.lines.length - 1]);
      else say(who, T('goodLuck'));
    } else if (e.role === 'trader') {
      if (s !== 2) return say(who, s < 2 ? T('busy') : T('goodLuck'));
      const a = q.action;
      WW.ui.talk(Object.assign({}, who, { lines: a.trader.lines, ask: { stat: q.stat, q: a.q, choices: a.choices } }), () => {
        set(3); WW.sfx('coin'); WW.fx.burst(e.x, e.y, 'gold');
        WW.toast(`🤝 ${WW.esc(T('traded'))}${item() ? ' · ' + WW.esc(itemName()) : ''}`, '#2aa198');
      });
    }
    return true;
  };

  function showAction(ents) {
    const a = WW.ep.quest.action;
    if (a.type === 'fight') {
      const f = ents.find(e => e.kind === 'qfoe'); f.visible = true;
      WW.fx.burst(f.x, f.y, 'purple');
    }
    WW.ui.quest();
  }

  function fight(e) {
    const q = WW.ep.quest, a = q.action, r = WW.run;
    r.questMissed = r.questMissed || [];
    WW.bossTrial({ name: a.name, need: a.need || 2, taunt: a.taunt, win: a.win, questions: a.questions, pal: THIEF, minor: true, missedList: r.questMissed }, () => {
      e.gone = true; WW.fx.burst(e.x, e.y, 'poof'); set(3);
      WW.music.play('realm' + WW.ep.realm);
      if (item()) WW.toast(WW.esc(itemName()), '#2aa198');
    });
    return true;
  }

  /* stepping onto a tile: is it the secret spot? */
  Q.onStep = (x, y) => {
    if (!Q.on() || Q.step() !== 2) return;
    const a = WW.ep.quest.action;
    if (a.type !== 'find' || a.at[0] !== x || a.at[1] !== y) return;
    WW.sfx('win'); WW.fx.burst(x, y, 'gold'); set(3);
    WW.ui.message('✨ ' + T('foundIt'), a.found);
  };

  function finish() {
    const q = WW.ep.quest;
    set(4);
    WW.fx.burst(q.giver.x, q.giver.y, 'gold');
    WW.gain(q.stat || 'reg', 2, (q.reward && q.reward.coins) || 10);
    WW.toast('🏅 ' + WW.esc(T('questDone')), '#c08a1e');
  }

  /* what to draw above people's heads, and the secret spot's twinkle */
  Q.mark = e => {
    const s = Q.step();
    if (e.role === 'giver') return s === 0 || s === 3 ? '!' : '';
    if (e.role === 'contact') return s === 1 ? '?' : '';
    if (e.role === 'trader') return s === 2 ? '?' : '';
    return '';
  };
  Q.draw = (c, e, x, y, t) => {
    if (e.kind === 'qnpc') {
      WW.drawPerson(c, e.ref, x, y - 2, t, e.phase);
      const m = Q.mark(e);
      if (m) {
        const b = Math.round(Math.sin(t / 220 + e.phase) * 1.5);
        c.fillStyle = '#22202e'; c.fillRect(x + 5, y - 13 + b, 7, 9);
        c.fillStyle = m === '!' ? '#f2c14e' : '#8fc3ff'; c.fillRect(x + 6, y - 12 + b, 5, 7);
        c.fillStyle = '#22202e';
        if (m === '!') { c.fillRect(x + 8, y - 11 + b, 1, 3); c.fillRect(x + 8, y - 7 + b, 1, 1); }
        else { c.fillRect(x + 7, y - 11 + b, 3, 1); c.fillRect(x + 9, y - 10 + b, 1, 1); c.fillRect(x + 8, y - 9 + b, 1, 1); c.fillRect(x + 8, y - 7 + b, 1, 1); }
      }
    } else if (e.kind === 'qfoe') {
      WW.shadow(c, x, y + 13, 10);
      WW.sprite(c, 'smudge', x, y, { bob: true, t, phase: 2, pal: THIEF });
      c.fillStyle = '#22202e'; c.fillRect(x + 3, y + 7, 10, 2); // a bandit mask
      c.fillStyle = '#ffffff'; c.fillRect(x + 4, y + 7, 2, 1); c.fillRect(x + 10, y + 7, 2, 1);
    } else if (e.kind === 'qspot' && Q.step() === 2) {
      const k = (Math.sin(t / 260) + 1) / 2;
      c.fillStyle = `rgba(255,243,176,${0.25 + k * 0.6})`;
      c.fillRect(x + 7, y + 4, 2, 8); c.fillRect(x + 4, y + 7, 8, 2);
      c.fillStyle = `rgba(255,255,255,${k})`; c.fillRect(x + 7, y + 7, 2, 2);
    }
  };

  /* the words in the quest bar */
  Q.bar = () => {
    const q = WW.ep.quest, s = Q.step(), a = q.action;
    if (s >= 4) return '✓ ' + WW.plain(q.title);
    const now = s === 0 ? T('qFindGiver') : s === 1 ? T('qTalkTo') + ' ' + WW.plain(q.contact.name)
      : s === 3 ? T('qReturn') + ' ' + WW.plain(q.giver.name)
        : a.type === 'find' ? WW.plain(a.hint) : a.type === 'fight' ? T('qBeat') + ' ' + WW.plain(a.name) : T('qTrade') + ' ' + WW.plain(a.trader.name);
    return `📜 ${WW.plain(q.title)}: ${now}`;
  };
  Q.log = () => {
    if (!Q.on()) return '';
    const q = WW.ep.quest, r = WW.run;
    const extra = q.action.type === 'fight' ? ` (${(r.questMissed || []).length} missed)` : q.action.type === 'trade' ? ` (${(r.tries.qtrader || 0) + 1} ${(r.tries.qtrader || 0) ? 'tries' : 'try'})` : '';
    return `QUEST: ${WW.plain({ en: q.title.en })} — ${Q.done() ? 'done' : 'not finished'}${extra}`;
  };
})();

/* game.js */
/* WORLDWALKER engine · the game itself: map, walking, screens, people, Smudges, flow */
(function () {
  const TS = 16, SW = 16, SH = 11; // tile size, screen width/height in tiles
  const L = t => WW.L(t), T = k => WW.T(k), esc = s => WW.esc(s);
  const $ = id => document.getElementById(id);

  /* ---------------- sound (made in code, no files) ---------------- */
  let ac = null;
  WW.audioInit = () => {
    if (!ac) try { ac = WW.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { }
    if (ac && ac.state === 'suspended') ac.resume();
    if (WW.music) WW.music.wake();
  };
  const NOTES = {
    blip: [[660, .05]], good: [[523, .08], [784, .12]], bad: [[220, .12], [180, .14]], coin: [[988, .05], [1319, .1]],
    hurt: [[200, .08], [140, .15]], hit: [[392, .06], [523, .06], [784, .12]], win: [[523, .1], [659, .1], [784, .1], [1047, .25]], step: [[120, .02]]
  };
  WW.sfx = (name) => {
    if (!WW.save.sound || !ac) return;
    let t = ac.currentTime;
    (NOTES[name] || []).forEach(([f, d]) => {
      const o = ac.createOscillator(), g = ac.createGain();
      o.type = name === 'hurt' || name === 'bad' ? 'sawtooth' : 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(.06, t); g.gain.exponentialRampToValueAtTime(.001, t + d);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + d); t += d * .9;
    });
  };

  /* ---------------- the page around the game ---------------- */
  function buildDom(root) {
    root.innerHTML = `
      <div class="ww-frame">
        <div class="ww-bar" id="ww-bar">
          <a class="ww-logo" ${WW.CONFIG.MODE === 'pages' ? 'href="index.html"' : ''}>WORLDWALKER</a>
          <span class="langs"><button data-lang="en">EN</button><button data-lang="es">ES</button><button data-lang="fa">دری</button></span>
          <span class="tools"><button id="ww-b-pass"></button>${WW.CONFIG.MODE === 'pages' ? '<button id="ww-b-map"></button>' : ''}<button id="ww-b-mus"></button><button id="ww-b-snd"></button><button id="ww-b-pad" aria-label="arrow buttons">✥</button><button id="ww-b-full"></button></span>
        </div>
        <div class="hud" id="ww-hud"></div>
        <div class="quest" id="ww-quest"></div>
        <div class="screen" id="ww-screen" tabindex="0">
          <canvas id="ww-cv" aria-label="game map"></canvas>
          <div id="ww-toast" class="toast" role="status"></div>
          <div id="ww-ov" class="ov hidden" role="dialog" aria-modal="true"></div>
        </div>
        <div class="dpad" id="ww-dpad" aria-label="arrows">
          <button data-d="up" aria-label="up">▲</button><button data-d="left" aria-label="left">◀</button>
          <button data-d="act" class="act" aria-label="use">●</button>
          <button data-d="right" aria-label="right">▶</button><button data-d="down" aria-label="down">▼</button>
        </div>
        <div class="ww-foot" id="ww-foot"></div>
      </div>`;
    if ('ontouchstart' in window || navigator.maxTouchPoints > 0) root.classList.add('touch');
    root.querySelectorAll('[data-lang]').forEach(b => (b.onclick = () => WW.setLang(b.dataset.lang)));
    $('ww-b-pass').onclick = () => { if (!WW.ui.stack.length || WW.ui.top().opts.cls !== 'passov') WW.ui.passport(); };
    if ($('ww-b-map')) $('ww-b-map').onclick = () => (location.href = 'index.html');
    $('ww-b-pad').onclick = () => root.classList.toggle('touch');
    $('ww-b-snd').onclick = () => { WW.save.sound = !WW.save.sound; WW.store(); WW.audioInit(); WW.ui.hud(); };
    $('ww-b-mus').onclick = () => { WW.audioInit(); WW.music.toggle(); WW.ui.hud(); };
    $('ww-b-full').onclick = () => {
      const el = root.querySelector('.ww-frame');
      if (document.fullscreenElement) document.exitFullscreen(); else if (el.requestFullscreen) el.requestFullscreen().catch(() => window.open(location.href, '_blank'));
      else window.open(location.href, '_blank');
    };
  }

  /* ---------------- run state ---------------- */
  const G = WW.game = {};
  let lastFrame = 0, map, W, H, ents, player, pip, trans = null, held = null, heldSince = 0, lastStep = 0, inv = 0, shakeT = 0;

  WW.gain = (stat, n, coins) => {
    WW.save.stats[stat] = (WW.save.stats[stat] || 0) + n;
    WW.save.coins = (WW.save.coins || 0) + (coins || 0);
    WW.store(); WW.ui.hud();
    const th = WW.THEMES.find(t => t.k === stat);
    if (th) WW.toast(`+${n} ${th.icon} ${esc(L(th.name))}${coins ? ` · +${coins} ●` : ''}`, th.col);
  };
  WW.hurt = (inBoss) => {
    const r = WW.run;
    r.hearts--; r.heartsLost++; shakeT = performance.now();
    if (r.hearts <= 0) {
      r.hearts = WW.heartsMax();
      if (!inBoss) { player.x = WW.ep.start[0]; player.y = WW.ep.start[1]; pip.x = player.x; pip.y = player.y; }
      WW.toast(T('rescued'), '#2f7fd1');
    } else if (!inBoss) WW.toast(T('ouch'), '#b0392b');
    WW.ui.hud();
  };

  function screenOf(x, y) { return [Math.floor(x / SW), Math.floor(y / SH)]; }
  function tileAt(x, y) { return (map[y] || '')[x]; }
  function entAt(x, y) { return ents.find(e => e.x === x && e.y === y && !e.gone && e.visible !== false); }
  function walkable(x, y) {
    if (x < 0 || y < 0 || x >= W || y >= H) return false;
    if (WW.solid(tileAt(x, y))) return false;
    const e = entAt(x, y);
    return !e || e.kind === 'scrap' || e.kind === 'smudge' || e.kind === 'qspot';
  }

  /* ---------------- start an episode ---------------- */
  WW.start = (ep, rootSel) => {
    WW.ep = ep;
    // teacher console: ep-X-Y.html?teacher=start|stone|boss|finish opens a preview that saves nothing
    const jump = (new URLSearchParams(location.search).get('teacher') || '').toLowerCase();
    G.preview = WW.save.teacher && ['start', 'stone', 'boss', 'finish'].includes(jump) ? jump : '';
    if (G.preview) { WW.store = () => true; WW.sheetOn = () => false; }
    ep.npcs = ep.npcs || []; ep.scraps = ep.scraps || []; ep.smudges = ep.smudges || []; ep.signs = ep.signs || [];
    ep.realm = ep.realm || +ep.id[0];
    map = ep.map; H = map.length; W = map[0].length;
    WW.fx.setup(ep);
    const root = typeof rootSel === 'string' ? document.querySelector(rootSel) : (rootSel || document.getElementById('ww'));
    buildDom(root);
    document.title = `Worldwalker ${ep.id} · ${WW.plain({ en: (ep.title.en || ep.title) })}`;
    WW.run = {
      hearts: WW.heartsMax(), heartsLost: 0, talked: new Set(), asked: new Set(), tries: {}, scraps: new Set(),
      quest: 0, questMissed: [], challengeDone: false, challengeTries: 0, bossDone: false, bossMisses: 0, missed: [], log: [], t0: Date.now(), reflection: '', stars: 0
    };
    ents = [];
    ep.npcs.forEach((n, i) => { n.id = n.id || 'npc' + i; ents.push({ kind: 'npc', x: n.x, y: n.y, ref: n, phase: i }); });
    ep.scraps.forEach((s, i) => ents.push({ kind: 'scrap', x: s[0], y: s[1], id: i }));
    ep.smudges.forEach((s, i) => ents.push({ kind: 'smudge', x: s[0], y: s[1], home: screenOf(s[0], s[1]), next: 0, phase: i }));
    ep.signs.forEach(s => ents.push({ kind: 'sign', x: s.x, y: s.y, ref: s }));
    WW.quest.ents(ep).forEach(e => ents.push(e));
    ents.push({ kind: 'stone', x: ep.challenge.at[0], y: ep.challenge.at[1] });
    ents.push({ kind: 'boss', x: ep.boss.at[0], y: ep.boss.at[1], visible: false });
    player = { x: ep.start[0], y: ep.start[1], fx: ep.start[0], fy: ep.start[1], dir: 'down', moving: 0, from: null };
    pip = { x: player.x, y: player.y, fx: player.x, fy: player.y };
    const cv = $('ww-cv'); cv.width = SW * TS; cv.height = SH * TS;
    G.ctx = cv.getContext('2d'); G.ctx.imageSmoothingEnabled = false;
    WW.ui.hud(); WW.ui.quest();
    WW.setLang(WW.lang);
    bindInput();
    requestAnimationFrame(frame);
    if (G.preview) return previewJump(G.preview);
    WW.music.play('realm' + ep.realm);
    WW.ui.start(() => WW.ui.intro(() => { WW.audioInit(); $('ww-screen').focus(); }));
  };

  function previewJump(where) {
    const ep = WW.ep, r = WW.run;
    const tag = document.createElement('a'); tag.className = 'ww-preview'; tag.textContent = 'TEACHER PREVIEW · nothing is saved';
    if (WW.CONFIG.MODE === 'pages') { tag.href = 'teacher.html#ep=' + ep.id; tag.textContent += ' · ↩ console'; }
    $('ww-bar').insertBefore(tag, $('ww-bar').querySelector('.langs'));
    if (where === 'start') return WW.ui.intro(() => { WW.audioInit(); $('ww-screen').focus(); });
    ep.npcs.forEach(n => r.talked.add(n.id));
    r.quest = 4;
    if (where === 'stone') { WW.ui.quest(); WW.dbg.bumpInto(ep.challenge.at[0], ep.challenge.at[1]); return; }
    r.challengeDone = true; G.onChallengeDone();
    if (where === 'boss') { WW.dbg.bumpInto(ep.boss.at[0], ep.boss.at[1]); return; }
    ents.forEach(e => { if (e.kind === 'scrap') { e.gone = true; r.scraps.add(e.id); } if (e.kind === 'boss') e.gone = true; });
    finishEpisode();
  }

  G.onChallengeDone = () => {
    const b = ents.find(e => e.kind === 'boss'); b.visible = true;
    WW.fx.burst(WW.ep.challenge.at[0], WW.ep.challenge.at[1], 'gold'); WW.fx.burst(b.x, b.y, 'poof');
    WW.ui.quest();
    setTimeout(() => WW.toast('Pip: ' + WW.plain(WW.ep.boss.appear || { en: 'The Smudge is out! Find it.', es: '¡Salió el Borrón! Búscalo.', fa: 'لکه بیرون آمد! پیدایش کن.' }), '#4b3f63'), 600);
  };

  function finishEpisode() {
    const r = WW.run, ep = WW.ep, s = WW.save;
    r.bossDone = true;
    const stars = 1 + (r.scraps.size >= ep.scraps.length ? 1 : 0) + (r.bossMisses <= 1 ? 1 : 0);
    r.stars = stars;
    const had = s.episodes[ep.id];
    const toolBefore = WW.TOOLS.find(t => t.ep === ep.id && !WW.hasTool(t.id));
    s.episodes[ep.id] = { done: true, stars: Math.max(stars, (had && had.stars) || 0), at: new Date().toISOString().slice(0, 10) };
    if (toolBefore) r.newTool = toolBefore;
    WW.gain(ep.boss.stat || 'reg', 2, 15);
    WW.store();
    WW.music.play('win', 'realm' + ep.realm);
    WW.ui.quest();
    WW.ui.finish();
  }

  /* ---------------- interacting ---------------- */
  function interact(e) {
    if (!e || WW.paused) return;
    const ep = WW.ep, r = WW.run;
    if (e.kind === 'qnpc' || e.kind === 'qfoe') return WW.quest.interact(e, ents);
    if (e.kind === 'npc') {
      WW.ui.talk(e.ref, () => { r.talked.add(e.ref.id); WW.ui.quest(); });
    } else if (e.kind === 'sign') {
      WW.ui.message('🪧', e.ref.text);
    } else if (e.kind === 'stone') {
      const need = ep.challenge.needTalk ?? ep.npcs.length;
      if (r.talked.size < need && !r.challengeDone) WW.ui.message('', T('talkFirst'));
      else if (!WW.quest.done() && !r.challengeDone) WW.ui.message('', T('questFirst'));
      else WW.challenge(ep.challenge);
    } else if (e.kind === 'boss') {
      WW.bossTrial(ep.boss, () => { e.gone = true; WW.fx.burst(e.x, e.y, 'poof'); WW.fx.burst(e.x, e.y, 'gold'); finishEpisode(); });
    }
  }
  function pickup() {
    WW.quest.onStep(player.x, player.y);
    const e = ents.find(e => e.kind === 'scrap' && !e.gone && e.x === player.x && e.y === player.y);
    if (e) {
      e.gone = true; WW.run.scraps.add(e.id); WW.save.coins += 3; WW.store(); WW.sfx('coin'); WW.fx.burst(e.x, e.y, 'gold');
      WW.toast(`📄 ${esc(T('scraps'))} ${WW.run.scraps.size}/${WW.ep.scraps.length} · +3 ●`, '#c08a1e');
      WW.ui.hud(); WW.ui.quest();
    }
    const sm = ents.find(e => e.kind === 'smudge' && e.x === player.x && e.y === player.y);
    if (sm) touchSmudge(sm);
  }
  function touchSmudge(sm) {
    if (performance.now() < inv) return;
    inv = performance.now() + 1200; WW.sfx('hurt'); WW.hurt(false); WW.fx.burst(sm.x, sm.y, 'purple');
    // push the smudge away one tile
    const opts = [[1, 0], [-1, 0], [0, 1], [0, -1]].map(([dx, dy]) => [sm.x + dx * 2, sm.y + dy * 2]).filter(([x, y]) => walkable(x, y) && screenOf(x, y)[0] === sm.home[0] && screenOf(x, y)[1] === sm.home[1]);
    if (opts.length) [sm.x, sm.y] = opts[0];
  }

  /* ---------------- moving ---------------- */
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const STEP_MS = 150;
  function tryStep(d, now) {
    if (player.moving || trans || WW.paused) return;
    player.dir = d;
    const [dx, dy] = DIRS[d];
    const nx = player.x + dx, ny = player.y + dy;
    const e = entAt(nx, ny);
    if (e && e.kind !== 'scrap' && e.kind !== 'smudge' && e.kind !== 'qspot') { interact(e); held = null; return; }
    if (!walkable(nx, ny)) return;
    const [sx, sy] = screenOf(player.x, player.y), [tx, ty] = screenOf(nx, ny);
    pip.tx = player.x; pip.ty = player.y;
    player.from = [player.x, player.y]; player.x = nx; player.y = ny; player.moving = now;
    if (sx !== tx || sy !== ty) { trans = { from: [sx, sy], to: [tx, ty], t0: now, d: [dx, dy] }; }
  }
  function actFacing() {
    const [dx, dy] = DIRS[player.dir];
    const e = entAt(player.x + dx, player.y + dy);
    if (e) interact(e);
  }

  function bindInput() {
    const keys = { ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right', w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right' };
    window.addEventListener('keydown', e => {
      const tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input' || tag === 'textarea') return;
      if (e.key === 'Escape') { const t = WW.ui.top(); if (t && (t.opts.cls === 'passov' || t.opts.cls === 'msgov')) t.close(); return; }
      WW.audioInit();
      if (WW.paused) return;
      if (keys[e.key]) { e.preventDefault(); held = keys[e.key]; heldSince = performance.now(); }
      else if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); actFacing(); }
      else if (e.key === 'p' || e.key === 'P') WW.ui.passport();
    });
    window.addEventListener('keyup', e => { if (keys[e.key] === held) held = null; });
    window.addEventListener('blur', () => (held = null));
    const pad = $('ww-dpad');
    pad.querySelectorAll('button').forEach(b => {
      const d = b.dataset.d;
      const down = e => { e.preventDefault(); WW.audioInit(); if (d === 'act') actFacing(); else { held = d; heldSince = performance.now(); } };
      const up = e => { e.preventDefault(); if (held === d) held = null; };
      b.addEventListener('pointerdown', down); b.addEventListener('pointerup', up); b.addEventListener('pointerleave', up); b.addEventListener('pointercancel', up);
    });
    // click on the map next to the hero = step that way (mouse users)
    $('ww-cv').addEventListener('click', e => {
      WW.audioInit(); $('ww-screen').focus();
      if (WW.paused || trans) return;
      const r = e.target.getBoundingClientRect();
      const [sx, sy] = screenOf(player.x, player.y);
      const tx = sx * SW + Math.floor((e.clientX - r.left) / r.width * SW), ty = sy * SH + Math.floor((e.clientY - r.top) / r.height * SH);
      const dx = tx - player.x, dy = ty - player.y;
      if (!dx && !dy) return;
      const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
      const e2 = entAt(tx, ty);
      if (e2 && !['scrap', 'smudge', 'qspot'].includes(e2.kind) && Math.abs(dx) + Math.abs(dy) === 1) { player.dir = d; interact(e2); return; }
      clickTarget = [tx, ty];
    });
  }
  let clickTarget = null;

  /* ---------------- smudges wander ---------------- */
  function moveSmudges(now) {
    if (WW.paused || trans || G.noSmudges) return;
    const [psx, psy] = screenOf(player.x, player.y);
    ents.forEach(e => {
      if (e.kind !== 'smudge' || e.home[0] !== psx || e.home[1] !== psy) return;
      if (now < e.next) return;
      e.next = now + 650 + (e.phase % 3) * 120;
      const dirs = Object.values(DIRS);
      // drift a little toward the player, mostly random
      const toward = [[Math.sign(player.x - e.x), 0], [0, Math.sign(player.y - e.y)]].filter(([a, b]) => a || b);
      const pick = Math.random() < .35 && toward.length ? toward[(Math.random() * toward.length) | 0] : dirs[(Math.random() * 4) | 0];
      const nx = e.x + pick[0], ny = e.y + pick[1];
      const [hx, hy] = screenOf(nx, ny);
      if (hx !== e.home[0] || hy !== e.home[1]) return;
      if (WW.solid(tileAt(nx, ny))) return;
      const o = entAt(nx, ny); if (o && o !== e) return;
      e.x = nx; e.y = ny;
      if (e.x === player.x && e.y === player.y) touchSmudge(e);
    });
  }

  /* ---------------- drawing ---------------- */
  function drawScreen(c, sx, sy, ox, oy, t) {
    c.save(); c.translate(ox, oy);
    // tiles get their global position so edges and ground match the real map around them
    for (let y = 0; y < SH; y++) for (let x = 0; x < SW; x++) {
      const gx = sx * SW + x, gy = sy * SH + y, ch = tileAt(gx, gy);
      (WW.tiles[ch] || WW.tiles['.'])(c, x * TS, y * TS, gx, gy, t, map);
    }
    const inScreen = e => { const [ex, ey] = screenOf(e.x, e.y); return ex === sx && ey === sy; };
    const px = e => (e.x - sx * SW) * TS, py = e => (e.y - sy * SH) * TS;
    ents.forEach(e => {
      if (e.gone || e.visible === false || !inScreen(e)) return;
      if (e.kind === 'scrap') WW.sprite(c, 'page', px(e) + 1, py(e) + 2, { bob: true, t, phase: e.id });
      if (e.kind === 'stone') {
        const glow = WW.run.challengeDone ? 0 : (Math.sin(t / 300) + 1) / 2;
        if (glow) { c.fillStyle = `rgba(242,193,78,${.15 + glow * .25})`; c.fillRect(px(e) - 2, py(e) - 2, 20, 20); }
        WW.sprite(c, 'stone', px(e), py(e), { pal: { W: '#9aa3ad', G: '#5e636b', y: WW.run.challengeDone ? '#3fa34d' : '#f2c14e', r: '#e04848', n: '#2f6fd6' } });
      }
    });
    ents.forEach(e => {
      if (e.gone || e.visible === false || !inScreen(e)) return;
      if (e.kind === 'npc') {
        WW.drawPerson(c, e.ref, px(e), py(e) - 2, t, e.phase);
        if (!WW.run.talked.has(e.ref.id)) { // speech bubble
          const b = Math.round(Math.sin(t / 250 + e.phase) * 1.5);
          c.fillStyle = '#fffbe8'; c.fillRect(px(e) + 10, py(e) - 9 + b, 7, 6); c.fillStyle = '#22202e'; c.fillRect(px(e) + 12, py(e) - 7 + b, 1, 1); c.fillRect(px(e) + 14, py(e) - 7 + b, 1, 1);
        }
      }
      if (e.kind === 'qnpc' || e.kind === 'qfoe' || e.kind === 'qspot') WW.quest.draw(c, e, px(e), py(e), t);
      if (e.kind === 'smudge') { WW.shadow(c, px(e), py(e) + 13, 8); WW.sprite(c, 'smudge', px(e), py(e), { bob: true, t, phase: e.phase }); }
      if (e.kind === 'boss') {
        const a = (Math.sin(t / 200) + 1) / 2;
        c.fillStyle = `rgba(109,95,140,${.25 + a * .3})`; c.beginPath(); c.arc(px(e) + 8, py(e) + 8, 12 + a * 3, 0, 7); c.fill();
        WW.sprite(c, 'smudge', px(e) - 8, py(e) - 16, { bob: true, t, scale: 2 });
      }
    });
    c.restore();
  }

  function frame(now) {
    requestAnimationFrame(frame);
    const c = G.ctx; if (!c || !WW.run) return;
    // movement timing
    if (player.moving && now - player.moving >= STEP_MS) { player.moving = 0; player.from = null; WW.fx.step(player.x, player.y); pickup(); }
    const dt = Math.min(100, now - (lastFrame || now)); lastFrame = now;
    if (!player.moving && !trans && !WW.paused) {
      if (held) tryStep(held, now);
      else if (clickTarget) {
        const dx = clickTarget[0] - player.x, dy = clickTarget[1] - player.y;
        if (!dx && !dy) clickTarget = null;
        else {
          const d = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up');
          const bx = player.x, by = player.y; tryStep(d, now);
          if (player.x === bx && player.y === by) {
            const d2 = Math.abs(dx) > Math.abs(dy) ? (dy ? (dy > 0 ? 'down' : 'up') : null) : (dx ? (dx > 0 ? 'right' : 'left') : null);
            if (d2) tryStep(d2, now);
            if (player.x === bx && player.y === by) clickTarget = null;
          }
        }
      }
    }
    moveSmudges(now);
    // pip trails one tile behind
    if (pip.tx != null && !player.moving) { pip.x = pip.tx; pip.y = pip.ty; pip.tx = null; }
    // where to draw the hero inside the screen
    const k = player.moving ? Math.min(1, (now - player.moving) / STEP_MS) : 1;
    const fx = player.from ? player.from[0] + (player.x - player.from[0]) * k : player.x;
    const fy = player.from ? player.from[1] + (player.y - player.from[1]) * k : player.y;
    let [sx, sy] = screenOf(player.x, player.y);
    c.save();
    if (now - shakeT < 250) c.translate(Math.round(Math.sin(now / 20) * 2), 0);
    if (trans) {
      const p = Math.min(1, (now - trans.t0) / 380);
      const [dx, dy] = trans.d;
      const offX = -dx * p * SW * TS, offY = -dy * p * SH * TS;
      drawScreen(c, trans.from[0], trans.from[1], offX, offY, now);
      drawScreen(c, trans.to[0], trans.to[1], offX + dx * SW * TS, offY + dy * SH * TS, now);
      const hx = (fx - trans.from[0] * SW) * TS + offX, hy = (fy - trans.from[1] * SH) * TS + offY;
      drawHero(c, hx, hy, now);
      WW.fx.draw(c, trans.to[0], trans.to[1], null, now, dt);
      if (p >= 1) trans = null;
    } else {
      drawScreen(c, sx, sy, 0, 0, now);
      // pip
      const [psx, psy] = screenOf(pip.x, pip.y);
      if (psx === sx && psy === sy) WW.shadow(c, (pip.x - sx * SW) * TS, (pip.y - sy * SH) * TS + 13, 6);
      if (psx === sx && psy === sy) WW.sprite(c, 'pip', (pip.x - sx * SW) * TS + 2, (pip.y - sy * SH) * TS - 4, { bob: true, t: now, phase: 1 });
      drawHero(c, (fx - sx * SW) * TS, (fy - sy * SH) * TS, now);
      WW.fx.draw(c, sx, sy, { x: (fx - sx * SW) * TS, y: (fy - sy * SH) * TS }, now, dt);
    }
    c.restore();
  }
  function drawHero(c, x, y, now) {
    if (performance.now() < inv && Math.floor(now / 90) % 2) return; // blink after a hit
    const walk = player.moving && Math.floor(now / 75) % 2;
    const d = player.dir;
    const name = d === 'up' ? (walk ? 'heroUpWalk' : 'heroUp') : d === 'down' ? (walk ? 'heroWalk' : 'hero') : (walk ? 'heroSideWalk' : 'heroSide');
    WW.shadow(c, Math.round(x), Math.round(y) + 12, 10);
    WW.sprite(c, name, Math.round(x), Math.round(y) - 3, { pal: WW.heroPal(), flip: d === 'left' });
  }

  /* ---------------- hooks for the automatic play-tests ---------------- */
  WW.dbg = {
    teleport(x, y) { player.x = x; player.y = y; player.from = null; player.moving = 0; trans = null; pip.x = x; pip.y = y; },
    face(d) { player.dir = d; },
    act() { actFacing(); },
    bumpInto(x, y) { // stand next to (x,y) on a walkable tile and interact
      for (const [d, [dx, dy]] of Object.entries(DIRS)) {
        const sx = x - dx, sy = y - dy;
        if (walkable(sx, sy)) { this.teleport(sx, sy); player.dir = d; actFacing(); return true; }
      }
      return false;
    },
    standOn(x, y) { this.teleport(x, y); pickup(); },
    collect(i) { const e = ents.find(e => e.kind === 'scrap' && e.id === i); this.teleport(e.x, e.y); pickup(); },
    get ents() { return ents; }, get player() { return player; },
    noSmudges() { G.noSmudges = true; }
  };
