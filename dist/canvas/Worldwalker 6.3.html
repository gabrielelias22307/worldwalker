          const v = s.stats[th.k] || 0, tr = WW.tier(th.k);
          gr += `<div class="gw"><b>${th.icon} ${esc(L(th.full))}</b> <span class="small">${v} · ${esc(T('lvl'))} ${tr} · ${tr < 2 ? esc(T('nextAt')) + ' ' + WW.TIERS[tr] : esc(T('maxed'))}</span><ul>` +
            WW.PERKS[th.k].map((p, i) => `<li class="${i < tr ? 'on' : ''}">${i < tr ? '✓' : '🔒 ' + WW.TIERS[i]} ${esc(L(p))}</li>`).join('') + '</ul></div>';
        });
        gr += `</div><p class="small">● ${esc(T('growCoins'))}</p>`;
        box.insertAdjacentHTML('beforeend', gr);
        let bag = `<h3>${esc(T('bag'))}</h3><div class="bag">`;
        WW.TOOLS.forEach((t, i) => {
          const has = WW.hasTool(t.id);
          bag += `<div class="slot ${has ? 'has' : ''}"><span class="ti">${has ? t.icon : '?'}</span><span>${has ? esc(L(t.name)) : esc(T('realm')) + ' ' + (i + 1)}</span></div>`;
        });
        bag += '</div>';
        if (WW.tools) bag += `<p class="small">🎒 ${esc(T('gathered'))}: ${['wood', 'fiber', 'seed'].map(k => `<b>${WW.tools.have(k)}</b> ${esc(T('item_' + k))}`).join(' · ')}</p>`;
        box.insertAdjacentHTML('beforeend', bag);
        let st = `<h3>${esc(T('stamps'))}</h3><div class="stamps">`;
        for (let r = 1; r <= 8; r++) {
          st += '<div class="scol">';
          WW.EPISODES.filter(e => e.realm === r).forEach(e => {
            const d = s.episodes[e.id];
            st += `<span class="stamp ${d && d.done ? 'on r' + r : ''}" title="${e.id}">${e.id}${d && d.stars ? '<i>' + '★'.repeat(d.stars) + '</i>' : ''}</span>`;
          });
          st += '</div>';
        }
        st += '</div>';
        box.insertAdjacentHTML('beforeend', st);
        const code = WW.passportCode();
        box.insertAdjacentHTML('beforeend', `<h3>${esc(T('yourCode'))}</h3><p class="small">${esc(T('codeHelp'))}</p>
          <div class="coderow"><code class="pcode">${code}</code></div>`);
        const cr = box.querySelector('.coderow');
        cr.appendChild(btn(T('copyCode'), 'gold', () => WW.copy(code).then(() => { msg = '✓'; h.render(); })));
        if (msg) cr.insertAdjacentHTML('beforeend', `<span class="ok">${msg}</span>`);
        const acts = document.createElement('div'); acts.className = 'acts';
        acts.appendChild(btn(T('close'), 'ghost', () => h.close()));
        box.appendChild(acts);
      }
    });
  };

  WW.copy = (text) => {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).catch(() => fallback());
    return Promise.resolve(fallback());
    function fallback() {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { } ta.remove();
    }
  };
  WW.download = (name, text) => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'text/plain;charset=utf-8' }));
    a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  };

  /* ---------------- finish: page restored, reflect, save, turn in ---------------- */
  // paper confetti over the game screen
  WW.confetti = () => {
    if (WW.calm) return;
    const box = document.createElement('div'); box.className = 'confetti';
    const cols = ['#f2c14e', '#e04848', '#2aa198', '#2f7fd1', '#8e5bd6', '#7cc451', '#fffbe8'];
    for (let i = 0; i < 70; i++) {
      const p = document.createElement('i');
      p.style.left = Math.random() * 100 + '%'; p.style.background = cols[i % cols.length];
      p.style.animationDelay = (Math.random() * 0.8) + 's'; p.style.animationDuration = (1.8 + Math.random() * 1.6) + 's';
      p.style.setProperty('--dx', (Math.random() * 120 - 60) + 'px'); p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      box.appendChild(p);
    }
    $('ww-screen').appendChild(box); setTimeout(() => box.remove(), 4200);
  };
  ui.finish = () => {
    const r = WW.run, ep = WW.ep;
    WW.confetti();
    let sheet = WW.sheetOn() ? 'saving' : 'off', note = '';
    ui.open({
      cls: 'finov',
      render(box, h) {
        const st = r.stars;
        box.innerHTML = `<div class="fin-head"><div class="pagebig"></div><div><div class="epn">${esc(T('episode'))} ${esc(ep.id)}</div>
          <h2>${esc(T('done'))}</h2><div class="stars">${'★'.repeat(st)}<span class="dim">${'★'.repeat(3 - st)}</span></div><div class="small">${esc(T('starWhy'))}</div></div></div>`;
        const pg = WW.spriteCanvas('page', null, 4); box.querySelector('.pagebig').appendChild(pg);
        if (r.newTool) box.insertAdjacentHTML('beforeend', `<div class="newtool">${r.newTool.icon} <b>${esc(T('gotTool'))}:</b> ${esc(L(r.newTool.name))}</div>`);
        const earned = (r.gains || []).filter(g => g.stat).map(g => { const th = WW.THEMES.find(t => t.k === g.stat); return `<li><span style="color:${th.col}">${th.icon}</span> <b>+${g.n} ${esc(L(th.full))}</b> · ${esc(g.why)}</li>`; }).join('');
        const coins = (r.gains || []).reduce((a, g) => a + g.coins, 0);
        box.insertAdjacentHTML('beforeend', `<h3>${esc(T('earned'))}</h3><ul class="earned">${earned}<li>● <b>+${coins} ${esc(T('coins'))}</b></li></ul>`);
        box.insertAdjacentHTML('beforeend', `<h3>${esc(T('learned'))}</h3><ul class="learned">${(ep.learned || []).map(l => `<li>${WW.rich(l)}</li>`).join('')}</ul>
          <h3>${esc(T('oneQ'))}</h3><p class="say">${WW.rich(ep.reflect.q)}</p>`);
        const starter = document.createElement('button'); starter.className = 'starter'; starter.innerHTML = esc(L(ep.reflect.starter)) + '…';
        starter.onclick = () => { const ta = box.querySelector('textarea'); if (!ta.value.trim()) { ta.value = WW.plain(ep.reflect.starter) + ' '; r.reflection = ta.value; } ta.focus(); };
        box.appendChild(starter);
        const ta = document.createElement('textarea'); ta.placeholder = T('reflectHint'); ta.value = r.reflection || ''; ta.rows = 3;
        ta.oninput = () => { r.reflection = ta.value; };
        box.appendChild(ta);
        const sv = document.createElement('div'); sv.className = 'savebox';
        sv.innerHTML = `<div class="ok">${esc(T('savedHere'))}</div>` +
          (sheet === 'saving' ? `<div class="pending">${esc(T('savingSheet'))}</div>` : sheet === 'ok' ? `<div class="ok">${esc(T('savedSheet'))}</div>` : sheet === 'down' ? `<div class="bad">${esc(T('sheetDown'))}</div>` : '') +
          `<div class="small">${esc(T('yourCode'))}: <code class="pcode">${WW.passportCode()}</code></div>`;
        box.appendChild(sv);
        box.insertAdjacentHTML('beforeend', `<h3>${esc(T('turnIn'))}</h3>`);
        const acts = document.createElement('div'); acts.className = 'acts';
        acts.appendChild(btn('📋 ' + T('copyWork'), 'gold', () => { WW.copy(workText()).then(() => { note = T('copied'); h.render(); }); }));
        acts.appendChild(btn('⬇ ' + T('download'), 'teal', () => WW.download(`Worldwalker ${ep.id} - ${WW.save.name || 'student'}.txt`, workText())));
        box.appendChild(acts);
        box.insertAdjacentHTML('beforeend', `<p class="small">${esc(note || T('turnInNote'))}</p>`);
        const nx = WW.EPISODES[WW.epIndex(ep.id) + 1];
        const nav = document.createElement('div'); nav.className = 'acts';
        if (WW.CONFIG.MODE === 'pages') {
          nav.appendChild(btn('🗺️ ' + T('map'), 'ghost', () => (location.href = 'index.html')));
          if (nx) nav.appendChild(btn(T('nextEp') + ' ' + nx.id + ' ▶', 'teal', () => (location.href = WW.epFile(nx.id))));
        } else if (nx) nav.insertAdjacentHTML('beforeend', `<p class="small"><b>${esc(T('nextEp'))} ${nx.id}:</b> ${esc(T('nextCanvas'))}</p>`);
        nav.appendChild(btn('📘 ' + T('passport'), 'ghost', () => ui.passport()));
        box.appendChild(nav);
      }
    });
    if (sheet === 'saving') {
      WW.sheetSave(logEntry()).then(res => { sheet = res.ok ? 'ok' : 'down'; const t = ui.top(); if (t) t.render(); });
    }
  };
  function logEntry() {
    const r = WW.run;
    return { episode: WW.ep.id, stars: r.stars, heartsLost: r.heartsLost, minutes: Math.round((Date.now() - r.t0) / 60000), missed: r.missed.map(i => 'Q' + (i + 1)), reflection: r.reflection || '' };
  }
  function workText() {
    const r = WW.run, ep = WW.ep, s = WW.save;
    const en = t => (t && t.en) || WW.plain(t);
    const lines = [];
    lines.push(`WORLDWALKER — Episode ${ep.id}: ${WW.plain({ en: en(ep.title) })}`);
    lines.push(`Name: ${s.name || ''}   Class: ${s.cls || ''}   Date: ${new Date().toLocaleDateString()}`);
    lines.push(`Stars: ${r.stars} of 3   Atlas scraps: ${r.scraps.size}/${ep.scraps.length}   Hearts lost: ${r.heartsLost}   Hints used: ${r.hints || 0}   Minutes: ${Math.round((Date.now() - r.t0) / 60000)}`);
    lines.push('');
    lines.push('TALKS (question — my answer — tries)');
    r.log.forEach(l => lines.push(`- ${l.who}: ${l.q} — ${l.a} (${l.tries} ${l.tries === 1 ? 'try' : 'tries'})`));
    lines.push('');
    if (WW.quest.on()) lines.push(WW.quest.log());
    lines.push(`CHALLENGE: ${WW.plain(ep.challenge.title)} — solved in ${r.challengeTries} ${r.challengeTries === 1 ? 'try' : 'tries'}`);
    lines.push(`GRUMP TRIAL: ${r.missed.length} missed ${r.missed.length ? '(' + r.missed.map(i => WW.plain(ep.boss.questions[i].q)).join(' | ') + ')' : ''}`);
    lines.push('');
    lines.push('REFLECTION');
    lines.push('Q: ' + WW.plain(ep.reflect.q));
    lines.push('A: ' + (r.reflection || '(blank)'));
    lines.push('');
    lines.push('POWERS: ' + WW.THEMES.map(t => `${WW.plain(t.full)} ${s.stats[t.k] || 0}`).join(' · '));
    lines.push('PASSPORT CODE: ' + WW.passportCode());
    return lines.join('\n');
  }
  WW.workText = workText;
})();

/* challenges.js */
/* WORLDWALKER engine · the compass-stone challenges and the Grump trial
   Challenge types (set by ep.challenge.type):
     sort   – put each card in the right group (style:'bands' draws groups as land bands, e.g. elevation)
     order  – tap the cards in the right order
     claim  – choose one option, then back it up with one reason of each kind
     combo  – set switches; some settings work and some do not
     table  – read a small table of facts, answer questions about it
     build  – the stone moved into the world: place signposts where they point (tools.js); fallback: a card version  */
(function () {
  const L = t => WW.L(t), T = k => WW.T(k), esc = s => WW.esc(s), btn = (a, b, c) => WW.btn(a, b, c);
  const shuffle = (a, seed = 7) => { a = a.slice(); let s = seed; for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  WW.shuffle = shuffle;

  function header(box, ch) {
    const pip = WW.spriteCanvas('stone', { W: '#9aa3ad', G: '#5e636b', y: '#f2c14e', r: '#e04848', n: '#2f6fd6' }, 3); pip.className = 'chface';
    const hd = document.createElement('div'); hd.className = 'ch-head';
    hd.appendChild(pip);
    hd.insertAdjacentHTML('beforeend', `<div><h3>${esc(L(ch.title))}</h3>${(ch.intro ? `<p class="say">${WW.rich(ch.intro)}</p>` : '')}</div>`);
    box.appendChild(hd);
  }
  function solved(h, ch, okText) {
    const r = WW.run;
    if (!r.challengeDone) {
      r.challengeDone = true;
      WW.gain(ch.stat || 'hei', 2, 5, T('why_stone')); WW.sheetSync();
      WW.sfx('win');
      WW.game.onChallengeDone();
    }
    return okText;
  }
  function doneBlock(box, h, ch) {
    const d = document.createElement('div'); d.className = 'fb right';
    d.innerHTML = `<b>${esc(T('allRight'))}</b> ${WW.rich(ch.success || '')}`;
    box.appendChild(d);
    const acts = document.createElement('div'); acts.className = 'acts';
    acts.appendChild(btn(T('cont') + ' ▶', 'gold', () => h.close()));
    box.appendChild(acts);
  }

  /* ---------------- sort ---------------- */
  function sortUI(ch) {
    const place = {}; // item index -> bin id
    let sel = null, checked = false;
    const order = shuffle(ch.items.map((_, i) => i), ch.items.length * 13 + 5);
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        header(box, ch);
        const done = WW.run.challengeDone;
        box.insertAdjacentHTML('beforeend', `<p class="hint">${esc(T('pickItem'))}</p>`);
        const pool = document.createElement('div'); pool.className = 'pool';
        order.filter(i => place[i] == null).forEach(i => pool.appendChild(card(i)));
        box.appendChild(pool);
        const bins = document.createElement('div'); bins.className = 'bins ' + (ch.style === 'bands' ? 'bands' : '');
        ch.bins.forEach(b => {
          const el = document.createElement('div'); el.className = 'bin';
          if (b.tile && ch.style === 'bands') {
            const cv = document.createElement('canvas'); cv.width = 16 * 6; cv.height = 16; cv.className = 'bintile';
            const x = cv.getContext('2d'); for (let i = 0; i < 6; i++) WW.tiles[b.tile](x, i * 16, 0, i, 1, 0);
            el.appendChild(cv);
          }
          el.insertAdjacentHTML('beforeend', `<div class="binlabel">${b.icon ? b.icon + ' ' : ''}${WW.rich(b.label)}${b.sub ? `<span class="small"> · ${WW.rich(b.sub)}</span>` : ''}</div>`);
          const inside = document.createElement('div'); inside.className = 'binin';
          order.filter(i => place[i] === b.id).forEach(i => inside.appendChild(card(i)));
          el.appendChild(inside);
          el.onclick = e => {
            if (e.target.closest('.card') || done) return;
            if (sel != null) { place[sel] = b.id; sel = null; checked = false; WW.sfx('blip'); h.render(); }
          };
          el.classList.toggle('target', sel != null);
          bins.appendChild(el);
        });
        box.appendChild(bins);
        if (done) return doneBlock(box, h, ch);
        const all = Object.keys(place).length === ch.items.length;
        const acts = document.createElement('div'); acts.className = 'acts';
        const cb = btn(T('check'), 'gold', () => {
          checked = true; WW.run.challengeTries++;
          const wrong = ch.items.filter((it, i) => place[i] !== it.bin);
          if (!wrong.length) { solved(h, ch); } else WW.sfx('bad');
          h.render();
        });
        cb.disabled = !all; acts.appendChild(cb);
        box.appendChild(acts);
        if (checked) {
          const wrong = ch.items.map((it, i) => [it, i]).filter(([it, i]) => place[i] !== it.bin);
          if (wrong.length) {
            const fb = document.createElement('div'); fb.className = 'fb wrong';
            fb.innerHTML = `<b>${esc(T('someWrong'))}</b>` + (wrong[0][0].why ? ` ${WW.rich(wrong[0][0].why)}` : '');
            box.appendChild(fb);
          }
        }
        function card(i) {
          const it = ch.items[i];
          const c = document.createElement('button'); c.className = 'card';
          if (sel === i) c.classList.add('sel');
          if (checked && place[i] != null) c.classList.add(place[i] === it.bin ? 'right' : 'wrong');
          c.innerHTML = (it.icon ? `<span class="ic">${it.icon}</span>` : '') + WW.rich(it.t);
          c.onclick = (e) => {
            e.stopPropagation(); if (done) return;
            if (sel != null && sel !== i && place[i] != null) { place[sel] = place[i]; sel = null; } // drop the chosen card into this card's group
            else if (place[i] != null) { delete place[i]; sel = i; } else sel = sel === i ? null : i;
            checked = false; WW.sfx('blip'); h.render();
          };
          c.dataset.i = i;
          return c;
        }
      }
    });
  }

  /* ---------------- order ---------------- */
  function orderUI(ch) {
    let seq = [], checked = false;
    const order = shuffle(ch.items.map((_, i) => i), ch.items.length * 7 + 3);
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        header(box, ch);
        const done = WW.run.challengeDone;
        box.insertAdjacentHTML('beforeend', `<p class="hint">${esc(T('pickOrder'))}</p>`);
        const line = document.createElement('ol'); line.className = 'seq';
        seq.forEach((i, pos) => {
          const li = document.createElement('li');
          li.className = 'card' + (checked ? (i === pos ? ' right' : ' wrong') : '');
          li.innerHTML = (ch.items[i].icon ? `<span class="ic">${ch.items[i].icon}</span>` : '') + WW.rich(ch.items[i].t);
          line.appendChild(li);
        });
        box.appendChild(line);
        const pool = document.createElement('div'); pool.className = 'pool';
        order.filter(i => !seq.includes(i)).forEach(i => {
          const c = document.createElement('button'); c.className = 'card'; c.dataset.i = i;
          c.innerHTML = (ch.items[i].icon ? `<span class="ic">${ch.items[i].icon}</span>` : '') + WW.rich(ch.items[i].t);
          c.onclick = () => { if (done) return; seq.push(i); checked = false; WW.sfx('blip'); h.render(); };
          pool.appendChild(c);
        });
        box.appendChild(pool);
        if (done) return doneBlock(box, h, ch);
        const acts = document.createElement('div'); acts.className = 'acts';
        const cb = btn(T('check'), 'gold', () => {
          checked = true; WW.run.challengeTries++;
          if (seq.every((v, k) => v === k)) solved(h, ch); else WW.sfx('bad');
          h.render();
        });
        cb.disabled = seq.length !== ch.items.length; acts.appendChild(cb);
        acts.appendChild(btn(T('reset'), 'ghost', () => { seq = []; checked = false; h.render(); }));
        box.appendChild(acts);
        if (checked && !WW.run.challengeDone) {
          const first = seq.findIndex((v, k) => v !== k);
          const fb = document.createElement('div'); fb.className = 'fb wrong';
          fb.innerHTML = `<b>${esc(T('wrong'))}</b> ${WW.rich(ch.why || '')} <span class="small">(#${first + 1})</span>`;
          box.appendChild(fb);
        }
      }
    });
  }

  /* ---------------- claim ---------------- */
  function claimUI(ch) {
    let pick = ch.pickAt ?? null, why = {}, checked = false; // pickAt: the site the student is standing at (world version)
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        header(box, ch);
        const done = WW.run.challengeDone;
        box.insertAdjacentHTML('beforeend', `<h4>1 · ${esc(T('choose'))}</h4>`);
        const opts = document.createElement('div'); opts.className = 'opts';
        ch.options.forEach((o, i) => {
          const b = document.createElement('button'); b.className = 'opt' + (pick === i ? ' sel' : ''); b.dataset.i = i;
          b.innerHTML = `<b>${o.icon ? o.icon + ' ' : ''}${WW.rich(o.name)}</b>${o.desc ? `<span>${WW.rich(o.desc)}</span>` : ''}`;
          b.onclick = () => { if (done) return; pick = i; why = {}; checked = false; WW.sfx('blip'); h.render(); };
          opts.appendChild(b);
        });
        box.appendChild(opts);
        if (pick != null) {
          box.insertAdjacentHTML('beforeend', `<h4>2 · ${esc(T('because'))}</h4>`);
          ch.kinds.forEach(k => {
            const grp = document.createElement('div'); grp.className = 'kind';
            grp.innerHTML = `<div class="klabel">${WW.rich(k.label)}</div>`;
            ch.reasons.forEach((r, ri) => {
              if (r.kind !== k.id) return;
              const b = document.createElement('button'); b.className = 'reason' + (why[k.id] === ri ? ' sel' : ''); b.dataset.r = ri;
              if (checked && why[k.id] === ri) b.classList.add(r.fits.includes(pick) ? 'right' : 'wrong');
              b.innerHTML = WW.rich(r.t);
              b.onclick = () => { if (done) return; why[k.id] = ri; checked = false; WW.sfx('blip'); h.render(); };
              grp.appendChild(b);
            });
            box.appendChild(grp);
          });
        }
        if (done) {
          const o = ch.options[pick ?? WW.run.claimPick ?? 0];
          if (o && o.result) box.insertAdjacentHTML('beforeend', `<div class="fb right">${WW.rich(o.result)}</div>`);
          return doneBlock(box, h, ch);
        }
        const ready = pick != null && ch.kinds.every(k => why[k.id] != null);
        const acts = document.createElement('div'); acts.className = 'acts';
        const cb = btn(T('check'), 'gold', () => {
          checked = true; WW.run.challengeTries++;
          const ok = ch.kinds.every(k => ch.reasons[why[k.id]].fits.includes(pick));
          if (ok) { WW.run.claimPick = pick; solved(h, ch); } else WW.sfx('bad');
          h.render();
        });
        cb.disabled = !ready; acts.appendChild(cb);
        box.appendChild(acts);
        if (checked && !WW.run.challengeDone) {
          const bad = ch.kinds.map(k => ch.reasons[why[k.id]]).find(r => !r.fits.includes(pick));
          box.insertAdjacentHTML('beforeend', `<div class="fb wrong"><b>${esc(T('wrong'))}</b> ${WW.rich(ch.mismatch || '')} ${bad && bad.why ? WW.rich(bad.why) : ''}</div>`);
        }
      }
    });
  }

  /* ---------------- combo ---------------- */
  function comboUI(ch) {
    const set = ch.switches.map(s => s.start || 0);
    let tried = false;
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        header(box, ch);
        const done = WW.run.challengeDone;
        const sw = document.createElement('div'); sw.className = 'switches';
        ch.switches.forEach((s, i) => {
          const g = document.createElement('div'); g.className = 'sw-g';
          g.innerHTML = `<div class="klabel">${s.icon ? s.icon + ' ' : ''}${WW.rich(s.name)}</div>`;
          s.states.forEach((st, k) => {
            const b = document.createElement('button'); b.className = 'reason' + (set[i] === k ? ' sel' : ''); b.dataset.s = i + ':' + k;
            b.innerHTML = WW.rich(st);
            b.onclick = () => { if (done) return; set[i] = k; tried = false; WW.sfx('blip'); h.render(); };
            g.appendChild(b);
          });
          sw.appendChild(g);
        });
        box.appendChild(sw);
        const key = set.join(',');
        const res = ch.results[key] || ch.otherwise || { t: '' , ok: false };
        if (res.show) {
          const out = document.createElement('div'); out.className = 'outs';
          res.show.forEach(o => out.insertAdjacentHTML('beforeend', `<span class="out ${o.ok ? 'good' : 'badp'}">${o.icon || ''} ${WW.rich(o.t)}</span>`));
          box.appendChild(out);
        }
        if (done) return doneBlock(box, h, ch);
        const acts = document.createElement('div'); acts.className = 'acts';
        acts.appendChild(btn(T('check'), 'gold', () => {
          tried = true; WW.run.challengeTries++;
          if (res.ok) solved(h, ch); else WW.sfx('bad');
          h.render();
        }));
        box.appendChild(acts);
        if (tried && !WW.run.challengeDone) box.insertAdjacentHTML('beforeend', `<div class="fb wrong"><b>${esc(T('wrong'))}</b> ${WW.rich(res.t)}</div>`);
      }
    });
  }

  /* ---------------- table ---------------- */
  function tableUI(ch) {
    let qi = 0, picked = null;
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        header(box, ch);
        const done = WW.run.challengeDone;
        let t = '<div class="tblwrap"><table class="dtbl"><thead><tr>' + ch.table.head.map(c => `<th>${WW.rich(c)}</th>`).join('') + '</tr></thead><tbody>';
        ch.table.rows.forEach(r => (t += '<tr>' + r.map(c => `<td>${WW.rich(c)}</td>`).join('') + '</tr>'));
        t += '</tbody></table></div>';
        if (ch.table.note) t += `<p class="small">${WW.rich(ch.table.note)}</p>`;
        box.insertAdjacentHTML('beforeend', t);
        if (done) return doneBlock(box, h, ch);
        const q = ch.questions[qi]; box.dataset.q = qi;
        box.insertAdjacentHTML('beforeend', `<h4>${qi + 1} / ${ch.questions.length}</h4><p class="say q">${WW.rich(q.q)}</p>`);
        const list = document.createElement('div'); list.className = 'choices';
        shuffle(q.choices.map((_, i) => i), qi * 3 + 1).forEach(i => {
          const c = q.choices[i];
          const b = document.createElement('button'); b.innerHTML = WW.rich(c); b.dataset.i = i;
          if (picked === i) b.className = i === q.answer ? 'right' : 'wrong';
          b.onclick = () => {
            if (picked === q.answer) return;
            picked = i;
            if (i === q.answer) WW.sfx('good'); else { WW.sfx('bad'); WW.run.challengeTries++; }
            h.render();
          };
          list.appendChild(b);
        });
        box.appendChild(list);
        if (picked != null) {
          const ok = picked === q.answer;
          box.insertAdjacentHTML('beforeend', `<div class="fb ${ok ? 'right' : 'wrong'}"><b>${esc(ok ? T('right') : T('wrong'))}</b> ${WW.rich(q.why || '')}</div>`);
          if (ok) {
            const acts = document.createElement('div'); acts.className = 'acts';
            acts.appendChild(btn(T('next') + ' ▶', 'gold', () => {
              picked = null;
              if (qi < ch.questions.length - 1) qi++; else { WW.run.challengeTries = Math.max(1, WW.run.challengeTries); solved(h, ch); }
              h.render();
            }));
            box.appendChild(acts);
          }
        }
      }
    });
  }

  WW.challengeSolved = ch => solved(null, ch);
  WW.challenge = (ch) => {
    const f = { sort: sortUI, order: orderUI, claim: claimUI, combo: comboUI, table: tableUI, build: c => WW.tools.stone(c), carry: c => WW.tools.stone(c), route: c => WW.world.stone(c), site: c => WW.world.stone(c), survey: c => WW.world.stone(c), levers: c => WW.world.stone(c) }[ch.type];
    if (!f) return console.error('unknown challenge type', ch.type);
    f(ch);
  };

  /* ---------------- the Grump trial ---------------- */
  WW.bossTrial = (boss, onWin) => {
    const need = boss.need || 3;
    let queue = shuffle(boss.questions.map((_, i) => i), boss.questions.length * 11 + 1);
    let broken = 0, picked = null, last = null, grr = '';
    let freeHints = WW.tier('reg'); const hidden = {}; // Region power: free hints. A hint hides one wrong answer.
    WW.music.play('boss');
    WW.ui.open({
      cls: 'bossov',
      render(box, h) {
        const top = document.createElement('div'); top.className = 'boss-top';
        // the Grump gets FURIOUS once half its shield is cracked, and roars at every wrong answer
        const furious = !boss.minor && broken >= need / 2 && broken < need;
        const cv = document.createElement('canvas'); cv.width = 16 * 5; cv.height = 16 * 5; cv.className = 'bossface' + (last === 'hit' ? ' hit' : last === 'crack' ? ' crack' : '') + (furious ? ' furious' : '');
        WW.sprite(cv.getContext('2d'), 'smudge', 0, 0, { scale: 5, pal: boss.pal || (furious ? { g: '#8a2836', G: '#561722', e: '#fff070' } : null) });
        if (!boss.minor) box.classList.toggle('roar', last === 'hit');
        top.appendChild(cv);
        let shield = `<div><div class="bname">${esc(L(boss.name))}${furious ? ` <span class="furious-tag">${esc(T('furious'))}</span>` : ''}</div><div class="klabel">${esc(T('shield'))}</div><div class="shield">`;
        for (let i = 0; i < need; i++) shield += `<span class="${i < need - broken ? 'on' : ''}${last === 'crack' && i === need - broken ? ' cracked' : ''}"></span>`;
        shield += `</div><div class="hearts">${'<span class="hrt">♥</span>'.repeat(WW.run.hearts)}${'<span class="hrt empty">♥</span>'.repeat(Math.max(0, WW.heartsMax() - WW.run.hearts))}</div></div>`;
        top.insertAdjacentHTML('beforeend', shield);
        if (last === 'crack') top.insertAdjacentHTML('beforeend', '<span class="starshot">★</span>'); // a right answer throws a star at the Grump
        box.appendChild(top);
        if (broken >= need) {
          box.insertAdjacentHTML('beforeend', `<div class="fb right"><b>${esc(T('allRight'))}</b> ${WW.rich(boss.win || '')}</div>`);
          const acts = document.createElement('div'); acts.className = 'acts';
          acts.appendChild(btn(T('cont') + ' ▶', 'gold big', () => { h.close(); onWin(); }));
          box.appendChild(acts);
          return;
        }
        if (broken === 0 && picked == null && boss.taunt) box.insertAdjacentHTML('beforeend', `<p class="say taunt">${WW.rich(boss.taunt)}</p>`);
        const qi = queue[0], q = boss.questions[qi];
        box.dataset.q = qi;
        box.insertAdjacentHTML('beforeend', `<p class="say q">${WW.rich(q.q)}</p>`);
        const list = document.createElement('div'); list.className = 'choices two';
        const ord = shuffle(q.choices.map((_, i) => i), qi * 5 + WW.run.bossMisses + 3);
        let pos = 0;
        ord.forEach(i => {
          if (picked == null && (hidden[qi] || []).includes(i)) return;
          const c = q.choices[i];
          const b = document.createElement('button'); b.innerHTML = `<i>${'ABCDE'[pos++]}</i> ${WW.rich(c)}`; b.dataset.i = i;
          if (picked === i) b.className = i === q.answer ? 'right' : 'wrong';
          b.disabled = picked != null;
          b.onclick = () => {
            picked = i;
            if (i === q.answer) { broken++; last = 'crack'; WW.sfx('hit'); }
            else { last = 'hit'; WW.sfx('hurt'); if (!boss.minor) { WW.sfx('growl'); grr = WW.grr(); } const ml = boss.missedList || WW.run.missed; ml.includes(qi) || ml.push(qi); if (!boss.minor) WW.run.bossMisses++; WW.hurt(true); }
            h.render();
          };
          list.appendChild(b);
        });
        box.appendChild(list);
        const wrongLeft = q.choices.map((_, i) => i).filter(i => i !== q.answer && !(hidden[qi] || []).includes(i));
        if (picked == null && wrongLeft.length > 1) {
          const hb = btn(`💡 ${esc(T('hint'))} · ${freeHints ? esc(T('hintFree')) + ' ×' + freeHints : '10 ●'}`, 'ghost hintbtn', () => {
            if (freeHints) freeHints--;
            else if ((WW.save.coins || 0) >= 10) { WW.spend(10); WW.ui.hud(); }
            else return WW.toast(esc(T('hintNoCoins')), '#b0392b');
            (hidden[qi] = hidden[qi] || []).push(wrongLeft[0]); WW.run.hints++; WW.sfx('blip'); h.render();
          });
          const ha = document.createElement('div'); ha.className = 'acts'; ha.appendChild(hb); box.appendChild(ha);
        }
        if (picked != null) {
          const ok = picked === q.answer;
          if (!ok && grr && !boss.minor) box.insertAdjacentHTML('beforeend', `<p class="say taunt grr">${esc(grr)}</p>`);
          box.insertAdjacentHTML('beforeend', `<div class="fb ${ok ? 'right' : 'wrong'}"><b>${esc(ok ? T('right') : T('wrong'))}</b> ${WW.rich(q.why || '')}</div>`);
          const acts = document.createElement('div'); acts.className = 'acts';
          acts.appendChild(btn(T('next') + ' ▶', 'gold', () => {
            queue.shift(); if (!ok) queue.push(qi);
            picked = null; last = null; h.render();
          }));
          box.appendChild(acts);
        }
      }
    });
  };
})();

               A5 B5 D6 - B5 A5 F#5 - | A5 - F#5 E5 D5 - . . | E5 F#5 A5 - F#5 E5 D5 B4 | D5 - - - . . . .`,
      bass: 'D3 - A3 - D4 - A3 -',
      drums: 'k . h k s h . h'
    },
    // 7 East Asia: gentle five-note tune, like a plucked koto
    realm7: {
      bpm: 92, lead: 'pluck',
      melody: `E5 . D5 . B4 - A4 . | B4 - D5 - E5 - - . | G5 . E5 . D5 - B4 . | D5 - - - - . . . |
               E5 . G5 . A5 - G5 E5 | D5 - E5 - B4 - - . | A4 . B4 . D5 - E5 D5 | B4 - A4 - G4 - - .`,
      bass: 'G2 - D3 - G3 - D3 - | E2 - B2 - E3 - B2 -',
      drums: 'k . . . h . . . | k . h . h . . .'
    },
    // 8 Australia, the Pacific & the World: bright island song in F major
    realm8: {
      bpm: 128, lead: 'tri',
      melody: `C5 - F5 - A5 - G5 F5 | G5 - - - . . C5 - | D5 - G5 - Bb5 - A5 G5 | A5 - - - . . F5 G5 |
               A5 - C6 - A5 - F5 - | G5 - Bb5 - G5 - E5 - | F5 - A5 - G5 - E5 - | F5 - - - . . . .`,
      bass: `F2 . C3 . F3 . C3 . | F2 . C3 . A2 . C3 . | G2 . D3 . G3 . D3 . | C3 . G2 . C3 . E3 . |
             F2 . C3 . F3 . C3 . | C3 . G2 . C3 . G2 . | Bb2 . F3 . C3 . G2 . | F2 . C3 . F2 . . .`,
      drums: 'k h s h k k s h'
    },
    // the Grump trial: fast and tense, A minor
    boss: {
      bpm: 150, lead: 'square',
      melody: `A5 . A5 C6 B5 . G#5 . | A5 . E5 . . . . . | F5 . F5 A5 G5 . E5 . | D5 . E5 . . . . . |
               A5 . A5 C6 B5 . G#5 . | A5 . E6 . D6 . C6 . | B5 . C6 . B5 . A5 . | G#5 - - - E5 - - -`,
      bass: `A2 A3 A2 A3 A2 A3 A2 A3 | A2 A3 A2 A3 A2 A3 A2 A3 | F2 F3 F2 F3 F2 F3 F2 F3 | D2 D3 D2 D3 D2 D3 D2 D3 |
             A2 A3 A2 A3 A2 A3 A2 A3 | F2 F3 F2 F3 F2 F3 F2 F3 | E2 E3 E2 E3 E2 E3 E2 E3 | E2 E3 E2 E3 E2 E3 E2 E3`,
      drums: 'k h s h k k s h'
    },
    // the page is won (plays once)
    win: {
      bpm: 170, lead: 'square', once: true,
      melody: 'C5 E5 G5 C6 - - G5 C6 - - - - - - - .',
      bass: 'C3 . G3 . C4 - - . G3 . C3 - - - - .',
      drums: 'k . . . s . . . k . s . k s k .'
    }
  };

  const NOTE = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };
  function freq(tok) {
    const m = /^([A-G])([#b]?)(\d)$/.exec(tok); if (!m) return 0;
    const n = NOTE[m[1]] + (m[2] === '#' ? 1 : m[2] === 'b' ? -1 : 0) + (+m[3] + 1) * 12;
    return 440 * Math.pow(2, (n - 69) / 12);
  }
  const parse = s => (s || '').split(/\s+/).filter(w => w && w !== '|');
  for (const k in SONGS) { const s = SONGS[k]; s.ch = { melody: parse(s.melody), bass: parse(s.bass), drums: parse(s.drums) }; s.len = Math.max(s.ch.melody.length, s.ch.bass.length, s.ch.drums.length); }

  let ac = null, out = null, noise = null, song = null, songName = '', step = 0, nextT = 0, timer = null;

  function setup() {
    ac = WW.ac; if (!ac || out) return !!ac;
    out = ac.createGain(); out.gain.value = 0.9; out.connect(ac.destination);
    noise = ac.createBuffer(1, ac.sampleRate * 0.5, ac.sampleRate);
    const d = noise.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    return true;
  }
  function env(g, t, peak, dur, hold) {
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.01);
    if (hold) { g.gain.setValueAtTime(peak * 0.75, t + Math.max(0.02, dur * 0.7)); g.gain.exponentialRampToValueAtTime(0.0001, t + dur); }
    else g.gain.exponentialRampToValueAtTime(0.0001, t + Math.min(dur, 0.45));
  }
  function tone(type, f, t, dur, peak, hold, vib) {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (vib && dur > 0.35) { // a little wobble on long notes
      const l = ac.createOscillator(), lg = ac.createGain(); l.frequency.value = 5.5; lg.gain.value = f * 0.006;
      l.connect(lg); lg.connect(o.frequency); l.start(t + 0.15); l.stop(t + dur);
    }
    env(g, t, peak, dur, hold);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05);
  }
  function hit(kind, t) {
    if (kind === 'k') {
      const o = ac.createOscillator(), g = ac.createGain();
      o.frequency.setValueAtTime(150, t); o.frequency.exponentialRampToValueAtTime(42, t + 0.12);
      g.gain.setValueAtTime(0.22, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.14);
      o.connect(g); g.connect(out); o.start(t); o.stop(t + 0.16);
    } else if (kind === 'c') {
      tone('square', 2400, t, 0.03, 0.025, false);
    } else {
      const src = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain();
      src.buffer = noise; f.type = 'highpass'; f.frequency.value = kind === 's' ? 1200 : 6500;
      const d = kind === 's' ? 0.12 : 0.035, v = kind === 's' ? 0.07 : 0.03;
      g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
      src.connect(f); f.connect(g); g.connect(out); src.start(t, Math.random() * 0.3); src.stop(t + d + 0.02);
    }
  }
  // how many steps a note lasts: itself plus the '-' words after it
  function length(arr, i) { let n = 1; while (arr[(i + n) % arr.length] === '-' && n < arr.length) n++; return n; }

  function schedule(s, i, t, sd) {
    const m = s.ch.melody, b = s.ch.bass, d = s.ch.drums;
    if (m.length && (!s.once || i < m.length)) {
      const w = m[i % m.length], f = freq(w);
      if (f) {
        const dur = length(m, i % m.length) * sd;
        if (s.lead === 'pluck') { tone('triangle', f, t, dur, 0.13, false); tone('square', f * 2, t, Math.min(dur, 0.12), 0.012, false); }
        else if (s.lead === 'tri') tone('triangle', f, t, dur * 0.95, 0.12, true, true);
        else tone('square', f, t, dur * 0.95, 0.035, true, true);
      }
    }
    if (b.length && (!s.once || i < b.length)) { const w = b[i % b.length], f = freq(w); if (f) tone('triangle', f, t, length(b, i % b.length) * sd * 0.9, 0.11, true); }
    if (d.length && (!s.once || i < d.length)) { const w = d[i % d.length]; if (w !== '.' && w !== '-') for (const k of w) hit(k, t); }
  }
  function tick() {
    if (!song || !ac) return;
    const sd = 60 / song.bpm / 2;
    while (nextT < ac.currentTime + 0.15) {
      if (song.once && step >= song.len) { const after = song.after; stop(); if (after) play(after); return; }
      schedule(song, step, nextT, sd);
      nextT += sd; step++;
    }
  }
  function stop() { if (timer) clearInterval(timer); timer = null; song = null; songName = ''; }
  function start() {
    if (!WW.save.music || !wanted || !setup()) return;
    if (ac.state === 'suspended') ac.resume();
    song = Object.assign({}, SONGS[wanted]); songName = wanted; step = 0; nextT = ac.currentTime + 0.08;
    if (song.once) song.after = wantedAfter;
    if (timer) clearInterval(timer);
    timer = setInterval(tick, 30); tick();
  }
  let wanted = '', wantedAfter = '';
  // play a song by name ('realm4', 'boss', 'win'); 'then' = the song to go back to after a one-time jingle
  function play(name, then) {
    wanted = name; wantedAfter = then || '';
    if (songName === name && timer) return;
    stop(); start();
  }
  document.addEventListener('visibilitychange', () => { if (!ac) return; if (document.hidden) ac.suspend(); else ac.resume(); });

  WW.music = {
    SONGS, play,
    stop() { wanted = ''; stop(); },
    wake() { if (wanted && !timer) start(); },          // call after the first tap/click, when sound is allowed
    toggle() { WW.save.music = !WW.save.music; WW.store(); if (WW.save.music) start(); else stop(); },
    get playing() { return songName; },
    // for tests/music.js: write a whole song into an OfflineAudioContext
    renderInto(ctx, name, loops = 1) {
      const keep = [ac, out, noise]; ac = ctx; out = null; WW.ac = ctx; setup();
      const s = SONGS[name], sd = 60 / s.bpm / 2;
      for (let i = 0; i < s.len * loops; i++) schedule(s, i, 0.05 + i * sd, sd);
      [ac, out, noise] = keep; WW.ac = ac;
    }
  };
})();

/* fx.js */
/* WORLDWALKER engine · the living world: butterflies, birds, fish, chimney smoke, cloud shadows,
   weather and time of day for each episode, and little bursts of sparkle and dust.
   Everything is drawn on top of the map canvas each frame. */
(function () {
  const TS = 16, SW = 16, SH = 11, VW = SW * TS, VH = SH * TS;
  const { hash } = WW;
  const calm = () => WW.calm;

  /* weather and time of day for each episode (an episode file can also set its own: weather: { sky, time }) */
  const SKY = {
    '1.1': { life: 1 }, '1.2': { life: 1 }, '1.3': { life: 1 },
    '2.1': { sky: 'leaves' }, '2.2': { sky: 'drizzle' }, '2.3': { time: 'sunset' },
    '3.1': { sky: 'drizzle' }, '3.2': { sky: 'snow' }, '3.3': { time: 'sunset', sky: 'dust' },
    '4.1': { sky: 'heat' }, '4.2': { time: 'sunset' }, '4.3': { life: 1 },
    '5.1': { sky: 'heat' }, '5.2': { time: 'sunset' }, '5.3': { sky: 'heat' },
    '6.1': { sky: 'rain' }, '6.2': { sky: 'drizzle' }, '6.3': { life: 1 },
    '7.1': { sky: 'petals' }, '7.2': { life: 1 }, '7.3': { time: 'night' },
    '8.1': { sky: 'heat' }, '8.2': { life: 1 }, '8.3': { time: 'sunset' }
  };
  let sky = {}, map = null, parts = [], drops = [], amb = [], cur = '', clouds = [], dark = null, wind = 0.3;

  const rnd = Math.random;
  const tileAt = (x, y) => (map[y] || '')[x];

  function setup(ep) {
    sky = Object.assign({ sky: 'clear', time: 'day' }, SKY[ep.id] || {}, ep.weather || {});
    map = ep.map; parts = []; amb = []; cur = ''; dim = null; liftT = 0;
    WW.style.realm = ep.realm || +ep.id[0];
    WW.style.night = sky.time === 'night';
    wind = sky.sky === 'snow' ? 0.25 : sky.sky === 'dust' || sky.sky === 'heat' ? 0.9 : 0.35;
    drops = [];
    const n = { rain: 90, drizzle: 40, snow: 70, petals: 18, leaves: 14, dust: 26, heat: 14 }[sky.sky] || 0;

  function newDrop(anywhere) {

  /* things that live on one screen: made fresh each time the hero walks onto a new screen */
  function enterScreen(sx, sy) {

      const gx = sx * SW + x, gy = sy * SH + y, ch = tileAt(gx, gy);
      if ('.,"'.includes(ch)) grass.push([gx, gy]);

    }
    const ox = sx * VW, oy = sy * VH;

      grass.length > 20 && [0, 1, 2, 3, 4].forEach(i => { const g = grass[(hash(sx, sy, i) * grass.length) | 0]; amb.push({ k: 'fly', x: g[0] * TS + 8, y: g[1] * TS + 8, ph: i * 1.7 }); });
    } else if (clear && grass.length > 30) {
      [0, 1].forEach(i => { const g = grass[(hash(sx, sy, i + 3) * grass.length) | 0]; amb.push({ k: 'butterfly', x: g[0] * TS + 8, y: g[1] * TS + 8, tx: 0, ty: 0, c: ['#ffe36e', '#ff8fb1', '#ffffff', '#8fc3ff'][(i + sx + sy) % 4], ph: i * 2 }); });

  }

  /* bursts: sparkles, dust, smoke */
  function burst(gx, gy, kind) {
    if (calm() && kind !== 'gold') return;
    const x = gx * TS + 8, y = gy * TS + 8;
    // chips and leaves: a few bits of wood or grass fly up and fall
    const n = { gold: 16, purple: 22, dust: 4, snow: 4, splash: 6, poof: 30, chips: 8, leaves: 9 }[kind] || 8;
    for (let i = 0; i < n; i++) {

        vx: Math.cos(a) * sp, vy: kind === 'dust' || kind === 'snow' ? -0.1 - rnd() * 0.15 : kind === 'splash' || kind === 'chips' || kind === 'leaves' ? -0.8 - rnd() * 0.6 : Math.sin(a) * sp,

  }
  // a little dust when you walk on dry ground or snow
  function step(gx, gy) {
    const ch = tileAt(gx, gy);
    if ('su:g'.includes(ch)) burst(gx, gy, 'dust');
    else if ('nzi'.includes(ch)) burst(gx, gy, 'snow');
  }

  const PCOL = { gold: ['#fff3b0', '#f2c14e', '#ffffff'], purple: ['#a08cc8', '#6d5f8c', '#4b3f63'], poof: ['#a08cc8', '#6d5f8c', '#d8d0ec'], dust: ['rgba(201,176,100,.7)'], snow: ['rgba(255,255,255,.85)'], splash: ['#d8f0ff', '#ffffff'], chips: ['#c79a5b', '#8b5a2b', '#e8c48a'], leaves: ['#5cc46a', '#2e8b3a', '#a5d86a'] };

  /* ---------------- drawing ---------------- */

  let dim = null, liftT = 0, liftAt = null;
  function smudgeDim(c, t, dt, hero) {

    if (dim == null) dim = target;

      const g = c.createRadialGradient(VW / 2, VH / 2, VH * (0.55 - 0.12 * dim), VW / 2, VH / 2, VW * 0.62);
      g.addColorStop(0, 'rgba(40,20,60,0)'); g.addColorStop(1, `rgba(40,20,60,${0.55 * dim})`);

    }
  }

  function weather(c, t, dt, k) {
    const s = sky.sky;
    if (!drops.length || calm()) { if (s === 'rain' || s === 'drizzle') { c.fillStyle = 'rgba(30,45,70,.05)'; c.fillRect(0, 0, VW, VH); } return; }

      c.fillStyle = s === 'rain' ? 'rgba(210,228,255,.7)' : 'rgba(215,230,255,.55)';
      drops.forEach(d => {
        d.y += (s === 'rain' ? 5 : 3.2) * d.s * k; d.x -= (s === 'rain' ? 1.4 : 0.8) * k;

      drops.forEach(d => {

        const flip = Math.sin(t / 250 + d.ph) > 0;
        c.fillStyle = cols[d.c]; c.fillRect(Math.round(d.x), Math.round(d.y), flip ? 2 : 1, flip ? 1 : 2);

        if (d.y > VH || d.x > VW + 10) Object.assign(d, newDrop(false), { x: rnd() * VW - 30 });

    } else if (s === 'heat' || s === 'dust') {
      // shimmer: faint wavy light bands, plus sand blowing past

        d.x += (1.2 + d.s) * wind * k; d.y += Math.sin(t / 300 + d.ph) * 0.15 * k;

    }
  }

  // sunset glow, dusk, or night with lit windows and a small light around the hero
  function light(c, sx, sy, hero, t) {
    const tm = sky.time;
    if (tm === 'sunset') {
      const g = c.createLinearGradient(0, 0, 0, VH);
      g.addColorStop(0, 'rgba(255,120,50,.20)'); g.addColorStop(0.5, 'rgba(255,160,70,.06)'); g.addColorStop(1, 'rgba(255,160,70,0)');

        const ch = tileAt(sx * SW + x, sy * SH + y);

  WW.fx = { setup, draw, burst, step, lift, get sky() { return sky; }, SKY };
})();

/* quest.js */
/* WORLDWALKER engine · the episode quest
   A quest giver (gold !) asks for help -> you talk to a contact (?) -> you do one action -> you go back to the giver.
   The action is one of:
     find  – use the contact's clue to find a secret spot and walk onto it
     fight – beat an Ink Thief in a short question duel
     trade – offer the right goods to a trader
   The compass stone stays shut until the quest is done. See docs/EPISODE-FORMAT.md ("quest"). */
(function () {
  const L = t => WW.L(t), T = k => WW.T(k);
  // quest steps: 0 not started · 1 go to the contact · 2 do the action · 3 go back to the giver · 4 done
  const Q = WW.quest = {};
  const THIEF = { g: '#a04848', G: '#6e2c2c', w: '#ffffff', r: '#2b1414' };
  Q.THIEF = THIEF;

  Q.on = () => !!(WW.ep && WW.ep.quest);
  Q.step = () => (WW.run && WW.run.quest) || 0;
  Q.done = () => !Q.on() || Q.step() >= 4;
  function set(n) { WW.run.quest = n; WW.ui.quest(); }

  /* make the map entities for the quest */
  Q.ents = (ep) => {
    const q = ep.quest, out = [];
    if (!q) return out;
    q.giver.id = 'qgiver'; q.contact.id = 'qcontact';
    out.push({ kind: 'qnpc', role: 'giver', x: q.giver.x, y: q.giver.y, ref: q.giver, phase: 7 });
    out.push({ kind: 'qnpc', role: 'contact', x: q.contact.x, y: q.contact.y, ref: q.contact, phase: 11 });
    const a = q.action;
    if (a.type === 'trade') { a.trader.id = 'qtrader'; out.push({ kind: 'qnpc', role: 'trader', x: a.trader.x, y: a.trader.y, ref: a.trader, phase: 13 }); }
    if (a.type === 'fight') out.push({ kind: 'qfoe', x: a.at[0], y: a.at[1], visible: false });
    if (a.type === 'find') out.push({ kind: 'qspot', x: a.at[0], y: a.at[1] });
    return out;
  };

  const item = () => WW.ep.quest.action.item;
  const itemName = () => (item() ? `${item().icon || '🎁'} ${WW.plain(item().name)}` : '');
  const say = (who, text, after) => WW.ui.talk({ id: who.id, name: who.name, role: who.role, look: who.look, lines: [text] }, after);

  /* walking into a quest person or the thief */
  Q.interact = (e, ents) => {
    const q = WW.ep.quest, s = Q.step();
    if (e.kind === 'qfoe') return fight(e);
    const who = e.ref;
    if (e.role === 'giver') {
      if (s === 0) WW.ui.talk(Object.assign({}, who, { lines: q.giver.lines, doneLabel: T('accept') }), () => { set(1); WW.sfx('good'); WW.toast('📜 ' + WW.esc(T('newQuest')) + ': ' + WW.esc(WW.plain(q.title)), '#c08a1e'); });
      else if (s < 3) say(who, q.giver.wait);
      else if (s === 3) say(who, q.giver.thanks, () => finish());
      else say(who, T('thanksAgain'));
    } else if (e.role === 'contact') {
      if (s === 1) WW.ui.talk(Object.assign({}, who, { lines: q.contact.lines }), () => { set(2); showAction(ents); });
      else if (s === 0) say(who, T('busy'));
      else if (s === 2) say(who, q.contact.lines[q.contact.lines.length - 1]);
      else say(who, T('goodLuck'));
    } else if (e.role === 'trader') {
      if (s !== 2) return say(who, s < 2 ? T('busy') : T('goodLuck'));
      const a = q.action;
      WW.ui.talk(Object.assign({}, who, { lines: a.trader.lines, ask: { stat: q.stat, q: a.q, choices: a.choices } }), () => {
        set(3); WW.sfx('coin'); WW.fx.burst(e.x, e.y, 'gold');
        WW.toast(`🤝 ${WW.esc(T('traded'))}${item() ? ' · ' + WW.esc(itemName()) : ''}`, '#2aa198');
      });
    }
    return true;
  };

  function showAction(ents) {
    const a = WW.ep.quest.action;
    if (a.type === 'fight') {
      const f = ents.find(e => e.kind === 'qfoe'); f.visible = true;
      WW.fx.burst(f.x, f.y, 'purple');
    }
    WW.ui.quest();
  }

  function fight(e) {
    const q = WW.ep.quest, a = q.action, r = WW.run;
    r.questMissed = r.questMissed || [];
    WW.bossTrial({ name: a.name, need: a.need || 2, taunt: a.taunt, win: a.win, questions: a.questions, pal: THIEF, minor: true, missedList: r.questMissed }, () => {
      e.gone = true; WW.fx.burst(e.x, e.y, 'poof'); set(3);
      WW.music.play('realm' + WW.ep.realm);
      if (item()) WW.toast(WW.esc(itemName()), '#2aa198');
    });
    return true;
  }

  /* stepping onto a tile: is it the secret spot? */
  Q.onStep = (x, y) => {
    if (!Q.on() || Q.step() !== 2) return;
    const a = WW.ep.quest.action;
    if (a.type !== 'find' || a.at[0] !== x || a.at[1] !== y) return;
    WW.sfx('win'); WW.fx.burst(x, y, 'gold'); set(3);
    WW.ui.message('✨ ' + T('foundIt'), a.found);
  };

  function finish() {
    const q = WW.ep.quest;
    set(4);
    WW.fx.burst(q.giver.x, q.giver.y, 'gold');
    WW.gain(q.stat || 'reg', 2, (q.reward && q.reward.coins) || 10, T('why_quest') + ': ' + WW.plain(q.title));
    WW.toast('🏅 ' + WW.esc(T('questDone')), '#c08a1e');
    WW.sheetSync();
  }

  /* what to draw above people's heads, and the secret spot's twinkle */
  Q.mark = e => {
    const s = Q.step();
    if (e.role === 'giver') return s === 0 || s === 3 ? '!' : '';
    if (e.role === 'contact') return s === 1 ? '?' : '';
    if (e.role === 'trader') return s === 2 ? '?' : '';
    return '';
  };
  Q.draw = (c, e, x, y, t) => {
    if (e.kind === 'qnpc') {
      WW.drawPerson(c, e.ref, x, y - 2, t, e.phase);
      const m = Q.mark(e);
      if (m) {
        const b = Math.round(Math.sin(t / 220 + e.phase) * 1.5);
        c.fillStyle = '#22202e'; c.fillRect(x + 5, y - 13 + b, 7, 9);
        c.fillStyle = m === '!' ? '#f2c14e' : '#8fc3ff'; c.fillRect(x + 6, y - 12 + b, 5, 7);
        c.fillStyle = '#22202e';
        if (m === '!') { c.fillRect(x + 8, y - 11 + b, 1, 3); c.fillRect(x + 8, y - 7 + b, 1, 1); }
        else { c.fillRect(x + 7, y - 11 + b, 3, 1); c.fillRect(x + 9, y - 10 + b, 1, 1); c.fillRect(x + 8, y - 9 + b, 1, 1); c.fillRect(x + 8, y - 7 + b, 1, 1); }
      }
    } else if (e.kind === 'qfoe') {
      WW.shadow(c, x, y + 13, 10);
      WW.sprite(c, 'smudge', x, y, { bob: true, t, phase: 2, pal: THIEF });
      c.fillStyle = '#22202e'; c.fillRect(x + 3, y + 7, 10, 2); // a bandit mask
      c.fillStyle = '#ffffff'; c.fillRect(x + 4, y + 7, 2, 1); c.fillRect(x + 10, y + 7, 2, 1);
    } else if (e.kind === 'qspot' && Q.step() === 2) {
      const k = (Math.sin(t / 260) + 1) / 2;
      c.fillStyle = `rgba(255,243,176,${0.25 + k * 0.6})`;
      c.fillRect(x + 7, y + 4, 2, 8); c.fillRect(x + 4, y + 7, 8, 2);
      c.fillStyle = `rgba(255,255,255,${k})`; c.fillRect(x + 7, y + 7, 2, 2);
    }
  };

  /* the words in the quest bar */
  Q.bar = () => {
    const q = WW.ep.quest, s = Q.step(), a = q.action;
    if (s >= 4) return WW.plain(q.title);
    const now = s === 0 ? T('qFindGiver') : s === 1 ? T('qTalkTo') + ' ' + WW.plain(q.contact.name)
      : s === 3 ? T('qReturn') + ' ' + WW.plain(q.giver.name)
        : a.type === 'find' ? WW.plain(a.hint) : a.type === 'fight' ? T('qBeat') + ' ' + WW.plain(a.name) : T('qTrade') + ' ' + WW.plain(a.trader.name);
    // Spanish: "vence a El Ladrón" -> "vence al Ladrón"
    return `📜 ${WW.plain(q.title)}: ${now.replace(/\ba El\b/, 'al')}`;
  };
  Q.log = () => {
    if (!Q.on()) return '';
    const q = WW.ep.quest, r = WW.run;
    const extra = q.action.type === 'fight' ? ` (${(r.questMissed || []).length} missed)` : q.action.type === 'trade' ? ` (${(r.tries.qtrader || 0) + 1} ${(r.tries.qtrader || 0) ? 'tries' : 'try'})` : '';
    return `QUEST: ${WW.plain({ en: q.title.en })} — ${Q.done() ? 'done' : 'not finished'}${extra}`;
  };
})();

/* foes.js */
/* WORLDWALKER engine · the Grump's helpers: the bad guys that roam each map (1 to 3 per map)
   An episode lists them in smudges: [[x, y], [x, y, 'bat'], ...]. Without a type, the realm picks a fitting mix.
     grump  Grumpling   – wanders, and sometimes flies into a rage and charges (1 star)
     bat    Ink Bat     – fast and twitchy, flies over water, trees and rocks (1 star)
     blob   Mud Blob    – slow but stubborn: it takes 2 stars
     whirl  Dust Devil  – zooms in straight lines and bounces off walls (1 star) */
(function () {
  const { SPR } = WW;
  WW.FOES = {
    grump: { hp: 1, ms: 650, fly: false, name: { en: 'Grumpling', es: 'Gruñoncito', fa: 'غرغروی کوچک' } },
    bat: { hp: 1, ms: 230, fly: true, name: { en: 'Ink Bat', es: 'Murciélago de Tinta', fa: 'شب‌پرهٔ رنگ' } },
    blob: { hp: 2, ms: 1050, fly: false, name: { en: 'Mud Blob', es: 'Bola de Lodo', fa: 'گلولهٔ گِل' } },
    whirl: { hp: 1, ms: 170, fly: false, name: { en: 'Dust Devil', es: 'Remolino de Polvo', fa: 'گردباد خاک' } }
  };
  // which helpers live in each realm (the first spot on every map is always a Grumpling)
  WW.REALM_FOES = { 1: ['bat', 'blob'], 2: ['bat', 'whirl'], 3: ['whirl', 'bat'], 4: ['whirl', 'blob'], 5: ['whirl', 'bat'], 6: ['blob', 'bat'], 7: ['bat', 'whirl'], 8: ['blob', 'whirl'] };
  WW.foeType = (ep, i) => {
    const s = (ep.smudges || [])[i] || [];
    if (s[2] && WW.FOES[s[2]]) return s[2];
    if (i === 0) return 'grump';
    const list = WW.REALM_FOES[ep.realm || +String(ep.id)[0]] || ['bat', 'blob'];
    return list[(i - 1) % list.length];
  };

  SPR.bat = [ // wings up
    '................', '................', 'kk............kk', 'kGk..........kGk', 'kGGk..k..k..kGGk', 'kGGGkkgkkgkkGGGk',
    '.kGGGggggggGGGk.', '..kGgEeggeEgGk..', '...kggggggggk...', '....kgmtmtgk....', '.....kggggk.....', '......kkkk......',
    '................', '................', '................', '................'];
  SPR.batDown = [ // wings down
    '................', '................', '................', '................', '......k..k......', '.....kgkkgk.....',
    '....kggggggk....', '...kgEeggeEgk...', '..kGggggggggGk..', '.kGGkmtmtmkGGk..', 'kGGk.kggggk.kGGk', 'kGk...kkkk...kGk',
    'kk............kk', '................', '................', '................'];
  SPR.blob = [
    '................', '................', '................', '................', '......kkkk......', '....kkggggkk....',
    '...kggggggggk...', '..kgggEgggEggk..', '..kggEegggeEgk..', '.kggggggggggggk.', '.kgggmmmmmmgggk.', '.kggggggggggggk.',
    'kGgggggggggggGGk', 'kGGGgggggggGGGGk', '.kkkkkkkkkkkkkk.', '................'];
  SPR.whirl = [
    '................', '..kkkkkkkkkkkk..', '.kggggggggggggk.', '..kGGGGGGGGGGk..', '...kggggggggk...', '....kgEggEgk....',
    '....kGGGGGGk....', '.....kggggk.....', '.....kGmmGk.....', '......kggk......', '......kGGk......', '.......kk.......',
    '......k.........', '.......k........', '................', '................'];
  // colors for each helper
  WW.FOE_PAL = {
    grump: null,
    bat: { g: '#4a3a6e', G: '#2a1f45', E: '#ffe08a', e: '#ff3b2f', m: '#170c22', t: '#f4efe0' },
    blob: { g: '#6fae2a', G: '#3f6e16', E: '#ffffff', e: '#d4153a', m: '#1c3008' }, // a bright green slime
    whirl: { g: '#e2683a', G: '#9e3418', E: '#ffffff', e: '#2b0d06', m: '#4a1404' }  // a red-orange dust devil
  };
  // draw one helper on the map
  WW.drawFoe = (c, e, x, y, t, rage) => {
    const pal = Object.assign({}, WW.FOE_PAL[e.type] || {}, rage ? { g: '#a8323a', G: '#6e1c24', e: '#fff070' } : {}, e.hurtT && t - e.hurtT < 200 ? { g: '#ffffff', G: '#dddddd' } : {});
    if (e.type === 'bat') {
      const up = Math.floor(t / 110 + e.phase) % 2;
      WW.shadow(c, x, y + 15, 6);
      WW.sprite(c, up ? 'bat' : 'batDown', x, y - 4 + Math.round(Math.sin(t / 160 + e.phase) * 2), { pal });
    } else if (e.type === 'blob') {
      const sq = Math.round(Math.sin(t / 300 + e.phase));
      WW.shadow(c, x, y + 14, 12);
      if (e.hp < WW.FOES.blob.hp) { c.save(); c.translate(x + 8, y + 16); c.scale(0.8, 0.8); WW.sprite(c, 'blob', -8, -16 + sq, { pal }); c.restore(); }
      else WW.sprite(c, 'blob', x, y + sq, { pal });
    } else if (e.type === 'whirl') {
      const j = Math.round(Math.sin(t / 40) * 1.5);
      WW.shadow(c, x, y + 14, 6);
      WW.sprite(c, 'whirl', x + j, y, { pal, flip: Math.floor(t / 90) % 2 === 1 });
    } else {
      WW.shadow(c, x, y + 13, 8);
      WW.sprite(c, 'smudge', x, y, { bob: true, t, phase: e.phase, pal: rage ? { g: '#a8323a', G: '#6e1c24', e: '#fff070' } : (e.hurtT && t - e.hurtT < 200 ? { g: '#ffffff' } : null) });
    }
  };
})();

/* christopher.js */
/* WORLDWALKER engine · Christopher, the living compass who follows the hero
   - meets the student the first time they play an episode with christopher.meet (1.1)
   - drawn a little bigger with a soft glow; his name tag shows under him while you meet him
   - talks in a speech bubble over his head on the map (no timer: it stays until you tap it, press C, or walk away)
   - C (or the 🧭 button) asks him "What do I do next?" and opens his hint shop */
(function () {
  const L = t => WW.L(t), T = k => WW.T(k), esc = s => WW.esc(s);
  const $ = id => document.getElementById(id);
  const C = WW.chris = { scene: false };
  let bubble = null, tag = null, said = null, saidAt = null, meetT = 0;

  // "Christopher: «...»" -> just the words, for his bubble
  const words = t => {
    const s = typeof t === 'string' ? t : L(t), m = s.match(/^\s*(Christopher|کریستوفر)\s*[:：]\s*/);
    return m ? s.slice(m[0].length).replace(/^[«"“]\s*|\s*[»"”]$/g, '') : s;
  };

  function el() {
    if (!bubble || !bubble.isConnected) {
      bubble = document.createElement('div'); bubble.className = 'cbubble'; bubble.setAttribute('role', 'status');
      $('ww-screen').appendChild(bubble);
      bubble.addEventListener('click', e => { if (e.target.closest('button')) return; if (C.scene) C.next(); else C.hide(); });
    }
    return bubble;
  }
  C.hide = () => { if (bubble) bubble.style.display = 'none'; if (tag) tag.style.display = 'none'; said = null; };
  C.showing = () => !!(bubble && bubble.style.display === 'block');

  /* say something over his head. buttons: [{ label, kind, fn }] */
  C.say = (text, buttons) => {
    const b = el(); b.setAttribute('dir', WW.dir());
    b.classList.toggle('meet', C.scene);
    b.innerHTML = `<div class="cb-name">🧭 ${esc(T('chrisName'))}</div><div class="cb-say">${WW.rich(words(text))}</div>`;
    if (buttons && buttons.length) {
      const row = document.createElement('div'); row.className = 'cb-acts';
      buttons.forEach(o => { const x = WW.btn(o.label, 'cb ' + (o.kind || ''), e => { e.stopPropagation(); o.fn(); }); row.appendChild(x); });
      b.appendChild(row);
    }
    b.style.display = 'block'; said = text;
    const p = WW.game.player; saidAt = p ? [p.x, p.y] : null;
    WW.sfx('blip');
    C.place();
  };

  /* keep the bubble over his head (called every frame) */
  C.place = () => {
    if (!C.showing()) return;
    const g = WW.game, cv = $('ww-cv'); if (!g.pip || !cv) return;
    const [sx, sy] = g.screenOf(g.player.x, g.player.y), pip = g.pip;
    const scale = cv.getBoundingClientRect().width / cv.width, sr = $('ww-screen').getBoundingClientRect(), cr = cv.getBoundingClientRect();
    const px = ((pip.dx ?? (pip.x - sx * 16) * 16) + 9) * scale + (cr.left - sr.left), py = ((pip.dy ?? (pip.y - sy * 11) * 16) - 8) * scale + (cr.top - sr.top);
    const w = bubble.offsetWidth, h = bubble.offsetHeight;
    bubble.style.left = Math.max(6, Math.min(sr.width - w - 6, px - w / 2)) + 'px';
    const above = py - h - 10;
    bubble.style.top = Math.max(4, Math.min(sr.height - h - 4, above > 4 ? above : py + 34 * scale)) + 'px'; // never off the screen
    bubble.classList.toggle('below', above <= 4);
    if (C.scene) { // his name, crisp, under him while you meet him
      if (!tag || !tag.isConnected) { tag = document.createElement('div'); tag.className = 'ctag'; $('ww-screen').appendChild(tag); }
      tag.textContent = T('chrisName'); tag.style.display = 'block';
      tag.style.left = px + 'px'; tag.style.top = (py + 30 * scale) + 'px';
    } else if (tag) tag.style.display = 'none';
    // walked away: the bubble goes (no timer)
    if (!C.scene && saidAt && !bubble.querySelector('button') && Math.abs(g.player.x - saidAt[0]) + Math.abs(g.player.y - saidAt[1]) > 6) C.hide();
  };

  /* ---------------- meeting him ---------------- */
  let lines = [], li = 0, after = null;
  C.meet = (ls, done) => {
    lines = ls; li = 0; after = done; C.scene = true; meetT = performance.now(); WW.paused = true;
    const g = WW.game; g.pip.fly = { t0: performance.now(), from: [-20, -20] };
    setTimeout(() => C.next(true), WW.calm ? 50 : 900);
  };
  C.next = (first) => {
    if (!C.scene) return;
    if (!first) li++;
    if (li >= lines.length) return C.end();
    C.say(lines[li], [{ label: (li < lines.length - 1 ? T('next') : T('cont')) + ' ▶', kind: 'gold', fn: () => C.next() }]);
  };
  C.end = () => {
    C.scene = false; C.hide(); WW.paused = false;
    WW.save.metChris = true; WW.store();
    if (WW.game.pip) WW.game.pip.fly = null;
    const d = after; after = null; d && d();
    WW.toastPump && WW.toastPump();
  };
  C.skip = () => { if (C.scene) C.end(); }; // for the play-tests

  /* ---------------- "What do I do next?" ---------------- */
  const DIRS = ['n', 'ne', 'e', 'se', 's', 'sw', 'w', 'nw'];
  C.dirWord = (fx, fy, tx, ty) => {
    const dx = tx - fx, dy = ty - fy;
    if (Math.abs(dx) + Math.abs(dy) <= 1) return null; // right next to it
    const a = (Math.atan2(dx, -dy) * 180 / Math.PI + 360 + 22.5) % 360;
    return T('dir_' + DIRS[Math.floor(a / 45)]);
  };
  const go = (at) => { const p = WW.game.player, d = at && C.dirWord(p.x, p.y, at[0], at[1]); return !at ? '' : d ? T('goDir').replace('{d}', d) : T('dirHere'); };
  C.go = go;
  // can the hero walk there now? (a broken bridge might be in the way)
  function reachable(at) {
    const g = WW.game, [W, H] = g.size, seen = new Set(), q = [[g.player.x, g.player.y]];
    seen.add(q[0].join());
    while (q.length) {
      const [x, y] = q.shift();
      if (Math.abs(x - at[0]) + Math.abs(y - at[1]) <= 1) return true;
      for (const [dx, dy] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
        const nx = x + dx, ny = y + dy, k = nx + ',' + ny;
        if (nx < 0 || ny < 0 || nx >= W || ny >= H || seen.has(k) || WW.solid(g.tileAt(nx, ny))) continue;
        seen.add(k); q.push([nx, ny]);
      }
    }
    return false;
  }
  C.nextStep = () => {
    const ep = WW.ep, r = WW.run, g = WW.game, near = list => list.sort((a, b) => Math.abs(a.x - g.player.x) + Math.abs(a.y - g.player.y) - Math.abs(b.x - g.player.x) - Math.abs(b.y - g.player.y))[0];
    let text, at = null;
    if (r.bossDone) { at = ep.boss.at; text = T('nsPage'); }
    else {
      const left = g.ents.filter(e => e.kind === 'npc' && !r.talked.has(e.ref.id));
      if (left.length) { const n = near(left).ref; at = [n.x, n.y]; text = T('nsTalk').replace('{n}', WW.plain(n.name)).replace('{r}', WW.plain(n.role)); }
      else if (WW.quest.on() && !WW.quest.done()) {
        const q = ep.quest, st = WW.quest.step(), a = q.action;
        at = st === 0 || st === 3 ? [q.giver.x, q.giver.y] : st === 1 ? [q.contact.x, q.contact.y] : a.type === 'fight' ? a.at : a.type === 'trade' ? [a.trader.x, a.trader.y] : null;
        text = st === 2 && a.type === 'find' ? T('nsFind').replace('{h}', WW.plain(a.hint)) : WW.quest.bar().replace(/^📜\s*/, '');
      } else if (!r.challengeDone) { at = WW.world.next() || ep.challenge.at; text = WW.world.nextText() || WW.tools.signText() || T('nsStone'); }
      else { at = ep.boss.at; text = T('nsBoss'); }
    }
    // a broken bridge in the way? say so first
    const fix = at && WW.tools && WW.tools.blockingRepair ? WW.tools.blockingRepair(at, reachable) : null;
    if (fix) return { text: fix.text, at: fix.at };
    return { text: text + (at ? ' ' + go(at) : ''), at };
  };

  /* C: talk to him */
  C.talk = () => {
    if (C.scene) return C.next();
    if (WW.paused) return;
    if (C.showing() && said === 'next') return C.hide();
    const ns = C.nextStep();
    const way = WW.game.wayUntil && performance.now() < WW.game.wayUntil;
    C.say(ns.text, [
      ...(ns.at && !way ? [{ label: '🧭 ' + T('showWay') + ' · 5 ●', kind: 'gold', fn: buyWay }] : []),
      { label: '✕', kind: 'ghost', fn: () => C.hide() }]);
    said = 'next';
  };
  function buyWay() {
    if ((WW.save.coins || 0) < 5) return C.say(T('noCoins5'));
    WW.spend(5); WW.ui.hud(); WW.game.wayUntil = performance.now() + 30000;
    WW.sfx('coin'); C.say(T('wayOn'));
  }

  /* draw him: a little bigger than before, with a soft glow, and his name while you meet him */
  C.draw = (c, x, y, t) => {
    const k = (Math.sin(t / 400) + 1) / 2;
    c.fillStyle = `rgba(255,236,150,${0.18 + k * 0.14})`; c.beginPath(); c.arc(x + 8, y + 8, 11 + k * 2, 0, 7); c.fill();
    WW.shadow(c, x - 1, y + 15, 8);
    c.save(); c.translate(x + 8, y + 8); c.scale(1.25, 1.25);
    WW.sprite(c, 'pip', -8, -8 + Math.round(Math.sin(t / 260 + 1)), {});
    c.restore();
  };
})();

/* tools.js */
/* WORLDWALKER engine · the tool bar and building (an episode turns it on with tools: ['axe', 'sickle'])
   1 ★ stars · 2 axe (small trees and bushes -> wood) · 3 sickle (tall grass -> fiber, sometimes a seed or a coin; ripe crops -> coins)
   4 seeds (plant on farm soil) · 5 signposts (while you carry them). Space uses the tool on the tile you face.
   Chopped trees and cut grass grow back. Border trees never get cut.
   build: [...] in the episode lists what can be built (see docs/EPISODE-FORMAT.md): kind 'repair' (fix a broken thing with wood)
   or kind 'signpost' (put a sign where its directions point; a wrong spot explains why, and you can pick the sign up again). */
(function () {
  const L = t => WW.L(t), T = k => WW.T(k), esc = s => WW.esc(s);
  const $ = id => document.getElementById(id);
  const X = WW.tools = {};
  const G = () => WW.game;
  // what the axe and sickle work on: tile -> [what it gives, how many, what is left, seconds to grow back]
  const CHOP = { T: ['wood', 2, '%', 180], P: ['wood', 2, '%', 180], a: ['wood', 2, '%', 180], Y: ['wood', 1, '.', 150] };
  const CUT = { '"': ['fiber', 1, '.', 60] };
  const SLOTS = ['star', 'axe', 'sickle', 'seed', 'sign'];
  let sel = 'star', regrow = [], told = {}, bar = null;

  X.on = () => !!(WW.ep && WW.ep.tools && WW.ep.tools.length);

  /* ---------------- the bag (saved with the hero: got and used, like coins, so spent wood never comes back) ---------------- */
  X.have = item => { const b = (WW.save.bag || {})[item]; return b ? (b.got || 0) - (b.used || 0) : 0; };
  X.add = (item, n) => {

/* world.js */
/* WORLDWALKER engine · the compass stone moved into the world, and the earned tools' secrets
   Challenge types that happen on the map (the card version is always one tap away: "Use cards instead"):
     carry  – (sort in the world) carry each card to the right marked area      -> tools.js (like the 1.1 signposts)
     route  – (order in the world) visit the stops in the right order
     site   – (claim in the world) visit each site, then plant the flag and say why
     survey – (table in the world) visit each survey post to read its facts, then answer
     levers – (combo in the world) pull the levers on the map, then test them at the stone
   Each one adds spots: [[x, y], ...] to the challenge: one map spot per item, option, table row or switch, in the same order.
   secret: { tool, at: [x, y], text } — a chest only an earned tool reaches: the Canoe paddles on rivers (~), the Sail crosses
   deep water (=) too, and every other tool opens a tool gate (G) on the map. Optional: a required path never needs a tool. */
(function () {
  const L = t => WW.L(t), T = k => WW.T(k), esc = s => WW.esc(s);
  const Wd = WW.world = {};
  const G = () => WW.game;
  Wd.BASE = { carry: 'sort', route: 'order', site: 'claim', survey: 'table', levers: 'combo', build: null };
  Wd.isWorld = ch => !!(ch && ch.type in Wd.BASE);
  const tool = () => WW.ep && WW.ep.secret && WW.TOOLS.find(t => t.id === WW.ep.secret.tool);

  /* ---------------- things on the map ---------------- */
  // spots: [[x, y], ...] — one map spot for each item (route), option (site), table row (survey) or switch (levers)
  Wd.norm = (ch) => {
    const list = ch.type === 'route' ? ch.items : ch.type === 'site' ? ch.options : ch.type === 'levers' ? ch.switches : null;
    if (list) list.forEach((o, i) => { o.at = o.at || (ch.spots || [])[i]; });
  };
  Wd.ents = (ep) => {
    const ch = ep.challenge, out = []; Wd.norm(ch);
    if (ch.type === 'route') ch.items.forEach((it, i) => out.push({ kind: 'stop', x: it.at[0], y: it.at[1], i }));
    if (ch.type === 'site') ch.options.forEach((o, i) => out.push({ kind: 'site', x: o.at[0], y: o.at[1], i }));
    if (ch.type === 'survey') ch.spots.forEach((p, i) => out.push({ kind: 'survey', x: p[0], y: p[1], i }));
    if (ch.type === 'levers') ch.switches.forEach((s, i) => out.push({ kind: 'lever', x: s.at[0], y: s.at[1], i }));
    if (ep.secret) out.push({ kind: 'chest', x: ep.secret.at[0], y: ep.secret.at[1] });
    return out;
  };
  Wd.KINDS = ['stop', 'site', 'survey', 'lever', 'chest'];
  Wd.setup = (ep) => {
    const r = WW.run, ch = ep.challenge;
    r.worldOn = false; r.route = 0; r.seen = new Set(); r.levers = ch.type === 'levers' ? ch.switches.map(s => s.start || 0) : null;
  };

  /* the earned tools: canoe on rivers, sail on deep water, the episode's tool gate */
  Wd.pass = ch => {
    if (ch === '~') return WW.hasTool('canoe') || WW.hasTool('sail');
    if (ch === '=') return WW.hasTool('sail');

    return true;
  };

  /* ---------------- the stone ---------------- */
  const cards = ch => () => { const h = WW.ui.top(); if (h) h.close(); WW.challenge(Object.assign({}, ch, { type: Wd.BASE[ch.type] })); };
  function stonePanel(ch, how, extra, go) {
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        box.innerHTML = `<h3>🧭 ${esc(L(ch.title))}</h3><p class="say">${WW.rich(ch.intro)}</p><p class="say"><b>${esc(T(how))}</b></p>${extra ? extra() : ''}`;
        const acts = document.createElement('div'); acts.className = 'acts';
        if (go) acts.appendChild(WW.btn(go.label, 'gold', () => { h.close(); go.fn(); }));
        else acts.appendChild(WW.btn(T('close'), 'gold', () => h.close()));
        if (!WW.run.challengeDone) acts.appendChild(WW.btn(esc(T('sgCards')), 'ghost small', cards(ch)));
        box.appendChild(acts);
      }
    });
  }
  Wd.stone = (ch) => {

    const start = () => { r.worldOn = true; WW.chris.say(T('w_' + ch.type + 'Go')); };

    if (ch.type === 'site') return stonePanel(ch, 'w_siteHow', () => `<p class="small">${esc(T('w_siteSeen').replace('{n}', r.seen.size).replace('{m}', ch.options.length))}</p>`, r.worldOn ? null : { label: '🚩 ' + esc(T('wStart')), fn: start });
    if (ch.type === 'survey') {

    }
    if (ch.type === 'levers') {

  };

  /* ---------------- walking into the things ---------------- */

    if (!r.worldOn) { WW.chris.say(T('wStoneFirst')); WW.sfx('bad'); return; }
    if (e.kind === 'stop') {

      if (e.i < r.route) return WW.chris.say(`✅ ${WW.plain(it.t)}`);
      if (e.i === r.route) {

        if (r.route >= ch.items.length) { WW.challengeSolved(ch); WW.chris.say(`🎉 ${L(ch.success)}`); return; }
        WW.chris.say(`✅ ${r.route}. ${WW.plain(it.t)}. ${T('w_routeNext')}`);
      } else {
        r.challengeTries++; WW.sfx('bad'); g.shake();
        WW.chris.say(`❌ ${T('w_routeWrong')} ${L(ch.why || '')}`);

      return;
    }
    if (e.kind === 'site') {
      const o = ch.options[e.i];
      r.seen.add(e.i); WW.sfx('blip');
      if (r.seen.size < ch.options.length) {
        return WW.ui.message(`🚩 ${WW.plain(o.name)}`, `${o.desc ? L(o.desc) + ' ' : ''}${T('w_siteMore').replace('{n}', ch.options.length - r.seen.size)}`);
      }

    }
    if (e.kind === 'survey') {
      const row = ch.table.rows[e.i]; r.seen.add(e.i); WW.sfx('blip');
      const tbl = `<table class="dtbl"><tr>${ch.table.head.map(c => `<th>${WW.rich(c)}</th>`).join('')}</tr><tr>${row.map(c => `<td>${WW.rich(c)}</td>`).join('')}</tr></table>`;
      const left = ch.spots.length - r.seen.size;
      return WW.ui.open({
        cls: 'msgov',
        render(box, h) {
          box.innerHTML = `<h3>📋 ${esc(T('w_surveyPost'))}</h3><div class="tblwrap">${tbl}</div><p class="say">${esc(left ? T('w_surveyLeft').replace('{n}', left) : T('w_surveyAll'))}</p>`;
          const a = document.createElement('div'); a.className = 'acts'; a.appendChild(WW.btn(T('cont') + ' ▶', 'gold', () => h.close())); box.appendChild(a);
        }
      });
    }
    if (e.kind === 'lever') {
      const s = ch.switches[e.i];
      r.levers[e.i] = (r.levers[e.i] + 1) % s.states.length; WW.sfx('pop'); g.shake();
      WW.chris.say(`${s.icon || '🕹️'} ${WW.plain(s.name)}: <b>${esc(WW.plain(s.states[r.levers[e.i]]))}</b>. ${T('w_leverTest')}`);
    }
  };
  function testLevers(ch) {
    const r = WW.run, key = r.levers.join(','), res = ch.results[key] || ch.otherwise || { ok: false, t: '' };
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        box.innerHTML = `<h3>🕹️ ${esc(L(ch.title))}</h3><ul class="signlist">${ch.switches.map((s, i) => `<li>${s.icon || ''} <b>${WW.rich(s.name)}</b>: ${WW.rich(s.states[r.levers[i]])}</li>`).join('')}</ul>`;
        if (res.show) box.insertAdjacentHTML('beforeend', `<div class="outs">${res.show.map(o => `<span class="out ${o.ok ? 'good' : 'badp'}">${o.icon || ''} ${WW.rich(o.t)}</span>`).join('')}</div>`);
        box.insertAdjacentHTML('beforeend', `<div class="fb ${res.ok ? 'right' : 'wrong'}"><b>${esc(T(res.ok ? 'right' : 'wrong'))}</b> ${WW.rich(res.t || '')}</div>`);
        const a = document.createElement('div'); a.className = 'acts';
        a.appendChild(WW.btn(T(res.ok ? 'cont' : 'close') + ' ▶', 'gold', () => { h.close(); if (res.ok) WW.chris.say(`🎉 ${L(ch.success)}`); }));
        if (!res.ok) { a.appendChild(WW.btn(esc(T('sgCards')), 'ghost small', cards(ch))); box.insertAdjacentHTML('beforeend', `<p class="small">${esc(T('w_leverAgain'))}</p>`); }
        box.appendChild(a);
      }
    });
    r.challengeTries++;
    if (res.ok) WW.challengeSolved(ch); else WW.sfx('bad');
  }

  /* the secret chest */
  function openChest(e) {

    if (s.secrets.includes(ep.id)) return WW.chris.say(`${t ? t.icon + ' ' : ''}${L(ep.secret.text)}`);
    s.secrets.push(ep.id); WW.store(); WW.sheetSync && WW.sheetSync();

    WW.gain(null, 0, 5, T('why_secret'), true);
    WW.toast(`🎁 +5 ● ${esc(T('why_secret'))}`, '#c08a1e');

  }

  /* where to go next for the world challenge (Christopher and the arrow) */
  Wd.next = () => {
    const r = WW.run, ch = WW.ep.challenge;
    if (!r.worldOn || r.challengeDone) return null;
    if (ch.type === 'route') return ch.items[r.route].at;
    if (ch.type === 'site') { const i = ch.options.findIndex((_, k) => !r.seen.has(k)); return i < 0 ? null : ch.options[i].at; }
    if (ch.type === 'survey') { const i = ch.spots.findIndex((_, k) => !r.seen.has(k)); return i < 0 ? ch.at : ch.spots[i]; }

  Wd.nextText = () => {

      c.fillStyle = '#22202e'; c.fillRect(x + 3, y + 1, 10, 10); c.fillStyle = r.seen.has(e.i) ? '#d8f0d0' : '#fffbe8'; c.fillRect(x + 4, y + 2, 8, 8);
