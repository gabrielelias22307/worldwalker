<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worldwalker 8.3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Atkinson+Hyperlegible:wght@400;700&display=swap');
:root{
--bg:#141322; --panel:#1f1d33; --panel2:#29264a; --line:#3b3866; --text:#f3f1ff; --muted:#b9b5dc;
--gold:#f2c14e; --teal:#2aa198; --red:#e04848; --paper:#fffbe8; --ink:#22202e;
--pix:'Press Start 2P', ui-monospace, monospace;
--read:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--read);font-size:17px;line-height:1.5}
button{font-family:inherit}
html.ww-game,html.ww-game body{height:100%;overflow:hidden}
.ww-frame{max-width:1200px;height:100vh;height:100dvh;margin:0 auto;padding:6px 8px;background:var(--bg);display:flex;flex-direction:column;gap:0}
.ww-frame:fullscreen{max-width:none}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-bottom:2px;position:relative}
.ww-frame>.ww-bar,.ww-frame>.hud,.ww-frame>.quest{width:100%;max-width:max(var(--gw,100%),min(100%,560px));margin-left:auto;margin-right:auto}
.ww-frame.narrow .stage>.toolbar{position:static;transform:none;margin:5px auto 0;width:max-content;max-width:100%}
.cbubble.dock{max-width:none}
.cbubble.dock::after{bottom:auto;top:-10px;left:var(--tx,50%);border:7px solid transparent;border-bottom-color:var(--ink);border-top:0}
.ww-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.ww-logo{font-family:var(--pix);font-size:12px;color:var(--gold);text-decoration:none;margin-right:auto}
.ww-bar button{font-size:13px;padding:5px 8px;background:var(--panel2);color:#fff;border:2px solid #000;border-radius:4px;cursor:pointer;line-height:1.3}
@media (max-width:820px){.ww-bar .lbl{display:none}.ww-bar button{padding:5px 7px}}
@media (max-width:520px){.ww-logo{display:none}.ww-bar{gap:4px;justify-content:center}.ww-bar .langs,.ww-bar .tools{gap:3px}.ww-bar button{font-size:12px;padding:4px 6px}}
.ww-bar .langs button.on{background:var(--gold);color:var(--ink);font-weight:700}
.ww-bar .langs,.ww-bar .tools{display:flex;gap:5px;flex-wrap:wrap}
.ww-preview{font-size:12px;font-weight:700;padding:5px 8px;background:var(--teal);color:#fff;border:2px solid #000;border-radius:4px;text-decoration:none}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;background:#0b0a14;padding:5px 10px;font-family:var(--pix);font-size:10px;border:3px solid #000;border-bottom:0;border-radius:6px 6px 0 0}
.hud-left,.hud-right{display:flex;align-items:center;gap:6px}
.hrt{color:var(--red);font-size:16px;line-height:1}
.hrt.empty{color:#4a2630}
.hud-coin{color:var(--gold);margin-left:6px}
.hud-mid{color:var(--muted);font-family:var(--read);font-weight:700;font-size:13px}
.meter{display:inline-flex;align-items:center;gap:2px}
.meter i{font-style:normal;font-size:12px}
.track{display:block;width:40px;height:9px;background:#2a2840;border:2px solid #000}
.track b{display:block;height:100%}
.quest{background:#0b0a14;border:3px solid #000;border-top:1px solid #2a2840;border-bottom:0;padding:3px 8px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;min-width:0}
.quest .qgoal{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.quest .qlist{background:var(--panel2);color:#fff;border:2px solid #000;border-radius:4px;font-size:13px;padding:1px 7px;cursor:pointer}
.qpop{position:absolute;z-index:7;left:8px;top:8px;max-width:calc(100% - 16px);background:rgba(11,10,20,.94);color:var(--text);border:3px solid #000;outline:2px solid var(--gold);border-radius:6px;padding:8px 12px;font-size:14px;line-height:1.5;display:none}
.qpop.on{display:block}
.qpop ol{margin:4px 0 0;padding-inline-start:20px}
.qpop .qdone{color:#7cc451}.qpop .qnow{color:#fff;font-weight:700}.qpop li{color:var(--muted)}
.quest b{color:var(--gold)}
.quest i{font-style:normal;color:#5a5680}
.quest .qnow{color:#fff;font-weight:700}
.quest .qdone{color:#7cc451}
.quest .qscr{color:#c9b064}
.screen{position:relative;background:#000;border:3px solid #000;outline:3px solid var(--line);border-radius:0 0 6px 6px;overflow:hidden;user-select:none;flex:none;width:100%}
.screen:focus{outline-color:var(--gold)}
.screen canvas#ww-cv{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.toast{position:absolute;right:10px;top:10px;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:5px;max-width:70%;pointer-events:none}
.toast .tst{color:#fff;font-weight:700;font-size:15px;padding:7px 11px;border:3px solid #000;border-radius:4px;animation:pop .2s ease-out}
.toast .tst.big{font-size:16px;padding:10px 14px;outline:3px solid #fff3b0;max-width:100%}
.toast .tst small{display:block;font-weight:400;font-size:13px;opacity:.95}
.defpop{position:absolute;z-index:9;max-width:300px;background:var(--ink);color:#fff;border:3px solid #ffe36e;border-radius:4px;padding:8px 12px;font-size:15px;line-height:1.4;display:none}
.defpop b{color:#ffe36e}
.ov{position:absolute;inset:0;z-index:5;overflow:auto;background:rgba(10,9,20,.55);padding:12px}
.ov.hidden{display:none}
.ov-box{background:var(--paper);color:var(--ink);border:4px solid var(--ink);outline:3px solid var(--paper);border-radius:4px;padding:14px 16px;max-width:760px;margin:0 auto}
.ov[dir=rtl] .ov-box{text-align:right}
.ov h2{margin:4px 0 6px;font-size:22px;line-height:1.25}
.ov h3{margin:12px 0 6px;font-size:17px;color:#7a3b12}
.ov h4{margin:10px 0 6px;font-size:15px;color:#5a4a7a}
.say{font-size:clamp(15px,1.8vw,18px);margin:6px 0}
.say.q{font-weight:700}
.say.taunt{font-style:italic;color:#4b3f63}
.hint,.small{font-size:13.5px;color:#5c5874;margin:4px 0}
.ov .small a{color:#2f6fd6}
.word{background:#ffe36e;border-bottom:2px dotted #7a3b12;padding:0 2px;cursor:help;border-radius:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.acts.center{justify-content:center}
.pbtn{font-size:14px;font-weight:700;padding:9px 14px;background:#29264a;color:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;min-height:42px}
.pbtn.gold{background:var(--gold);color:var(--ink)}
.pbtn.teal{background:var(--teal);color:#fff}
.pbtn.ghost{background:#fff;color:var(--ink)}
.pbtn.big{font-size:17px;padding:11px 22px}
.pbtn:disabled{opacity:.45;cursor:not-allowed}
.pbtn:focus-visible,.choices button:focus-visible,.card:focus-visible{outline:3px solid #2f6fd6;outline-offset:2px}
.choices{display:grid;gap:7px;margin-top:8px}
.choices.two{grid-template-columns:1fr 1fr}
@media (max-width:640px){.choices.two{grid-template-columns:1fr}}
.choices button{text-align:start;font-size:clamp(14px,1.6vw,16.5px);padding:9px 12px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);min-height:44px}
.choices button i{font-style:normal;font-weight:700;color:#7a3b12;margin-inline-end:6px}
.choices button.right{background:#d9f5dd;border-color:#1f7a3a}
.choices button.wrong{background:#fde2de;border-color:#b0392b}
.choices button:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:10px;padding:9px 12px;border-radius:4px;border:2px solid}
.fb.right{background:#e3f6e6;border-color:#1f7a3a;color:#174f27}
.fb.wrong{background:#fdeae6;border-color:#b0392b;color:#7a2318}
.err{color:#b0392b;font-weight:700;text-align:center}
.talk-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.talk-head .face{width:64px;height:44px;border:3px solid var(--ink);background:#cfe8ff;image-rendering:pixelated;flex:0 0 auto}
.who{font-weight:700;color:#7a3b12;font-size:16px}
.role{font-size:13.5px;color:#5c5874}
.startov .logo{font-family:var(--pix);color:#c08a1e;text-align:center;font-size:clamp(18px,4vw,30px);margin-top:4px}
.startov .sublogo{font-family:var(--pix);text-align:center;font-size:10px;color:#5a4a7a;margin:6px 0 10px}
.epcard{background:#f3e3b5;border:3px solid var(--ink);border-radius:4px;padding:8px 12px;text-align:center}
.epcard h2{margin:2px 0}
.epn{font-size:13px;font-weight:700;color:#5a4a7a}
.place{color:#5c5874}
.langrow{display:flex;gap:6px;justify-content:center;margin:10px 0}
.langrow .pbtn{min-height:36px;padding:6px 12px}
.wb{text-align:center;font-size:18px}
.signin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.signin h3{grid-column:1/-1;margin-bottom:0}
@media (max-width:640px){.signin{grid-template-columns:1fr}}
.signin label,.codein label{display:flex;flex-direction:column;font-size:13.5px;font-weight:700;gap:3px}
.ov input,.ov textarea{font:inherit;font-size:16px;padding:8px 10px;border:3px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);width:100%}
.ov textarea{resize:vertical;min-height:80px;margin-top:6px}
.looks{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.heroprev{border:3px solid var(--ink);background:#cfe8ff;image-rendering:pixelated;width:96px;height:96px}
.lrow{display:flex;align-items:center;gap:5px;margin:3px 0}
.lrow span{width:52px;font-size:13px;font-weight:700}
.sw{width:28px;height:28px;border:3px solid #fff;outline:2px solid var(--ink);border-radius:3px;cursor:pointer;padding:0}
.sw.on{border-color:#c08a1e;outline:3px solid #c08a1e}
.codein{display:flex;gap:8px;align-items:end;margin-top:12px;flex-wrap:wrap}
.codein label{flex:1;min-width:220px}
.pipface{float:right;image-rendering:pixelated;width:64px;height:64px;margin-inline-start:10px}
.ov[dir=rtl] .pipface{float:left}
.pp-top{display:flex;gap:14px;align-items:center}
.pp-hero{border:3px solid var(--ink);background:#cfe8ff;image-rendering:pixelated;width:90px;height:90px}
.pp-name{font-size:22px;font-weight:700}
.pp-nums{display:flex;gap:14px;flex-wrap:wrap;font-size:15px}
.powers{display:grid;gap:6px}
.pw{display:grid;grid-template-columns:30px 1fr 34px;gap:8px;align-items:center}
.pwi{font-size:20px}
.pwn{font-weight:700;text-align:end}
.bar{height:12px;border:2px solid var(--ink);background:#e9dfc0}
.bar b{display:block;height:100%}
.bag{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:520px){.bag{grid-template-columns:repeat(2,1fr)}}
.slot{border:3px solid #b7a77e;background:#e9dfc0;border-radius:4px;padding:6px;text-align:center;font-size:12.5px;color:#8a7c58}
.slot.has{background:#fff;border-color:var(--ink);color:var(--ink);font-weight:700}
.slot .ti{display:block;font-size:24px}
.stamps{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
@media (max-width:560px){.stamps{grid-template-columns:repeat(4,1fr)}}
.scol{display:flex;flex-direction:column;gap:4px;align-items:center;border:2px dashed #b7a77e;border-radius:4px;padding:4px}
.stamp{width:44px;height:44px;border-radius:50%;border:2px dashed #b7a77e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:#b7a77e;font-weight:700;line-height:1}
.stamp i{font-style:normal;font-size:8px;color:#c08a1e}
.stamp.on{border:3px solid var(--ink);color:#fff}
.stamp.on i{color:#fff}
.stamp.r1{background:#e04848}.stamp.r2{background:#2f7fd1}.stamp.r3{background:#8e5bd6}.stamp.r4{background:#d98e2b}
.stamp.r5{background:#c9a227}.stamp.r6{background:#3fa34d}.stamp.r7{background:#c0392b}.stamp.r8{background:#2aa198}
.coderow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pcode{font-family:var(--pix);font-size:12px;background:var(--ink);color:var(--gold);padding:8px 10px;border-radius:3px;letter-spacing:1px;direction:ltr;display:inline-block}
.ok{color:#1f7a3a;font-weight:700}.bad{color:#b0392b;font-weight:700}.pending{color:#5a4a7a;font-weight:700}
.ch-head{display:flex;gap:10px;align-items:flex-start}
.chface{image-rendering:pixelated;width:48px;height:48px;flex:0 0 auto}
.ch-head h3{margin-top:2px}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;min-height:10px}
.card{font-size:14.5px;padding:7px 10px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);text-align:start;line-height:1.3}
.card .ic{margin-inline-end:5px}
.card.sel{background:#ffe36e;border-color:#c08a1e;outline:2px solid #c08a1e}
.card.right{background:#d9f5dd;border-color:#1f7a3a}
.card.wrong{background:#fde2de;border-color:#b0392b}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.bins.bands{grid-template-columns:1fr}
.bin{border:3px dashed #8a7c58;border-radius:6px;padding:6px;background:#f6edd2;min-height:70px;cursor:pointer;overflow:hidden}
.bin.target{border-color:#c08a1e;background:#fff3c4}
.bins.bands .bin{min-height:54px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.bintile{grid-row:1/3;width:96px;height:32px;image-rendering:pixelated;border:2px solid var(--ink)}
.binlabel{font-weight:700;font-size:14.5px}
.binin{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.seq{padding-inline-start:26px;margin:8px 0;display:grid;gap:5px}
.seq li.card{cursor:default}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;gap:3px;text-align:start;padding:9px 11px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);font-size:14.5px}
.opt span{font-size:13.5px;color:#5c5874}
.opt.sel{background:#ffe36e;border-color:#c08a1e}
.kind,.sw-g{margin:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.klabel{width:100%;font-weight:700;font-size:14px;color:#5a4a7a}
.reason{font-size:14px;padding:7px 10px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);text-align:start}
.reason.sel{background:#ffe36e;border-color:#c08a1e}
.reason.right{background:#d9f5dd;border-color:#1f7a3a}
.reason.wrong{background:#fde2de;border-color:#b0392b}
.outs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.out{padding:5px 10px;border-radius:20px;border:2px solid;font-size:14px;font-weight:700}
.out.good{background:#d9f5dd;border-color:#1f7a3a;color:#174f27}
.out.badp{background:#fbe2c8;border-color:#b5651d;color:#7a3b12}
.tblwrap{overflow-x:auto}
.dtbl{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0}
.dtbl th,.dtbl td{border:2px solid var(--ink);padding:5px 8px;text-align:start}
.dtbl th{background:#f3e3b5}
.bossov .ov-box{background:#f1ecff}
.boss-top{display:flex;gap:14px;align-items:center}
.bossface{image-rendering:pixelated;width:90px;height:90px;background:#2b2140;border:3px solid var(--ink);border-radius:6px}
.bossface.hit{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bname{font-weight:700;font-size:19px;color:#4b3f63}
.shield{display:flex;gap:4px;margin:3px 0}
.shield span{width:44px;height:14px;border:2px solid var(--ink);background:#ddd}
.shield span.on{background:#8fc3ff}
.hearts .hrt{font-size:18px}
.fin-head{display:flex;gap:14px;align-items:center}
.pagebig canvas{image-rendering:pixelated;width:80px;height:80px;animation:glow 1.6s ease-in-out infinite;border-radius:6px}
@keyframes glow{50%{filter:drop-shadow(0 0 10px #f2c14e)}}
.stars{font-size:28px;color:#e0a81e;letter-spacing:3px}
.stars .dim{color:#d8cfb0}
.newtool{margin-top:8px;padding:8px 12px;background:#fff3c4;border:2px solid #c08a1e;border-radius:4px}
.learned{margin:4px 0;padding-inline-start:22px}
.starter{background:#ffe36e;border:2px solid #c08a1e;border-radius:4px;padding:5px 10px;font-size:14px;cursor:pointer;color:var(--ink)}
.top5{margin-top:10px;padding:8px 12px;background:#fff6d6;border:2px solid #d9b44a;border-radius:4px}
.top5 ol{list-style:none;margin:6px 0 4px;padding:0;display:grid;gap:3px}
.top5 li{display:grid;grid-template-columns:2em 1fr auto;gap:8px;align-items:center;padding:2px 8px;border-radius:4px;background:#fffbe8}
.top5 li.me{outline:2px solid #c58f12;font-weight:700}
.top5 .p{opacity:.8}
.savebox{margin-top:10px;padding:8px 12px;background:#efe8d2;border:2px solid #b7a77e;border-radius:4px;display:grid;gap:4px}
.dpad{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,44px);gap:4px;justify-content:center;margin:6px auto 0;touch-action:none;flex:none}
.dpad button{background:var(--panel2);color:#fff;border:3px solid #000;border-radius:8px;font-size:22px;cursor:pointer}
.dpad [data-d=up]{grid-column:2;grid-row:1}.dpad [data-d=left]{grid-column:1;grid-row:2}.dpad .act{grid-column:2;grid-row:2;background:var(--gold);color:var(--ink)}
.dpad [data-d=right]{grid-column:3;grid-row:2}.dpad [data-d=down]{grid-column:2;grid-row:3}
@media (pointer:coarse){.dpad{display:grid}}
.ww-foot{display:none}
@media (max-width:640px){
.track{width:22px}.hud{font-size:9px;padding:4px 6px}.hud-mid{display:none}
.ov{padding:6px}.ov-box{padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.ov.talkov,.ov.msgov{background:rgba(10,9,20,.18);display:flex;flex-direction:column;justify-content:flex-end}
.ov.talkov .ov-box,.ov.msgov .ov-box{width:100%;margin:0 auto}
.stamp{font-family:var(--read)}
.touch .dpad{display:grid}
.screen canvas#ww-cv{animation:fadein .7s ease-out}
@keyframes fadein{from{opacity:0;filter:brightness(2)}to{opacity:1;filter:none}}
.ov-box{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.bossface.crack{animation:flash .45s}
@keyframes flash{0%,60%{filter:brightness(2.4) saturate(.3)}30%{transform:scale(.9) rotate(-4deg)}100%{filter:none;transform:none}}
.shield span.cracked{animation:crack .6s ease-out;position:relative}
@keyframes crack{0%{background:#ffffff;transform:scale(1.25)}40%{background:#8fc3ff;transform:scale(1.1) rotate(6deg)}100%{background:#ddd;transform:none}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:7}
.confetti i{position:absolute;top:-12px;width:7px;height:10px;border-radius:1px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.9}}
.goals{background:#fff3c4;border:3px solid var(--ink);border-radius:6px;padding:8px 12px;margin:10px 0;text-align:start}
.goals ol{margin:6px 0 6px 22px;padding:0}.goals li{margin:2px 0}
[dir=rtl] .goals ol{margin:6px 22px 6px 0}
ul.earned{list-style:none;padding:0;margin:4px 0;display:grid;gap:3px}
ul.earned li{background:#f3eedc;border-radius:4px;padding:4px 8px}
.grow{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grow .gw{background:#f3eedc;border-radius:6px;padding:6px 9px}
.grow ul{list-style:none;padding:0;margin:4px 0 0}
.grow li{font-size:14px;color:#8a8370;margin:2px 0}.grow li.on{color:#1f6a2e;font-weight:700}
.hintbtn{font-size:14px!important}

vers at the compass stone.",es:"Prueba las palancas en la piedra brújula.",fa:"دسته‌ها را در سنگ قطب‌نما امتحان کن."},w_leverAgain:{en:"Change the levers on the map and test again.",es:"Cambia las palancas en el mapa y prueba otra vez.",fa:"دسته‌ها را روی نقشه عوض کن و دوباره امتحان کن."},gate_cloak:{en:"The monsoon rain is too heavy to walk through here. A Monsoon Cloak (Episode {e}) would keep you dry.",es:"La lluvia del monzón es demasiado fuerte para pasar por aquí. Una capa del monzón (episodio {e}) te mantendría seco.",fa:"باران موسمی این جا خیلی شدید است و نمی‌شود از آن گذشت. یک بارانی موسمی (قسمت {e}) تو را خشک نگه می‌دارد."},gate_key:{en:"This canal gate is locked. The Water Key (Episode {e}) opens it and lets the water through.",es:"Esta compuerta del canal está cerrada con llave. La llave del agua (episodio {e}) la abre y deja pasar el agua.",fa:"این دروازهٔ کانال قفل است. کلید آب (قسمت {e}) آن را باز می‌کند و آب را رد می‌کند."},gate_rail:{en:"A barrier blocks the tracks. Railway workers with a Rail Pass (Episode {e}) may go through.",es:"Una barrera cierra las vías. Pueden pasar quienes tengan un pase de tren (episodio {e}).",fa:"یک مانع خط آهن را بسته است. کسی که کارت قطار (قسمت {e}) دارد می‌تواند رد شود."},gateNeed:{en:"This gate opens for the {t} (you earn it in Episode {e}). Come back when you have it!",es:"Esta puerta se abre con {t} (lo ganas en el episodio {e}). ¡Vuelve cuando lo tengas!",fa:"این دروازه با {t} باز می‌شود (آن را در قسمت {e} می‌گیری). وقتی داشتی برگرد!"},secretFound:{en:"A secret!",es:"¡Un secreto!",fa:"یک راز!"},why_secret:{en:"secret found",es:"secreto encontrado",fa:"راز پیدا شد"},fogMore:{en:"The fog pulled back! {n} more right answer(s) to break the Grump's shield. Walk into the fog again.",es:"¡La niebla se retiró! Faltan {n} respuesta(s) correcta(s) para romper el escudo del Gruñón. Camina hacia la niebla otra vez.",fa:"مه عقب رفت! {n} جواب درست دیگر لازم است تا سپر غرغرو بشکند. دوباره به طرف مه برو."},fogLast:{en:"The fog is w it joins the neighbors instead of keeping them apart. When neighbors work together, both sides win.",es:"¡El puente de la amistad está listo! El río sigue siendo la frontera, pero ahora une a los vecinos en vez de separarlos. Cuando los vecinos trabajan juntos, los dos ganan.",fa:"پل دوستی ساخته شد! دریا هنوز سرحد است، اما حالا همسایه‌ها را به هم وصل می‌کند، نه اینکه از هم دور نگه دارد. وقتی همسایه‌ها با هم کار کنند، هر دو طرف برنده می‌شوند."}}],finds:[{clueAt:[4,12],at:[8,13],decor:"flower",clue:{en:"Rivers are often borders. Find the bridge farthest west on the river. Stand just north of it.",es:"Los ríos suelen ser fronteras. Busca el puente más al oeste del río. Párate justo al norte de él.",fa:"دریاها اکثراً سرحد هستند. غربی‌ترین پل دریا را پیدا کن. درست شمالِ آن بایست."},text:{en:"A river is a natural border, easy to see on maps, like the Rio Grande. A flower!",es:"Un río es una frontera natural, fácil de ver en los mapas, como el río Bravo. ¡Una flor!",fa:"دریا یک سرحد طبیعی است که روی نقشه آسان دیده می‌شود، مثل ریو گرانده. یک گل!"}},{clueAt:[32,2],at:[35,7],decor:"gem",clue:{en:"From this note, walk 3 steps east, then 5 steps south. Something is hidden there.",es:"Desde esta nota, camina 3 pasos al este y luego 5 pasos al sur. Algo está escondido allí.",fa:"از این یادداشت، ۳ قدم به شرق برو، بعد ۵ قدم به جنوب. چیزی آن جا پنهان است."},text:{en:"East is right, south is down. Much of the Egypt–Sudan border follows one line of latitude. A gem!",es:"El este está a la derecha y el sur abajo. Gran parte de la frontera Egipto–Sudán sigue una línea de latitud. ¡Una gema!",fa:"شرق راست و جنوب پایین است. بیشتر سرحد مصر و سودان یک خط عرض جغرافیایی را دنبال می‌کند. یک جواهر!"}}],secret:{tool:"sail",at:[45,18],text:{en:"Your sail carried you over deep water to a hidden island! The note in the chest says the Mekong River flows through six countries, so they all must share it.",es:"¡Tu vela te llevó por aguas profundas hasta una isla escondida! La nota del cofre dice que el río Mekong pasa por seis países, así que todos deben compartirlo.",fa:"بادبان تو را از آب‌های عمیق به یک جزیرهٔ پنهان برد! یادداشت داخل صندوق می‌گوید دریای میکانگ از شش کشور می‌گذرد، پس همه باید آن را با هم استفاده کنند."}},words:{border:{en:"a line that shows where one country ends and another begins",es:"una línea que muestra dónde termina un país y empieza otro",fa:"خطی که نشان می‌دهد یک کشور کجا تمام می‌شود و کشور دیگر کجا شروع می‌شود"},"natural border":{en:"a border that follows a river, a mountain range or a coastline",es:"una frontera que sigue un río, una cordillera o una costa",fa:"سرحدی که از یک دریا، رشته‌کوه یا ساحل پیروی می‌کند"},"geometric border":{en:"a straight-line border drawn by people that does not follow any river or mountain",es:"una frontera en línea recta dibujada por personas, que no sigue ningún río ni montaña",fa:"سرحد خط راست که مردم کشیده‌اند و از هیچ دریا یا کوهی پیروی نمی‌کند"},"boundary dispute":{en:"when two countries argue over where a border should be",es:"cuando dos países discuten sobre dónde debe estar una frontera",fa:"وقتی دو کشور دربارهٔ جای یک سرحد اختلاف دارند"},treaty:{en:"a written agreement between countries",es:"un acuerdo escrito entre países",fa:"یک توافق نوشته‌شده بین کشورها"},neutral:{en:"not on either side; fair to both",es:"que no está de ningún lado; justo con los dos",fa:"به طرف هیچ کس نیست؛ با هر دو طرف منصف است"},"united nations":{en:"a group where almost every country in the world meets to talk and work together",es:"un grupo donde casi todos los países del mundo se reúnen para hablar y trabajar juntos",fa:"سازمانی که تقریباً همهٔ کشورهای جهان در آن جمع می‌شوند تا گپ بزنند و با هم کار کنند"},"trade bloc":{en:"a group of countries that agree to make trade easier between them",es:"un grupo de países que acuerdan hacer más fácil el comercio entre ellos",fa:"گروهی از کشورها که توافق می‌کنند تجارت بین خود را آسان‌تر کنند"},upstream:{en:"closer to where a river starts",es:"más cerca de donde empieza un río",fa:"نزدیک‌تر به جایی که دریا شروع می‌شود"}},npcs:[{x:21,y:3,name:{en:"Rosa",es:"Rosa",fa:"روزا"},remember:{ep:"1.1",t:{en:"Look at you now! You put the village signposts back, found Grandpa Tomas's compass and won your very first atlas page.",es:"¡Mírate ahora! Volviste a poner los letreros del pueblo, encontraste la brújula del abuelo Tomás y ganaste tu primera página del atlas.",fa:"حالا خودت را ببین! تابلوهای ده را دوباره سر جایشان گذاشتی، قطب‌نمای پدرکلان توماس را پیدا کردی و اولین صفحهٔ اطلس خود را بردی."}},role:{en:"Mapmaker and host of the Council",es:"Cartógrafa y anfitriona del Consejo",fa:"نقشه‌کش و میزبان شورا"},look:{skin:2,hair:"#3a2a1a",shirt:"#c0392b"},lines:[{en:"Welcome to the Council Hall! It is me, Rosa, from Mapmaker's Valley.",es:"¡Bienvenido al Salón del Consejo! Soy yo, Rosa, del Valle del Cartógrafo.",fa:"به تالار شورا خوش آمدی! من هستم، روزا، از درهٔ نقشه‌کش."},{en:"Guests from all eight realms are here. Together we will finish the Great Atlas.",es:"Aquí hay invitados de los ocho reinos. Juntos terminaremos el Gran Atlas.",fa:"مهمانان هر هشت سرزمین اینجا هستند. با هم اطلس بزرگ را تمام می‌کنیم."},{en:"Countries sit inside [[border|borders]]. Most are calm, but neighbors who disagree must work together.",es:"Los países están dentro de [[border|fronteras]]. Casi todas son tranquilas, pero los vecinos que no están de acuerdo deben cooperar.",fa:"کشورها داخل [[border|سرحدها]] هستند. بیشتر آرام‌اند، اما همسایه‌هایی که موافق نیستند باید همکاری کنند."},{en:"The [[united nations|United Nations]] has 193 members. A [[trade bloc|trade bloc]], like the EU, eases trade.",es:"La [[united nations|ONU]] tiene 193 miembros. Un [[trade bloc|bloque comercial]], como la Unión Europea, facilita el comercio.",fa:"[[united nations|سازمان ملل متحد]] ۱۹۳ عضو دارد. یک [[trade bloc|گروه تجارتی]]، مثل اتحادیهٔ اروپا، تجارت را آسان می‌کند."}],ask:{stat:"reg",q:{en:"Why do countries join groups like the United Nations?",es:"¿Por qué los países se unen a grupos como las Naciones Unidas?",fa:"چرا کشورها به گروه‌هایی مثل سازمان ملل متحد می‌پیوندند؟"},choices:[{ok:true,t:{en:"To work together on shared problems",es:"Para trabajar juntos en problemas comunes",fa:"تا روی مشکلات مشترک با هم کار کنند"},why:{en:"Groups give countries a place to meet, talk and solve problems together.",es:"Los grupos dan a los países un lugar para reunirse, hablar y resolver problemas juntos.",fa:"گروه‌ها به کشورها جایی برای دیدار، گپ زدن و حل مشکلات با هم می‌دهند."}},{t:{en:"To erase all the borders in the world",es:"Para borrar todas las fronteras del mundo",fa:"تا همهٔ سرحدهای جهان را پاک کنند"},why:{en:"Member countries keep their own borders. They work together across them.",es:"Los países miembros mantienen sus fronteras. Trabajan juntos a través de ellas.",fa:"کشورهای عضو سرحدهای خود را نگه می‌دارند. از دو طرف سرحد با هم کار می‌کنند."}},{t:{en:"To make every country exactly the same",es:"Para que todos los países sean exactamente iguales",fa:"تا همهٔ کشورها دقیقاً یک‌رقم شوند"},why:{en:"Each country keeps its own language, laws and ways. They just cooperate.",es:"Cada país mantiene su idioma, sus leyes y sus costumbres. Solo cooperan.",fa:"هر کشور زبان، قانون و رسم خود را نگه می‌دارد. فقط با هم همکاری می‌کنند."}}]}},{x:6,y:5,name:{en:"Camila Rojas",es:"Camila Rojas",fa:"کامیلا روخاس"},role:{en:"Mountain guide from Chile",es:"Guía de montaña de Chile",fa:"رهنمای کوه از چیلی"},look:{skin:2,hair:"#2b1d14",shirt:"#d64545",pants:"#3a3a3a",hat:"#2f6fd6"},lines:[{en:"¡Hola! I guide hikers in the Andes. They are part of the Chile–Argentina border.",es:"¡Hola! Guío excursionistas en los Andes. Son parte de la frontera entre Chile y Argentina.",fa:"اولا! من رهنمای کوه‌پیمایان در اندیز هستم. اندیز بخشی از سرحد چیلی و ارجنتاین است."},{en:"A [[natural border|natural border]] follows a mountain range, a river or a coastline.",es:"Una [[natural border|frontera natural]] sigue una cordillera, un río o una costa.",fa:"[[natural border|سرحد طبیعی]] از یک رشته‌کوه، دریا یا ساحل پیروی می‌کند."},{en:"The Rio Grande is part of the US–Mexico border. Some Great Lakes border Canada.",es:"El río Bravo es parte de la frontera entre EE. UU. y México. Algunos Grandes Lagos son frontera con Canadá.",fa:"دریای ریو گرانده بخشی از سرحد امریکا و مکسیکو است. بعضی جهیل‌های بزرگ سرحد کانادا هستند."},{en:"Japan's coast is its border. Rivers can move, and mountain tops are hard to measure.",es:"La costa de Japón es su frontera. Los ríos se mueven y las cimas son difíciles de medir.",fa:"ساحل جاپان سرحد آن است. دریا ممکن است راهش را تغییر دهد و اندازه کردن سر کوه سخت است."}],ask:{stat:"pla",q:{en:"Which one is a natural border?",es:"¿Cuál es una frontera natural?",fa:"کدام یک سرحد طبیعی است؟"},choices:[{ok:true,t:{en:"The Andes between Chile and Argentina",es:"Los Andes entre Chile y Argentina",fa:"اندیز بین چیلی و ارجنتاین"},why:{en:"It follows a mountain range, so it is natural.",es:"Sigue una cordillera, así que es natural.",fa:"از یک رشته‌کوه پیروی می‌کند، پس طبیعی است."}},{t:{en:"A straight line drawn with a ruler on a map",es:"Una línea recta dibujada con una regla en un mapa",fa:"یک خط راست که با خط‌کش روی نقشه کشیده شده"},why:{en:"A straight line drawn by people is a geometric border.",es:"Una línea recta dibujada por personas es una frontera geométrica.",fa:"خط راستی که مردم کشیده‌اند سرحد هندسی است."}},{t:{en:"A line chosen by drawing names from a hat",es:"Una línea elegida sacando nombres de un sombrero",fa:"خطی که با قرعه‌کشی انتخاب شده"},why:{en:"Borders are not chosen that way, and this has nothing to do with nature.",es:"Las fronteras no se eligen así, y esto no tiene nada que ver con la naturaleza.",fa:"سرحدها این‌طور انتخاب نمی‌شوند و این هیچ ربطی به طبیعت ندارد."}}]}},{x:37,y:6,name:{en:"Mr. Kwame Mensah",es:"Sr. Kwame Mensah",fa:"استاد کوامی منسا"},role:{en:"History teacher from Ghana",es:"Maestro de historia de Ghana",fa:"معلم تاریخ از غانا"},look:{skin:5,hair:"#1b1410",shirt:"#2e8b57",pants:"#3b2f2f"},lines:[{en:"Akwaaba! I teach history in Ghana. Many borders on a map of Africa are straight.",es:"¡Akwaaba! Enseño historia en Ghana. Muchas fronteras en un mapa de África son rectas.",fa:"اکوابا! من در غانا تاریخ درس می‌دهم. بسیاری از سرحدهای روی نقشهٔ افریقا راست هستند."},{en:"A straight line drawn by people, not following nature, is a [[geometric border|geometric border]].",es:"Una línea recta dibujada por la gente, sin seguir la naturaleza, es una [[geometric border|frontera geométrica]].",fa:"خط راستی که مردم کشیده‌اند و از طبیعت پیروی نمی‌کند [[geometric border|سرحد هندسی]] است."},{en:"In the late 1800s, Europeans drew many with a ruler. Some villages were split.",es:"A fines del siglo XIX, los europeos dibujaron muchas con regla. Algunas aldeas quedaron partidas.",fa:"در اواخر دههٔ ۱۸۰۰، اروپایی‌ها بسیاری را با خط‌کش کشیدند. بعضی قریه‌ها تقسیم شدند."},{en:"Old maps, history or resources can start a [[boundary dispute|boundary dispute]], like China and India's.",es:"Mapas viejos, la historia o los recursos pueden causar una [[boundary dispute|disputa fronteriza]], como la de China e India.",fa:"نقشه‌های کهنه، تاریخ یا منابع می‌توانند [[boundary dispute|اختلاف سرحدی]] شروع کنند، مثل چین و هند."}],ask:{stat:"loc",q:{en:"Why do some borders in Africa cut through villages and family land?",es:"¿Por qué algunas fronteras en África cruzan pueblos y tierras de familias?",fa:"چرا بعضی سرحدها در افریقا از وسط قریه‌ها و زمین خانواده‌ها می‌گذرند؟"},choices:[{ok:true,t:{en:"Faraway people drew lines without asking them",es:"Gente lejana trazó líneas sin preguntarles",fa:"مردم دور بدون پرسیدن از آن‌ها خط کشیدند"},why:{en:"The lines were drawn on maps in Europe, not by the people living on the land.",es:"Las líneas se dibujaron en mapas en Europa, no por la gente que vivía en esa tierra.",fa:"این خط‌ها در اروپا روی نقشه کشیده شدند، نه به دست مردمی که روی آن زمین زندگی می‌کردند."}},{t:{en:"The villages moved after the lines were drawn",es:"Las aldeas se mudaron después de las líneas",fa:"قریه‌ها بعد از کشیدن خط‌ها جا عوض کردند"},why:{en:"The villages were already there. The lines were drawn across them.",es:"Los pueblos ya estaban allí. Las líneas se dibujaron encima de ellos.",fa:"قریه‌ها از قبل آنجا بودند. خط‌ها از روی آن‌ها کشیده شدند."}},{t:{en:"Floods pushed the villages across the line",es:"Las inundaciones movieron las aldeas al otro lado",fa:"سیلاب قریه‌ها را به آن طرف خط برد"},why:{en:"These are geometric borders. They do not follow rivers at all.",es:"Estas son fronteras geométricas. No siguen ríos.",fa:"این‌ها سرحدهای هندسی هستند. اصلاً از دریاها پیروی نمی‌کنند."}}]}},{x:35,y:16,name:{en:"Dr. Linh Nguyen",es:"Dra. Linh Nguyen",fa:"داکتر لین نگوین"},role:{en:"River scientist from Vietnam",es:"Científica de ríos de Vietnam",fa:"دانشمند دریا از ویتنام"},look:{skin:1,hair:"#1b1410",shirt:"#f2c14e",pants:"#2b4a6b"},lines:[{en:"Xin chào! I study the Mekong. Laos, Thailand, Cambodia and Vietnam need its water.",es:"¡Xin chào! Estudio el Mekong. Laos, Tailandia, Camboya y Vietnam necesitan su agua.",fa:"سین چائو! من میکانگ را مطالعه می‌کنم. لائوس، تایلند، کمبودیا و ویتنام به آب آن ضرورت دارند."},{en:"Rivers ignore borders. A dam [[upstream|upstream]] changes the water for everyone below.",es:"Los ríos no respetan fronteras. Una represa [[upstream|río arriba]] cambia el agua para todos abajo.",fa:"دریاها سرحد نمی‌شناسند. یک بند در [[upstream|بالای دریا]] آب را برای همهٔ پایینی‌ها تغییر می‌دهد."},{en:"In 1995 they formed the Mekong River Commission to share data. A [[treaty|treaty]] helps too.",es:"En 1995 formaron la Comisión del Río Mekong para compartir datos. Un [[treaty|tratado]] también ayuda.",fa:"در ۱۹۹۵ کمیسیون دریای میکانگ را ساختند تا معلومات شریک کنند. [[treaty|معاهده]] هم کمک می‌کند."},{en:"A [[neutral|neutral]] World Bank helped make the 1960 Indus Waters Treaty. It held 60+ years.",es:"El Banco Mundial, [[neutral|neutral]], ayudó con el Tratado del Indo de 1960. Duró más de 60 años.",fa:"بانک جهانی [[neutral|بی‌طرف]] در معاهدهٔ ۱۹۶۰ آب‌های سند کمک کرد. بیشتر از ۶۰ سال پابرجا ماند."}],ask:{stat:"hei",q:{en:"What happened to the Aral Sea?",es:"¿Qué le pasó al mar de Aral?",fa:"بر سر بحیرهٔ ارال چه آمد؟"},choices:[{ok:true,t:{en:"Its rivers went to cotton farms, so it shrank",es:"Sus ríos fueron al algodón y se encogió",fa:"دریاهایش به کشتزار پخته رفت و کوچک شد"},why:{en:"With no strong agreement to protect it, the sea shrank over many years.",es:"Sin un acuerdo fuerte que lo protegiera, el mar se encogió durante muchos años.",fa:"بدون یک توافق محکم برای حفاظت، بحیره در طول سال‌ها کوچک شد."}},{t:{en:"It froze over one winter and never thawed",es:"Se congeló un invierno y nunca se derritió",fa:"یک زمستان یخ بست و دیگر آب نشد"},why:{en:"The sea shrank because people took its river water, not because of ice.",es:"El mar se encogió porque la gente tomó el agua de sus ríos, no por el hielo.",fa:"بحیره کوچک شد چون مردم آب دریاهایش را گرفتند، نه به خاطر یخ."}},{t:{en:"A treaty split it evenly between two countries",es:"Un tratado lo dividió igual entre dos países",fa:"یک معاهده آن را مساوی بین دو کشور تقسیم کرد"},why:{en:"There was no strong agreement. That is part of why it was lost.",es:"No hubo un acuerdo fuerte. Eso es parte de por qué se perdió.",fa:"توافق محکمی نبود. این بخشی از دلیل از دست رفتنش است."}}]}}],signs:[{x:27,y:2,text:{en:"THE GREAT ATLAS · 24 pages, one for every place you walked. 23 are home. One is still missing.",es:"EL GRAN ATLAS · 24 páginas, una por cada lugar que recorriste. 23 ya están. Todavía falta una.",fa:"اطلس بزرگ · ۲۴ صفحه، یکی برای هر جایی که رفتی. ۲۳ صفحه سر جایشان هستند. هنوز یکی کم است."}},{x:22,y:13,text:{en:"SILVER RIVER · This river is the [[border|border]] between North Bank and South Bank. Both sides share its water.",es:"RÍO PLATEADO · Este río es la [[border|frontera]] entre la Orilla Norte y la Orilla Sur. Los dos lados comparten su agua.",fa:"دریای نقره‌ای · این دریا [[border|سرحد]] بین ساحل شمالی و ساحل جنوبی است. هر دو طرف در آب آن شریک هستند."}}],quest:{stat:"reg",title:{en:"The Stolen Border Map",es:"El mapa robado de la frontera",fa:"نقشهٔ دزدیده‌شدهٔ سرحد"},giver:{x:20,y:16,name:{en:"Farida Noori",es:"Farida Noori",fa:"فریده نوری"},role:{en:"Farmer on the South Bank",es:"Agricultora de la Orilla Sur",fa:"دهقان در ساحل جنوبی"},look:{skin:3,hair:"#2b1d14",shirt:"#3f8f6f",pants:"#4a3a2a",robe:true,hat:"#d9a441"},lines:[{en:"Please help! North Bank and South Bank made a map of our [[border|border]] together.",es:"¡Ayuda, por favor! La Orilla Norte y la Orilla Sur hicieron juntas un mapa de nuestra [[border|frontera]].",fa:"لطفاً کمک کن! ساحل شمالی و ساحل جنوبی با هم نقشهٔ [[border|سرحد]] ما را ساختند."},{en:"The line runs down the middle of the Silver River. Both sides signed it.",es:"La línea va por el medio del Río Plateado. Los dos lados la firmaron.",fa:"خط از وسط دریای نقره‌ای می‌گذرد. هر دو طرف آن را امضا کردند."},{en:"An Ink Thief stole it! It wants to smear the line so the neighbors fight.",es:"¡Un Ladrón de Tinta lo robó! Quiere borrar la línea para que los vecinos peleen.",fa:"یک دزد رنگ آن را دزدید! می‌خواهد خط را خراب کند تا همسایه‌ها جنگ کنند."},{en:"Mateo the mapmaker saw it run. Ask him in the north-west mountains!",es:"Mateo, el cartógrafo, lo vio correr. ¡Pregúntale en las montañas del noroeste!",fa:"ماتئوی نقشه‌کش دید که کجا دوید. در کوه‌های شمال غرب از او بپرس!"}],wait:{en:"Mateo is in the mountains to the north-west. Cross the west bridge, then walk north.",es:"Mateo está en las montañas, al noroeste. Cruza el puente del oeste y luego camina al norte.",fa:"ماتئو در کوه‌ها به طرف شمال غرب است. از پل غربی بگذر، بعد به شمال برو."},thanks:{en:"Our map is back! Clear borders help neighbors live in peace. Thank you!",es:"¡Volvió nuestro mapa! Las fronteras claras ayudan a los vecinos a vivir en paz. ¡Gracias!",fa:"نقشهٔ ما برگشت! سرحدهای روشن به همسایه‌ها کمک می‌کنند در صلح زندگی کنند. تشکر!"}},contact:{x:12,y:5,name:{en:"Mateo Quispe",es:"Mateo Quispe",fa:"ماتئو کیسپه"},role:{en:"Land surveyor from Peru",es:"Topógrafo de Perú",fa:"اندازه‌گیر زمین از پیرو"},look:{skin:3,hair:"#1b1410",shirt:"#c8742a",pants:"#3a3a3a",hat:"#7a2f2f"},lines:[{en:"I mark borders. The Ink Thief ran past me, laughing, with a river map!",es:"Marco fronteras. ¡El Ladrón de Tinta pasó riéndose, con un mapa de un río!",fa:"من سرحد نشانی می‌کنم. دزد رنگ خنده‌کنان با یک نقشهٔ دریا از کنارم دوید!"},{en:"It tore the map into 3 pieces, each by a different kind of [[border|border]].",es:"Rompió el mapa en 3 pedazos, cada uno junto a un tipo distinto de [[border|frontera]].",fa:"نقشه را سه تکه کرد، هر تکه کنار یک نوع دیگر [[border|سرحد]]."},{en:"Follow its riddles to each piece. Then catch the thief!",es:"Sigue sus acertijos hasta cada pedazo. ¡Después atrapa al ladrón!",fa:"چیستان‌هایش را تا هر تکه دنبال کن. بعد دزد را بگیر!"}]},action:{type:"chase",at:[4,3],hops:[[9,9],[3,7]],name:{en:"The Border Ink Thief",es:"El Ladrón de Tinta de la Frontera",fa:"دزد رنگِ سرحد"},taunt:{en:'"Hee hee! I tore the border map into 3 pieces. Who knows where North Bank ends now?"',es:'"¡Ji ji! Rompí el mapa de la frontera en 3 pedazos. ¿Quién sabe ahora dónde termina la Orilla Norte?"',fa:"«هی هی! نقشهٔ سرحد را سه تکه کردم. حالا کی می‌داند ساحل شمالی کجا تمام می‌شود؟»"},clues:[{t:{en:"Piece 1 is by a [[geometric border|geometric border]]: a straight line people drew across empty sand.",es:"El pedazo 1 está junto a una [[geometric border|frontera geométrica]]: una línea recta que la gente trazó por la arena vacía.",fa:"تکهٔ ۱ کنار یک [[geometric border|سرحد هندسی]] است: خط راستی که مردم در ریگ خالی کشیدند."},zones:[{x:31,y:1,w:15,h:10}],noBy:[{x:16,y:11,w:15,h:3,t:{en:"The river is a border too, but nature made it. That is a natural border. A geometric border is a straight line people drew, out in the sand.",es:"El río también es una frontera, pero la hizo la naturaleza. Esa es una frontera natural. Una frontera geométrica es una línea recta que dibujó la gente, allá en la arena.",fa:"دریا هم سرحد است، اما طبیعت آن را ساخته. این سرحد طبیعی است. سرحد هندسی یک خط راست است که مردم کشیدند، آن جا در ریگ."}}],found:{en:"In the desert! Few people live here, so straight lines were drawn, like Egypt–Sudan.",es:"¡En el desierto! Aquí vive poca gente, así que se trazaron líneas rectas, como Egipto–Sudán.",fa:"در ریگستان! مردم کم اینجا زندگی می‌کنند، پس خط راست کشیده شد، مثل مصر و سودان."}},{t:{en:"Piece 2 is [[upstream|upstream]] on the Silver River. It flows east, so go toward where it starts.",es:"El pedazo 2 está [[upstream|río arriba]] en el Río Plateado. Corre al este, así que ve hacia donde empieza.",fa:"تکهٔ ۲ در [[upstream|بالای دریا]] است، در دریای نقره‌ای. دریا به شرق می‌رود، پس به طرف سرچشمه‌اش برو."},zones:[{x:1,y:11,w:8,h:10}],noBy:[{x:31,y:11,w:10,h:3,t:{en:"This is downstream, where the river meets the sea. Upstream is the other way, far to the west.",es:"Esto es río abajo, donde el río llega al mar. Río arriba es hacia el otro lado, lejos al oeste.",fa:"این جا پایین دریا است، جایی که دریا به بحر می‌رسد. بالای دریا به طرف دیگر است، دور در غرب."}},{x:31,y:16,w:9,h:5,t:{en:"This is the river mouth, where the river ends at the sea. That is downstream. Walk west, toward where the river begins.",es:"Esta es la desembocadura, donde el río termina en el mar. Eso es río abajo. Camina al oeste, hacia donde empieza el río.",fa:"این دهن دریا است، جایی که دریا در بحر تمام می‌شود. این پایین دریا است. به طرف غرب برو، به طرف جایی که دریا شروع می‌شود."}}],found:{en:"Upstream! A dam here changes water downstream, so neighbors need a [[treaty|treaty]].",es:"¡Río arriba! Una represa aquí cambia el agua río abajo, así que los vecinos necesitan un [[treaty|tratado]].",fa:"بالای دریا! یک بند اینجا آب پایین دریا را تغییر می‌دهد، پس همسایه‌ها به [[treaty|معاهده]] ضرورت دارند."}},{t:{en:"Piece 3 is by a [[natural border|natural border]] along a long mountain range. Find the snowy peaks.",es:"El pedazo 3 está junto a una [[natural border|frontera natural]] por una larga cordillera. Busca los picos nevados.",fa:"تکهٔ ۳ کنار یک [[natural border|سرحد طبیعی]] در امتداد یک سلسله‌کوه دراز است. قله‌های برفی را پیدا کن."},zones:[{x:1,y:1,w:15,h:10}],noBy:[{x:31,y:1,w:15,h:10,t:{en:"There are no mountains in this sand. A border here is a straight line drawn by people. Look for the snowy peaks in the west.",es:"En esta arena no hay montañas. Una frontera aquí es una línea recta dibujada por la gente. Busca los picos nevados en el oeste.",fa:"در این ریگ کوه نیست. سرحد این جا یک خط راست است که مردم کشیدند. قله‌های برفی را در غرب پیدا کن."}}],found:{en:"The mountains! A border on a mountain range is natural, like the Andes.",es:"¡Las montañas! Una frontera en una cordillera es natural, como los Andes.",fa:"کوه‌ها! سرحدی که روی سلسله‌کوه است طبیعی است، مثل اندیز."}}],win:{en:"Got you! The thief drops the pieces and vanishes in ink. The map is whole again!",es:"¡Te atrapé! El ladrón suelta los pedazos y desaparece en tinta. ¡El mapa está completo otra vez!",fa:"گرفتمت! دزد تکه‌ها را می‌اندازد و در رنگ گم می‌شود. نقشه دوباره کامل است!"},item:{icon:"🗺️",name:{en:"The Silver River border map",es:"El mapa de la frontera del Río Plateado",fa:"نقشهٔ سرحد دریای نقره‌ای"}}}},scraps:[[1,1],[46,1],[1,20]],smudges:[[6,8],[5,18],[42,8]],challenge:{at:[24,4],type:"site",spots:[[15,13],[25,13],[34,9]],stat:"hei",title:{en:"Settle the river fight",es:"Resuelve la pelea por el río",fa:"دعوای دریا را حل کن"},intro:{en:'North Bank and South Bank share the Silver River. In a dry year, both need its water for their farms. The Grump whispers, "Fight!" Choose how the neighbors should settle it. Then pick one reason it is fair and one reason it will last.',es:'Orilla Norte y Orilla Sur comparten el Río Plateado. En un año seco, los dos necesitan su agua para sus cultivos. El Gruñón susurra: "¡Peleen!" Elige cómo deben resolverlo los vecinos. Luego elige una razón por la que es justo y una razón por la que va a durar.',fa:"ساحل شمالی و ساحل جنوبی در دریای نقره‌ای شریک هستند. در یک سال خشک، هر دو برای کشت خود به آب آن نیاز دارند. غرغرو آهسته می‌گوید: «بجنگید!» انتخاب کن همسایه‌ها چطور آن را حل کنند. بعد یک دلیل برای منصفانه بودن و یک دلیل برای دوام آن انتخاب کن."},options:[{icon:"🧱",name:{en:"A: Build a wall and stop talking",es:"A: Construir un muro y dejar de hablar",fa:"الف: دیوار بسازند و گپ زدن را بس کنند"},desc:{en:"Each side keeps to itself.",es:"Cada lado se queda solo.",fa:"هر طرف به کار خودش."},result:{en:"The wall goes up, but the river keeps flowing. In the next dry year nobody talks, and the fight grows. Like the Aral Sea, shared water with no agreement can be lost.",es:"El muro se levanta, pero el río sigue corriendo. En el próximo año seco nadie habla, y la pelea crece. Como el mar de Aral, el agua compartida sin acuerdo se puede perder.",fa:"دیوار ساخته می‌شود، اما دریا جاری است. در سال خشک بعدی کسی گپ نمی‌زند و دعوا بزرگ‌تر می‌شود. مثل بحیرهٔ ارال، آب مشترک بدون توافق ممکن است از دست برود."}},{icon:"📜",name:{en:"B: Sign a treaty to share the water and meet every year",es:"B: Firmar un tratado para compartir el agua y reunirse cada año",fa:"ب: معاهده امضا کنند تا آب را شریک باشند و هر سال جلسه کنند"},desc:{en:"Write down how much water each side gets.",es:"Escribir cuánta agua recibe cada lado.",fa:"بنویسند که هر طرف چقدر آب می‌گیرد."},result:{en:"The treaty is signed! Each side gets a fair share, and they meet every year to fix new problems. The Mekong River Commission works a lot like this.",es:"¡Se firma el tratado! Cada lado recibe una parte justa, y se reúnen cada año para arreglar problemas nuevos. La Comisión del Río Mekong funciona de forma parecida.",fa:"معاهده امضا شد! هر طرف سهم منصفانه می‌گیرد و هر سال جلسه می‌کنند تا مشکلات تازه را حل کنند. کمیسیون دریای میکانگ هم تقریباً همین‌طور کار می‌کند."}},{icon:"⚖️",name:{en:"C: Ask a neutral group to help decide",es:"C: Pedir ayuda a un grupo neutral para decidir",fa:"ج: از یک گروه بی‌طرف بخواهند در تصمیم کمک کند"},desc:{en:"A helper who takes no side listens to both.",es:"Un ayudante que no está de ningún lado escucha a los dos.",fa:"کمک‌کننده‌ای که طرف کسی نیست به هر دو گوش می‌دهد."},result:{en:"A neutral helper listens to both sides and helps them write fair rules. In 1960 the World Bank helped India and Pakistan agree on the Indus Waters Treaty.",es:"Un ayudante neutral escucha a los dos lados y los ayuda a escribir reglas justas. En 1960 el Banco Mundial ayudó a India y Pakistán a acordar el Tratado de las Aguas del Indo.",fa:"یک کمک‌کنندهٔ بی‌طرف به هر دو طرف گوش می‌دهد و کمک می‌کند قانون‌های منصفانه بنویسند. در سال ۱۹۶۰ بانک جهانی به هند و پاکستان کمک کرد تا بر معاهدهٔ آب‌های سند موافقه کنند."}}],kinds:[{id:"fair",label:{en:"Why is it fair?",es:"¿Por qué es justo?",fa:"چرا منصفانه است؟"}},{id:"lasting",label:{en:"Why will it last?",es:"¿Por qué va a durar?",fa:"چرا دوام می‌کند؟"}}],reasons:[{kind:"fair",fits:[1],t:{en:"Both neighbors write the rules together, and each gets a share of the water.",es:"Los dos vecinos escriben las reglas juntos, y cada uno recibe una parte del agua.",fa:"هر دو همسایه با هم قانون می‌نویسند و هر کدام سهمی از آب می‌گیرد."},why:{en:"This reason is about the neighbors writing a treaty together.",es:"Esta razón habla de que los vecinos escriben un tratado juntos.",fa:"این دلیل دربارهٔ نوشتن معاهده توسط خود همسایه‌ها است."}},{kind:"fair",fits:[2],t:{en:"A helper who takes no side listens to both neighbors the same way.",es:"Un ayudante que no está de ningún lado escucha a los dos vecinos de la misma forma.",fa:"کمک‌کننده‌ای که طرف کسی نیست به هر دو همسایه یک‌رقم گوش می‌دهد."},why:{en:"This reason is about a neutral helper, which is choice C.",es:"Esta razón habla de un ayudante neutral, que es la opción C.",fa:"این دلیل دربارهٔ کمک‌کنندهٔ بی‌طرف است، یعنی انتخاب ج."}},{kind:"fair",fits:[1,2],t:{en:"Each neighbor gets a voice before anything is decided.",es:"Cada vecino tiene voz antes de que se decida algo.",fa:"هر همسایه پیش از هر تصمیم حق گپ زدن دارد."},why:{en:"With a wall and no talking, nobody gets a voice.",es:"Con un muro y sin hablar, nadie tiene voz.",fa:"با دیوار و بدون گپ زدن، هیچ کس حق گپ زدن ندارد."}},{kind:"fair",fits:[],t:{en:"The stronger neighbor keeps all the water on its side.",es:"El vecino más fuerte se queda con toda el agua de su lado.",fa:"همسایهٔ قوی‌تر تمام آب را در طرف خود نگه می‌دارد."},why:{en:"That is not fair. The other neighbor's farms would dry up.",es:"Eso no es justo. Los cultivos del otro vecino se secarían.",fa:"این منصفانه نیست. کشت همسایهٔ دیگر خشک می‌شود."}},{kind:"lasting",fits:[1],t:{en:"They meet every year, so they can fix new problems before they grow.",es:"Se reúnen cada año, así que pueden arreglar problemas nuevos antes de que crezcan.",fa:"هر سال جلسه می‌کنند، پس می‌توانند مشکلات تازه را پیش از بزرگ شدن حل کنند."},why:{en:"Meeting every year is part of the treaty choice, B.",es:"Reunirse cada año es parte de la opción del tratado, B.",fa:"هر سال جلسه کردن بخشی از انتخاب معاهده، یعنی ب، است."}},{kind:"lasting",fits:[1,2],t:{en:"Both sides agree to clear, written rules, so everyone knows what to do in a dry year.",es:"Los dos lados aceptan reglas claras y escritas, así todos saben qué hacer en un año seco.",fa:"هر دو طرف قانون‌های روشن و نوشته‌شده را قبول می‌کنند، پس همه می‌دانند در سال خشک چه کنند."},why:{en:"A wall gives no rules for sharing water.",es:"Un muro no da reglas para compartir el agua.",fa:"دیوار هیچ قانونی برای شریک شدن آب نمی‌دهد."}},{kind:"lasting",fits:[2],t:{en:"A trusted outside group can come back and help if a new fight starts.",es:"Un grupo de afuera de confianza puede volver a ayudar si empieza una pelea nueva.",fa:"یک گروه بیرونی قابل اعتماد می‌تواند اگر دعوای تازه شروع شود دوباره کمک کند."},why:{en:"This reason is about a neutral group, which is choice C.",es:"Esta razón habla de un grupo neutral, que es la opción C.",fa:"این دلیل دربارهٔ گروه بی‌طرف است، یعنی انتخاب ج."}},{kind:"lasting",fits:[],t:{en:"A wall stops the neighbors from ever arguing again.",es:"Un muro hace que los vecinos nunca vuelvan a discutir.",fa:"دیوار نمی‌گذارد همسایه‌ها دیگر هرگز دعوا کنند."},why:{en:"A wall does not stop the river or the need for water. When nobody talks, problems grow.",es:"Un muro no detiene el río ni la necesidad de agua. Cuando nadie habla, los problemas crecen.",fa:"دیوار نه دریا را متوقف می‌کند و نه نیاز به آب را. وقتی کسی گپ نزند، مشکلات بزرگ می‌شوند."}}],mismatch:{en:"That reason does not back up your choice.",es:"Esa razón no apoya tu elección.",fa:"آن دلیل از انتخاب تو پشتیبانی نمی‌کند."},success:{en:"North Bank and South Bank shake hands across the bridge. Talking, fair rules and neutral helpers turn a fight into a plan.",es:"Orilla Norte y Orilla Sur se dan la mano sobre el puente. Hablar, tener reglas justas y ayudantes neutrales convierte una pelea en un plan.",fa:"ساحل شمالی و ساحل جنوبی روی پل با هم دست می‌دهند. گپ زدن، قانون‌های منصفانه و کمک‌کننده‌های بی‌طرف یک دعوا را به یک پلان تبدیل می‌کنند."}},boss:{at:[24,14],stat:"reg",need:3,name:{en:"The Great Grump",es:"El Gran Gruñón",fa:"غرغروی بزرگ"},appear:{en:"The Great Grump has risen over the river bridge, right below the hall! It is the very last one. Go!",es:"¡El Gran Gruñón apareció sobre el puente del río, justo debajo del salón! Es el último de todos. ¡Ve!",fa:"غرغروی بزرگ بالای پل دریا، درست پایین تالار، پیدا شد! این آخرین غرغرو است. برو!"},taunt:{en:"I am the Great Grump! I blur every border and turn every neighbor against the other. Without the last page, the Atlas stays torn forever!",es:"¡Soy el Gran Gruñón! Borro cada frontera y pongo a cada vecino contra el otro. ¡Sin la última página, el Atlas se queda roto para siempre!",fa:"من غرغروی بزرگ هستم! هر سرحد را تار می‌کنم و هر همسایه را با دیگری دشمن می‌کنم. بدون صفحهٔ آخر، اطلس برای همیشه پاره می‌ماند!"},win:{en:"The Great Grump breaks into a shower of light. The 24th page flies home, and the Great Atlas is whole again! Every realm, river and road is back on the map. Thank you, Worldwalker. The world is wide, and now you know how to read it.",es:"El Gran Gruñón se rompe en una lluvia de luz. ¡La página 24 vuelve a casa y el Gran Atlas está completo otra vez! Cada reino, río y camino está de nuevo en el mapa. Gracias, Caminante del Mundo. El mundo es grande, y ahora sabes cómo leerlo.",fa:"غرغروی بزرگ به بارانی از نور تبدیل می‌شود. صفحهٔ ۲۴ به خانه برمی‌گردد و اطلس بزرگ دوباره کامل است! هر سرزمین، دریا و راه دوباره روی نقشه است. تشکر، جهان‌گرد. جهان بزرگ است و حالا تو می‌دانی چطور آن را بخوانی."},questions:[{q:{en:"What is a natural border?",es:"¿Qué es una frontera natural?",fa:"سرحد طبیعی چیست؟"},choices:[{en:"One that follows a river, mountains or a coast",es:"Una que sigue un río, montañas o una costa",fa:"سرحدی که از دریا، کوه یا ساحل پیروی می‌کند"},{en:"One drawn with a ruler on a map",es:"Una trazada con regla en un mapa",fa:"سرحدی که با خط‌کش روی نقشه کشیده شده"},{en:"One that two countries still argue about",es:"Una que dos países todavía discuten",fa:"سرحدی که دو کشور هنوز بر سرش اختلاف دارند"},{en:"One guarded day and night by soldiers",es:"Una vigilada día y noche por soldados",fa:"سرحدی که عسکرها شب و روز نگهبانی می‌کنند"}],answer:0,why:{en:"Natural borders follow things in nature, like the Andes or the Rio Grande.",es:"Las fronteras naturales siguen cosas de la naturaleza, como los Andes o el río Bravo.",fa:"سرحدهای طبیعی از چیزهای طبیعت پیروی می‌کنند، مثل اندیز یا ریو گرانده."}},{q:{en:"What is a geometric border?",es:"¿Qué es una frontera geométrica?",fa:"سرحد هندسی چیست؟"},choices:[{en:"A straight line drawn by people",es:"Una línea recta dibujada por personas",fa:"خط راستی که مردم کشیده‌اند"},{en:"A border that follows a mountain ridge",es:"Una frontera que sigue la cima de una montaña",fa:"سرحدی که از تیغهٔ کوه پیروی می‌کند"},{en:"A border along a seacoast",es:"Una frontera a lo largo de una costa",fa:"سرحدی در امتداد ساحل بحر"},{en:"A border that moves every few years",es:"Una frontera que se mueve cada pocos años",fa:"سرحدی که هر چند سال جا عوض می‌کند"}],answer:0,why:{en:"Geometric borders are straight lines. Many borders in Africa are like this.",es:"Las fronteras geométricas son líneas rectas. Muchas fronteras de África son así.",fa:"سرحدهای هندسی خط راست هستند. بسیاری از سرحدهای افریقا این‌طور هستند."}},{q:{en:"What is a boundary dispute?",es:"¿Qué es una disputa fronteriza?",fa:"اختلاف سرحدی چیست؟"},choices:[{en:"Two countries arguing over land",es:"Dos países que discuten por tierra",fa:"دو کشور که بر سر زمین اختلاف دارند"},{en:"A treaty that ends a long war",es:"Un tratado que termina una guerra larga",fa:"معاهده‌ای که یک جنگ دراز را ختم می‌کند"},{en:"A tax charged at a border crossing",es:"Un impuesto que se cobra en la frontera",fa:"مالیه‌ای که هنگام گذشتن از سرحد گرفته می‌شود"},{en:"A tall fence built along a river",es:"Una cerca alta junto a un río",fa:"کتارهٔ بلندی که کنار دریا ساخته شده"}],answer:0,why:{en:"In a boundary dispute, two countries do not agree on where the border is.",es:"En una disputa fronteriza, dos países no están de acuerdo sobre dónde está la frontera.",fa:"در اختلاف سرحدی، دو کشور دربارهٔ جای سرحد موافق نیستند."}},{q:{en:"What is a treaty?",es:"¿Qué es un tratado?",fa:"معاهده چیست؟"},choices:[{en:"A written deal between countries",es:"Un acuerdo escrito entre países",fa:"توافق نوشته‌شده بین کشورها"},{en:"A meeting that happens once a year",es:"Una reunión que pasa una vez al año",fa:"جلسه‌ای که سالی یک بار برگزار می‌شود"},{en:"A wall built along a border",es:"Un muro construido en una frontera",fa:"دیواری که کنار سرحد ساخته شده"},{en:"A map that shows where a border runs",es:"Un mapa que muestra por dónde va una frontera",fa:"نقشه‌ای که نشان می‌دهد سرحد از کجا می‌گذرد"}],answer:0,why:{en:"A treaty is written down and signed. It can say how countries share water or land.",es:"Un tratado se escribe y se firma. Puede decir cómo los países comparten agua o tierra.",fa:"معاهده نوشته و امضا می‌شود. می‌تواند بگوید کشورها چطور آب یا زمین را شریک شوند."}},{q:{en:"Why did Laos, Thailand, Cambodia and Vietnam form the Mekong River Commission in 1995?",es:"¿Por qué Laos, Tailandia, Camboya y Vietnam formaron la Comisión del Río Mekong en 1995?",fa:"چرا لائوس، تایلند، کمبودیا و ویتنام در سال ۱۹۹۵ کمیسیون دریای میکانگ را ساختند؟"},choices:[{en:"To share water data and plan together",es:"Para compartir datos del agua y planear juntos",fa:"تا معلومات آب را شریک کنند و با هم پلان بسازند"},{en:"To close the river to foreign ships",es:"Para cerrar el río a barcos extranjeros",fa:"تا دریا را به روی کشتی‌های خارجی ببندند"},{en:"To divide the river into private parts",es:"Para dividir el río en partes privadas",fa:"تا دریا را به بخش‌های شخصی تقسیم کنند"},{en:"To build one dam they would all own",es:"Para construir una sola represa de todos",fa:"تا یک بند آب بسازند که مال همه باشد"}],answer:0,why:{en:"The commission gives the countries a table to sit at and share what they know.",es:"La comisión les da a los países una mesa donde sentarse y compartir lo que saben.",fa:"این کمیسیون به کشورها میزی برای نشستن و شریک کردن دانسته‌هایشان می‌دهد."}},{q:{en:"What is surprising about the Indus Waters Treaty?",es:"¿Qué tiene de sorprendente el Tratado de las Aguas del Indo?",fa:"چه چیز معاهدهٔ آب‌های سند تعجب‌آور است؟"},choices:[{en:"It lasted 60+ years, even through wars",es:"Duró más de 60 años, aun con guerras",fa:"بیشتر از ۶۰ سال، حتی در جنگ‌ها، دوام کرد"},{en:"Every country in the world signed it",es:"Todos los países del mundo lo firmaron",fa:"همهٔ کشورهای جهان آن را امضا کردند"},{en:"It gave all of the water to India",es:"Le dio toda el agua a India",fa:"تمام آب را به هند داد"},{en:"It was never written down on paper",es:"Nunca se escribió en papel",fa:"هرگز روی کاغذ نوشته نشد"}],answer:0,why:{en:"With help from the World Bank, the treaty held longer than many treaties in calmer places.",es:"Con ayuda del Banco Mundial, el tratado duró más que muchos tratados en lugares más tranquilos.",fa:"با کمک بانک جهانی، این معاهده از بسیاری معاهده‌ها در جاهای آرام‌تر بیشتر دوام کرد."}},{q:{en:"What happened to the Aral Sea?",es:"¿Qué le pasó al mar de Aral?",fa:"بر سر بحیرهٔ ارال چه آمد؟"},choices:[{en:"Its rivers were used for cotton fields",es:"Sus ríos se usaron para el algodón",fa:"دریاهایش برای کشتزار پخته استفاده شد"},{en:"An earthquake opened a channel to the ocean",es:"Un terremoto abrió un canal hacia el océano",fa:"یک زلزله راهی به سوی بحر باز کرد"},{en:"It froze over and never thawed",es:"Se congeló y nunca se descongeló",fa:"یخ بست و دیگر آب نشد"},{en:"A treaty split it evenly in two",es:"Un tratado lo dividió igual en dos",fa:"یک معاهده آن را مساوی دو تکه کرد"}],answer:0,why:{en:"No strong agreement protected the sea, so it lost most of its water.",es:"Ningún acuerdo fuerte protegió el mar, así que perdió casi toda su agua.",fa:"هیچ توافق محکمی از بحیره حفاظت نکرد، پس بیشتر آبش را از دست داد."}},{q:{en:"Two countries share one river. Why do they need to work together?",es:"Dos países comparten un río. ¿Por qué necesitan trabajar juntos?",fa:"دو کشور در یک دریا شریک هستند. چرا باید با هم کار کنند؟"},choices:[{en:"What one side does changes the other",es:"Lo que hace un lado cambia al otro",fa:"کار یک طرف طرف دیگر را تغییر می‌دهد"},{en:"Rivers stop flowing at the border line",es:"Los ríos dejan de correr en la frontera",fa:"دریاها کنار خط سرحد از جریان می‌ایستند"},{en:"Only one country can ever use a river",es:"Solo un país puede usar un río",fa:"فقط یک کشور می‌تواند از دریا استفاده کند"},{en:"Rivers are not useful for farms",es:"Los ríos no sirven para los cultivos",fa:"دریاها برای کشت به درد نمی‌خورند"}],answer:0,why:{en:"Rivers do not stop for a border sign. A dam upstream changes the water downstream.",es:"Los ríos no se detienen por un letrero de frontera. Una represa río arriba cambia el agua río abajo.",fa:"دریاها برای تابلوی سرحد نمی‌ایستند. بند آب در بالای دریا آب پایین را تغییر می‌دهد."}}]},learned:[{en:"A [[natural border|natural border]] follows a river, mountains or a coast. A [[geometric border|geometric border]] is a straight line drawn by people.",es:"Una [[natural border|frontera natural]] sigue un río, montañas o una costa. Una [[geometric border|frontera geométrica]] es una línea recta dibujada por personas.",fa:"[[natural border|سرحد طبیعی]] از دریا، کوه یا ساحل پیروی می‌کند. [[geometric border|سرحد هندسی]] خط راستی است که مردم کشیده‌اند."},{en:"Countries can argue over land, water and resources. That can lead to a [[boundary dispute|boundary dispute]]. Rivers do not stop at borders, so neighbors must share them.",es:"Los países pueden discutir por tierra, agua y recursos. Eso puede llevar a una [[boundary dispute|disputa fronteriza]]. Los ríos no se detienen en las fronteras, así que los vecinos deben compartirlos.",fa:"کشورها ممکن است بر سر زمین، آب و منابع اختلاف کنند. این می‌تواند به [[boundary dispute|اختلاف سرحدی]] برسد. دریاها کنار سرحد نمی‌ایستند، پس همسایه‌ها باید آن‌ها را شریک باشند."},{en:"A [[treaty|treaty]], a shared group like the Mekong River Commission, a [[neutral|neutral]] helper, or the [[united nations|United Nations]] can help neighbors work together for a long time.",es:"Un [[treaty|tratado]], un grupo compartido como la Comisión del Río Mekong, un ayudante [[neutral|neutral]] o las [[united nations|Naciones Unidas]] pueden ayudar a los vecinos a trabajar juntos por mucho tiempo.",fa:"یک [[treaty|معاهده]]، یک گروه مشترک مثل کمیسیون دریای میکانگ، یک کمک‌کنندهٔ [[neutral|بی‌طرف]] یا [[united nations|سازمان ملل متحد]] می‌توانند به همسایه‌ها کمک کنند تا مدت درازی با هم کار کنند."}],reflect:{q:{en:"Think about something people share in your school or neighborhood, like a field, a park or a bus. How do people share it fairly? What rule would you add to help everyone get along?",es:"Piensa en algo que la gente comparte en tu escuela o tu barrio, como una cancha, un parque o un autobús. ¿Cómo lo comparten de forma justa? ¿Qué regla agregarías para que todos se lleven bien?",fa:"به چیزی فکر کن که مردم در مکتب یا محلهٔ تو شریک هستند، مثل میدان، پارک یا سرویس. مردم چطور آن را منصفانه شریک می‌شوند؟ چه قانونی اضافه می‌کنی تا همه با هم خوب باشند؟"},starter:{en:"In my community, people share",es:"En mi comunidad, la gente comparte",fa:"در محلهٔ من، مردم شریک هستند در"}}};
