<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worldwalker 5.2</title>
<style>
/* WORLDWALKER engine · page and game styles */
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Atkinson+Hyperlegible:wght@400;700&display=swap');
:root{
  --bg:#141322; --panel:#1f1d33; --panel2:#29264a; --line:#3b3866; --text:#f3f1ff; --muted:#b9b5dc;
  --gold:#f2c14e; --teal:#2aa198; --red:#e04848; --paper:#fffbe8; --ink:#22202e;
  --pix:'Press Start 2P', ui-monospace, monospace;
  --read:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--read);font-size:17px;line-height:1.5}
button{font-family:inherit}
.ww-frame{max-width:960px;margin:0 auto;padding:10px 12px 24px;background:var(--bg)}
.ww-frame:fullscreen{max-width:none;height:100vh;overflow:auto;display:flex;flex-direction:column;justify-content:center}
.ww-frame:fullscreen .screen{max-width:calc((100vh - 160px) * 16 / 11);margin:0 auto;width:100%}

/* top bar */
.ww-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.ww-logo{font-family:var(--pix);font-size:12px;color:var(--gold);text-decoration:none;margin-right:auto}
.ww-bar button{font-size:13px;padding:6px 9px;background:var(--panel2);color:#fff;border:2px solid #000;border-radius:4px;cursor:pointer}
.ww-bar .langs button.on{background:var(--gold);color:var(--ink);font-weight:700}
.ww-bar .langs,.ww-bar .tools{display:flex;gap:5px;flex-wrap:wrap}
.ww-preview{font-size:12px;font-weight:700;padding:5px 8px;background:var(--teal);color:#fff;border:2px solid #000;border-radius:4px;text-decoration:none}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;background:#0b0a14;padding:7px 10px;font-family:var(--pix);font-size:10px;border:3px solid #000;border-bottom:0;border-radius:6px 6px 0 0}
.hud-left,.hud-right{display:flex;align-items:center;gap:6px}
.hrt{color:var(--red);font-size:16px;line-height:1}
.hrt.empty{color:#4a2630}
.hud-coin{color:var(--gold);margin-left:6px}
.hud-mid{color:var(--muted);font-family:var(--read);font-weight:700;font-size:13px}
.meter{display:inline-flex;align-items:center;gap:2px}
.meter i{font-style:normal;font-size:12px}
.track{display:block;width:40px;height:9px;background:#2a2840;border:2px solid #000}
.track b{display:block;height:100%}
.quest{background:#0b0a14;border:3px solid #000;border-top:1px solid #2a2840;border-bottom:0;padding:5px 10px;font-size:14px;color:var(--muted)}
.quest b{color:var(--gold)}
.quest i{font-style:normal;color:#5a5680}
.quest .qnow{color:#fff;font-weight:700}
.quest .qdone{color:#7cc451}
.quest .qscr{color:#c9b064}

/* screen */
.screen{position:relative;background:#000;border:3px solid #000;outline:3px solid var(--line);border-radius:0 0 6px 6px;overflow:hidden;user-select:none}
.screen:focus{outline-color:var(--gold)}
.screen canvas#ww-cv{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.screen.ovopen{min-height:min(560px,85vh)}
.toast{position:absolute;right:10px;top:10px;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:5px;max-width:70%;pointer-events:none}
.toast .tst{color:#fff;font-weight:700;font-size:15px;padding:7px 11px;border:3px solid #000;border-radius:4px;animation:pop .2s ease-out}
.toast .tst.big{font-size:16px;padding:10px 14px;outline:3px solid #fff3b0;max-width:100%}
.toast .tst small{display:block;font-weight:400;font-size:13px;opacity:.95}
.defpop{position:absolute;z-index:9;max-width:300px;background:var(--ink);color:#fff;border:3px solid #ffe36e;border-radius:4px;padding:8px 12px;font-size:15px;line-height:1.4;display:none}
.defpop b{color:#ffe36e}

/* overlays */
.ov{position:absolute;inset:0;z-index:5;overflow:auto;background:rgba(10,9,20,.55);padding:12px}
.ov.hidden{display:none}
.ov-box{background:var(--paper);color:var(--ink);border:4px solid var(--ink);outline:3px solid var(--paper);border-radius:4px;padding:14px 16px;max-width:760px;margin:0 auto}
.ov[dir=rtl] .ov-box{text-align:right}
.ov h2{margin:4px 0 6px;font-size:22px;line-height:1.25}
.ov h3{margin:12px 0 6px;font-size:17px;color:#7a3b12}
.ov h4{margin:10px 0 6px;font-size:15px;color:#5a4a7a}
.say{font-size:clamp(15px,1.8vw,18px);margin:6px 0}
.say.q{font-weight:700}
.say.taunt{font-style:italic;color:#4b3f63}
.hint,.small{font-size:13.5px;color:#5c5874;margin:4px 0}
.ov .small a{color:#2f6fd6}
.word{background:#ffe36e;border-bottom:2px dotted #7a3b12;padding:0 2px;cursor:help;border-radius:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.acts.center{justify-content:center}
.pbtn{font-size:14px;font-weight:700;padding:9px 14px;background:#29264a;color:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;min-height:42px}
.pbtn.gold{background:var(--gold);color:var(--ink)}
.pbtn.teal{background:var(--teal);color:#fff}
.pbtn.ghost{background:#fff;color:var(--ink)}
.pbtn.big{font-size:17px;padding:11px 22px}
.pbtn:disabled{opacity:.45;cursor:not-allowed}
.pbtn:focus-visible,.choices button:focus-visible,.card:focus-visible{outline:3px solid #2f6fd6;outline-offset:2px}
.choices{display:grid;gap:7px;margin-top:8px}
.choices.two{grid-template-columns:1fr 1fr}
@media (max-width:640px){.choices.two{grid-template-columns:1fr}}
.choices button{text-align:start;font-size:clamp(14px,1.6vw,16.5px);padding:9px 12px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);min-height:44px}
.choices button i{font-style:normal;font-weight:700;color:#7a3b12;margin-inline-end:6px}
.choices button.right{background:#d9f5dd;border-color:#1f7a3a}
.choices button.wrong{background:#fde2de;border-color:#b0392b}
.choices button:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:10px;padding:9px 12px;border-radius:4px;border:2px solid}
.fb.right{background:#e3f6e6;border-color:#1f7a3a;color:#174f27}
.fb.wrong{background:#fdeae6;border-color:#b0392b;color:#7a2318}
.err{color:#b0392b;font-weight:700;text-align:center}

/* talk */
.talk-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.talk-head .face{width:64px;height:44px;border:3px solid var(--ink);background:#cfe8ff;image-rendering:pixelated;flex:0 0 auto}
.who{font-weight:700;color:#7a3b12;font-size:16px}
.role{font-size:13.5px;color:#5c5874}
/* start */
.startov .logo{font-family:var(--pix);color:#c08a1e;text-align:center;font-size:clamp(18px,4vw,30px);margin-top:4px}
.startov .sublogo{font-family:var(--pix);text-align:center;font-size:10px;color:#5a4a7a;margin:6px 0 10px}
.epcard{background:#f3e3b5;border:3px solid var(--ink);border-radius:4px;padding:8px 12px;text-align:center}
.epcard h2{margin:2px 0}
.epn{font-size:13px;font-weight:700;color:#5a4a7a}
.place{color:#5c5874}
.langrow{display:flex;gap:6px;justify-content:center;margin:10px 0}
.langrow .pbtn{min-height:36px;padding:6px 12px}
.wb{text-align:center;font-size:18px}
.signin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.signin h3{grid-column:1/-1;margin-bottom:0}
@media (max-width:640px){.signin{grid-template-columns:1fr}}
.signin label,.codein label{display:flex;flex-direction:column;font-size:13.5px;font-weight:700;gap:3px}
.ov input,.ov textarea{font:inherit;font-size:16px;padding:8px 10px;border:3px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);width:100%}
.ov textarea{resize:vertical;min-height:80px;margin-top:6px}
.looks{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.heroprev{border:3px solid var(--ink);background:#cfe8ff;image-rendering:pixelated;width:96px;height:96px}
.lrow{display:flex;align-items:center;gap:5px;margin:3px 0}
.lrow span{width:52px;font-size:13px;font-weight:700}
.sw{width:28px;height:28px;border:3px solid #fff;outline:2px solid var(--ink);border-radius:3px;cursor:pointer;padding:0}
.sw.on{border-color:#c08a1e;outline:3px solid #c08a1e}
.codein{display:flex;gap:8px;align-items:end;margin-top:12px;flex-wrap:wrap}
.codein label{flex:1;min-width:220px}
.pipface{float:right;image-rendering:pixelated;width:64px;height:64px;margin-inline-start:10px}
.ov[dir=rtl] .pipface{float:left}

/* passport */
.pp-top{display:flex;gap:14px;align-items:center}
.pp-hero{border:3px solid var(--ink);background:#cfe8ff;image-rendering:pixelated;width:90px;height:90px}
.pp-name{font-size:22px;font-weight:700}
.pp-nums{display:flex;gap:14px;flex-wrap:wrap;font-size:15px}
.powers{display:grid;gap:6px}
.pw{display:grid;grid-template-columns:30px 1fr 34px;gap:8px;align-items:center}
.pwi{font-size:20px}
.pwn{font-weight:700;text-align:end}
.bar{height:12px;border:2px solid var(--ink);background:#e9dfc0}
.bar b{display:block;height:100%}
.bag{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:520px){.bag{grid-template-columns:repeat(2,1fr)}}
.slot{border:3px solid #b7a77e;background:#e9dfc0;border-radius:4px;padding:6px;text-align:center;font-size:12.5px;color:#8a7c58}
.slot.has{background:#fff;border-color:var(--ink);color:var(--ink);font-weight:700}
.slot .ti{display:block;font-size:24px}
.stamps{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
@media (max-width:560px){.stamps{grid-template-columns:repeat(4,1fr)}}
.scol{display:flex;flex-direction:column;gap:4px;align-items:center;border:2px dashed #b7a77e;border-radius:4px;padding:4px}
.stamp{width:44px;height:44px;border-radius:50%;border:2px dashed #b7a77e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:#b7a77e;font-weight:700;line-height:1}
.stamp i{font-style:normal;font-size:8px;color:#c08a1e}
.stamp.on{border:3px solid var(--ink);color:#fff}
.stamp.on i{color:#fff}
.stamp.r1{background:#e04848}.stamp.r2{background:#2f7fd1}.stamp.r3{background:#8e5bd6}.stamp.r4{background:#d98e2b}
.stamp.r5{background:#c9a227}.stamp.r6{background:#3fa34d}.stamp.r7{background:#c0392b}.stamp.r8{background:#2aa198}
.coderow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pcode{font-family:var(--pix);font-size:12px;background:var(--ink);color:var(--gold);padding:8px 10px;border-radius:3px;letter-spacing:1px;direction:ltr;display:inline-block}
.ok{color:#1f7a3a;font-weight:700}.bad{color:#b0392b;font-weight:700}.pending{color:#5a4a7a;font-weight:700}

/* challenges */
.ch-head{display:flex;gap:10px;align-items:flex-start}
.chface{image-rendering:pixelated;width:48px;height:48px;flex:0 0 auto}
.ch-head h3{margin-top:2px}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;min-height:10px}
.card{font-size:14.5px;padding:7px 10px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);text-align:start;line-height:1.3}
.card .ic{margin-inline-end:5px}
.card.sel{background:#ffe36e;border-color:#c08a1e;outline:2px solid #c08a1e}
.card.right{background:#d9f5dd;border-color:#1f7a3a}
.card.wrong{background:#fde2de;border-color:#b0392b}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.bins.bands{grid-template-columns:1fr}
.bin{border:3px dashed #8a7c58;border-radius:6px;padding:6px;background:#f6edd2;min-height:70px;cursor:pointer;overflow:hidden}
.bin.target{border-color:#c08a1e;background:#fff3c4}
.bins.bands .bin{min-height:54px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.bintile{grid-row:1/3;width:96px;height:32px;image-rendering:pixelated;border:2px solid var(--ink)}
.binlabel{font-weight:700;font-size:14.5px}
.binin{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.seq{padding-inline-start:26px;margin:8px 0;display:grid;gap:5px}
.seq li.card{cursor:default}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;gap:3px;text-align:start;padding:9px 11px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);font-size:14.5px}
.opt span{font-size:13.5px;color:#5c5874}
.opt.sel{background:#ffe36e;border-color:#c08a1e}
.kind,.sw-g{margin:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.klabel{width:100%;font-weight:700;font-size:14px;color:#5a4a7a}
.reason{font-size:14px;padding:7px 10px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);text-align:start}
.reason.sel{background:#ffe36e;border-color:#c08a1e}
.reason.right{background:#d9f5dd;border-color:#1f7a3a}
.reason.wrong{background:#fde2de;border-color:#b0392b}
.outs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.out{padding:5px 10px;border-radius:20px;border:2px solid;font-size:14px;font-weight:700}
.out.good{background:#d9f5dd;border-color:#1f7a3a;color:#174f27}
.out.badp{background:#fbe2c8;border-color:#b5651d;color:#7a3b12}
.tblwrap{overflow-x:auto}
.dtbl{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0}
.dtbl th,.dtbl td{border:2px solid var(--ink);padding:5px 8px;text-align:start}
.dtbl th{background:#f3e3b5}

/* boss */
.bossov .ov-box{background:#f1ecff}
.boss-top{display:flex;gap:14px;align-items:center}
.bossface{image-rendering:pixelated;width:90px;height:90px;background:#2b2140;border:3px solid var(--ink);border-radius:6px}
.bossface.hit{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bname{font-weight:700;font-size:19px;color:#4b3f63}
.shield{display:flex;gap:4px;margin:3px 0}
.shield span{width:44px;height:14px;border:2px solid var(--ink);background:#ddd}
.shield span.on{background:#8fc3ff}
.hearts .hrt{font-size:18px}

/* finish */
.fin-head{display:flex;gap:14px;align-items:center}
.pagebig canvas{image-rendering:pixelated;width:80px;height:80px;animation:glow 1.6s ease-in-out infinite;border-radius:6px}
@keyframes glow{50%{filter:drop-shadow(0 0 10px #f2c14e)}}
.stars{font-size:28px;color:#e0a81e;letter-spacing:3px}
.stars .dim{color:#d8cfb0}
.newtool{margin-top:8px;padding:8px 12px;background:#fff3c4;border:2px solid #c08a1e;border-radius:4px}
.learned{margin:4px 0;padding-inline-start:22px}
.starter{background:#ffe36e;border:2px solid #c08a1e;border-radius:4px;padding:5px 10px;font-size:14px;cursor:pointer;color:var(--ink)}
.savebox{margin-top:10px;padding:8px 12px;background:#efe8d2;border:2px solid #b7a77e;border-radius:4px;display:grid;gap:4px}

/* touch arrows */
.dpad{display:none;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,56px);gap:6px;justify-content:center;margin:12px auto 0;touch-action:none}
.dpad button{background:var(--panel2);color:#fff;border:3px solid #000;border-radius:8px;font-size:22px;cursor:pointer}
.dpad [data-d=up]{grid-column:2;grid-row:1}.dpad [data-d=left]{grid-column:1;grid-row:2}.dpad .act{grid-column:2;grid-row:2;background:var(--gold);color:var(--ink)}
.dpad [data-d=right]{grid-column:3;grid-row:2}.dpad [data-d=down]{grid-column:2;grid-row:3}
@media (pointer:coarse){.dpad{display:grid}}
.ww-foot{text-align:center;color:var(--muted);font-size:13.5px;margin-top:10px}
@media (max-width:640px){
  .track{width:22px}.hud{font-size:9px}.hud-mid{font-size:12px;order:3;width:100%}
  .ov{padding:6px}.ov-box{padding:10px 12px}
  .screen.ovopen{min-height:85vh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* talk boxes sit at the bottom like a classic RPG; the map stays visible */
.ov.talkov,.ov.msgov{background:rgba(10,9,20,.18);display:flex;flex-direction:column;justify-content:flex-end}
.ov.talkov .ov-box,.ov.msgov .ov-box{width:100%;margin:0 auto}
.stamp{font-family:var(--read)}

.touch .dpad{display:grid}

/* ---------- effects ---------- */
.screen canvas#ww-cv{animation:fadein .7s ease-out}
@keyframes fadein{from{opacity:0;filter:brightness(2)}to{opacity:1;filter:none}}
.ov-box{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.bossface.crack{animation:flash .45s}
@keyframes flash{0%,60%{filter:brightness(2.4) saturate(.3)}30%{transform:scale(.9) rotate(-4deg)}100%{filter:none;transform:none}}
.shield span.cracked{animation:crack .6s ease-out;position:relative}
@keyframes crack{0%{background:#ffffff;transform:scale(1.25)}40%{background:#8fc3ff;transform:scale(1.1) rotate(6deg)}100%{background:#ddd;transform:none}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:7}
.confetti i{position:absolute;top:-12px;width:7px;height:10px;border-radius:1px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.9}}

/* ---------- goals, earnings, how you grow ---------- */
.goals{background:#fff3c4;border:3px solid var(--ink);border-radius:6px;padding:8px 12px;margin:10px 0;text-align:start}
.goals ol{margin:6px 0 6px 22px;padding:0}.goals li{margin:2px 0}
[dir=rtl] .goals ol{margin:6px 22px 6px 0}
ul.earned{list-style:none;padding:0;margin:4px 0;display:grid;gap:3px}
ul.earned li{background:#f3eedc;border-radius:4px;padding:4px 8px}
.grow{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grow .gw{background:#f3eedc;border-radius:6px;padding:6px 9px}
.grow ul{list-style:none;padding:0;margin:4px 0 0}
.grow li{font-size:14px;color:#8a8370;margin:2px 0}.grow li.on{color:#1f6a2e;font-weight:700}
.hintbtn{font-size:14px!important}

/* ---------- the Grump ---------- */
.bossov .ov-box.roar{animation:roar .45s}
@keyframes roar{0%{box-shadow:0 0 0 0 rgba(220,40,40,.0)}20%{transform:translate(-6px,2px);box-shadow:0 0 0 8px rgba(220,40,40,.55)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}100%{transform:none;box-shadow:0 0 0 0 rgba(220,40,40,0)}}
.bossface.furious{animation:fury .5s infinite;border-color:#b0392b}
@keyframes fury{25%{transform:translate(-2px,0) rotate(-2deg)}75%{transform:translate(2px,0) rotate(2deg)}}
.furious-tag{display:inline-block;background:#b0392b;color:#fff;font-size:12px;padding:2px 6px;border-radius:3px;animation:fury .5s infinite}
.say.grr{color:#8a1c24;font-weight:700;font-style:italic}
.screen:has(.ov:not(.hidden)) .toast{top:auto;bottom:10px} /* while a box is open, messages move to the bottom corner */

</style>
</head>
<body>
<div id="ww"></div>
<script>
/* WORLDWALKER settings you can change
   SHEET_URL     – paste your Google Apps Script web app URL here (see apps-script/Code.gs) to save to the class Sheet.
                   Leave it '' and the game still saves in the browser and gives a Passport Code.
   TEACHER_CODE  – type this on the world map to open every episode for a student. */
window.WW_CONFIG = {
  SHEET_URL: '',
  TEACHER_CODE: 'ATLAS'
};

window.WW_CONFIG.MODE = 'canvas';
</script>
<script>
/* art.js */
/* WORLDWALKER engine · art (tiles + characters, all drawn in code)
   (grew out of mockups/kit.js)
   Everything here is drawn in code: no picture files.
   World = <canvas> (pixel art). Words, buttons, HUD = HTML on top (easy to read,
   easy to translate, Dari can run right-to-left).                              */
(function () {
  const T = 16; // one tile = 16 x 16 pixels

  const P = {
    k: '#22202e', // outline
    grass: '#5aa83b', grassD: '#3f8a2e', grassL: '#7cc451',
    water: '#2f7fd1', waterL: '#5fb0ee', waterD: '#1d5aa8', foam: '#d8f0ff',
    sand: '#e8d18a', sandD: '#c9b064',
    path: '#c79a5b', pathD: '#a87c45',
    leaf: '#2e7d32', leafD: '#1b5e20', leafL: '#43a047', trunk: '#6d4c2f',
    stone: '#8a8f98', stoneD: '#5e636b', stoneL: '#b5bac2',
    snow: '#f4f8fb', snowD: '#c9dbe8',
    roof: '#c0392b', roofD: '#8e2a20', wall: '#e9d8b4', wallD: '#c9b48c', wood: '#8b5a2b', woodD: '#5f3d1d',
    soil: '#7a4e2d', soilD: '#5c3a20',
    dFloor: '#3a3550', dFloorL: '#47416a', dWall: '#5b5479', dWallD: '#2b2740',
    gold: '#f2c14e', goldD: '#c08a1e', red: '#e04848', white: '#ffffff', ink: '#2b2b3a',
    dune: '#e9b86a', duneD: '#c98f45'
  };

  // stable "random" from tile position, so every redraw looks the same
  function hash(x, y, s = 0) {
    let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
    h = (h ^ (h >>> 13)) * 1274126177;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };

  /* ---------- tiles ---------- */
  function grassBase(c, x, y, gx, gy) {
    R(c, x, y, T, T, P.grass);
    for (let i = 0; i < 5; i++) {
      const a = hash(gx, gy, i), b = hash(gx, gy, i + 9);
      R(c, x + ((a * 14) | 0), y + ((b * 14) | 0), 1, 2, i % 2 ? P.grassD : P.grassL);
    }
  }
  const tiles = {
    '.': grassBase,
    ',': (c, x, y, gx, gy) => { // flowers
      grassBase(c, x, y, gx, gy);
      const cols = ['#ffe36e', '#ff8fb1', '#ffffff', '#b89cff'];
      for (let i = 0; i < 3; i++) {
        const fx = x + 2 + ((hash(gx, gy, i + 3) * 11) | 0), fy = y + 2 + ((hash(gx, gy, i + 7) * 11) | 0);
        R(c, fx, fy, 2, 2, cols[(hash(gx, gy, i) * 4) | 0]);
      }
    },
    '"': (c, x, y, gx, gy) => { // tall grass
      grassBase(c, x, y, gx, gy);
      for (let i = 0; i < 4; i++) {
        const fx = x + 1 + i * 4;
        R(c, fx, y + 6, 1, 7, P.grassD); R(c, fx + 1, y + 4, 1, 9, P.leafL); R(c, fx + 2, y + 7, 1, 6, P.grassD);
      }
    },
    '~': (c, x, y, gx, gy, t, m) => water(c, x, y, gx, gy, t, m, P.water),
    '=': (c, x, y, gx, gy, t, m) => water(c, x, y, gx, gy, t, m, P.waterD),
    's': (c, x, y, gx, gy) => {
      R(c, x, y, T, T, P.sand);
      for (let i = 0; i < 4; i++) R(c, x + ((hash(gx, gy, i) * 15) | 0), y + ((hash(gx, gy, i + 4) * 15) | 0), 1, 1, P.sandD);
    },
    'u': (c, x, y, gx, gy) => { // dune
      R(c, x, y, T, T, P.dune);
      const o = (hash(gx, gy) * 6) | 0;
      for (let i = 0; i < 16; i++) { const yy = 9 + Math.round(Math.sin((i + o) / 2.6) * 3); R(c, x + i, y + yy, 1, 16 - yy, P.duneD); }
    },
    ':': (c, x, y, gx, gy) => {
      R(c, x, y, T, T, P.path);
      for (let i = 0; i < 5; i++) R(c, x + ((hash(gx, gy, i) * 14) | 0), y + ((hash(gx, gy, i + 5) * 14) | 0), 2, 1, P.pathD);
    },
    'T': (c, x, y, gx, gy) => { // round tree
      grassBase(c, x, y, gx, gy);
      R(c, x + 3, y + 14, 10, 2, 'rgba(0,0,0,.18)');
      R(c, x + 7, y + 10, 2, 5, P.trunk);
      R(c, x + 2, y + 3, 12, 8, P.leaf); R(c, x + 3, y + 1, 10, 11, P.leaf); R(c, x + 1, y + 5, 14, 5, P.leaf);
      R(c, x + 4, y + 2, 4, 3, P.leafL); R(c, x + 3, y + 4, 2, 2, P.leafL);
      R(c, x + 9, y + 8, 4, 2, P.leafD); R(c, x + 4, y + 10, 8, 1, P.leafD);
    },
    'P': (c, x, y, gx, gy, t, m, base) => { // pine
      (base === 'n' ? tiles.n : grassBase)(c, x, y, gx, gy);
      R(c, x + 7, y + 12, 2, 4, P.trunk);
      for (let r = 0; r < 12; r++) { const w = 2 + ((r % 4) + (r >> 2)) * 1.6 | 0; R(c, x + 8 - w, y + 1 + r, w * 2, 1, r % 4 === 3 ? P.leafD : '#25693a'); }
      if (base === 'n') { R(c, x + 6, y + 1, 4, 2, P.snow); R(c, x + 4, y + 5, 3, 1, P.snow); R(c, x + 9, y + 9, 4, 1, P.snow); }
    },
    'p': (c, x, y, gx, gy) => { // palm on sand
      tiles.s(c, x, y, gx, gy);
      for (let i = 0; i < 10; i++) R(c, x + 7 + Math.round(Math.sin(i / 4) * 2), y + 5 + i, 2, 1, P.trunk);
      R(c, x + 2, y + 3, 12, 2, P.leaf); R(c, x + 1, y + 5, 3, 2, P.leaf); R(c, x + 12, y + 5, 3, 2, P.leaf);
      R(c, x + 5, y + 1, 6, 2, P.leafL); R(c, x + 7, y + 5, 2, 2, '#7a4b1e');
    },
    'c': (c, x, y, gx, gy) => { // cactus
      tiles.s(c, x, y, gx, gy);
      R(c, x + 6, y + 2, 4, 13, '#3b8f4a'); R(c, x + 2, y + 6, 3, 5, '#3b8f4a'); R(c, x + 11, y + 4, 3, 5, '#3b8f4a');
      R(c, x + 4, y + 9, 2, 2, '#3b8f4a'); R(c, x + 10, y + 7, 2, 2, '#3b8f4a'); R(c, x + 7, y + 3, 1, 11, '#5fb86c');
    },
    'M': (c, x, y, gx, gy, t, m, base) => mountain(c, x, y, gx, gy, false, base),
    'A': (c, x, y, gx, gy, t, m, base) => mountain(c, x, y, gx, gy, true, base),
    'r': (c, x, y, gx, gy) => {
      grassBase(c, x, y, gx, gy);
      R(c, x + 2, y + 5, 12, 9, P.stoneD); R(c, x + 3, y + 4, 10, 9, P.stone); R(c, x + 4, y + 5, 4, 2, P.stoneL);
    },
    'n': (c, x, y, gx, gy) => {
      R(c, x, y, T, T, P.snow);
      for (let i = 0; i < 3; i++) R(c, x + ((hash(gx, gy, i) * 13) | 0), y + ((hash(gx, gy, i + 3) * 14) | 0), 3, 1, P.snowD);
    },
    'i': (c, x, y, gx, gy) => { R(c, x, y, T, T, '#bfe6f5'); R(c, x + 2, y + 3, 6, 1, '#ffffff'); R(c, x + 9, y + 10, 4, 1, '#ffffff'); },
    'W': (c, x, y, gx, gy) => { // stone wall
      R(c, x, y, T, T, P.stoneD);
      for (let r = 0; r < 4; r++) for (let k = 0; k < 2; k++) {
        const o = r % 2 ? 4 : 0; R(c, x + ((k * 8 + o) % 16), y + r * 4, 7, 3, hash(gx * 3 + k, gy * 4 + r) > .5 ? P.stone : '#7d828b');
      }
    },
    'D': (c, x, y, gx, gy) => { // dungeon wall
      R(c, x, y, T, T, P.dWallD);
      for (let r = 0; r < 4; r++) for (let k = 0; k < 2; k++) {
        const o = r % 2 ? 4 : 0; R(c, x + ((k * 8 + o) % 16), y + r * 4, 7, 3, hash(gx * 3 + k, gy * 4 + r) > .5 ? P.dWall : '#4d476a');
      }
    },
    'f': (c, x, y, gx, gy) => {
      R(c, x, y, T, T, P.dFloor); R(c, x, y, T, 1, P.dFloorL); R(c, x, y, 1, T, P.dFloorL);
      if (hash(gx, gy) > .7) R(c, x + 5, y + 6, 3, 1, P.dFloorL);
    },
    'R': (c, x, y, gx, gy) => { // roof
      R(c, x, y, T, T, P.roof);
      for (let r = 0; r < 4; r++) R(c, x, y + r * 4 + 3, T, 1, P.roofD);
      for (let r = 0; r < 4; r++) R(c, x + (r % 2 ? 4 : 10), y + r * 4, 1, 3, P.roofD);
    },
    'h': (c, x, y, gx, gy) => { // house wall with window
      R(c, x, y, T, T, P.wall); R(c, x, y + 14, T, 2, P.wallD);
      R(c, x + 4, y + 4, 8, 6, P.k); R(c, x + 5, y + 5, 6, 4, '#9fd3ff'); R(c, x + 7, y + 5, 1, 4, P.k); R(c, x + 5, y + 7, 6, 1, P.k);
    },
    'd': (c, x, y, gx, gy) => { // door
      R(c, x, y, T, T, P.wall); R(c, x, y + 14, T, 2, P.wallD);
      R(c, x + 3, y + 2, 10, 14, P.k); R(c, x + 4, y + 3, 8, 13, P.wood); R(c, x + 7, y + 3, 1, 13, P.woodD); R(c, x + 10, y + 9, 1, 2, P.gold);
    },
    'b': (c, x, y, gx, gy, t, m) => { // bridge
      water(c, x, y, gx, gy, t, m, P.water);
      R(c, x, y + 2, T, 12, P.wood);
      for (let i = 0; i < 4; i++) R(c, x + i * 4 + 3, y + 2, 1, 12, P.woodD);
      R(c, x, y + 2, T, 1, P.woodD); R(c, x, y + 13, T, 1, P.woodD);
    },
    'B': (c, x, y, gx, gy, t, m) => { // bridge (up-down)
      water(c, x, y, gx, gy, t, m, P.water);
      R(c, x + 2, y, 12, T, P.wood);
      for (let i = 0; i < 4; i++) R(c, x + 2, y + i * 4 + 3, 12, 1, P.woodD);
      R(c, x + 2, y, 1, T, P.woodD); R(c, x + 13, y, 1, T, P.woodD);
    },
    'o': (c, x, y, gx, gy) => { // tilled soil
      R(c, x, y, T, T, P.soil);
      for (let r = 0; r < 4; r++) R(c, x + 1, y + r * 4 + 2, 14, 1, P.soilD);
    },
    '1': (c, x, y, gx, gy) => { tiles.o(c, x, y, gx, gy); R(c, x + 7, y + 8, 2, 4, P.leafL); R(c, x + 5, y + 7, 2, 2, P.leafL); },
    '2': (c, x, y, gx, gy) => { tiles.o(c, x, y, gx, gy); R(c, x + 7, y + 4, 2, 9, P.leaf); R(c, x + 4, y + 5, 3, 3, P.leafL); R(c, x + 9, y + 7, 3, 3, P.leafL); },
    '3': (c, x, y, gx, gy) => { // ripe coffee bush
      tiles.o(c, x, y, gx, gy);
      R(c, x + 3, y + 3, 10, 10, P.leaf); R(c, x + 2, y + 5, 12, 6, P.leaf); R(c, x + 4, y + 4, 3, 2, P.leafL);
      [[5, 7], [9, 5], [10, 9], [6, 10], [8, 8]].forEach(([a, b]) => R(c, x + a, y + b, 2, 2, '#d1263a'));
    },
    'w': (c, x, y, gx, gy) => { // wheat
      R(c, x, y, T, T, '#d9b44a');
      for (let i = 0; i < 5; i++) { R(c, x + 1 + i * 3, y + 3, 1, 12, '#b98e2a'); R(c, x + i * 3, y + 2 + (i % 2) * 2, 2, 3, '#f0d27a'); }
    },
    'q': (c, x, y, gx, gy, t, m) => { // rice paddy
      water(c, x, y, gx, gy, t, m, '#4f9fc9');
      for (let r = 0; r < 3; r++) for (let k = 0; k < 4; k++) { R(c, x + 2 + k * 4, y + 2 + r * 5, 1, 4, '#7ccf5a'); R(c, x + 1 + k * 4, y + 3 + r * 5, 1, 2, '#58b247'); }
    },
    'F': (c, x, y, gx, gy) => { // fence
      grassBase(c, x, y, gx, gy);
      R(c, x, y + 6, T, 2, P.wood); R(c, x, y + 11, T, 2, P.wood);
      R(c, x + 2, y + 4, 2, 11, P.woodD); R(c, x + 11, y + 4, 2, 11, P.woodD);
    },
    'x': (c, x, y, gx, gy) => { // sign post
      grassBase(c, x, y, gx, gy);
      R(c, x + 7, y + 9, 2, 6, P.woodD); R(c, x + 2, y + 2, 12, 8, P.k); R(c, x + 3, y + 3, 10, 6, P.wood);
      R(c, x + 4, y + 5, 8, 1, P.woodD); R(c, x + 4, y + 7, 6, 1, P.woodD);
    },
    'C': (c, x, y, gx, gy) => { // little city (world map)
      grassBase(c, x, y, gx, gy);
      R(c, x + 1, y + 7, 5, 8, P.wall); R(c, x + 1, y + 5, 5, 2, P.roof);
      R(c, x + 6, y + 3, 4, 12, P.stoneL); R(c, x + 6, y + 2, 4, 1, P.stoneD);
      R(c, x + 10, y + 8, 5, 7, P.wall); R(c, x + 10, y + 6, 5, 2, '#3c6fb4');
      for (let i = 0; i < 4; i++) R(c, x + 7, y + 5 + i * 3, 2, 1, '#ffe36e');
    },
    'L': (c, x, y, gx, gy) => { // lava / volcano glow
      R(c, x, y, T, T, '#c4401d');
      R(c, x + ((hash(gx, gy) * 10) | 0), y + 4, 5, 2, '#ffb13b'); R(c, x + 2, y + 11, 6, 2, '#ff7a2a');
    },
    ' ': (c, x, y) => R(c, x, y, T, T, '#000000')
  };

  function water(c, x, y, gx, gy, t, m, col) {
    R(c, x, y, T, T, col);
    const ph = ((t || 0) / 450 + hash(gx, gy) * 6);
    for (let i = 0; i < 2; i++) {
      const wx = x + ((hash(gx, gy, i) * 10) | 0) + Math.round(Math.sin(ph + i) * 2);
      const wy = y + 3 + i * 7;
      R(c, wx, wy, 4, 1, P.waterL);
    }
    if (m) { // foam where water meets land
      const wet = ch => '~=bBq'.includes(ch);
      const at = (dx, dy) => (m[gy + dy] || '')[gx + dx];
      if (at(0, -1) !== undefined && !wet(at(0, -1))) R(c, x, y, T, 1, P.foam);
      if (at(0, 1) !== undefined && !wet(at(0, 1))) R(c, x, y + 15, T, 1, P.foam);
      if (at(-1, 0) !== undefined && !wet(at(-1, 0))) R(c, x, y, 1, T, P.foam);
      if (at(1, 0) !== undefined && !wet(at(1, 0))) R(c, x + 15, y, 1, T, P.foam);
    }
  }

  function mountain(c, x, y, gx, gy, snowy, base) {
    (base === 'n' ? tiles.n : base === 's' ? tiles.s : grassBase)(c, x, y, gx, gy);
    for (let r = 0; r < 15; r++) {
      const half = Math.min(8, (r + 2) * 0.55) | 0;
      R(c, x + 8 - half, y + 1 + r, half, 1, P.stone);
      R(c, x + 8, y + 1 + r, half, 1, P.stoneD);
    }
    R(c, x + 5, y + 7, 2, 1, P.stoneL); R(c, x + 4, y + 10, 2, 1, P.stoneL);
    if (snowy) { R(c, x + 6, y + 1, 4, 2, P.snow); R(c, x + 5, y + 3, 6, 2, P.snow); R(c, x + 4, y + 5, 2, 1, P.snow); R(c, x + 9, y + 5, 2, 1, P.snowD); }
  }

  const SPAL = {

  function sprite(c, name, x, y, o = {}) {
    const rows = SPR[name]; if (!rows) return;
    const pal = Object.assign({}, SPAL, name === 'smudge' ? SMUDGE : {}, name === 'page' ? PAGE : {}, o.pal || {});

        c.fillStyle = pal[ch] || '#ff00ff';
        c.fillRect(x + k * s, y + (r + bob) * s, s, s);

  }

  // a generic coin (code-drawn circle)
  function coin(c, x, y, t = 0) {

  /* ---------- map drawing ---------- */
  // rows: array of strings. base: optional map of same size giving ground under trees/mountains

  /* soft, ragged edges where one kind of ground meets another (grass grows over paths, snow over grass, ...) */

  /* ---------------- trees and plants ---------------- */
  function roundTree(c, x, y, gx, gy, t) {
    const s = sway(t, gx, gy);
    shadow(c, x, y + 13, 12);

    [1, 5, 'k'], [1, 6, 'k'], [1, 7, 'k'], [1, 8, 'k'], [1, 9, 'k'], [1, 10, 'k'],

  const STYLES = ['npc', 'npcLong', 'npcBun', 'npc', 'npcLong'];
  WW.personSprite = p => {
    const look = p.look || {};
    if (look.hat) return 'npcHat';
    if (look.style) return { short: 'npc', long: 'npcLong', bun: 'npcBun' }[look.style] || 'npc';
    const name = (p.name && (p.name.en || p.name)) || '';
    let h = 0; for (const ch of String(name)) h = (h * 31 + ch.charCodeAt(0)) >>> 0;
    return STYLES[h % STYLES.length];
  };

  WW.drawPerson = (c, p, x, y, t, phase = 0) => {
    shadow(c, x, y + 15, 10);

    if (!calm && (((t || 0) + phase * 977) % 3700) < 130) pal.e = pal.s;
    WW.sprite(c, WW.personSprite(p), x, y, { pal });
  };

})();

    realm: { en: 'Realm', es: 'Reino', fa: 'سرزمین' },

  WW.resetHero = () => { const lang = WW.save.lang; WW.save = blank(); WW.save.lang = lang; WW.store(); };
  WW.doneCount = () => Object.keys(WW.save.episodes).filter(k => WW.save.episodes[k] && WW.save.episodes[k].done).length;
  WW.hasTool = id => { const t = WW.TOOLS.find(x => x.id === id); return !!(t && WW.save.episodes[t.ep] && WW.save.episodes[t.ep].done); };
  /* ---------------- what the five powers do ----------------
     Each power unlocks a level at 3 points and another at 12. WW.tier('loc') is 0, 1 or 2. */
  WW.TIERS = [3, 12];
  WW.tier = k => WW.TIERS.filter(n => (WW.save.stats[k] || 0) >= n).length;
  WW.PERKS = {
    loc: [{ en: 'Compass arrow: an arrow points to your next goal', es: 'Flecha brújula: una flecha señala tu próxima meta', fa: 'تیر قطب‌نما: یک تیر هدف بعدی‌ات را نشان می‌دهد' },

    pla: [{ en: 'Strong roots: +1 heart', es: 'Raíces fuertes: +1 corazón', fa: 'ریشهٔ قوی: +۱ قلب' },

  };

  /* ---------------- Passport Code ----------------
     15 letters/numbers: episodes done (24 bits) + five powers (5 bits each) + look (9 bits) + version (2 bits) + check (15 bits) */
  const ALPH = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
  function check15(n) { let h = 0x2a1; let x = n; for (let i = 0; i < 12; i++) { h = (h * 31 + Number(x & 31n)) & 0x7fff; x >>= 5n; } return BigInt(h); }
  WW.passportCode = (s = WW.save) => {
    let n = 0n;
    WW.EPISODES.forEach((e, i) => { if (s.episodes[e.id] && s.episodes[e.id].done) n |= 1n << BigInt(i); });
    let shift = 24n;
    WW.THEMES.forEach(t => { n |= BigInt(Math.min(31, s.stats[t.k] || 0)) << shift; shift += 5n; });
    const l = s.look || {};
    n |= BigInt((l.skin ?? 1) & 7) << 49n; n |= BigInt((l.hair || 0) & 7) << 52n; n |= BigInt((l.hat || 0) & 7) << 55n;
    n |= 1n << 58n; // version 1
    const full = (n << 15n) | check15(n);
    let out = '';
    for (let i = 0; i < 15; i++) out = ALPH[Number((full >> BigInt(i * 5)) & 31n)] + out;
    return 'WW-' + out.slice(0, 5) + '-' + out.slice(5, 10) + '-' + out.slice(10);
  };

    const c = String(code || '').toUpperCase().replace(/^WW/, '').replace(/[^0-9A-Z]/g, '').replace(/O/g, '0').replace(/[IL]/g, '1');
    if (c.length !== 15) return null;
    let full = 0n;
    for (const ch of c) { const v = ALPH.indexOf(ch); if (v < 0) return null; full = (full << 5n) | BigInt(v); }
    const n = full >> 15n;
    if ((full & 0x7fffn) !== check15(n)) return null;
    const out = { episodes: {}, stats: {}, look: {} };
    WW.EPISODES.forEach((e, i) => { if ((n >> BigInt(i)) & 1n) out.episodes[e.id] = { done: true, stars: 1 }; });
    let shift = 24n;
    WW.THEMES.forEach(t => { out.stats[t.k] = Number((n >> shift) & 31n); shift += 5n; });
    out.look = { skin: Number((n >> 49n) & 7n), hair: Number((n >> 52n) & 7n), hat: Number((n >> 55n) & 7n) };
    return out;
  };
  // never lose progress: keep the best of both
  WW.merge = other => {
    const s = WW.save;
    for (const id in other.episodes || {}) {
      const a = s.episodes[id], b = other.episodes[id];
      if (!a || (!a.done && b.done) || (b.stars || 0) > (a.stars || 0)) s.episodes[id] = Object.assign({}, a, b);
    }
    for (const k in other.stats || {}) s.stats[k] = Math.max(s.stats[k] || 0, other.stats[k] || 0);
    if (other.look && !s.name) s.look = other.look;
    // coins: keep the most ever earned and the most ever spent, so spent coins never come back
    if (other.coins != null) {
      const spent = Math.max(s.spent || 0, other.spent || 0);
      const earned = Math.max((s.coins || 0) + (s.spent || 0), (other.coins || 0) + (other.spent || 0));
      s.spent = spent; s.coins = Math.max(0, earned - spent);
    }
    WW.store();
  };

  /* ---------------- class Google Sheet ---------------- */
  WW.sheetOn = () => !!(CFG.SHEET_URL && WW.save.name && WW.save.cls && /^\d{4}$/.test(WW.save.pin || ''));
  function jsonp(url) {
    return new Promise((res, rej) => {
      const cb = 'wwcb' + Date.now(); const s = document.createElement('script');
      const done = () => { delete window[cb]; s.remove(); };
      window[cb] = d => { done(); res(d); };
      s.onerror = () => { done(); rej(new Error('jsonp')); };
      s.src = url + '&callback=' + cb; document.head.appendChild(s);
      setTimeout(() => { if (window[cb]) { done(); rej(new Error('timeout')); } }, 9000);
    });
  }
  WW.sheetLoad = async () => {
    if (!WW.sheetOn()) return { ok: false, off: true };
    const s = WW.save;
    const url = CFG.SHEET_URL + '?action=load&cls=' + encodeURIComponent(s.cls) + '&name=' + encodeURIComponent(s.name) + '&pin=' + encodeURIComponent(s.pin);
    let d;
    try { d = await (await fetch(url)).json(); } catch (e) { try { d = await jsonp(url); } catch (e2) { return { ok: false }; } }
    if (d && d.ok && d.found && d.state) {
      const st = d.state;
      WW.merge({ episodes: st.episodes || {}, stats: { loc: st.loc, pla: st.pla, hei: st.hei, mov: st.mov, reg: st.reg }, coins: +st.coins || 0, spent: +st.spent || 0, look: st.look });
    }
    return d || { ok: false };
  };
  WW.spend = n => { WW.save.coins -= n; WW.save.spent = (WW.save.spent || 0) + n; WW.store(); };
  // save the hero to the class Sheet after each goal (not only at the end), so leaving halfway loses little
  WW.sheetSync = () => { if (WW.sheetOn()) WW.sheetSave(null); };
  WW.sheetSave = async (log) => {
    if (!WW.sheetOn()) return { ok: false, off: true };
    const s = WW.save;
    const body = {
      action: 'save', cls: s.cls, name: s.name, pin: s.pin,
      state: { look: s.look, loc: s.stats.loc, pla: s.stats.pla, hei: s.stats.hei, mov: s.stats.mov, reg: s.stats.reg, heartsMax: WW.heartsMax(), coins: s.coins, spent: s.spent || 0, episodes: s.episodes, tools: WW.TOOLS.filter(t => WW.hasTool(t.id)).map(t => t.id), passport: WW.passportCode(), version: 1 },
      log
    };
    try {
      await fetch(CFG.SHEET_URL, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(body) });
      return { ok: true };
    } catch (e) { return { ok: false }; }
  };
})();

/* ui.js */
/* WORLDWALKER engine · everything with words: top bar, talk boxes, passport, start and finish screens */
(function () {
  const L = t => WW.L(t), T = k => WW.T(k);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  WW.esc = esc;

  /* [[key|shown words]] -> yellow tap-to-define word */
  WW.rich = t => L(t).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, (m, k, w) => `<span class="word" data-k="${esc(k.trim().toLowerCase())}" tabindex="0">${w}</span>`)
    .replace(/\[\[([^\]]+)\]\]/g, (m, w) => `<span class="word" data-k="${esc(w.trim().toLowerCase())}" tabindex="0">${w}</span>`);
  WW.plain = t => L(t).replace(/\[\[([^|\]]+)\|([^\]]+)\]\]/g, '$2').replace(/\[\[([^\]]+)\]\]/g, '$1').replace(/<[^>]+>/g, '');

  const $ = id => document.getElementById(id);
  const ui = WW.ui = { stack: [] };

  /* ---------------- overlay ---------------- */
  ui.open = (opts) => {
    const ov = $('ww-ov');
    const h = { opts, close() { ui.close(h); }, render() { draw(); } };
    function draw() {
      ov.className = 'ov' + (opts.cls ? ' ' + opts.cls : '');
      ov.setAttribute('dir', WW.dir());
      ov.innerHTML = '';
      const box = document.createElement('div');
      box.className = 'ov-box';
      ov.appendChild(box);
      opts.render(box, h);
      ov.scrollTop = 0;
    }
    ui.stack.push(h);
    $('ww-screen').classList.add('ovopen');
    draw();
    WW.paused = true;
    return h;
  };
  ui.close = (h) => {
    ui.stack = ui.stack.filter(x => x !== h);
    const top = ui.stack[ui.stack.length - 1];
    if (top) top.render();
    else { $('ww-ov').className = 'ov hidden'; $('ww-ov').innerHTML = ''; $('ww-screen').classList.remove('ovopen'); WW.paused = false; hidePop(); }
    if (h.opts.onClose) h.opts.onClose();
  };
  ui.top = () => ui.stack[ui.stack.length - 1];
  WW.onLang(() => { const t = ui.top(); if (t) t.render(); ui.hud(); ui.quest(); });

  /* definition pop-up for yellow words */
  let pop;
  function hidePop() { if (pop) pop.style.display = 'none'; }
  document.addEventListener('click', e => {
    const w = e.target.closest && e.target.closest('.word');
    if (!w) { hidePop(); return; }
    const words = (WW.ep && WW.ep.words) || {};
    const d = words[w.dataset.k];
    if (!d) return;
    if (!pop) { pop = document.createElement('div'); pop.className = 'defpop'; $('ww-screen').appendChild(pop); }
    pop.setAttribute('dir', WW.dir());
    pop.innerHTML = `<b>${esc(w.textContent)}</b> — ${esc(L(d))}`;
    pop.style.display = 'block';
    const sr = $('ww-screen').getBoundingClientRect(), r = w.getBoundingClientRect();
    pop.style.left = Math.max(6, Math.min(sr.width - 300, r.left - sr.left)) + 'px';
    pop.style.top = (r.bottom - sr.top + 6) + 'px';
    WW.sfx('blip');
  });

  /* ---------------- toast ---------------- */
  // small messages in the corner; several can show at once. big = a "New power!" banner
  WW.toast = (html, col, big) => {
    const box = $('ww-toast'); if (!box) return;
    const el = document.createElement('div'); el.className = 'tst' + (big ? ' big' : '');
    el.innerHTML = html; el.style.background = col || '#3fa34d'; el.setAttribute('dir', WW.dir());
    box.appendChild(el);
    while (box.children.length > 4) box.firstChild.remove();
    setTimeout(() => el.remove(), big ? 6000 : 3200);
  };

  /* ---------------- top bar ---------------- */
  ui.hud = () => {
    const el = $('ww-hud'); if (!el || !WW.ep) return;
    const run = WW.run || {}, max = WW.heartsMax();
    let h = '<div class="hud-left">';
    for (let i = 0; i < max; i++) h += `<span class="hrt ${i < (run.hearts ?? max) ? '' : 'empty'}">♥</span>`;
    h += `<span class="hud-coin" title="${esc(T('coins'))}">● ${WW.save.coins || 0}</span></div>`;
    h += `<div class="hud-mid">${esc(WW.ep.id)} · ${esc(WW.plain(WW.ep.title))}</div>`;
    h += '<div class="hud-right">';
    WW.THEMES.forEach(th => {
      const v = WW.save.stats[th.k] || 0;
      h += `<span class="meter" title="${esc(L(th.full))}: ${v}"><i>${th.icon}</i><span class="track"><b style="width:${Math.min(100, v / 30 * 100)}%;background:${th.col}"></b></span></span>`;
    });

    let page = 0, easy = false, stage = 'read', picked = null;

    WW.sfx('blip');
    ui.open({
      cls: 'talkov',
      render(box, h) {
        const face = WW.spriteCanvas(WW.personSprite ? WW.personSprite(npc) : 'npc', WW.lookPal(npc.look), 4, 11);
        face.className = 'face';
        const head = document.createElement('div'); head.className = 'talk-head';
        head.appendChild(face);
        head.insertAdjacentHTML('beforeend', `<div><div class="who">${esc(L(npc.name))}</div><div class="role">${esc(L(npc.role))}</div></div>`);
        box.appendChild(head);
        const body = document.createElement('div'); body.className = 'talk-body';
        box.appendChild(body);
        if (stage === 'read') {
          const ln = lines[page] || {};
          const txt = easy && ln.easy ? ln.easy : ln;
          body.innerHTML = `<p class="say">${WW.rich(txt)}</p><p class="hint">${page === 0 && /\[\[/.test(L(ln)) ? esc(T('tapWord')) : ''}</p>`;
          const acts = document.createElement('div'); acts.className = 'acts';
          if (ln.easy) acts.appendChild(btn(easy ? T('harder') : T('easier'), 'ghost', () => { easy = !easy; h.render(); }));
          if (page > 0) acts.appendChild(btn(T('back'), 'ghost', () => { page--; h.render(); }));
          acts.appendChild(btn(page < lines.length - 1 ? T('next') + ' ▶' : (npc.ask ? T('answer') + ' ▶' : npc.doneLabel ? esc(npc.doneLabel) + ' ▶' : T('close')), 'gold', () => {
            WW.sfx('blip');
            if (page < lines.length - 1) { page++; h.render(); }
            else if (npc.ask) { stage = 'ask'; h.render(); }
            else { h.close(); onDone && onDone(true); }
          }));
          body.appendChild(acts);
        } else {
          const a = npc.ask;
          body.innerHTML = `<p class="say q">${WW.rich(a.q)}</p>`;
          const list = document.createElement('div'); list.className = 'choices';
          WW.shuffle(a.choices.map((_, i) => i), (npc.x || 1) * 7 + (npc.y || 1)).forEach(i => {
            const ch = a.choices[i];
            const b = document.createElement('button'); b.dataset.i = i;
            b.innerHTML = WW.rich(ch.t || ch);
            if (picked != null && i === picked) b.className = ch.ok ? 'right' : 'wrong';
            b.onclick = () => {
              picked = i;
              if (ch.ok) {
                WW.sfx('good');
                if (!WW.run.asked.has(npc.id)) { WW.run.asked.add(npc.id); WW.gain(a.stat || 'pla', 1, 2, T('why_talk') + ' ' + WW.plain(npc.name)); WW.run.log.push({ who: WW.plain(npc.name), q: WW.plain(a.q), a: WW.plain(ch.t || ch), tries: (WW.run.tries[npc.id] || 0) + 1 }); }
              } else { WW.sfx('bad'); WW.run.tries[npc.id] = (WW.run.tries[npc.id] || 0) + 1; }
              h.render();
            };
            list.appendChild(b);
          });
          body.appendChild(list);
          if (picked != null) {
            const ch = a.choices[picked];
            const fb = document.createElement('div'); fb.className = 'fb ' + (ch.ok ? 'right' : 'wrong');
            fb.innerHTML = `<b>${esc(ch.ok ? T('right') : T('wrong'))}</b> ${WW.rich(ch.why || '')}`;

  function logEntry() {
    const r = WW.run;
    return { episode: WW.ep.id, stars: r.stars, heartsLost: r.heartsLost, minutes: Math.round((Date.now() - r.t0) / 60000), missed: r.missed.map(i => 'Q' + (i + 1)), reflection: r.reflection || '' };
  }
  function workText() {
    const r = WW.run, ep = WW.ep, s = WW.save;
    const en = t => (t && t.en) || WW.plain(t);
    const lines = [];
    lines.push(`WORLDWALKER — Episode ${ep.id}: ${WW.plain({ en: en(ep.title) })}`);
    lines.push(`Name: ${s.name || ''}   Class: ${s.cls || ''}   Date: ${new Date().toLocaleDateString()}`);

    lines.push('');
    lines.push('TALKS (question — my answer — tries)');
    r.log.forEach(l => lines.push(`- ${l.who}: ${l.q} — ${l.a} (${l.tries} ${l.tries === 1 ? 'try' : 'tries'})`));
    lines.push('');
    if (WW.quest.on()) lines.push(WW.quest.log());
    lines.push(`CHALLENGE: ${WW.plain(ep.challenge.title)} — solved in ${r.challengeTries} ${r.challengeTries === 1 ? 'try' : 'tries'}`);
    lines.push(`GRUMP TRIAL: ${r.missed.length} missed ${r.missed.length ? '(' + r.missed.map(i => WW.plain(ep.boss.questions[i].q)).join(' | ') + ')' : ''}`);
    lines.push('');
    lines.push('REFLECTION');
    lines.push('Q: ' + WW.plain(ep.reflect.q));
    lines.push('A: ' + (r.reflection || '(blank)'));
    lines.push('');
    lines.push('POWERS: ' + WW.THEMES.map(t => `${WW.plain(t.full)} ${s.stats[t.k] || 0}`).join(' · '));
    lines.push('PASSPORT CODE: ' + WW.passportCode());
    return lines.join('\n');
  }
  WW.workText = workText;
})();

/* challenges.js */
/* WORLDWALKER engine · the compass-stone challenges and the Grump trial
   Challenge types (set by ep.challenge.type):
     sort   – put each card in the right group (style:'bands' draws groups as land bands, e.g. elevation)
     order  – tap the cards in the right order
     claim  – choose one option, then back it up with one reason of each kind
     combo  – set switches; some settings work and some do not
     table  – read a small table of facts, answer questions about it            */
(function () {
  const L = t => WW.L(t), T = k => WW.T(k), esc = s => WW.esc(s), btn = (a, b, c) => WW.btn(a, b, c);
  const shuffle = (a, seed = 7) => { a = a.slice(); let s = seed; for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  WW.shuffle = shuffle;

  function header(box, ch) {
    const pip = WW.spriteCanvas('stone', { W: '#9aa3ad', G: '#5e636b', y: '#f2c14e', r: '#e04848', n: '#2f6fd6' }, 3); pip.className = 'chface';
    const hd = document.createElement('div'); hd.className = 'ch-head';
    hd.appendChild(pip);
    hd.insertAdjacentHTML('beforeend', `<div><h3>${esc(L(ch.title))}</h3>${(ch.intro ? `<p class="say">${WW.rich(ch.intro)}</p>` : '')}</div>`);
    box.appendChild(hd);
  }
  function solved(h, ch, okText) {
    const r = WW.run;
    if (!r.challengeDone) {
      r.challengeDone = true;
      WW.gain(ch.stat || 'hei', 2, 5, T('why_stone')); WW.sheetSync();
      WW.sfx('win');
      WW.game.onChallengeDone();
    }
    return okText;
  }
  function doneBlock(box, h, ch) {
    const d = document.createElement('div'); d.className = 'fb right';
    d.innerHTML = `<b>${esc(T('allRight'))}</b> ${WW.rich(ch.success || '')}`;
    box.appendChild(d);
    const acts = document.createElement('div'); acts.className = 'acts';
    acts.appendChild(btn(T('cont') + ' ▶', 'gold', () => h.close()));
    box.appendChild(acts);
  }

  /* ---------------- sort ---------------- */
  function sortUI(ch) {
    const place = {}; // item index -> bin id
    let sel = null, checked = false;
    const order = shuffle(ch.items.map((_, i) => i), ch.items.length * 13 + 5);
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        header(box, ch);
        const done = WW.run.challengeDone;
        box.insertAdjacentHTML('beforeend', `<p class="hint">${esc(T('pickItem'))}</p>`);
        const pool = document.createElement('div'); pool.className = 'pool';
        order.filter(i => place[i] == null).forEach(i => pool.appendChild(card(i)));
        box.appendChild(pool);
        const bins = document.createElement('div'); bins.className = 'bins ' + (ch.style === 'bands' ? 'bands' : '');
        ch.bins.forEach(b => {
          const el = document.createElement('div'); el.className = 'bin';
          if (b.tile && ch.style === 'bands') {
            const cv = document.createElement('canvas'); cv.width = 16 * 6; cv.height = 16; cv.className = 'bintile';
            const x = cv.getContext('2d'); for (let i = 0; i < 6; i++) WW.tiles[b.tile](x, i * 16, 0, i, 1, 0);
            el.appendChild(cv);
          }
          el.insertAdjacentHTML('beforeend', `<div class="binlabel">${b.icon ? b.icon + ' ' : ''}${WW.rich(b.label)}${b.sub ? `<span class="small"> · ${WW.rich(b.sub)}</span>` : ''}</div>`);
          const inside = document.createElement('div'); inside.className = 'binin';
          order.filter(i => place[i] === b.id).forEach(i => inside.appendChild(card(i)));
          el.appendChild(inside);
          el.onclick = e => {
            if (e.target.closest('.card') || done) return;
            if (sel != null) { place[sel] = b.id; sel = null; checked = false; WW.sfx('blip'); h.render(); }
          };
          el.classList.toggle('target', sel != null);
          bins.appendChild(el);
        });
        box.appendChild(bins);
        if (done) return doneBlock(box, h, ch);
        const all = Object.keys(place).length === ch.items.length;
        const acts = document.createElement('div'); acts.className = 'acts';
        const cb = btn(T('check'), 'gold', () => {
          checked = true; WW.run.challengeTries++;
          const wrong = ch.items.filter((it, i) => place[i] !== it.bin);
          if (!wrong.length) { solved(h, ch); } else WW.sfx('bad');
          h.render();
        });
        cb.disabled = !all; acts.appendChild(cb);
        box.appendChild(acts);
        if (checked) {
          const wrong = ch.items.map((it, i) => [it, i]).filter(([it, i]) => place[i] !== it.bin);
          if (wrong.length) {
            const fb = document.createElement('div'); fb.className = 'fb wrong';
            fb.innerHTML = `<b>${esc(T('someWrong'))}</b>` + (wrong[0][0].why ? ` ${WW.rich(wrong[0][0].why)}` : '');
            box.appendChild(fb);
          }
        }
        function card(i) {
          const it = ch.items[i];
          const c = document.createElement('button'); c.className = 'card';
          if (sel === i) c.classList.add('sel');
          if (checked && place[i] != null) c.classList.add(place[i] === it.bin ? 'right' : 'wrong');
          c.innerHTML = (it.icon ? `<span class="ic">${it.icon}</span>` : '') + WW.rich(it.t);
          c.onclick = (e) => {
            e.stopPropagation(); if (done) return;
            if (sel != null && sel !== i && place[i] != null) { place[sel] = place[i]; sel = null; } // drop the chosen card into this card's group
            else if (place[i] != null) { delete place[i]; sel = i; } else sel = sel === i ? null : i;
            checked = false; WW.sfx('blip'); h.render();
          };
          c.dataset.i = i;
          return c;
        }
      }
    });
  }

  /* ---------------- order ---------------- */
  function orderUI(ch) {
    let seq = [], checked = false;
    const order = shuffle(ch.items.map((_, i) => i), ch.items.length * 7 + 3);
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        header(box, ch);
        const done = WW.run.challengeDone;
        box.insertAdjacentHTML('beforeend', `<p class="hint">${esc(T('pickOrder'))}</p>`);
        const line = document.createElement('ol'); line.className = 'seq';
        seq.forEach((i, pos) => {
          const li = document.createElement('li');
          li.className = 'card' + (checked ? (i === pos ? ' right' : ' wrong') : '');
          li.innerHTML = (ch.items[i].icon ? `<span class="ic">${ch.items[i].icon}</span>` : '') + WW.rich(ch.items[i].t);
          line.appendChild(li);
        });
        box.appendChild(line);
        const pool = document.createElement('div'); pool.className = 'pool';
        order.filter(i => !seq.includes(i)).forEach(i => {
          const c = document.createElement('button'); c.className = 'card'; c.dataset.i = i;
          c.innerHTML = (ch.items[i].icon ? `<span class="ic">${ch.items[i].icon}</span>` : '') + WW.rich(ch.items[i].t);
          c.onclick = () => { if (done) return; seq.push(i); checked = false; WW.sfx('blip'); h.render(); };
          pool.appendChild(c);
        });
        box.appendChild(pool);
        if (done) return doneBlock(box, h, ch);
        const acts = document.createElement('div'); acts.className = 'acts';
        const cb = btn(T('check'), 'gold', () => {
          checked = true; WW.run.challengeTries++;
          if (seq.every((v, k) => v === k)) solved(h, ch); else WW.sfx('bad');
          h.render();
        });
        cb.disabled = seq.length !== ch.items.length; acts.appendChild(cb);
        acts.appendChild(btn(T('reset'), 'ghost', () => { seq = []; checked = false; h.render(); }));
        box.appendChild(acts);
        if (checked && !WW.run.challengeDone) {
          const first = seq.findIndex((v, k) => v !== k);
          const fb = document.createElement('div'); fb.className = 'fb wrong';
          fb.innerHTML = `<b>${esc(T('wrong'))}</b> ${WW.rich(ch.why || '')} <span class="small">(#${first + 1})</span>`;
          box.appendChild(fb);
        }
      }
    });
  }

  /* ---------------- claim ---------------- */
  function claimUI(ch) {
    let pick = null, why = {}, checked = false;
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        header(box, ch);
        const done = WW.run.challengeDone;
        box.insertAdjacentHTML('beforeend', `<h4>1 · ${esc(T('choose'))}</h4>`);
        const opts = document.createElement('div'); opts.className = 'opts';
        ch.options.forEach((o, i) => {
          const b = document.createElement('button'); b.className = 'opt' + (pick === i ? ' sel' : ''); b.dataset.i = i;
          b.innerHTML = `<b>${o.icon ? o.icon + ' ' : ''}${WW.rich(o.name)}</b>${o.desc ? `<span>${WW.rich(o.desc)}</span>` : ''}`;
          b.onclick = () => { if (done) return; pick = i; why = {}; checked = false; WW.sfx('blip'); h.render(); };
          opts.appendChild(b);
        });
        box.appendChild(opts);
        if (pick != null) {
          box.insertAdjacentHTML('beforeend', `<h4>2 · ${esc(T('because'))}</h4>`);
          ch.kinds.forEach(k => {
            const grp = document.createElement('div'); grp.className = 'kind';
            grp.innerHTML = `<div class="klabel">${WW.rich(k.label)}</div>`;
            ch.reasons.forEach((r, ri) => {
              if (r.kind !== k.id) return;
              const b = document.createElement('button'); b.className = 'reason' + (why[k.id] === ri ? ' sel' : ''); b.dataset.r = ri;
              if (checked && why[k.id] === ri) b.classList.add(r.fits.includes(pick) ? 'right' : 'wrong');
              b.innerHTML = WW.rich(r.t);
              b.onclick = () => { if (done) return; why[k.id] = ri; checked = false; WW.sfx('blip'); h.render(); };
              grp.appendChild(b);
            });
            box.appendChild(grp);
          });
        }
        if (done) {
          const o = ch.options[pick ?? WW.run.claimPick ?? 0];
          if (o && o.result) box.insertAdjacentHTML('beforeend', `<div class="fb right">${WW.rich(o.result)}</div>`);
          return doneBlock(box, h, ch);
        }
        const ready = pick != null && ch.kinds.every(k => why[k.id] != null);
        const acts = document.createElement('div'); acts.className = 'acts';
        const cb = btn(T('check'), 'gold', () => {
          checked = true; WW.run.challengeTries++;
          const ok = ch.kinds.every(k => ch.reasons[why[k.id]].fits.includes(pick));
          if (ok) { WW.run.claimPick = pick; solved(h, ch); } else WW.sfx('bad');
          h.render();
        });
        cb.disabled = !ready; acts.appendChild(cb);
        box.appendChild(acts);
        if (checked && !WW.run.challengeDone) {
          const bad = ch.kinds.map(k => ch.reasons[why[k.id]]).find(r => !r.fits.includes(pick));
          box.insertAdjacentHTML('beforeend', `<div class="fb wrong"><b>${esc(T('wrong'))}</b> ${WW.rich(ch.mismatch || '')} ${bad && bad.why ? WW.rich(bad.why) : ''}</div>`);
        }
      }
    });
  }

  /* ---------------- combo ---------------- */
  function comboUI(ch) {
    const set = ch.switches.map(s => s.start || 0);
    let tried = false;
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        header(box, ch);
        const done = WW.run.challengeDone;
        const sw = document.createElement('div'); sw.className = 'switches';
        ch.switches.forEach((s, i) => {
          const g = document.createElement('div'); g.className = 'sw-g';
          g.innerHTML = `<div class="klabel">${s.icon ? s.icon + ' ' : ''}${WW.rich(s.name)}</div>`;
          s.states.forEach((st, k) => {
            const b = document.createElement('button'); b.className = 'reason' + (set[i] === k ? ' sel' : ''); b.dataset.s = i + ':' + k;
            b.innerHTML = WW.rich(st);
            b.onclick = () => { if (done) return; set[i] = k; tried = false; WW.sfx('blip'); h.render(); };
            g.appendChild(b);
          });
          sw.appendChild(g);
        });
        box.appendChild(sw);
        const key = set.join(',');
        const res = ch.results[key] || ch.otherwise || { t: '' , ok: false };
        if (res.show) {
          const out = document.createElement('div'); out.className = 'outs';
          res.show.forEach(o => out.insertAdjacentHTML('beforeend', `<span class="out ${o.ok ? 'good' : 'badp'}">${o.icon || ''} ${WW.rich(o.t)}</span>`));
          box.appendChild(out);
        }
        if (done) return doneBlock(box, h, ch);
        const acts = document.createElement('div'); acts.className = 'acts';
        acts.appendChild(btn(T('check'), 'gold', () => {
          tried = true; WW.run.challengeTries++;
          if (res.ok) solved(h, ch); else WW.sfx('bad');
          h.render();
        }));
        box.appendChild(acts);
        if (tried && !WW.run.challengeDone) box.insertAdjacentHTML('beforeend', `<div class="fb wrong"><b>${esc(T('wrong'))}</b> ${WW.rich(res.t)}</div>`);
      }
    });
  }

  /* ---------------- table ---------------- */
  function tableUI(ch) {
    let qi = 0, picked = null;
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        header(box, ch);
        const done = WW.run.challengeDone;
        let t = '<div class="tblwrap"><table class="dtbl"><thead><tr>' + ch.table.head.map(c => `<th>${WW.rich(c)}</th>`).join('') + '</tr></thead><tbody>';
        ch.table.rows.forEach(r => (t += '<tr>' + r.map(c => `<td>${WW.rich(c)}</td>`).join('') + '</tr>'));
        t += '</tbody></table></div>';
        if (ch.table.note) t += `<p class="small">${WW.rich(ch.table.note)}</p>`;
        box.insertAdjacentHTML('beforeend', t);
        if (done) return doneBlock(box, h, ch);
        const q = ch.questions[qi]; box.dataset.q = qi;
        box.insertAdjacentHTML('beforeend', `<h4>${qi + 1} / ${ch.questions.length}</h4><p class="say q">${WW.rich(q.q)}</p>`);
        const list = document.createElement('div'); list.className = 'choices';
        shuffle(q.choices.map((_, i) => i), qi * 3 + 1).forEach(i => {
          const c = q.choices[i];
          const b = document.createElement('button'); b.innerHTML = WW.rich(c); b.dataset.i = i;
          if (picked === i) b.className = i === q.answer ? 'right' : 'wrong';
          b.onclick = () => {
            if (picked === q.answer) return;
            picked = i;
            if (i === q.answer) WW.sfx('good'); else { WW.sfx('bad'); WW.run.challengeTries++; }
            h.render();
          };
          list.appendChild(b);
        });
        box.appendChild(list);
        if (picked != null) {
          const ok = picked === q.answer;
          box.insertAdjacentHTML('beforeend', `<div class="fb ${ok ? 'right' : 'wrong'}"><b>${esc(ok ? T('right') : T('wrong'))}</b> ${WW.rich(q.why || '')}</div>`);
          if (ok) {
            const acts = document.createElement('div'); acts.className = 'acts';
            acts.appendChild(btn(T('next') + ' ▶', 'gold', () => {
              picked = null;
              if (qi < ch.questions.length - 1) qi++; else { WW.run.challengeTries = Math.max(1, WW.run.challengeTries); solved(h, ch); }
              h.render();
            }));
            box.appendChild(acts);
          }
        }
      }
    });
  }

  WW.challenge = (ch) => {
    const f = { sort: sortUI, order: orderUI, claim: claimUI, combo: comboUI, table: tableUI }[ch.type];
    if (!f) return console.error('unknown challenge type', ch.type);
    f(ch);
  };

  /* ---------------- the Grump trial ---------------- */
  WW.bossTrial = (boss, onWin) => {
    const need = boss.need || 3;
    let queue = shuffle(boss.questions.map((_, i) => i), boss.questions.length * 11 + 1);
    let broken = 0, picked = null, last = null, grr = '';
    let freeHints = WW.tier('reg'); const hidden = {}; // Region power: free hints. A hint hides one wrong answer.
    WW.music.play('boss');
    WW.ui.open({
      cls: 'bossov',
      render(box, h) {
        const top = document.createElement('div'); top.className = 'boss-top';
        // the Grump gets FURIOUS once half its shield is cracked, and roars at every wrong answer
        const furious = !boss.minor && broken >= need / 2 && broken < need;
        const cv = document.createElement('canvas'); cv.width = 16 * 5; cv.height = 16 * 5; cv.className = 'bossface' + (last === 'hit' ? ' hit' : last === 'crack' ? ' crack' : '') + (furious ? ' furious' : '');
        WW.sprite(cv.getContext('2d'), 'smudge', 0, 0, { scale: 5, pal: boss.pal || (furious ? { g: '#8a2836', G: '#561722', e: '#fff070' } : null) });
        if (!boss.minor) box.classList.toggle('roar', last === 'hit');
        top.appendChild(cv);
        let shield = `<div><div class="bname">${esc(L(boss.name))}${furious ? ` <span class="furious-tag">${esc(T('furious'))}</span>` : ''}</div><div class="klabel">${esc(T('shield'))}</div><div class="shield">`;
        for (let i = 0; i < need; i++) shield += `<span class="${i < need - broken ? 'on' : ''}${last === 'crack' && i === need - broken ? ' cracked' : ''}"></span>`;
        shield += `</div><div class="hearts">${'<span class="hrt">♥</span>'.repeat(WW.run.hearts)}${'<span class="hrt empty">♥</span>'.repeat(Math.max(0, WW.heartsMax() - WW.run.hearts))}</div></div>`;
        top.insertAdjacentHTML('beforeend', shield);
        box.appendChild(top);
        if (broken >= need) {
          box.insertAdjacentHTML('beforeend', `<div class="fb right"><b>${esc(T('allRight'))}</b> ${WW.rich(boss.win || '')}</div>`);
          const acts = document.createElement('div'); acts.className = 'acts';
          acts.appendChild(btn(T('cont') + ' ▶', 'gold big', () => { h.close(); onWin(); }));
          box.appendChild(acts);
          return;
        }
        if (broken === 0 && picked == null && boss.taunt) box.insertAdjacentHTML('beforeend', `<p class="say taunt">${WW.rich(boss.taunt)}</p>`);
        const qi = queue[0], q = boss.questions[qi];
        box.dataset.q = qi;
        box.insertAdjacentHTML('beforeend', `<p class="say q">${WW.rich(q.q)}</p>`);
        const list = document.createElement('div'); list.className = 'choices two';
        const ord = shuffle(q.choices.map((_, i) => i), qi * 5 + WW.run.bossMisses + 3);
        let pos = 0;
        ord.forEach(i => {
          if (picked == null && (hidden[qi] || []).includes(i)) return;
          const c = q.choices[i];
          const b = document.createElement('button'); b.innerHTML = `<i>${'ABCDE'[pos++]}</i> ${WW.rich(c)}`; b.dataset.i = i;
          if (picked === i) b.className = i === q.answer ? 'right' : 'wrong';
          b.disabled = picked != null;
          b.onclick = () => {
            picked = i;
            if (i === q.answer) { broken++; last = 'crack'; WW.sfx('hit'); }
            else { last = 'hit'; WW.sfx('hurt'); if (!boss.minor) { WW.sfx('growl'); grr = WW.grr(); } const ml = boss.missedList || WW.run.missed; ml.includes(qi) || ml.push(qi); if (!boss.minor) WW.run.bossMisses++; WW.hurt(true); }
            h.render();
          };
          list.appendChild(b);
        });
        box.appendChild(list);
        const wrongLeft = q.choices.map((_, i) => i).filter(i => i !== q.answer && !(hidden[qi] || []).includes(i));
        if (picked == null && wrongLeft.length > 1) {
          const hb = btn(`💡 ${esc(T('hint'))} · ${freeHints ? esc(T('hintFree')) + ' ×' + freeHints : '10 ●'}`, 'ghost hintbtn', () => {
            if (freeHints) freeHints--;
            else if ((WW.save.coins || 0) >= 10) { WW.spend(10); WW.ui.hud(); }
            else return WW.toast(esc(T('hintNoCoins')), '#b0392b');
            (hidden[qi] = hidden[qi] || []).push(wrongLeft[0]); WW.run.hints++; WW.sfx('blip'); h.render();
          });
          const ha = document.createElement('div'); ha.className = 'acts'; ha.appendChild(hb); box.appendChild(ha);
        }
        if (picked != null) {
          const ok = picked === q.answer;
          if (!ok && grr && !boss.minor) box.insertAdjacentHTML('beforeend', `<p class="say taunt grr">${esc(grr)}</p>`);
          box.insertAdjacentHTML('beforeend', `<div class="fb ${ok ? 'right' : 'wrong'}"><b>${esc(ok ? T('right') : T('wrong'))}</b> ${WW.rich(q.why || '')}</div>`);
          const acts = document.createElement('div'); acts.className = 'acts';
          acts.appendChild(btn(T('next') + ' ▶', 'gold', () => {
            queue.shift(); if (!ok) queue.push(qi);
            picked = null; last = null; h.render();
          }));
          box.appendChild(acts);
        }
      }
    });
  };
})();
