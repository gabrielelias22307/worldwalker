<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Worldwalker 4.3</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Atkinson+Hyperlegible:wght@400;700&display=swap');
:root{
--bg:#141322; --panel:#1f1d33; --panel2:#29264a; --line:#3b3866; --text:#f3f1ff; --muted:#b9b5dc;
--gold:#f2c14e; --teal:#2aa198; --red:#e04848; --paper:#fffbe8; --ink:#22202e;
--pix:'Press Start 2P', ui-monospace, monospace;
--read:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--read);font-size:17px;line-height:1.5}
button{font-family:inherit}
html.ww-game,html.ww-game body{height:100%;overflow:hidden}
.ww-frame{max-width:1200px;height:100vh;height:100dvh;margin:0 auto;padding:6px 8px;background:var(--bg);display:flex;flex-direction:column;gap:0}
.ww-frame:fullscreen{max-width:none}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-bottom:2px;position:relative}
.ww-frame>.ww-bar,.ww-frame>.hud,.ww-frame>.quest{width:100%;max-width:max(var(--gw,100%),min(100%,560px));margin-left:auto;margin-right:auto}
.ww-frame.narrow .stage>.toolbar{position:static;transform:none;margin:5px auto 0;width:max-content;max-width:100%}
.cbubble.dock{max-width:none}
.cbubble.dock::after{bottom:auto;top:-10px;left:var(--tx,50%);border:7px solid transparent;border-bottom-color:var(--ink);border-top:0}
.ww-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.ww-logo{font-family:var(--pix);font-size:12px;color:var(--gold);text-decoration:none;margin-right:auto}
.ww-bar button{font-size:13px;padding:5px 8px;background:var(--panel2);color:#fff;border:2px solid #000;border-radius:4px;cursor:pointer;line-height:1.3}
@media (max-width:820px){.ww-bar .lbl{display:none}.ww-bar button{padding:5px 7px}}
@media (max-width:520px){.ww-logo{display:none}.ww-bar{gap:4px;justify-content:center}.ww-bar .langs,.ww-bar .tools{gap:3px}.ww-bar button{font-size:12px;padding:4px 6px}}
.ww-bar .langs button.on{background:var(--gold);color:var(--ink);font-weight:700}
.ww-bar .langs,.ww-bar .tools{display:flex;gap:5px;flex-wrap:wrap}
.ww-preview{font-size:12px;font-weight:700;padding:5px 8px;background:var(--teal);color:#fff;border:2px solid #000;border-radius:4px;text-decoration:none}
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;background:#0b0a14;padding:5px 10px;font-family:var(--pix);font-size:10px;border:3px solid #000;border-bottom:0;border-radius:6px 6px 0 0}
.hud-left,.hud-right{display:flex;align-items:center;gap:6px}
.hrt{color:var(--red);font-size:16px;line-height:1}
.hrt.empty{color:#4a2630}
.hud-coin{color:var(--gold);margin-left:6px}
.hud-mid{color:var(--muted);font-family:var(--read);font-weight:700;font-size:13px}
.meter{display:inline-flex;align-items:center;gap:2px}
.meter i{font-style:normal;font-size:12px}
.track{display:block;width:40px;height:9px;background:#2a2840;border:2px solid #000}
.track b{display:block;height:100%}
.quest{background:#0b0a14;border:3px solid #000;border-top:1px solid #2a2840;border-bottom:0;padding:3px 8px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;min-width:0}
.quest .qgoal{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.quest .qlist{background:var(--panel2);color:#fff;border:2px solid #000;border-radius:4px;font-size:13px;padding:1px 7px;cursor:pointer}
.qpop{position:absolute;z-index:7;left:8px;top:8px;max-width:calc(100% - 16px);background:rgba(11,10,20,.94);color:var(--text);border:3px solid #000;outline:2px solid var(--gold);border-radius:6px;padding:8px 12px;font-size:14px;line-height:1.5;display:none}
.qpop.on{display:block}
.qpop ol{margin:4px 0 0;padding-inline-start:20px}
.qpop .qdone{color:#7cc451}.qpop .qnow{color:#fff;font-weight:700}.qpop li{color:var(--muted)}
.quest b{color:var(--gold)}
.quest i{font-style:normal;color:#5a5680}
.quest .qnow{color:#fff;font-weight:700}
.quest .qdone{color:#7cc451}
.quest .qscr{color:#c9b064}
.screen{position:relative;background:#000;border:3px solid #000;outline:3px solid var(--line);border-radius:0 0 6px 6px;overflow:hidden;user-select:none;flex:none;width:100%}
.screen:focus{outline-color:var(--gold)}
.screen canvas#ww-cv{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.toast{position:absolute;right:10px;top:10px;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:5px;max-width:70%;pointer-events:none}
.toast .tst{color:#fff;font-weight:700;font-size:15px;padding:7px 11px;border:3px solid #000;border-radius:4px;animation:pop .2s ease-out}
.toast .tst.big{font-size:16px;padding:10px 14px;outline:3px solid #fff3b0;max-width:100%}
.toast .tst small{display:block;font-weight:400;font-size:13px;opacity:.95}
.defpop{position:absolute;z-index:9;max-width:300px;background:var(--ink);color:#fff;border:3px solid #ffe36e;border-radius:4px;padding:8px 12px;font-size:15px;line-height:1.4;display:none}
.defpop b{color:#ffe36e}
.ov{position:absolute;inset:0;z-index:5;overflow:auto;background:rgba(10,9,20,.55);padding:12px}
.ov.hidden{display:none}
.ov-box{background:var(--paper);color:var(--ink);border:4px solid var(--ink);outline:3px solid var(--paper);border-radius:4px;padding:14px 16px;max-width:760px;margin:0 auto}
.ov[dir=rtl] .ov-box{text-align:right}
.ov h2{margin:4px 0 6px;font-size:22px;line-height:1.25}
.ov h3{margin:12px 0 6px;font-size:17px;color:#7a3b12}
.ov h4{margin:10px 0 6px;font-size:15px;color:#5a4a7a}
.say{font-size:clamp(15px,1.8vw,18px);margin:6px 0}
.say.q{font-weight:700}
.say.taunt{font-style:italic;color:#4b3f63}
.hint,.small{font-size:13.5px;color:#5c5874;margin:4px 0}
.ov .small a{color:#2f6fd6}
.word{background:#ffe36e;border-bottom:2px dotted #7a3b12;padding:0 2px;cursor:help;border-radius:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.acts.center{justify-content:center}
.pbtn{font-size:14px;font-weight:700;padding:9px 14px;background:#29264a;color:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;min-height:42px}
.pbtn.gold{background:var(--gold);color:var(--ink)}
.pbtn.teal{background:var(--teal);color:#fff}
.pbtn.ghost{background:#fff;color:var(--ink)}
.pbtn.big{font-size:17px;padding:11px 22px}
.pbtn:disabled{opacity:.45;cursor:not-allowed}
.pbtn:focus-visible,.choices button:focus-visible,.card:focus-visible{outline:3px solid #2f6fd6;outline-offset:2px}
.choices{display:grid;gap:7px;margin-top:8px}
.choices.two{grid-template-columns:1fr 1fr}
@media (max-width:640px){.choices.two{grid-template-columns:1fr}}
.choices button{text-align:start;font-size:clamp(14px,1.6vw,16.5px);padding:9px 12px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);min-height:44px}
.choices button i{font-style:normal;font-weight:700;color:#7a3b12;margin-inline-end:6px}
.choices button.right{background:#d9f5dd;border-color:#1f7a3a}
.choices button.wrong{background:#fde2de;border-color:#b0392b}
.choices button:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:10px;padding:9px 12px;border-radius:4px;border:2px solid}
.fb.right{background:#e3f6e6;border-color:#1f7a3a;color:#174f27}
.fb.wrong{background:#fdeae6;border-color:#b0392b;color:#7a2318}
.err{color:#b0392b;font-weight:700;text-align:center}
.talk-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.talk-head .face{width:64px;height:44px;border:3px solid var(--ink);background:#cfe8ff;image-rendering:pixelated;flex:0 0 auto}
.who{font-weight:700;color:#7a3b12;font-size:16px}
.role{font-size:13.5px;color:#5c5874}
.startov .logo{font-family:var(--pix);color:#c08a1e;text-align:center;font-size:clamp(18px,4vw,30px);margin-top:4px}
.startov .sublogo{font-family:var(--pix);text-align:center;font-size:10px;color:#5a4a7a;margin:6px 0 10px}
.epcard{background:#f3e3b5;border:3px solid var(--ink);border-radius:4px;padding:8px 12px;text-align:center}
.epcard h2{margin:2px 0}
.epn{font-size:13px;font-weight:700;color:#5a4a7a}
.place{color:#5c5874}
.langrow{display:flex;gap:6px;justify-content:center;margin:10px 0}
.langrow .pbtn{min-height:36px;padding:6px 12px}
.wb{text-align:center;font-size:18px}
.signin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.signin h3{grid-column:1/-1;margin-bottom:0}
@media (max-width:640px){.signin{grid-template-columns:1fr}}
.signin label,.codein label{display:flex;flex-direction:column;font-size:13.5px;font-weight:700;gap:3px}
.ov input,.ov textarea{font:inherit;font-size:16px;padding:8px 10px;border:3px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);width:100%}
.ov textarea{resize:vertical;min-height:80px;margin-top:6px}
.looks{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.heroprev{border:3px solid var(--ink);background:#cfe8ff;image-rendering:pixelated;width:96px;height:96px}
.lrow{display:flex;align-items:center;gap:5px;margin:3px 0}
.lrow span{width:52px;font-size:13px;font-weight:700}
.sw{width:28px;height:28px;border:3px solid #fff;outline:2px solid var(--ink);border-radius:3px;cursor:pointer;padding:0}
.sw.on{border-color:#c08a1e;outline:3px solid #c08a1e}
.codein{display:flex;gap:8px;align-items:end;margin-top:12px;flex-wrap:wrap}
.codein label{flex:1;min-width:220px}
.pipface{float:right;image-rendering:pixelated;width:64px;height:64px;margin-inline-start:10px}
.ov[dir=rtl] .pipface{float:left}
.pp-top{display:flex;gap:14px;align-items:center}
.pp-hero{border:3px solid var(--ink);background:#cfe8ff;image-rendering:pixelated;width:90px;height:90px}
.pp-name{font-size:22px;font-weight:700}
.pp-nums{display:flex;gap:14px;flex-wrap:wrap;font-size:15px}
.powers{display:grid;gap:6px}
.pw{display:grid;grid-template-columns:30px 1fr 34px;gap:8px;align-items:center}
.pwi{font-size:20px}
.pwn{font-weight:700;text-align:end}
.bar{height:12px;border:2px solid var(--ink);background:#e9dfc0}
.bar b{display:block;height:100%}
.bag{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:520px){.bag{grid-template-columns:repeat(2,1fr)}}
.slot{border:3px solid #b7a77e;background:#e9dfc0;border-radius:4px;padding:6px;text-align:center;font-size:12.5px;color:#8a7c58}
.slot.has{background:#fff;border-color:var(--ink);color:var(--ink);font-weight:700}
.slot .ti{display:block;font-size:24px}
.stamps{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
@media (max-width:560px){.stamps{grid-template-columns:repeat(4,1fr)}}
.scol{display:flex;flex-direction:column;gap:4px;align-items:center;border:2px dashed #b7a77e;border-radius:4px;padding:4px}
.stamp{width:44px;height:44px;border-radius:50%;border:2px dashed #b7a77e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:#b7a77e;font-weight:700;line-height:1}
.stamp i{font-style:normal;font-size:8px;color:#c08a1e}
.stamp.on{border:3px solid var(--ink);color:#fff}
.stamp.on i{color:#fff}
.stamp.r1{background:#e04848}.stamp.r2{background:#2f7fd1}.stamp.r3{background:#8e5bd6}.stamp.r4{background:#d98e2b}
.stamp.r5{background:#c9a227}.stamp.r6{background:#3fa34d}.stamp.r7{background:#c0392b}.stamp.r8{background:#2aa198}
.coderow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pcode{font-family:var(--pix);font-size:12px;background:var(--ink);color:var(--gold);padding:8px 10px;border-radius:3px;letter-spacing:1px;direction:ltr;display:inline-block}
.ok{color:#1f7a3a;font-weight:700}.bad{color:#b0392b;font-weight:700}.pending{color:#5a4a7a;font-weight:700}
.ch-head{display:flex;gap:10px;align-items:flex-start}
.chface{image-rendering:pixelated;width:48px;height:48px;flex:0 0 auto}
.ch-head h3{margin-top:2px}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;min-height:10px}
.card{font-size:14.5px;padding:7px 10px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);text-align:start;line-height:1.3}
.card .ic{margin-inline-end:5px}
.card.sel{background:#ffe36e;border-color:#c08a1e;outline:2px solid #c08a1e}
.card.right{background:#d9f5dd;border-color:#1f7a3a}
.card.wrong{background:#fde2de;border-color:#b0392b}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.bins.bands{grid-template-columns:1fr}
.bin{border:3px dashed #8a7c58;border-radius:6px;padding:6px;background:#f6edd2;min-height:70px;cursor:pointer;overflow:hidden}
.bin.target{border-color:#c08a1e;background:#fff3c4}
.bins.bands .bin{min-height:54px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.bintile{grid-row:1/3;width:96px;height:32px;image-rendering:pixelated;border:2px solid var(--ink)}
.binlabel{font-weight:700;font-size:14.5px}
.binin{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.seq{padding-inline-start:26px;margin:8px 0;display:grid;gap:5px}
.seq li.card{cursor:default}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;gap:3px;text-align:start;padding:9px 11px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);font-size:14.5px}
.opt span{font-size:13.5px;color:#5c5874}
.opt.sel{background:#ffe36e;border-color:#c08a1e}
.kind,.sw-g{margin:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.klabel{width:100%;font-weight:700;font-size:14px;color:#5a4a7a}
.reason{font-size:14px;padding:7px 10px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);text-align:start}
.reason.sel{background:#ffe36e;border-color:#c08a1e}
.reason.right{background:#d9f5dd;border-color:#1f7a3a}
.reason.wrong{background:#fde2de;border-color:#b0392b}
.outs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.out{padding:5px 10px;border-radius:20px;border:2px solid;font-size:14px;font-weight:700}
.out.good{background:#d9f5dd;border-color:#1f7a3a;color:#174f27}
.out.badp{background:#fbe2c8;border-color:#b5651d;color:#7a3b12}
.tblwrap{overflow-x:auto}
.dtbl{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0}
.dtbl th,.dtbl td{border:2px solid var(--ink);padding:5px 8px;text-align:start}
.dtbl th{background:#f3e3b5}
.bossov .ov-box{background:#f1ecff}
.boss-top{display:flex;gap:14px;align-items:center}
.bossface{image-rendering:pixelated;width:90px;height:90px;background:#2b2140;border:3px solid var(--ink);border-radius:6px}
.bossface.hit{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bname{font-weight:700;font-size:19px;color:#4b3f63}
.shield{display:flex;gap:4px;margin:3px 0}
.shield span{width:44px;height:14px;border:2px solid var(--ink);background:#ddd}
.shield span.on{background:#8fc3ff}
.hearts .hrt{font-size:18px}
.fin-head{display:flex;gap:14px;align-items:center}
.pagebig canvas{image-rendering:pixelated;width:80px;height:80px;animation:glow 1.6s ease-in-out infinite;border-radius:6px}
@keyframes glow{50%{filter:drop-shadow(0 0 10px #f2c14e)}}
.stars{font-size:28px;color:#e0a81e;letter-spacing:3px}
.stars .dim{color:#d8cfb0}
.newtool{margin-top:8px;padding:8px 12px;background:#fff3c4;border:2px solid #c08a1e;border-radius:4px}
.learned{margin:4px 0;padding-inline-start:22px}
.starter{background:#ffe36e;border:2px solid #c08a1e;border-radius:4px;padding:5px 10px;font-size:14px;cursor:pointer;color:var(--ink)}
.top5{margin-top:10px;padding:8px 12px;background:#fff6d6;border:2px solid #d9b44a;border-radius:4px}
.top5 ol{list-style:none;margin:6px 0 4px;padding:0;display:grid;gap:3px}
.top5 li{display:grid;grid-template-columns:2em 1fr auto;gap:8px;align-items:center;padding:2px 8px;border-radius:4px;background:#fffbe8}
.top5 li.me{outline:2px solid #c58f12;font-weight:700}
.top5 .p{opacity:.8}
.savebox{margin-top:10px;padding:8px 12px;background:#efe8d2;border:2px solid #b7a77e;border-radius:4px;display:grid;gap:4px}
.dpad{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,44px);gap:4px;justify-content:center;margin:6px auto 0;touch-action:none;flex:none}
.dpad button{background:var(--panel2);color:#fff;border:3px solid #000;border-radius:8px;font-size:22px;cursor:pointer}
.dpad [data-d=up]{grid-column:2;grid-row:1}.dpad [data-d=left]{grid-column:1;grid-row:2}.dpad .act{grid-column:2;grid-row:2;background:var(--gold);color:var(--ink)}
.dpad [data-d=right]{grid-column:3;grid-row:2}.dpad [data-d=down]{grid-column:2;grid-row:3}
@media (pointer:coarse){.dpad{display:grid}}
.ww-foot{display:none}
@media (max-width:640px){
.track{width:22px}.hud{font-size:9px;padding:4px 6px}.hud-mid{display:none}
.ov{padding:6px}.ov-box{padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
.ov.talkov,.ov.msgov{background:rgba(10,9,20,.18);display:flex;flex-direction:column;justify-content:flex-end}
.ov.talkov .ov-box,.ov.msgov .ov-box{width:100%;margin:0 auto}
.stamp{font-family:var(--read)}
.touch .dpad{display:grid}
.screen canvas#ww-cv{animation:fadein .7s ease-out}
@keyframes fadein{from{opacity:0;filter:brightness(2)}to{opacity:1;filter:none}}
.ov-box{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.bossface.crack{animation:flash .45s}
@keyframes flash{0%,60%{filter:brightness(2.4) saturate(.3)}30%{transform:scale(.9) rotate(-4deg)}100%{filter:none;transform:none}}
.shield span.cracked{animation:crack .6s ease-out;position:relative}
@keyframes crack{0%{background:#ffffff;transform:scale(1.25)}40%{background:#8fc3ff;transform:scale(1.1) rotate(6deg)}100%{background:#ddd;transform:none}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:7}
.confetti i{position:absolute;top:-12px;width:7px;height:10px;border-radius:1px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.9}}
.goals{background:#fff3c4;border:3px solid var(--ink);border-radius:6px;padding:8px 12px;margin:10px 0;text-align:start}
.goals ol{margin:6px 0 6px 22px;padding:0}.goals li{margin:2px 0}
[dir=rtl] .goals ol{margin:6px 22px 6px 0}
ul.earned{list-style:none;padding:0;margin:4px 0;display:grid;gap:3px}
ul.earned li{background:#f3eedc;border-radius:4px;padding:4px 8px}
.grow{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grow .gw{background:#f3eedc;border-radius:6px;padding:6px 9px}
.grow ul{list-style:none;padding:0;margin:4px 0 0}
.grow li{font-size:14px;color:#8a8370;margin:2px 0}.grow li.on{color:#1f6a2e;font-weight:700}
.hintbtn{font-size:14px!important}
.bossov .ov-box.roar{animation:roar .45s}
@keyframes roar{0%{box-shadow:0 0 0 0 rgba(220,40,40,.0)}20%{transform:translate(-6px,2px);box-shadow:0 0 0 8px rgba(220,40,40,.55)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}100%{transform:none;box-shadow:0 0 0 0 rgba(220,40,40,0)}}

 طلا کار کردم."},{en:"Deep down, the rock is hot. We needed big fans to cool the air.",es:"Muy abajo, la roca está caliente. Necesitábamos ventiladores grandes para enfriar el aire.",fa:"در عمق زمین سنگ داغ است. برای خنک کردن هوا پکه‌های کلان لازم داشتیم."}]},{at:[11,10],name:{en:"Mama Lerato",es:"Mamá Lerato",fa:"ماما لراتو"},look:{skin:4,hair:"#1a1a1a",shirt:"#2f9a8a",pants:"#5a2a4a",style:"long"},lines:[{en:"Dumela! That means hello in Sesotho. Grab a blanket, the nights are cold.",es:"¡Dumela! Significa hola en sesotho. Toma una cobija, las noches son frías.",fa:"دومیلا! به زبان سوتو یعنی سلام. کمپل بگیر، شب‌ها سرد است."},{en:"Our city sits high up, on a plateau. Winter nights can bring frost.",es:"Nuestra ciudad está en lo alto, sobre una meseta. En invierno, las noches pueden traer escarcha.",fa:"شهر ما بلند، روی یک فلات است. شب‌های زمستان گاهی یخبندان می‌شود."}]},{at:[15,10],name:{en:"Kagiso",es:"Kagiso",fa:"کاگیسو"},look:{skin:3,hair:"#202020",shirt:"#f08a24",pants:"#2a3a5a",style:"short"},lines:[{en:"Hi! I just got home from my shift. I build cars at a factory.",es:"¡Hola! Acabo de llegar de mi turno. Armo carros en una fábrica.",fa:"سلام! تازه از نوبت کارم آمدم. من در یک فابریکه موتر می‌سازم."},{en:"Trains take our cars to the port. Ships carry many to Europe.",es:"Los trenes llevan nuestros carros al puerto. Los barcos llevan muchos a Europa.",fa:"قطارها موترهای ما را به بندر می‌برند. کشتی‌ها بسیاری را به اروپا می‌برند."}]}],map:["KKKKKKKKKKKKKKKKTTTTTTTTTTTT~===","K::::rr::::r:K...........K.T~===","K:rr:::::XX:r:...eeeeee.K.G.~XX=","K::::::r:XX:::...eeeeee..K..~XX=","K:::rr:::::::r...eeeeee.....~ss=","K:r::::::r::::.............T~ss=","K:::::::::::::.....K........kss=","K...----------.-----------..~===","K.......x................|..~===","K....RRR..QQQ.RRReeeeee...K.~===","K....hdh..hdh.hdheeeeee.....~===","K.UU.:.UU..:JJJ.........:|~~~===","K.UUT:.UUT.:JJJ..XXX..Tx:|~~~===","K:::::::::::::::.XXX....:|kkkk==","K.JJ.:.JJJ.:UU..........:.~~~===","K.JJ.:.JJ n the coast. Fill the gaps in the tracks to the east.",es:"Esto es la ciudad, no la vía del tren. Los minerales tienen que ir al puerto en la costa. Llena los huecos de la vía, al este.",fa:"این شهر است، نه خط آهن. معدنیات باید به بندر در ساحل بروند. شکاف‌های خط را در شرق پر کن."}}],done:{en:"The railway is whole again! Trains carry the minerals from the mine to Durban. Then ships export them to other countries, and South Africa earns money from trade.",es:"¡La vía del tren está completa otra vez! Los trenes llevan los minerales de la mina a Durban. Luego los barcos los exportan a otros países, y Sudáfrica gana dinero con el comercio.",fa:"خط آهن دوباره کامل شد! قطارها معدنیات را از معدن به دوربان می‌برند. بعد کشتی‌ها آن‌ها را به کشورهای دیگر صادر می‌کنند و افریقای جنوبی از تجارت پول به دست می‌آورد."}}],finds:[{clueAt:[6,6],at:[8,2],decor:"gem",clue:{en:"From this note, walk 4 steps north, then 2 steps east. Look near the mine.",es:"Desde esta nota, camina 4 pasos al norte y luego 2 pasos al este. Busca cerca de la mina.",fa:"از این یادداشت، ۴ قدم به شمال برو، بعد ۲ قدم به شرق. نزدیک معدن را ببین."},text:{en:"North is up, east is right! A gem! The biggest diamond ever, the Cullinan, came from here.",es:"¡El norte arriba, el este a la derecha! ¡Una gema! El diamante más grande, el Cullinan, salió de aquí.",fa:"شمال بالا، شرق راست! یک سنگ قیمتی! بزرگ‌ترین الماس، کالینان، از این‌جا بیرون آمد."}},{clueAt:[23,9],at:[26,17],decor:"coinold",clue:{en:"Follow the railway east, then south, then east to a dock. Stand at the end of the tracks.",es:"Sigue la vía del tren al este, luego al sur, luego al este hasta un muelle. Párate al final de las vías.",fa:"خط ریل را به شرق، بعد جنوب، بعد شرق تا یک اسکله دنبال کن. در آخر خط ریل بایست."},text:{en:"Here goods go from train to ship. An old gold coin! South Africa made Krugerrand coins from 1967.",es:"Aquí los productos pasan del tren al barco. ¡Una moneda de oro! Sudáfrica hace monedas Krugerrand desde 1967.",fa:"این‌جا جنس از ریل به کشتی می‌رود. یک سکهٔ طلا! افریقای جنوبی از ۱۹۶۷ سکهٔ کروگررند می‌سازد."}}],secret:{tool:"rail",at:[26,1],text:{en:"The Rail Pass opened the old rail gate! In the chest is a miner's note. It says South Africa digs up more platinum than any other country on Earth.",es:"¡El pase de tren abrió la vieja puerta del ferrocarril! En el cofre hay una nota de un minero. Dice que Sudáfrica saca más platino que cualquier otro país de la Tierra.",fa:"کارت قطار دروازهٔ کهنهٔ خط آهن را باز کرد! در صندوق یادداشت یک معدن‌کار است. می‌گوید افریقای جنوبی از هر کشور دیگر روی زمین بیشتر پلاتین استخراج می‌کند."}},words:{mineral:{en:"a solid material found naturally in rock, like gold or chrome",es:"un material sólido que se encuentra en la roca, como el oro o el cromo",fa:"مادهٔ سختی که به طور طبیعی در سنگ پیدا می‌شود، مثل طلا یا کروم"},"natural resource":{en:"something from nature that people use, like water, soil, trees or minerals",es:"algo de la naturaleza que la gente usa, como agua, tierra, árboles o minerales",fa:"چیزی از طبیعت که مردم از آن استفاده می‌کنند، مثل آب، خاک، درخت یا معدنیات"},"raw material":{en:"something in its natural form, before a factory changes it",es:"algo en su forma natural, antes de que una fábrica lo cambie",fa:"چیزی به شکل طبیعی خودش، پیش از آن‌که فابریکه آن را تغییر دهد"},"finished product":{en:"a thing that is ready to use, like a phone, a car or a pot",es:"una cosa lista para usar, como un teléfono, un carro o una olla",fa:"چیزی که آمادهٔ استفاده است، مثل موبایل، موتر یا دیگ"},"cash crop":{en:"a crop grown mostly to sell, not to eat at home",es:"un cultivo que se siembra más que nada para vender, no para comer en casa",fa:"کشتی که بیشتر برای فروش است، نه برای خوردن در خانه"},export:{en:"a good that is sold and sent to another country",es:"un producto que se vende y se envía a otro país",fa:"جنسی که فروخته و به کشور دیگر فرستاده می‌شود"},import:{en:"a good that is bought and brought in from another country",es:"un producto que se compra y se trae de otro país",fa:"جنسی که از کشور دیگر خریده و آورده می‌شود"},port:{en:"a place on the coast where ships load and unload goods",es:"un lugar en la costa donde los barcos cargan y descargan mercancías",fa:"جایی در ساحل که کشتی‌ها بار را بار می‌کنند و خالی می‌کنند"}},npcs:[{x:7,y:4,name:{en:"Thandiwe",es:"Thandiwe",fa:"تاندیوه"},role:{en:"Mining engineer",es:"Ingeniera de minas",fa:"انجنیر معدن"},look:{skin:4,hair:"#1b1410",shirt:"#f39c12",pants:"#2c3e50"},lines:[{en:"Sawubona! I am Thandiwe. Our gold, platinum and chrome are [[natural resource|natural resources]].",es:"¡Sawubona! Soy Thandiwe. Nuestro oro, platino y cromo son [[natural resource|recursos naturales]].",fa:"ساوبونا! من تاندیوه هستم. طلا، پلاتین و کروم ما [[natural resource|منابع طبیعی]] هستند."},{en:"These [[mineral|minerals]] lie in the ground. Gold was found here in 1886.",es:"Estos [[mineral|minerales]] están bajo la tierra. Aquí se encontró oro en 1886.",fa:"این [[mineral|معدنیات]] در زیر زمین هستند. در سال ۱۸۸۶ این‌جا طلا پیدا شد."},{en:'Thousands came, and Johannesburg grew fast. Its Zulu name, eGoli, means "place of gold."',es:'Llegaron miles, y Johannesburgo creció rápido. Su nombre en zulú, eGoli, significa "lugar del oro".',fa:"هزاران نفر آمدند و ژوهانسبرگ زود بزرگ شد. نام زولوی آن، اِگولی، یعنی «جای طلا»."},{en:"We have most of the world's platinum, for cleaner engines. Chrome keeps steel from rust.",es:"Tenemos casi todo el platino del mundo, para motores más limpios. El cromo protege el acero del óxido.",fa:"بیشتر پلاتین جهان پیش ما است، برای انجن‌های پاک‌تر. کروم فولاد را از زنگ نگه می‌دارد."}],ask:{stat:"hei",q:{en:"Why did Johannesburg grow so fast?",es:"¿Por qué Johannesburgo creció tan rápido?",fa:"چرا ژوهانسبرگ این‌قدر زود بزرگ شد؟"},choices:[{ok:true,t:{en:"Gold was found there, so miners came",es:"Allí se encontró oro, y llegaron mineros",fa:"آن‌جا طلا پیدا شد، پس کارگران معدن آمدند"},why:{en:"A natural resource pulled people in, and a city grew around it.",es:"Un recurso natural atrajo a la gente, y una ciudad creció a su alrededor.",fa:"یک منبع طبیعی مردم را کشاند و شهری دور آن ساخته شد."}},{t:{en:"It sits beside a busy ocean port",es:"Está junto a un puerto muy activo del océano",fa:"کنار یک بندر پرکار بحر است"},why:{en:"Johannesburg is far inland. Durban is the port.",es:"Johannesburgo está lejos del mar. Durban es el puerto.",fa:"ژوهانسبرگ از بحر دور است. بندر، دوربان است."}},{t:{en:"It was built for rice farming by a big river",es:"Se construyó para cultivar arroz junto a un río grande",fa:"برای کشت شالی کنار یک دریای بزرگ ساخته شد"},why:{en:"Johannesburg did not grow from farming. It grew from gold.",es:"Johannesburgo no creció por la agricultura. Creció por el oro.",fa:"ژوهانسبرگ از کشت و کار بزرگ نشد. از طلا بزرگ شد."}}]}},{x:8,y:16,name:{en:"Sipho",es:"Sipho",fa:"سیپو"},role:{en:"Bank worker in Johannesburg",es:"Empleado de banco en Johannesburgo",fa:"کارمند بانک در ژوهانسبرگ"},look:{skin:5,hair:"#111111",shirt:"#3e5c9a",pants:"#222222"},lines:[{en:"Hello! I am Sipho, a banker. Gold built Johannesburg. Now it is a banking center.",es:"¡Hola! Soy Sipho, banquero. El oro construyó Johannesburgo. Ahora es un centro de bancos.",fa:"سلام! من سیپو، کارمند بانک هستم. طلا ژوهانسبرگ را ساخت. حالا مرکز بانک‌ها است."},{en:"[[raw material|Raw materials]] earn some money. [[finished product|Finished products]], often made abroad, earn the most.",es:"Las [[raw material|materias primas]] dan algo de dinero. Los [[finished product|productos terminados]], muchas veces hechos afuera, dan más.",fa:"[[raw material|مواد خام]] کمی پول می‌آورد. [[finished product|جنس آماده]]، که اکثراً در خارج ساخته می‌شود، بیشترین پول را می‌آورد."},{en:"Ghana and Ivory Coast sell cocoa, a [[cash crop|cash crop]]. Ethiopia and Kenya sell coffee.",es:"Ghana y Costa de Marfil venden cacao, un [[cash crop|cultivo comercial]]. Etiopía y Kenia venden café.",fa:"گانا و ساحل عاج کاکائو می‌فروشند، یک [[cash crop|کشت تجارتی]]. ایتوپیا و کینیا قهوه می‌فروشند."},{en:"If the world price of that crop falls, the whole country earns less.",es:"Si el precio mundial de ese cultivo baja, todo el país gana menos.",fa:"اگر قیمت جهانی آن کشت پایین بیاید، تمام کشور کمتر پول می‌گیرد."}],ask:{stat:"reg",q:{en:"Why is it risky for a country to sell mostly one product?",es:"¿Por qué es arriesgado que un país venda casi solo un producto?",fa:"چرا برای یک کشور خطرناک است که بیشتر فقط یک جنس بفروشد؟"},choices:[{ok:true,t:{en:"If its price falls, everyone earns less",es:"Si su precio baja, todos ganan menos",fa:"اگر قیمتش پایین بیاید، همه کمتر پول می‌گیرند"},why:{en:"With only one product, one bad price hurts everyone at once.",es:"Con un solo producto, un mal precio hace daño a todos a la vez.",fa:"با یک جنس، یک قیمت بد به همه یک‌باره ضرر می‌زند."}},{t:{en:"That product will soon stop growing there",es:"Ese producto pronto dejará de crecer allí",fa:"آن جنس به زودی دیگر آن‌جا نمی‌روید"},why:{en:"The crop still grows. The risk is the price, not the plant.",es:"El cultivo sigue creciendo. El riesgo es el precio, no la planta.",fa:"کشت هنوز می‌روید. خطر از قیمت است، نه از نبات."}},{t:{en:"Other countries are not allowed to buy it",es:"Otros países no pueden comprarlo",fa:"کشورهای دیگر اجازه ندارند آن را بخرند"},why:{en:"Other countries do buy it. The problem is that the price can change.",es:"Otros países sí lo compran. El problema es que el precio puede cambiar.",fa:"کشورهای دیگر آن را می‌خرند. مشکل این است که قیمت می‌تواند تغییر کند."}}]}},{x:27,y:13,name:{en:"Ayanda",es:"Ayanda",fa:"آیاندا"},role:{en:"Crane operator at the port of Durban",es:"Operadora de grúa en el puerto de Durban",fa:"رانندهٔ جرثقیل در بندر دوربان"},look:{skin:3,hair:"#2b1d14",shirt:"#16a085",pants:"#2c3e50"},lines:[{en:"Welcome to Durban, on the Indian Ocean! I am Ayanda. I drive a giant crane.",es:"¡Bienvenido a Durban, en el océano Índico! Soy Ayanda. Manejo una grúa gigante.",fa:"به دوربان در کنار بحر هند خوش آمدی! من آیاندا هستم. یک جرثقیل بسیار بزرگ را می‌رانم."},{en:"Durban is a busy [[port|port]]. Trains bring ore, sugar, fruit and cars to my crane.",es:"Durban es un [[port|puerto]] muy activo. Los trenes traen mineral, azúcar, fruta y carros a mi grúa.",fa:"دوربان یک [[port|بندر]] پرکار است. قطارها سنگ معدنی، بوره، میوه و موتر را به جرثقیل من می‌آورند."},{en:"I load them onto ships. Those are [[export|exports]]: goods sold to other countries.",es:"Yo los subo a los barcos. Esas son [[export|exportaciones]]: productos que se venden a otros países.",fa:"من آن‌ها را به کشتی بار می‌کنم. این‌ها [[export|صادرات]] هستند: جنس‌هایی که به کشورهای دیگر فروخته می‌شوند."},{en:"Ships bring in phones, machines and medicine: [[import|imports]]. Ports connect countries to the world.",es:"Los barcos traen teléfonos, máquinas y medicinas: [[import|importaciones]]. Los puertos conectan a los países con el mundo.",fa:"کشتی‌ها موبایل، ماشین و دوا می‌آورند: [[import|واردات]]. بندرها کشورها را به جهان وصل می‌کنند."}],ask:{stat:"mov",q:{en:"What is an export?",es:"¿Qué es una exportación?",fa:"صادرات چیست؟"},choices:[{ok:true,t:{en:"A good sold and sent to another country",es:"Un producto que se vende y se envía a otro país",fa:"جنسی که فروخته و به کشور دیگر فرستاده می‌شود"},why:{en:"Exports go out. Imports come in.",es:"Las exportaciones salen. Las importaciones entran.",fa:"صادرات بیرون می‌رود. واردات داخل می‌آید."}},{t:{en:"A good that is bought from another country",es:"Un producto que se compra a otro país",fa:"جنسی که از کشور دیگر خریده می‌شود"},why:{en:"That is an import. It comes in.",es:"Esa es una importación. Entra al país.",fa:"این واردات است. داخل می‌آید."}},{t:{en:"A good that never leaves the farm",es:"Un producto que nunca sale de la granja",fa:"جنسی که هرگز از کشتزار بیرون نمی‌رود"},why:{en:"An export travels to another country.",es:"Una exportación viaja a otro país.",fa:"صادرات به کشور دیگر سفر می‌کند."}}]}}],signs:[{x:8,y:8,text:{en:"eGOLI · JOHANNESBURG · Gold was found here in 1886. A mining camp grew into a huge African city.",es:"eGOLI · JOHANNESBURGO · Aquí se encontró oro en 1886. Un campamento minero se volvió una enorme ciudad africana.",fa:"اِگولی · ژوهانسبرگ · در سال ۱۸۸۶ این‌جا طلا پیدا شد. یک کمپ معدن به یک شهر بزرگ افریقایی تبدیل شد."}},{x:23,y:12,text:{en:"PORT OF DURBAN ⚓ · Indian Ocean · Ships sail to Asia, Europe and the Americas. Sugarcane grows nearby.",es:"PUERTO DE DURBAN ⚓ · Océano Índico · Los barcos van a Asia, Europa y América. Cerca crece caña de azúcar.",fa:"بندر دوربان ⚓ · بحر هند · کشتی‌ها به آسیا، اروپا و امریکا می‌روند. نزدیک این‌جا نیشکر می‌روید."}}],quest:{stat:"mov",title:{en:"Sugar for a Water Pump",es:"Azúcar por una bomba de agua",fa:"بوره در بدل پمپ آب"},giver:{x:23,y:4,name:{en:"Nomvula",es:"Nomvula",fa:"نومولا"},role:{en:"Sugarcane farmer",es:"Agricultora de caña de azúcar",fa:"دهقان نیشکر"},look:{skin:5,hair:"#1b1410",shirt:"#27ae60",pants:"#5d4037",style:"bun"},lines:[{en:"Sawubona! I am Nomvula. I grow sugarcane on these green hills near Durban.",es:"¡Sawubona! Soy Nomvula. Cultivo caña de azúcar en estas colinas verdes cerca de Durban.",fa:"ساوبونا! من نومولا هستم. روی این تپه‌های سبز نزدیک دوربان نیشکر می‌کارم."},{en:"Rain and warm weather help cane grow. We grow more sugar than we eat.",es:"La lluvia y el calor ayudan a la caña. Cultivamos más azúcar de la que comemos.",fa:"باران و هوای گرم به نیشکر کمک می‌کند. ما بیشتر از خوراک خود بوره داریم."},{en:"But our water pump broke, and new pumps come in on ships.",es:"Pero nuestra bomba de agua se rompió, y las bombas nuevas llegan en barco.",fa:"اما پمپ آب ما خراب شد، و پمپ‌های نو با کشتی می‌آیند."},{en:"Johan drives trains, west of here. He knows the port traders. Please ask him!",es:"Johan maneja trenes, al oeste de aquí. Conoce a los comerciantes del puerto. ¡Pregúntale, por favor!",fa:"یوهان در غرب این‌جا قطار می‌راند. او تاجران بندر را می‌شناسد. لطفاً از او بپرس!"}],wait:{en:"Johan works by the railway, west of here. Follow the tracks west.",es:"Johan trabaja junto a la vía del tren, al oeste de aquí. Sigue las vías hacia el oeste.",fa:"یوهان کنار خط آهن در غرب این‌جا کار می‌کند. خط آهن را به طرف غرب دنبال کن."},thanks:{en:"A new pump! Sugar went out, an [[export|export]]. A pump came in, an [[import|import]]. Trade!",es:"¡Una bomba nueva! Salió azúcar, una [[export|exportación]]. Entró una bomba, una [[import|importación]]. ¡Comercio!",fa:"پمپ نو! بوره بیرون رفت، یک [[export|صادرات]]. پمپ داخل آمد، یک [[import|واردات]]. تجارت!"}},contact:{x:12,y:8,name:{en:"Johan",es:"Johan",fa:"یوهان"},role:{en:"Train driver",es:"Maquinista de tren",fa:"رانندهٔ قطار"},look:{skin:0,hair:"#c8a165",shirt:"#2c3e50",pants:"#34495e",hat:"#7f8c8d"},lines:[{en:"Hi, I am Johan. My train carries ore, fruit and sugar east to the [[port|port]].",es:"Hola, soy Johan. Mi tren lleva mineral, fruta y azúcar al este, hasta el [[port|puerto]].",fa:"سلام، من یوهان هستم. قطار من سنگ معدنی، میوه و بوره را به شرق تا [[port|بندر]] می‌برد."},{en:"Mei Lin sells water pumps by the south warehouses, near the docks.",es:"Mei Lin vende bombas de agua junto a las bodegas del sur, cerca de los muelles.",fa:"می‌لین کنار گدام‌های جنوبی، نزدیک اسکله‌ها، پمپ آب می‌فروشد."},{en:"Offer her something this land has a lot of, and her country needs.",es:"Ofrécele algo que esta tierra tiene de sobra y que su país necesita.",fa:"به او چیزی پیشنهاد کن که این سرزمین زیاد دارد و کشورش ضرورت دارد."}]},action:{type:"trade",trader:{x:22,y:18,name:{en:"Mei Lin",es:"Mei Lin",fa:"می‌لین"},role:{en:"Ship trader from China",es:"Comerciante de barco de China",fa:"تاجر کشتی از چین"},look:{skin:1,hair:"#111111",shirt:"#d35400",pants:"#2c3e50",style:"long"},lines:[{en:"Ni hao means hello in Chinese! My ship brings pumps and machines from China.",es:"¡Ni hao quiere decir hola en chino! Mi barco trae bombas y máquinas de China.",fa:"نی هاو به زبان چینی یعنی سلام! کشتی من پمپ و ماشین از چین می‌آورد."},{en:"I take South African goods back home.",es:"Me llevo productos de Sudáfrica a mi país.",fa:"جنس‌های افریقای جنوبی را به وطنم می‌برم."}]},q:{en:"What will you trade me for one water pump?",es:"¿Qué me das a cambio de una bomba de agua?",fa:"در بدل یک پمپ آب به من چه می‌دهی؟"},choices:[{ok:true,at:[20,3],icon:"🪨",t:{en:"A sack of sugar from Nomvula's farm",es:"Un saco de azúcar de la finca de Nomvula",fa:"یک بوجی بوره از کشتزار نومولا"},why:{en:"Good trade! The warm, rainy hills near Durban grow lots of sugarcane. Sugar is an [[export|export]] here, and my country needs more than it grows.",es:"¡Buen trato! Las colinas cálidas y lluviosas cerca de Durban dan mucha caña de azúcar. El azúcar es una [[export|exportación]] de aquí, y mi país necesita más de la que produce.",fa:"معاملهٔ خوب! تپه‌های گرم و بارانی نزدیک دوربان نیشکر زیاد می‌دهند. بوره این‌جا [[export|صادرات]] است و کشور من بیشتر از آن‌چه تولید می‌کند به آن نیاز دارد."}},{at:[25,19],icon:"🪨",t:{en:"A bag of rice",es:"Una bolsa de arroz",fa:"یک خلطه برنج"},why:{en:"This rice just came off a ship! South Africa grows very little rice. It buys rice from other countries, so rice is an [[import|import]] here. Do not trade away what you have to buy.",es:"¡Este arroz acaba de bajar de un barco! Sudáfrica cultiva muy poco arroz. Lo compra a otros países, así que aquí el arroz es una [[import|importación]]. No cambies lo que tienes que comprar.",fa:"این برنج همین حالا از کشتی پایین شده! افریقای جنوبی برنج بسیار کم می‌کارد. برنج را از کشورهای دیگر می‌خرد، پس برنج این‌جا [[import|واردات]] است. چیزی را که خودت می‌خری، در بدل چیز دیگر نده."}},{at:[25,18],icon:"📱",t:{en:"A new phone",es:"Un teléfono nuevo",fa:"یک موبایل نو"},why:{en:"This phone just came off a ship! Most phones here come in on ships, just like my pumps. I want something this land makes a lot of.",es:"¡Este teléfono acaba de bajar de un barco! Casi todos los teléfonos de aquí llegan en barco, igual que mis bombas. Yo quiero algo que esta tierra produce en abundancia.",fa:"این موبایل همین حالا از کشتی پایین شده! بیشتر موبایل‌های این‌جا با کشتی می‌آیند، درست مثل پمپ‌های من. من چیزی می‌خواهم که این سرزمین زیاد تولید می‌کند."}}],item:{icon:"⚙️",name:{en:"A new water pump",es:"Una bomba de agua nueva",fa:"یک پمپ آب نو"}}}},scraps:[[1,1],[16,1],[13,20]],smudges:[[14,4],[20,14],[24,6]],challenge:{at:[20,8],type:"route",spots:[[3,3],[11,3],[14,8],[28,17],[29,20],[29,4],[10,14]],stat:"mov",title:{en:"From the mine to your kitchen",es:"De la mina a tu cocina",fa:"از معدن تا آشپزخانهٔ تو"},intro:{en:"The Grump scattered the trade chain! Chrome ore leaves a mine in South Africa and ends up far away. Walk to each step on the map in the right order, from first to last.",es:"¡El Gruñón desarmó la cadena de comercio! El mineral de cromo sale de una mina en Sudáfrica y termina muy lejos. Camina a cada paso del mapa en el orden correcto, del primero al último.",fa:"غرغرو زنجیر تجارت را پراگنده کرد! سنگ کروم از یک معدن در افریقای جنوبی بیرون می‌آید و به جای دور می‌رسد. به ترتیب درست، از اول تا آخر، به هر قدم روی نقشه برو."},items:[{icon:"⛏️",t:{en:"Miners dig chrome ore from deep in the ground",es:"Mineros sacan mineral de cromo de lo profundo de la tierra",fa:"معدن‌کاران سنگ کروم را از عمق زمین بیرون می‌کنند"}},{icon:"🏭",t:{en:"A processing plant crushes the rock and pulls out the ore",es:"Una planta de procesamiento tritura la roca y saca el mineral",fa:"یک کارخانهٔ پروسس سنگ را میده می‌کند و سنگ معدنی را جدا می‌کند"}},{icon:"🚆",t:{en:"A train carries the ore to the coast",es:"Un tren lleva el mineral a la costa",fa:"قطار سنگ معدنی را به ساحل می‌برد"}},{icon:"⚓",t:{en:"Cranes at the port of Durban load it onto a ship",es:"Las grúas del puerto de Durban lo suben a un barco",fa:"جرثقیل‌های بندر دوربان آن را در کشتی بار می‌کنند"}},{icon:"🚢",t:{en:"The ship crosses the ocean to another country, like China",es:"El barco cruza el océano hasta otro país, como China",fa:"کشتی از اقیانوس به یک کشور دیگر، مثل چین، می‌رود"}},{icon:"🔥",t:{en:"A steel factory there mixes the chrome into shiny steel",es:"Allí una fábrica de acero mezcla el cromo para hacer acero brillante",fa:"در آن‌جا یک فابریکهٔ فولاد کروم را با فولاد براق مخلوط می‌کند"}},{icon:"🛒",t:{en:"A store sells a steel pot that does not rust",es:"Una tienda vende una olla de acero que no se oxida",fa:"یک دوکان دیگ فولادی می‌فروشد که زنگ نمی‌زند"}}],why:{en:"Follow the ore: first it is dug up, then cleaned, then moved by train and ship, then made into something new, then sold. The finished pot is worth much more than the rock.",es:"Sigue el mineral: primero se saca, luego se limpia, luego viaja en tren y en barco, luego se convierte en algo nuevo y al final se vende. La olla terminada vale mucho más que la roca.",fa:"دنبال سنگ معدنی برو: اول کنده می‌شود، بعد پاک می‌شود، بعد با قطار و کشتی می‌رود، بعد به چیز تازه تبدیل می‌شود، بعد فروخته می‌شود. دیگ آماده خیلی قیمتی‌تر از سنگ است."},success:{en:"The trade chain is fixed! Each step adds work, and each step adds value.",es:"¡La cadena de comercio está arreglada! Cada paso suma trabajo y cada paso suma valor.",fa:"زنجیر تجارت درست شد! هر قدم کار اضافه می‌کند و هر قدم ارزش اضافه می‌کند."}},boss:{at:[21,16],stat:"hei",need:3,name:{en:"The Rust Grump",es:"El Gruñón de Óxido",fa:"غرغروی زنگ"},appear:{en:"The Rust Grump is lurking by the warehouses near the port!",es:"¡El Gruñón de Óxido acecha junto a las bodegas cerca del puerto!",fa:"غرغروی زنگ کنار گدام‌های نزدیک بندر کمین کرده است!"},taunt:{en:"Creak! I rusted the trains and jammed the cranes. Who will carry the ore now?",es:"¡Crac! Oxidé los trenes y trabé las grúas. ¿Quién llevará el mineral ahora?",fa:"غِژ! قطارها را زنگ زدم و جرثقیل‌ها را بند کردم. حالا کی سنگ معدنی را می‌برد؟"},win:{en:"The rust flakes away. Atlas page 4.3 floats down into your hands!",es:"El óxido se cae. ¡La página 4.3 del atlas cae en tus manos!",fa:"زنگ ریخته می‌شود. صفحهٔ ۴.۳ اطلس به دستت می‌افتد!"},questions:[{q:{en:"Johannesburg grew up around…",es:"Johannesburgo creció alrededor de…",fa:"ژوهانسبرگ دور … بزرگ شد."},choices:[{en:"gold mining",es:"la minería de oro",fa:"معدن طلا"},{en:"cocoa farms",es:"granjas de cacao",fa:"کشت países el cacao es un cultivo comercial importante?",fa:"کاکائو در کدام کشورها کشت تجارتی مهم است؟"},choices:[{en:"Ghana and Ivory Coast",es:"Ghana y Costa de Marfil",fa:"گانا و ساحل عاج"},{en:"Ethiopia and Kenya",es:"Etiopía y Kenia",fa:"ایتوپیا و کینیا"},{en:"Botswana and Zambia",es:"Botsuana y Zambia",fa:"بوتسوانا و زامبیا"},{en:"Saudi Arabia and Türkiye",es:"Arabia Saudita y Turquía",fa:"عربستان سعودی و ترکیه"}],answer:0,why:{en:"Ghana and Ivory Coast grow cocoa. Ethiopia and Kenya are known for coffee.",es:"Ghana y Costa de Marfil cultivan cacao. Etiopía y Kenia son conocidas por el café.",fa:"گانا و ساحل عاج کاکائو می‌کارند. ایتوپیا و کینیا به قهوه مشهور هستند."}},{q:{en:"Why can a country rich in minerals still have many poor people?",es:"¿Por qué un país rico en minerales todavía puede tener mucha gente pobre?",fa:"چرا کشوری که معدنیات زیاد دارد باز هم مردم فقیر زیاد دارد؟"},choices:[{en:"The big money is in finished products made abroad",es:"El gran dinero está en productos terminados hechos afuera",fa:"پول اصلی در جنس آماده‌ای است که در خارج ساخته می‌شود"},{en:"Minerals are worth nothing at all to anyone",es:"Los minerales no valen nada para nadie",fa:"معدنیات برای هیچ‌کس هیچ ارزشی ندارند"},{en:"Nobody in the whole world wants to buy minerals",es:"Nadie en todo el mundo quiere comprar minerales",fa:"هیچ‌کس در تمام جهان نمی‌خواهد معدنیات بخرد"},{en:"Mining makes it rain much more on the land",es:"La minería hace que llueva mucho más en la tierra",fa:"معدن‌کاری باران زمین را خیلی بیشتر می‌کند"}],answer:0,why:{en:"Selling raw rock earns less than making and selling the finished product.",es:"Vender roca sin procesar da menos que hacer y vender el producto terminado.",fa:"فروختن سنگ خام کمتر از ساختن و فروختن جنس آماده پول می‌آورد."}},{q:{en:"What is an import?",es:"¿Qué es una importación?",fa:"واردات چیست؟"},choices:[{en:"A good bought from another country",es:"Un producto que se compra a otro país",fa:"جنسی که از کشور دیگر خریده می‌شود"},{en:"A good sold and sent to another country",es:"Un producto que se vende y se envía a otro país",fa:"جنسی که فروخته و به کشور دیگر فرستاده می‌شود"},{en:"A mineral that stays in the ground",es:"Un mineral que se queda en la tierra",fa:"معدنی که در زیر زمین می‌ماند"},{en:"A train that never leaves the mine",es:"Un tren que nunca sale de la mina",fa:"قطاری که هرگز از معدن بیرون نمی‌رود"}],answer:0,why:{en:"Imports come in from other countries. Exports go out.",es:"Las importaciones entran desde otros países. Las exportaciones salen.",fa:"واردات از کشورهای دیگر داخل می‌آید. صادرات بیرون می‌رود."}},{q:{en:"Why is a port like Durban important to South Africa?",es:"¿Por qué un puerto como Durban es importante para Sudáfrica?",fa:"چرا بندری مثل دوربان برای افریقای جنوبی مهم است؟"},choices:[{en:"Ships carry exports out and imports in",es:"Los barcos sacan exportaciones y traen importaciones",fa:"کشتی‌ها صادرات را بیرون و واردات را داخل می‌برند"},{en:"It is where South Africa first found gold",es:"Es donde Sudáfrica encontró oro por primera vez",fa:"جایی است که افریقای جنوبی اول بار طلا یافت"},{en:"It is the highest city in Africa",es:"Es la ciudad más alta de África",fa:"بلندترین شهر افریقا است"},{en:"Trains cannot reach it",es:"Los trenes no pueden llegar",fa:"قطار به آن‌جا نمی‌رسد"}],answer:0,why:{en:"A port connects a country to the world by sea.",es:"Un puerto conecta a un país con el mundo por mar.",fa:"بندر یک کشور را از راه بحر به جهان وصل می‌کند."}},{q:{en:"Why does a steel pot sell for much more than the chrome ore inside it?",es:"¿Por qué una olla de acero se vende por mucho más que el mineral de cromo que tiene?",fa:"چرا یک دیگ فولادی خیلی قیمتی‌تر از سنگ کرومی است که در آن به کار رفته؟"},choices:[{en:"Work turned the ore into something useful",es:"El trabajo convirtió el mineral en algo útil",fa:"کار، سنگ را به چیز مفید تبدیل کرد"},{en:"The pot is much heavier than the ore inside",es:"La olla pesa mucho más que el mineral que tiene",fa:"دیگ خیلی سنگین‌تر از سنگ داخل آن است"},{en:"Ore is free for anyone to dig up",es:"Sacar mineral es gratis para todos",fa:"کندن سنگ معدنی برای همه مفت است"},{en:"Stores pay nothing for pots",es:"Las tiendas no pagan nada por las ollas",fa:"دوکان‌ها برای دیگ هیچ پول نمی‌دهند"}],answer:0,why:{en:"Each step in the chain adds work and value. The finished product is worth the most.",es:"Cada paso de la cadena suma trabajo y valor. El producto terminado es el que más vale.",fa:"هر قدم زنجیر کار و ارزش اضافه می‌کند. جنس آماده از همه قیمتی‌تر است."}}]},learned:[{en:"South Africa mines gold, platinum and chrome. Johannesburg grew up around gold mining after 1886.",es:"Sudáfrica saca oro, platino y cromo. Johannesburgo creció alrededor de la minería de oro después de 1886.",fa:"افریقای جنوبی طلا، پلاتین و کروم استخراج می‌کند. ژوهانسبرگ بعد از ۱۸۸۶ دور معدن طلا بزرگ شد."},{en:"[[raw material|Raw materials]] travel by train to a [[port|port]] like Durban, then by ship to factories far away. Value grows at each step.",es:"Las [[raw material|materias primas]] viajan en tren a un [[port|puerto]] como Durban, y luego en barco a fábricas lejanas. El valor crece en cada paso.",fa:"[[raw material|مواد خام]] با قطار به [[port|بندری]] مثل دوربان می‌روند، بعد با کشتی به فابریکه‌های دور. ارزش در هر قدم بیشتر می‌شود."},{en:"A [[cash crop|cash crop]] like cocoa or coffee is grown to sell. Selling mostly one product is risky when its price falls.",es:"Un [[cash crop|cultivo comercial]] como el cacao o el café se siembra para vender. Vender casi solo un producto es arriesgado cuando su precio baja.",fa:"[[cash crop|کشت تجارتی]] مثل کاکائو یا قهوه برای فروش کاشته می‌شود. فروختن بیشتر یک جنس وقتی قیمتش پایین بیاید خطرناک است."}],reflect:{q:{en:"Pick one thing you use every day, like a phone, shoes or a cooking pot. Where do you think its materials started? How many steps did it take to reach you?",es:"Elige una cosa que usas todos los días, como un teléfono, unos zapatos o una olla. ¿Dónde crees que empezaron sus materiales? ¿Cuántos pasos dio para llegar a ti?",fa:"یک چیزی را که هر روز استفاده می‌کنی انتخاب کن، مثل موبایل، بوت یا دیگ. فکر می‌کنی مواد آن از کجا شروع شد؟ چند قدم طول کشید تا به تو برسد؟"},starter:{en:"One thing I use every day is",es:"Una cosa que uso todos los días es",fa:"یک چیزی که من هر روز استفاده می‌کنم"}}};
