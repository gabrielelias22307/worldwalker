fore you choose.",es:"Visita {n} lugar(es) más antes de elegir.",fa:"پیش از انتخاب به {n} جای دیگر هم سر بزن."},ns_site:{en:"Visit the flags: {n} left.",es:"Visita las banderas: faltan {n}.",fa:"به بیرق‌ها سر بزن: {n} تا مانده."},ns_siteDone:{en:"You saw every site. Walk into the flag you think is best.",es:"Viste todos los lugares. Camina hacia la bandera que crees que es la mejor.",fa:"همهٔ جاها را دیدی. به طرف بیرقی برو که فکر می‌کنی بهترین است."},w_surveyHow:{en:"Visit every survey post on the map to collect the facts. Then come back and answer.",es:"Visita cada poste de datos del mapa para juntar los datos. Luego vuelve y responde.",fa:"به هر تیر معلومات روی نقشه سر بزن تا معلومات جمع کنی. بعد برگرد و جواب بده."},w_surveyGo:{en:"Find the survey posts with a 📋 on the map.",es:"Busca los postes con 📋 en el mapa.",fa:"تیرهای 📋 دار را روی نقشه پیدا کن."},w_surveySeen:{en:"Posts read: {n} of {m}",es:"Postes leídos: {n} de {m}",fa:"تیرهای خوانده شده: {n} از {m}"},w_surveyPost:{en:"Survey post",es:"Poste de datos",fa:"تیر معلومات"},w_surveyLeft:{en:"{n} more survey post(s) to find.",es:"Faltan {n} poste(s) de datos.",fa:"{n} تیر معلومات دیگر مانده."},w_surveyAll:{en:"You have all the facts! Go back to the compass stone and answer.",es:"¡Tienes todos los datos! Vuelve a la piedra brújula y responde.",fa:"همهٔ معلومات را داری! به سنگ قطب‌نما برگرد و جواب بده."},w_leversHow:{en:"Pull the levers on the map to set them. Then come back here to test them.",es:"Mueve las palancas del mapa. Luego vuelve aquí para probarlas.",fa:"دسته‌های روی نقشه را تنظیم کن. بعد این جا برگرد و امتحانشان کن."},w_leversGo:{en:"Find the levers. Walk into one to change it.",es:"Busca las palancas. Camina hacia una para cambiarla.",fa:"دسته‌ها را پیدا کن. به طرف یکی برو تا عوضش کنی."},w_leverTest:{en:"Test the levers at the compass stone.",es:"Prueba las palancas en la piedra brújula.",fa:"دسته‌ها را در سنگ قطب‌نما امتحان کن."},w_leverAgain:{en:"Change the levers on the map and test again.",es:"Ca window.EPISODE={id:"6.3",realm:6,sol:"WHII",title:{en:"The Great Depression",es:"La Gran Depresión",fa:"رکود بزرگ"},place:{en:"Chicago, USA, 1932",es:"Chicago, EE. UU., 1932",fa:"شیکاگو، امریکا، ۱۹۳۲"},weather:{sky:"snow"},intro:[{en:"The Grump blurred the [[great depression|Great Depression]] page. People forgot how hard times spread.",es:"El Gruñón borró la página de la [[great depression|Gran Depresión]]. La gente olvidó cómo se extendieron los tiempos duros.",fa:"غرغرو صفحهٔ [[great depression|رکود بزرگ]] را تار کرد. مردم فراموش کردند روزهای سخت چطور پخش شد."},{en:"Talk to the 3 people here, then fix the time stone.",es:"Habla con las 3 personas de aquí y luego arregla la piedra del tiempo.",fa:"با ۳ نفر اینجا گپ بزن، بعد سنگ زمان را درست کن."}],scenes:{at:[-87.6,41.9],year:1932,start:[{en:"In October 1929, prices on the US stock market crashed.",es:"En octubre de 1929, los precios de la bolsa de Estados Unidos se desplomaron.",fa:"در اکتوبر ۱۹۲۹، قیمت‌ها در بازار سهام امریکا سقوط کرد."},{en:"Banks closed, factories shut, and millions of people lost their jobs.",es:"Cerraron bancos y fábricas, y millones de personas perdieron su trabajo.",fa:"بانک‌ها و فابریکه‌ها بسته شدند و میلیون‌ها نفر کار خود را از دست دادند."},{en:"This hard time is called the Great Depression. It spread around the world.",es:"Esta época dura se llama la Gran Depresión. Se extendió por todo el mundo.",fa:"این دورهٔ سخت رکود بزرگ نام دارد. در سراسر جهان پخش شد."}],page:{en:"In 1933, the New Deal began. The US government made jobs for millions.",es:"En 1933 empezó el Nuevo Trato. El gobierno de Estados Unidos creó trabajos para millones.",fa:"در ۱۹۳۳، برنامهٔ نیو دیل شروع شد. حکومت امریکا برای میلیون‌ها نفر کار ساخت."},guess:{q:{en:"In 1932, could people who lost their jobs find new ones fast?",es:"En 1932, ¿la gente que perdía su trabajo encontraba otro rápido?",fa:"در ۱۹۳۲، آیا کسانی که کار خود را از دست دادند زود کار تازه پیدا می‌کردند؟"},choices:[{t:{en:"No, jobs were scarce",es:"No, había pocos trabajos",fa:"نه، کار کم بود"},ok:true},{t:{en:"Yes, very fast",es:"Sí, muy rápido",fa:"بله، خیلی زود"}}],why:{en:"Factories and stores were closing. In 1932, about 1 in 4 US workers had no job.",es:"Fábricas y tiendas cerraban. En 1932, cerca de 1 de cada 4 trabajadores en EE. UU. no tenía empleo.",fa:"فابریکه‌ها و دکان‌ها بسته می‌شدند. در ۱۹۳۲ از هر ۴ کارگر امریکایی حدود ۱ نفر بیکار بود."}},next:{q:{en:"Next: the rise of dictators. Can hunger and fear help a cruel leader?",es:"Ahora: el ascenso de los dictadores. ¿El hambre y el miedo pueden ayudar a un líder cruel?",fa:"بعدی: به قدرت رسیدن دیکتاتورها. آیا گرسنگی و ترس به یک رهبر ظالم کمک می‌کند؟"},choices:[{t:{en:"Yes, they can",es:"Sí, pueden",fa:"بله، می‌توانند"},ok:true},{t:{en:"No, never",es:"No, nunca",fa:"نه، هرگز"}}],why:{en:"In the 1930s, leaders like Hitler used people's fear and anger to gain total power.",es:"En los años 30, líderes como Hitler usaron el miedo y el enojo de la gente para tener todo el poder.",fa:"در دههٔ ۱۹۳۰، رهبرانی مثل هیتلر از ترس و خشم مردم استفاده کردند تا قدرت کامل بگیرند."}}},houses:[{at:[3,13],name:{en:"Mr. Willis",es:"Sr. Willis",fa:"آقای ویلیس"},look:{skin:5,hair:"#2a2a2a",shirt:"#f2f2f2",pants:"#1a1a2a",style:"short",hat:"#1a1a2a"},lines:[{en:"I am a porter on the trains. I carry bags and make beds.",es:"Soy maletero en los trenes. Llevo maletas y hago camas.",fa:"من حمال قطار هستم. بکس‌ها را می‌برم و بستر جور می‌کنم."},{en:"Black workers are often the last hired and the first fired.",es:"A los trabajadores negros muchas veces los contratan al final y los despiden primero.",fa:"کارگران سیاه‌پوست اکثراً آخر از همه استخدام و اول از همه اخراج می‌شوند."}]},{at:[9,13],name:{en:"Pastor Green",es:"Pastor Green",fa:"کشیش گرین"},look:{skin:4,hair:"#a8a8a8",shirt:"#2a2a2a",pants:"#2a2a2a",style:"short"},lines:[{en:"This is our church soup kitchen. Hundreds come here every day.",es:"Este es el comedor de nuestra iglesia. Cientos vienen aquí cada día.",fa:"این آشخانهٔ خیریهٔ کلیسای ماست. هر روز صدها نفر اینجا می‌آیند."},{en:"Some had good jobs before the crash. Now they wait in line for soup.",es:"Algunos tenían buenos trabajos antes de la caída. Ahora hacen fila por sopa.",fa:"بعضی پیش از سقوط کار خوب داشتند. حالا برای شوربا در قطار می‌ایستند."}]},{at:[3,18],name:{en:"Mrs. Kowalski",es:"Sra. Kowalski",fa:"خانم کووالسکی"},look:{skin:1,hair:"#c8a060",shirt:"#5a6a4a",pants:"#3a3a3a",style:"bun"},lines:[{en:"We could not pay the rent, so we share this house with my sister.",es:"No pudimos pagar la renta, así que vivimos con mi hermana.",fa:"نتوانستیم کرایه بدهیم، پس با خواهرم در این خانه زندگی می‌کنیم."},{en:"I sew clothes at night to earn a few cents.",es:"Coso ropa de noche para ganar unos centavos.",fa:"شب‌ها لباس می‌دوزم تا چند سنت پیدا کنم."}]},{at:[25,2],name:{en:"Mr. Price",es:"Sr. Price",fa:"آقای پرایس"},look:{skin:1,hair:"#5a5a5a",shirt:"#3a4a6a",pants:"#2a2a2a",style:"short"},lines:[{en:"I was a clerk in this bank. It closed its doors last month.",es:"Era empleado de este banco. Cerró sus puertas el mes pasado.",fa:"من کارمند این بانک بودم. ماه گذشته درهایش را بست."},{en:"We had lent the savings out. When everyone came at once, the money was gone.",es:"Habíamos prestado los ahorros. Cuando todos vinieron a la vez, ya no había dinero.",fa:"پس‌اندازها را قرض داده بودیم. وقتی همه یکجا آمدند، پولی نماند."}]},{at:[18,14],name:{en:"Sam",es:"Sam",fa:"سم"},look:{skin:2,hair:"#3a2a1a",shirt:"#6a4a3a",pants:"#3a3a3a",style:"short",hat:"#4a3a2a"},lines:[{en:"I was a carpenter. I lost my house when I could not pay the bank.",es:"Era carpintero. Perdí mi casa cuando no pude pagarle al banco.",fa:"من نجار بودم. وقتی نتوانستم پول بانک را بدهم، خانه‌ام را از دست دادم."},{en:"I built this shack from boxes and tin. People call these camps Hoovervilles.",es:"Hice esta choza con cajas y lata. La gente llama a estos campos Hoovervilles.",fa:"این کلبه را از قطی و حلبی ساختم. مردم این اردوگاه‌ها را هوورویل می‌نامند."}]},{at:[23,14],name:{en:"Clara",es:"C ,es:"Obrero del acero",fa:"کارگر فولاد"},look:{skin:1,hair:"#7a5a3a",shirt:"#4a5a6a",pants:"#2a2a3a",style:"short",hat:"#3a3a3a"},lines:[{en:"My parents came from Poland. I worked in this steel mill for ten years.",es:"Mis padres vinieron de Polonia. Trabajé en esta acería diez años.",fa:"پدر و مادرم از پولند آمدند. ده سال در این فابریکهٔ فولاد کار کردم."},{en:"People stopped buying cars and buildings. So the mill needed less steel.",es:"La gente dejó de comprar autos y edificios. Así que la acería necesitó menos acero.",fa:"مردم دیگر موتر و ساختمان نخریدند. پس فابریکه به فولاد کمتر نیاز داشت."},{en:"The mill closed. Now about 1 in 4 workers is [[unemployed|unemployed]], like me.",es:"La acería cerró. Ahora cerca de 1 de cada 4 trabajadores está [[unemployed|desempleado]], como yo.",fa:"فابریکه بسته شد. حالا از هر ۴ کارگر حدود ۱ نفر مثل من [[unemployed|بیکار]] است."}],ask:{stat:"loc",q:{en:"Why did so many factories close after 1929?",es:"¿Por qué cerraron tantas fábricas después de 1929?",fa:"چرا بعد از ۱۹۲۹ این‌قدر زیاد فابریکه‌ها بسته شدند؟"},choices:[{ok:true,t:{en:"People had less money, so they bought less",es:"La gente tenía menos dinero y compraba menos",fa:"مردم پول کمتر داشتند، پس کمتر خریدند"},why:{en:"Yes. With less buying, factories sold less, so they cut jobs. Then people had even less money.",es:"Sí. Con menos compras, las fábricas vendían menos y despedían gente. Entonces había aún menos dinero.",fa:"بله. با خرید کمتر، فابریکه‌ها کمتر فروختند و کارگران را اخراج کردند. بعد مردم پول کمتری داشتند."}},{t:{en:"The government ordered every factory to close",es:"El gobierno ordenó cerrar todas las fábricas",fa:"حکومت دستور داد همهٔ فابریکه‌ها بسته شوند"},why:{en:"No law closed them. Factories closed because people stopped buying.",es:"Ninguna ley las cerró. Cerraron porque la gente dejó de comprar.",fa:"هیچ قانونی آن‌ها را نبست. چون مردم خرید را بس کردند، بسته شدند."}},{t:{en:"All the workers left to become farmers",es:"Todos los obreros se fueron a ser agricultores",fa:"همهٔ کارگران رفتند تا دهقان شوند"},why:{en:"Workers wanted to keep their jobs. Farmers were having hard times too.",es:"Los obreros querían conservar su trabajo. Los agricultores también pasaban tiempos duros.",fa:"کارگران می‌خواستند کارشان را نگه دارند. دهقانان هم روزهای سختی داشتند."}}]}},{x:12,y:18,name:{en:"Gertrude",es:"Gertrude",fa:"گرترود"},role:{en:"Baker from Germany",es:"Panadera de Alemania",fa:"نانوای آلمانی"},look:{skin:1,hair:"#d8c8a0",shirt:"#f2f2f2",pants:"#4a3a3a",style:"bun"},lines:[{en:"I came from Germany in 1923. My sister still lives in Berlin.",es:"Vine de Alemania en 1923. Mi hermana todavía vive en Berlín.",fa:"من در ۱۹۲۳ از آلمان آمدم. خواهرم هنوز در برلین زندگی می‌کند."},{en:"After the crash, American banks wanted their [[loan|loans]] to Germany paid back.",es:"Después de la caída, los bancos estadounidenses quisieron que Alemania pagara sus [[loan|préstamos]].",fa:"بعد از سقوط، بانک‌های امریکایی خواستند آلمان [[loan|قرض‌هایشان]] را پس بدهد."},{en:"Now 6 million Germans have no work. Some listen to a man named Hitler.",es:"Ahora 6 millones de alemanes no tienen trabajo. Algunos escuchan a un hombre llamado Hitler.",fa:"حالا ۶ میلیون آلمانی کار ندارند. بعضی به مردی به نام هیتلر گوش می‌دهند."}],ask:{stat:"reg",q:{en:"How did the crash in the United States hurt Germany?",es:"¿Cómo dañó a Alemania la caída de Estados Unidos?",fa:"سقوط در امریکا چطور به آلمان زیان رساند؟"},choices:[{ok:true,t:{en:"US banks asked for their loans back",es:"Los bancos de EE. UU. pidieron sus préstamos",fa:"بانک‌های امریکا قرض‌شان را پس خواستند"},why:{en:"Yes. German businesses had lived on US loans. Without them, many closed.",es:"Sí. Los negocios alemanes vivían de préstamos de EE. UU. Sin ellos, muchos cerraron.",fa:"بله. کسب و کار آلمان با قرض امریکا می‌چرخید. بدون آن، بسیاری بسته شدند."}},{t:{en:"American soldiers took over German mills",es:"Soldados estadounidenses tomaron fábricas alemanas",fa:"سربازان امریکایی فابریکه‌های آلمان را گرفتند"},wh ba cosas, como papas por carbón.",fa:"بانک‌ها بسته شدند و کارها از دست رفت. بی پول نقد، مردم جنس عوض می‌کردند، مثل کچالو با ذغال."}},{q:{en:"How did the Depression help dictators rise?",es:"¿Cómo ayudó la Depresión a que subieran dictadores?",fa:"رکود چطور به بالا آمدن دیکتاتورها کمک کرد؟"},choices:[{en:"Hungry, scared people wanted a strong leader",es:"La gente con hambre y miedo quería un líder fuerte",fa:"مردم گرسنه و ترسیده رهبر قوی می‌خواستند"},{en:"Every country had more jobs than workers",es:"Todos los países tenían más trabajos que obreros",fa:"هر کشور از کارگر بیشتر کار داشت"},{en:"Dictators gave away all of their money",es:"Los dictadores regalaron todo su dinero",fa:"دیکتاتورها همهٔ پول خود را بخشیدند"},{en:"People voted to end all of the schools",es:"La gente votó por cerrar todas las escuelas",fa:"مردم رأی دادند همهٔ مکتب‌ها بسته شوند"}],answer:0,why:{en:"In Germany, millions had no work. Hitler promised jobs and blamed others, and many followed him.",es:"En Alemania, millones no tenían trabajo. Hitler prometió empleo y culpó a otros, y muchos lo siguieron.",fa:"در آلمان، میلیون‌ها نفر کار نداشتند. هیتلر وعدهٔ کار داد و دیگران را مقصر دانست، و بسیاری از او پیروی کردند."}}]},learned:[{en:"The [[stock market|stock market]] crashed in 1929. Banks failed, and people lost their [[savings|savings]].",es:"La [[stock market|bolsa]] se desplomó en 1929. Los bancos quebraron y la gente perdió sus [[savings|ahorros]].",fa:"[[stock market|بازار سهام]] در ۱۹۲۹ سقوط کرد. بانک‌ها ورشکست شدند و مردم [[savings|پس‌انداز]] خود را از دست دادند."},{en:"In the [[great depression|Great Depression]], about 1 in 4 US workers was [[unemployed|unemployed]]. It spread around the world.",es:"En la [[great depression|Gran Depresión]], cerca de 1 de cada 4 trabajadores de EE. UU. estaba [[unemployed|desempleado]]. Se extendió por el mundo.",fa:"در [[great depression|رکود بزرگ]]، از هر ۴ کارگر امریکایی حدود ۱ نفر [[unemployed|بیکار]] بود. در سراسر جهان پخش شد."},{en:"The [[new deal|New Deal]] made jobs in the US. In Germany, hard times helped Hitler rise.",es:"El [[new deal|Nuevo Trato]] creó trabajos en EE. UU. En Alemania, los tiempos duros ayudaron a subir a Hitler.",fa:"[[new deal|نیو دیل]] در امریکا کار ساخت. در آلمان، روزهای سخت به بالا آمدن هیتلر کمک کرد."}],reflect:{q:{en:"In hard times, how can neighbors help each other, like the soup kitchen did?",es:"En tiempos difíciles, ¿cómo pueden ayudarse los vecinos, como lo hizo el comedor?",fa:"در روزهای سخت، همسایه‌ها چطور می‌توانند به هم کمک کنند، مثل آشخانهٔ خیریه؟"},starter:{en:"Neighbors can help each other by",es:"Los vecinos pueden ayudarse",fa:"همسایه‌ها می‌توانند به هم کمک کنند با"}}};
