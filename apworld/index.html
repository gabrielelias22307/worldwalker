<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>HistoryWalker</title>
<style>
/* WORLDWALKER engine · page and game styles */
@import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Atkinson+Hyperlegible:wght@400;700&display=swap');
:root{
  --bg:#141322; --panel:#1f1d33; --panel2:#29264a; --line:#3b3866; --text:#f3f1ff; --muted:#b9b5dc;
  --gold:#f2c14e; --teal:#2aa198; --red:#e04848; --paper:#fffbe8; --ink:#22202e;
  --pix:'Press Start 2P', ui-monospace, monospace;
  --read:'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--read);font-size:17px;line-height:1.5}
button{font-family:inherit}
/* the whole game is exactly as tall as the window: no page scrolling (FUN-PASS-2, Part A) */
/* only an episode page is locked to the window (it fits itself); the start page, world map and teacher page must scroll */
html.ww-game,html.ww-game body{height:100%;overflow:hidden}
.ww-frame{max-width:1200px;height:100vh;height:100dvh;margin:0 auto;padding:6px 8px;background:var(--bg);display:flex;flex-direction:column;gap:0}
.ww-frame:fullscreen{max-width:none}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-bottom:2px;position:relative}
.ww-frame>.ww-bar,.ww-frame>.hud,.ww-frame>.quest{width:100%;max-width:max(var(--gw,100%),min(100%,560px));margin-left:auto;margin-right:auto}
/* a phone: the tool bar sits under the map */
.ww-frame.narrow .stage>.toolbar{position:static;transform:none;margin:5px auto 0;width:max-content;max-width:100%}
.cbubble.dock{max-width:none}
.cbubble.dock::after{bottom:auto;top:-10px;left:var(--tx,50%);border:7px solid transparent;border-bottom-color:var(--ink);border-top:0}

/* top bar */
.ww-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:5px}
.ww-logo{font-family:var(--pix);font-size:12px;color:var(--gold);text-decoration:none;margin-right:auto}
.ww-bar button{font-size:13px;padding:5px 8px;background:var(--panel2);color:#fff;border:2px solid #000;border-radius:4px;cursor:pointer;line-height:1.3}
@media (max-width:820px){.ww-bar .lbl{display:none}.ww-bar button{padding:5px 7px}}
@media (max-width:520px){.ww-logo{display:none}.ww-bar{gap:4px;justify-content:center}.ww-bar .langs,.ww-bar .tools{gap:3px}.ww-bar button{font-size:12px;padding:4px 6px}}
.ww-bar .langs button.on{background:var(--gold);color:var(--ink);font-weight:700}
.ww-bar .langs,.ww-bar .tools{display:flex;gap:5px;flex-wrap:wrap}
.ww-preview{font-size:12px;font-weight:700;padding:5px 8px;background:var(--teal);color:#fff;border:2px solid #000;border-radius:4px;text-decoration:none}

/* HUD */
.hud{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:nowrap;background:#0b0a14;padding:5px 10px;font-family:var(--pix);font-size:10px;border:3px solid #000;border-bottom:0;border-radius:6px 6px 0 0}
.hud-left,.hud-right{display:flex;align-items:center;gap:6px}
.hrt{color:var(--red);font-size:16px;line-height:1}
.hrt.empty{color:#4a2630}
.hud-coin{color:var(--gold);margin-left:6px}
.hud-mid{color:var(--muted);font-family:var(--read);font-weight:700;font-size:13px}
.meter{display:inline-flex;align-items:center;gap:2px}
.meter i{font-style:normal;font-size:12px}
.track{display:block;width:40px;height:9px;background:#2a2840;border:2px solid #000}
.track b{display:block;height:100%}
/* the quest bar: the current goal only, on one line; ☰ (or Q) opens the whole list over the map */
.quest{background:#0b0a14;border:3px solid #000;border-top:1px solid #2a2840;border-bottom:0;padding:3px 8px;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px;white-space:nowrap;cursor:pointer;min-width:0}
.quest .qgoal{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.quest .qlist{background:var(--panel2);color:#fff;border:2px solid #000;border-radius:4px;font-size:13px;padding:1px 7px;cursor:pointer}
.qpop{position:absolute;z-index:7;left:8px;top:8px;max-width:calc(100% - 16px);background:rgba(11,10,20,.94);color:var(--text);border:3px solid #000;outline:2px solid var(--gold);border-radius:6px;padding:8px 12px;font-size:14px;line-height:1.5;display:none}
.qpop.on{display:block}
.qpop ol{margin:4px 0 0;padding-inline-start:20px}
.qpop .qdone{color:#7cc451}.qpop .qnow{color:#fff;font-weight:700}.qpop li{color:var(--muted)}
.quest b{color:var(--gold)}
.quest i{font-style:normal;color:#5a5680}
.quest .qnow{color:#fff;font-weight:700}
.quest .qdone{color:#7cc451}
.quest .qscr{color:#c9b064}

/* screen */
.screen{position:relative;background:#000;border:3px solid #000;outline:3px solid var(--line);border-radius:0 0 6px 6px;overflow:hidden;user-select:none;flex:none;width:100%}
.screen:focus{outline-color:var(--gold)}
.screen canvas#ww-cv{display:block;width:100%;height:auto;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}

.toast{position:absolute;right:10px;top:10px;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:5px;max-width:70%;pointer-events:none}
.toast .tst{color:#fff;font-weight:700;font-size:15px;padding:7px 11px;border:3px solid #000;border-radius:4px;animation:pop .2s ease-out}
.toast .tst.big{font-size:16px;padding:10px 14px;outline:3px solid #fff3b0;max-width:100%}
.toast .tst small{display:block;font-weight:400;font-size:13px;opacity:.95}
.defpop{position:absolute;z-index:9;max-width:300px;background:var(--ink);color:#fff;border:3px solid #ffe36e;border-radius:4px;padding:8px 12px;font-size:15px;line-height:1.4;display:none}
.defpop b{color:#ffe36e}

/* overlays */
.ov{position:absolute;inset:0;z-index:5;overflow:auto;background:rgba(10,9,20,.55);padding:12px}
.ov.hidden{display:none}
.ov-box{background:var(--paper);color:var(--ink);border:4px solid var(--ink);outline:3px solid var(--paper);border-radius:4px;padding:14px 16px;max-width:760px;margin:0 auto}
.ov[dir=rtl] .ov-box{text-align:right}
.ov h2{margin:4px 0 6px;font-size:22px;line-height:1.25}
.ov h3{margin:12px 0 6px;font-size:17px;color:#7a3b12}
.ov h4{margin:10px 0 6px;font-size:15px;color:#5a4a7a}
.say{font-size:clamp(15px,1.8vw,18px);margin:6px 0}
.say.q{font-weight:700}
.say.taunt{font-style:italic;color:#4b3f63}
.hint,.small{font-size:13.5px;color:#5c5874;margin:4px 0}
.ov .small a{color:#2f6fd6}
.word{background:#ffe36e;border-bottom:2px dotted #7a3b12;padding:0 2px;cursor:help;border-radius:2px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.acts.center{justify-content:center}
.pbtn{font-size:14px;font-weight:700;padding:9px 14px;background:#29264a;color:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;min-height:42px}
.pbtn.gold{background:var(--gold);color:var(--ink)}
.pbtn.teal{background:var(--teal);color:#fff}
.pbtn.ghost{background:#fff;color:var(--ink)}
.pbtn.big{font-size:17px;padding:11px 22px}
.pbtn:disabled{opacity:.45;cursor:not-allowed}
.pbtn:focus-visible,.choices button:focus-visible,.card:focus-visible{outline:3px solid #2f6fd6;outline-offset:2px}
.choices{display:grid;gap:7px;margin-top:8px}
.choices.two{grid-template-columns:1fr 1fr}
@media (max-width:640px){.choices.two{grid-template-columns:1fr}}
.choices button{text-align:start;font-size:clamp(14px,1.6vw,16.5px);padding:9px 12px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);min-height:44px}
.choices button i{font-style:normal;font-weight:700;color:#7a3b12;margin-inline-end:6px}
.choices button.right{background:#d9f5dd;border-color:#1f7a3a}
.choices button.wrong{background:#fde2de;border-color:#b0392b}
.choices button:disabled{cursor:default;color:var(--ink)}
.fb{margin-top:10px;padding:9px 12px;border-radius:4px;border:2px solid}
.fb.right{background:#e3f6e6;border-color:#1f7a3a;color:#174f27}
.fb.wrong{background:#fdeae6;border-color:#b0392b;color:#7a2318}
.err{color:#b0392b;font-weight:700;text-align:center}

/* talk */
.talk-head{display:flex;gap:12px;align-items:center;margin-bottom:6px}
.talk-head .face{width:64px;height:44px;border:3px solid var(--ink);background:#cfe8ff;image-rendering:pixelated;flex:0 0 auto}
.who{font-weight:700;color:#7a3b12;font-size:16px}
.role{font-size:13.5px;color:#5c5874}
/* start */
.startov .logo{font-family:var(--pix);color:#c08a1e;text-align:center;font-size:clamp(18px,4vw,30px);margin-top:4px}
.startov .sublogo{font-family:var(--pix);text-align:center;font-size:10px;color:#5a4a7a;margin:6px 0 10px}
.epcard{background:#f3e3b5;border:3px solid var(--ink);border-radius:4px;padding:8px 12px;text-align:center}
.epcard h2{margin:2px 0}
.epn{font-size:13px;font-weight:700;color:#5a4a7a}
.place{color:#5c5874}
.langrow{display:flex;gap:6px;justify-content:center;margin:10px 0}
.langrow .pbtn{min-height:36px;padding:6px 12px}
.wb{text-align:center;font-size:18px}
.signin{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;align-items:end}
.signin h3{grid-column:1/-1;margin-bottom:0}
@media (max-width:640px){.signin{grid-template-columns:1fr}}
.signin label,.codein label{display:flex;flex-direction:column;font-size:13.5px;font-weight:700;gap:3px}
.ov input,.ov textarea{font:inherit;font-size:16px;padding:8px 10px;border:3px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);width:100%}
.ov textarea{resize:vertical;min-height:80px;margin-top:6px}
.looks{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.heroprev{border:3px solid var(--ink);background:#cfe8ff;image-rendering:pixelated;width:96px;height:96px}
.lrow{display:flex;align-items:center;gap:5px;margin:3px 0}
.lrow span{width:52px;font-size:13px;font-weight:700}
.sw{width:28px;height:28px;border:3px solid #fff;outline:2px solid var(--ink);border-radius:3px;cursor:pointer;padding:0}
.sw.on{border-color:#c08a1e;outline:3px solid #c08a1e}
.codein{display:flex;gap:8px;align-items:end;margin-top:12px;flex-wrap:wrap}
.codein label{flex:1;min-width:220px}
.pipface{float:right;image-rendering:pixelated;width:64px;height:64px;margin-inline-start:10px}
.ov[dir=rtl] .pipface{float:left}

/* passport */
.pp-top{display:flex;gap:14px;align-items:center}
.pp-hero{border:3px solid var(--ink);background:#cfe8ff;image-rendering:pixelated;width:90px;height:90px}
.pp-name{font-size:22px;font-weight:700}
.pp-nums{display:flex;gap:14px;flex-wrap:wrap;font-size:15px}
.powers{display:grid;gap:6px}
.pw{display:grid;grid-template-columns:30px 1fr 34px;gap:8px;align-items:center}
.pwi{font-size:20px}
.pwn{font-weight:700;text-align:end}
.bar{height:12px;border:2px solid var(--ink);background:#e9dfc0}
.bar b{display:block;height:100%}
.bag{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
@media (max-width:520px){.bag{grid-template-columns:repeat(2,1fr)}}
.slot{border:3px solid #b7a77e;background:#e9dfc0;border-radius:4px;padding:6px;text-align:center;font-size:12.5px;color:#8a7c58}
.slot.has{background:#fff;border-color:var(--ink);color:var(--ink);font-weight:700}
.slot .ti{display:block;font-size:24px}
.stamps{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
@media (max-width:560px){.stamps{grid-template-columns:repeat(4,1fr)}}
.scol{display:flex;flex-direction:column;gap:4px;align-items:center;border:2px dashed #b7a77e;border-radius:4px;padding:4px}
.stamp{width:44px;height:44px;border-radius:50%;border:2px dashed #b7a77e;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:12px;color:#b7a77e;font-weight:700;line-height:1}
.stamp i{font-style:normal;font-size:8px;color:#c08a1e}
.stamp.on{border:3px solid var(--ink);color:#fff}
.stamp.on i{color:#fff}
.stamp.r1{background:#e04848}.stamp.r2{background:#2f7fd1}.stamp.r3{background:#8e5bd6}.stamp.r4{background:#d98e2b}
.stamp.r5{background:#c9a227}.stamp.r6{background:#3fa34d}.stamp.r7{background:#c0392b}.stamp.r8{background:#2aa198}
.coderow{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pcode{font-family:var(--pix);font-size:12px;background:var(--ink);color:var(--gold);padding:8px 10px;border-radius:3px;letter-spacing:1px;direction:ltr;display:inline-block}
.ok{color:#1f7a3a;font-weight:700}.bad{color:#b0392b;font-weight:700}.pending{color:#5a4a7a;font-weight:700}

/* challenges */
.ch-head{display:flex;gap:10px;align-items:flex-start}
.chface{image-rendering:pixelated;width:48px;height:48px;flex:0 0 auto}
.ch-head h3{margin-top:2px}
.pool{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0;min-height:10px}
.card{font-size:14.5px;padding:7px 10px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);text-align:start;line-height:1.3}
.card .ic{margin-inline-end:5px}
.card.sel{background:#ffe36e;border-color:#c08a1e;outline:2px solid #c08a1e}
.card.right{background:#d9f5dd;border-color:#1f7a3a}
.card.wrong{background:#fde2de;border-color:#b0392b}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}
.bins.bands{grid-template-columns:1fr}
.bin{border:3px dashed #8a7c58;border-radius:6px;padding:6px;background:#f6edd2;min-height:70px;cursor:pointer;overflow:hidden}
.bin.target{border-color:#c08a1e;background:#fff3c4}
.bins.bands .bin{min-height:54px;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;align-items:start}
.bintile{grid-row:1/3;width:96px;height:32px;image-rendering:pixelated;border:2px solid var(--ink)}
.binlabel{font-weight:700;font-size:14.5px}
.binin{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.seq{padding-inline-start:26px;margin:8px 0;display:grid;gap:5px}
.seq li.card{cursor:default}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.opt{display:flex;flex-direction:column;gap:3px;text-align:start;padding:9px 11px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);font-size:14.5px}
.opt span{font-size:13.5px;color:#5c5874}
.opt.sel{background:#ffe36e;border-color:#c08a1e}
.kind,.sw-g{margin:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.klabel{width:100%;font-weight:700;font-size:14px;color:#5a4a7a}
.reason{font-size:14px;padding:7px 10px;background:#fff;border:3px solid var(--ink);border-radius:4px;cursor:pointer;color:var(--ink);text-align:start}
.reason.sel{background:#ffe36e;border-color:#c08a1e}
.reason.right{background:#d9f5dd;border-color:#1f7a3a}
.reason.wrong{background:#fde2de;border-color:#b0392b}
.outs{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.out{padding:5px 10px;border-radius:20px;border:2px solid;font-size:14px;font-weight:700}
.out.good{background:#d9f5dd;border-color:#1f7a3a;color:#174f27}
.out.badp{background:#fbe2c8;border-color:#b5651d;color:#7a3b12}
.tblwrap{overflow-x:auto}
.dtbl{border-collapse:collapse;width:100%;font-size:14.5px;margin:6px 0}
.dtbl th,.dtbl td{border:2px solid var(--ink);padding:5px 8px;text-align:start}
.dtbl th{background:#f3e3b5}

/* boss */
.bossov .ov-box{background:#f1ecff}
.boss-top{display:flex;gap:14px;align-items:center}
.bossface{image-rendering:pixelated;width:90px;height:90px;background:#2b2140;border:3px solid var(--ink);border-radius:6px}
.bossface.hit{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
.bname{font-weight:700;font-size:19px;color:#4b3f63}
.shield{display:flex;gap:4px;margin:3px 0}
.shield span{width:44px;height:14px;border:2px solid var(--ink);background:#ddd}
.shield span.on{background:#8fc3ff}
.hearts .hrt{font-size:18px}

/* finish */
.fin-head{display:flex;gap:14px;align-items:center}
.pagebig canvas{image-rendering:pixelated;width:80px;height:80px;animation:glow 1.6s ease-in-out infinite;border-radius:6px}
@keyframes glow{50%{filter:drop-shadow(0 0 10px #f2c14e)}}
.stars{font-size:28px;color:#e0a81e;letter-spacing:3px}
.stars .dim{color:#d8cfb0}
.newtool{margin-top:8px;padding:8px 12px;background:#fff3c4;border:2px solid #c08a1e;border-radius:4px}
.learned{margin:4px 0;padding-inline-start:22px}
.starter{background:#ffe36e;border:2px solid #c08a1e;border-radius:4px;padding:5px 10px;font-size:14px;cursor:pointer;color:var(--ink)}
.top5{margin-top:10px;padding:8px 12px;background:#fff6d6;border:2px solid #d9b44a;border-radius:4px}
.top5 ol{list-style:none;margin:6px 0 4px;padding:0;display:grid;gap:3px}
.top5 li{display:grid;grid-template-columns:2em 1fr auto;gap:8px;align-items:center;padding:2px 8px;border-radius:4px;background:#fffbe8}
.top5 li.me{outline:2px solid #c58f12;font-weight:700}
.top5 .p{opacity:.8}
.savebox{margin-top:10px;padding:8px 12px;background:#efe8d2;border:2px solid #b7a77e;border-radius:4px;display:grid;gap:4px}

/* touch arrows */
.dpad{display:none;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,44px);gap:4px;justify-content:center;margin:6px auto 0;touch-action:none;flex:none}
.dpad button{background:var(--panel2);color:#fff;border:3px solid #000;border-radius:8px;font-size:22px;cursor:pointer}
.dpad [data-d=up]{grid-column:2;grid-row:1}.dpad [data-d=left]{grid-column:1;grid-row:2}.dpad .act{grid-column:2;grid-row:2;background:var(--gold);color:var(--ink)}
.dpad [data-d=right]{grid-column:3;grid-row:2}.dpad [data-d=down]{grid-column:2;grid-row:3}
@media (pointer:coarse){.dpad{display:grid}}
.ww-foot{display:none}
@media (max-width:640px){
  .track{width:22px}.hud{font-size:9px;padding:4px 6px}.hud-mid{display:none}
  .ov{padding:6px}.ov-box{padding:10px 12px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* talk boxes sit at the bottom like a classic RPG; the map stays visible */
.ov.talkov,.ov.msgov{background:rgba(10,9,20,.18);display:flex;flex-direction:column;justify-content:flex-end}
.ov.talkov .ov-box,.ov.msgov .ov-box{width:100%;margin:0 auto}
.stamp{font-family:var(--read)}

.touch .dpad{display:grid}

/* ---------- effects ---------- */
.screen canvas#ww-cv{animation:fadein .7s ease-out}
@keyframes fadein{from{opacity:0;filter:brightness(2)}to{opacity:1;filter:none}}
.ov-box{animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.bossface.crack{animation:flash .45s}
@keyframes flash{0%,60%{filter:brightness(2.4) saturate(.3)}30%{transform:scale(.9) rotate(-4deg)}100%{filter:none;transform:none}}
.shield span.cracked{animation:crack .6s ease-out;position:relative}
@keyframes crack{0%{background:#ffffff;transform:scale(1.25)}40%{background:#8fc3ff;transform:scale(1.1) rotate(6deg)}100%{background:#ddd;transform:none}}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:7}
.confetti i{position:absolute;top:-12px;width:7px;height:10px;border-radius:1px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r));opacity:.9}}

/* ---------- goals, earnings, how you grow ---------- */
.goals{background:#fff3c4;border:3px solid var(--ink);border-radius:6px;padding:8px 12px;margin:10px 0;text-align:start}
.goals ol{margin:6px 0 6px 22px;padding:0}.goals li{margin:2px 0}
[dir=rtl] .goals ol{margin:6px 22px 6px 0}
ul.earned{list-style:none;padding:0;margin:4px 0;display:grid;gap:3px}
ul.earned li{background:#f3eedc;border-radius:4px;padding:4px 8px}
.grow{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.grow .gw{background:#f3eedc;border-radius:6px;padding:6px 9px}
.grow ul{list-style:none;padding:0;margin:4px 0 0}
.grow li{font-size:14px;color:#8a8370;margin:2px 0}.grow li.on{color:#1f6a2e;font-weight:700}
.hintbtn{font-size:14px!important}

/* ---------- the Grump ---------- */
.bossov .ov-box.roar{animation:roar .45s}
@keyframes roar{0%{box-shadow:0 0 0 0 rgba(220,40,40,.0)}20%{transform:translate(-6px,2px);box-shadow:0 0 0 8px rgba(220,40,40,.55)}40%{transform:translate(6px,-2px)}60%{transform:translate(-4px,1px)}100%{transform:none;box-shadow:0 0 0 0 rgba(220,40,40,0)}}
.bossface.furious{animation:fury .5s infinite;border-color:#b0392b}
@keyframes fury{25%{transform:translate(-2px,0) rotate(-2deg)}75%{transform:translate(2px,0) rotate(2deg)}}
.furious-tag{display:inline-block;background:#b0392b;color:#fff;font-size:12px;padding:2px 6px;border-radius:3px;animation:fury .5s infinite}
.say.grr{color:#8a1c24;font-weight:700;font-style:italic}
.screen:has(.ov:not(.hidden)) .toast{top:auto;bottom:10px} /* while a box is open, messages move to the bottom corner */

.boss-top{position:relative}
.starshot{position:absolute;left:40px;top:120px;font-size:30px;color:#f2c14e;text-shadow:0 0 6px #fff3b0,0 0 2px #22202e;pointer-events:none;animation:starshot .5s ease-in forwards}
@keyframes starshot{0%{transform:translate(220px,40px) rotate(0) scale(.7);opacity:1}85%{transform:translate(0,-80px) rotate(540deg) scale(1.3);opacity:1}100%{transform:translate(0,-80px) rotate(600deg) scale(2);opacity:0}}

/* ✕ to leave a talk */
.talk-head{position:relative}
.talkx{margin-left:auto;font-size:18px;font-weight:700;line-height:1;width:34px;height:34px;border:3px solid var(--ink);border-radius:4px;background:#fff;color:var(--ink);cursor:pointer;flex:none}
.talkx:hover{background:#fde2de}
[dir=rtl] .talkx{margin-left:0;margin-right:auto}

/* ---------- vivid colors: one dial for the whole game picture (map, people, faces, banner) ---------- */
:root{--vivid:saturate(1.45) brightness(1.07) contrast(1.05)}
canvas{filter:var(--vivid)}
/* Christopher's speech bubble on the map */
.cbubble{display:none;position:absolute;z-index:4;max-width:min(330px,80%);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:8px;padding:7px 10px 8px;font-size:15px;line-height:1.35;box-shadow:0 3px 0 rgba(0,0,0,.35);cursor:pointer;animation:pop .18s ease-out}
.cbubble::after{content:'';position:absolute;left:calc(50% - 7px);bottom:-10px;border:7px solid transparent;border-top-color:var(--ink);border-bottom:0}
.cbubble.below::after{bottom:auto;top:-10px;border:7px solid transparent;border-bottom-color:var(--ink);border-top:0}
.cbubble.meet{outline:3px solid var(--gold)}
.cbubble .cb-name{font-weight:700;font-size:12px;color:#7a3b12;margin-bottom:2px}
.cbubble .cb-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
.cbubble .cb-acts .pbtn{font-size:13px;padding:4px 9px;min-height:30px}
.cbubble[dir=rtl]{text-align:right}
.ov .chrisjob,.pp-chris{background:#fff3c4;border:2px solid #e3c25b;border-radius:6px;padding:6px 9px}
.pp-chris{display:flex;gap:8px;align-items:flex-start;margin:10px 0;font-size:14px}
/* the tool bar under the map */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:6px 0 0;padding:6px;background:var(--panel);border:3px solid #000;border-radius:6px}
.toolbar .tslot{position:relative;width:46px;height:46px;padding:0;display:grid;place-items:center;background:var(--panel2);border:3px solid #000;border-radius:6px;cursor:pointer}
.toolbar .tslot canvas{width:32px;height:32px;image-rendering:pixelated}
.toolbar .tslot.on{background:#5a4f9c;outline:3px solid var(--gold)}
.toolbar .tslot i{position:absolute;left:3px;top:1px;font-style:normal;font-size:11px;color:#fff3b0;font-weight:700}
.toolbar .tslot b{position:absolute;right:3px;bottom:1px;font-size:12px;color:#fff;text-shadow:0 1px 0 #000}
.toolbar .tbag{display:flex;gap:10px;margin-inline-start:auto;color:#fff;font-weight:700}
.toolbar .tbag span{display:flex;align-items:center;gap:3px}
.toolbar .tbag canvas{width:24px;height:24px;image-rendering:pixelated}
.toolbar .tcarry{flex-basis:100%;color:var(--text);font-size:14px;background:#2f2a55;border-radius:4px;padding:5px 8px}
.toolbar .tcarry small{color:var(--muted)}
.flyicon{position:fixed;z-index:50;width:24px;height:24px;pointer-events:none;image-rendering:pixelated;transition:left .6s ease-in,top .6s ease-in,opacity .6s ease-in}
.ov .signlist{margin:6px 0;padding-inline-start:22px;font-size:16px;line-height:1.6}
@media (prefers-reduced-motion:reduce){.cbubble{animation:none}.flyicon{display:none}}
.gridlabs{position:absolute;inset:0;pointer-events:none;z-index:3}
.gridlabs .gl{position:absolute;background:rgba(34,32,46,.85);color:#fff3b0;font-weight:700;font-size:13px;line-height:1;padding:3px 5px;border-radius:3px;white-space:nowrap}
.gridlabs .gl.col{transform:translate(-50%,-100%)}
.gridlabs .gl.row{transform:translate(-100%,-50%)}
.ctag{display:none;position:absolute;z-index:4;transform:translateX(-50%);background:var(--ink);color:var(--gold);font-weight:700;font-size:13px;padding:2px 7px;border-radius:3px;pointer-events:none}
/* the atlas page flies home into the Passport */
.pagefly{position:fixed;z-index:60;width:96px;height:96px;image-rendering:pixelated;pointer-events:none;filter:drop-shadow(0 0 10px #fff3b0);transition:left .7s ease-out,top .7s ease-out,transform .7s ease-out,opacity .6s ease-in}
.pagefly.home{transition:left .6s ease-in,top .6s ease-in,transform .6s ease-in,opacity .6s ease-in}
#ww-b-pass.gotpage{animation:gotpage .9s ease-out}
@keyframes gotpage{0%{transform:scale(1)}30%{transform:scale(1.25);background:var(--gold);color:var(--ink)}100%{transform:scale(1)}}
.gridlabs .gl.zone{font-size:12px;background:rgba(34,32,46,.9)}
.gridlabs .gl.thing{font-size:11px;font-weight:600;background:rgba(255,251,232,.92);color:var(--ink);border:1px solid var(--ink);max-width:150px;white-space:normal;text-align:center}
.ov .zchip{display:inline-block;background:#fff3c4;border:2px solid #e3c25b;border-radius:4px;padding:1px 6px;margin:2px}
/* the base camp */
.campcv{display:block;width:100%;max-width:min(640px,calc(42vh * 320 / 176));margin:6px auto;image-rendering:pixelated;border:3px solid var(--ink);border-radius:4px}
.campslots,.campshop,.campown{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.campshop p,.campown p{flex-basis:100%;margin:4px 0 0}
.campslot{width:86px;min-height:58px;font-size:24px;background:#fff3c4;border:2px dashed #b8902a;border-radius:6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center}
.campslot small{font-size:11px;color:#5a4a2a}
.campslot.on{border-style:solid;outline:3px solid var(--gold)}
.campitem{font:inherit;font-size:14px;padding:6px 9px;border:2px solid var(--ink);border-radius:4px;background:#fff;cursor:pointer}
.campitem small{color:#6a5a7a}
.campitem.owned{background:#dff3d8}.campitem:disabled{cursor:default}
.campitem.ghost{background:#f0eef8}
.campmsg{font-weight:700}
.passov .campbtn{margin:8px 0}

/* small windows: panels cover the whole game, not just the little map, so they are easy to read */
@media (max-width:700px),(max-height:560px){.ov{position:fixed;z-index:20}}
/* the tool bar sits inside the map, over its bottom edge (like Stardew Valley); it hops to the top when the hero walks under it */
.screen .toolbar{position:absolute;z-index:3;left:50%;bottom:4px;transform:translateX(-50%);margin:0;max-width:calc(100% - 8px);width:max-content;padding:4px 6px;gap:5px;background:rgba(11,10,20,.78);border:2px solid #000;border-radius:8px;flex-wrap:wrap;justify-content:center}
.screen .toolbar.top{bottom:auto;top:4px}
.screen .toolbar .tslot{width:38px;height:38px;border-width:2px}
.screen .toolbar .tslot canvas{width:26px;height:26px}
.screen .toolbar .tbag{margin-inline-start:6px;gap:7px}
.screen .toolbar .tbag canvas{width:20px;height:20px}
.screen .toolbar .tcarry{order:-1;flex-basis:100%;max-width:min(560px,92vw);font-size:13px;padding:3px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:520px){.screen .toolbar{padding:3px 4px;gap:3px}.screen .toolbar .tslot{width:32px;height:32px}.screen .toolbar .tslot canvas{width:22px;height:22px}.screen .toolbar .tslot i{font-size:9px}.screen .toolbar .tslot b{font-size:10px}.screen .toolbar .tbag{gap:4px}}
/* Christopher's bubble: narrower on small screens; its tail points back at him from whichever side it sits */
.cbubble{max-width:min(330px,58%)}
@media (max-width:520px){.cbubble{font-size:14px;padding:5px 8px 6px;max-width:min(260px,62%)}.cbubble .cb-acts .pbtn{font-size:12px;padding:3px 7px}}
.cbubble.side-l::after,.cbubble.side-r::after{bottom:auto;top:calc(50% - 7px);border:7px solid transparent}
.cbubble.side-l::after{left:auto;right:-10px;border-left-color:var(--ink);border-right:0}
.cbubble.side-r::after{left:-10px;border-right-color:var(--ink);border-left:0}
.ww-help{font-weight:700}

/* map labels shrink with the map so they never pile up on a small screen */
.gridlabs .gl{font-size:clamp(8px,calc(var(--gw,900px) / 72),13px);padding:2px 4px}
.gridlabs .gl.zone{font-size:clamp(8px,calc(var(--gw,900px) / 76),12px)}
.gridlabs .gl.thing{font-size:clamp(8px,calc(var(--gw,900px) / 80),11px);max-width:clamp(70px,calc(var(--gw,900px) / 6),150px)}

/* the bubble's tail points at Christopher, wherever the bubble sits above or below him */
.cbubble:not(.side-l):not(.side-r)::after{left:var(--tx,calc(50% - 7px))}

/* the tool that fits what the hero faces glows; a tool picked for you pops */
.toolbar .tslot.fit{outline:2px dashed var(--gold);animation:fitglow 1s ease-in-out infinite}
@keyframes fitglow{50%{outline-color:#fff}}
.toolbar .tslot.auto{animation:autopop .5s ease-out}
@keyframes autopop{30%{transform:scale(1.25)}}

.dpad .padchris{grid-column:1;grid-row:1;background:#fff3c4;color:var(--ink)}
.dpad .padgoals{grid-column:3;grid-row:1;font-size:18px}

/* the monsoon badge (6.1) and crop seeds in the tool bar */
.seasonbadge{position:absolute;z-index:3;top:6px;left:50%;transform:translateX(-50%);background:rgba(255,243,196,.92);color:var(--ink);border:2px solid #000;border-radius:12px;padding:1px 10px;font-weight:700;font-size:13px;pointer-events:none}
.seasonbadge.wet{background:rgba(143,195,255,.95)}
.toolbar .tslot .tcrop{font-size:20px;line-height:1}

/* the carry line always takes its own full row over the tool slots; the bar sits above map labels */
.screen .toolbar{z-index:4}
.screen .toolbar .tcarry,.ww-frame.narrow .stage>.toolbar .tcarry{flex-basis:100%;max-width:100%;width:0;min-width:100%}
.seasonbadge{left:8px;transform:none}
.toolbar.top~.seasonbadge,.seasonbadge.under{top:auto;bottom:8px}

/* touch screens: everything big enough to tap (36px+) and read (14px+) */
.ww-frame.touch .ov .hint,.ww-frame.touch .ov .small{font-size:14.5px}
@media (pointer:coarse){
  .ov .hint,.ov .small{font-size:14.5px}
  .sw{width:38px;height:38px}
  .langrow .pbtn{min-height:42px;min-width:52px}
  .talkx{width:40px;height:40px}
  .starter{min-height:40px;font-size:15px}
}

/* a phone turned sideways (see G.fit): icons only in one row, the arrow pad on the right of the map */
.ww-frame.side{position:relative}
.ww-frame.side .ww-logo,.ww-frame.side .ww-bar .lbl{display:none}
.ww-frame.side .ww-bar{flex-wrap:nowrap;gap:3px;justify-content:center;padding:2px 4px}
.ww-frame.side .ww-bar .langs,.ww-frame.side .ww-bar .tools{flex-wrap:nowrap;gap:3px}
.ww-frame.side .ww-bar button{padding:3px 7px;font-size:13px}
.ww-frame.side .dpad{position:absolute;right:8px;bottom:8px;margin:0;z-index:5}

/* PLAYTEST-3: Christopher's bubble border matches what he points at (gold goal, green do, blue secret, red danger) */
.cbubble[data-kind=gold]{--cb:#c08a1e}.cbubble[data-kind=green]{--cb:#2e9a46}.cbubble[data-kind=blue]{--cb:#2f7fd1}.cbubble[data-kind=red]{--cb:#c8323a}
.cbubble[data-kind]{border-color:var(--cb)}
.cbubble[data-kind]::after{border-top-color:var(--cb)}
.cbubble[data-kind].below::after,.cbubble[data-kind].dock::after{border-top-color:transparent;border-bottom-color:var(--cb)}
.cbubble[data-kind].side-l::after{border-top-color:transparent;border-left-color:var(--cb)}
.cbubble[data-kind].side-r::after{border-top-color:transparent;border-right-color:var(--cb)}
.cbubble[data-kind] .cb-name{color:var(--cb)}
/* PLAYTEST-3: the one-sentence opening card, and the "walk on" mark in Christopher's welcome */
.introov .say.one{font-size:20px;line-height:1.4;margin:14px 0 6px}
.cbubble .cb-more{font-size:11px;opacity:.65;text-align:end;margin-top:2px}
/* PLAYTEST-3: ⚙ holds Music, Sound, Keys and help, the arrow pad and Full screen */
.ww-bar .gear{position:relative;display:inline-flex}
.ww-bar .gearmenu{display:none;position:absolute;right:0;top:calc(100% + 4px);z-index:20;flex-direction:column;gap:4px;background:#0b0a14;border:3px solid #000;outline:2px solid var(--line);border-radius:6px;padding:6px;min-width:170px}
.ww-bar .gearmenu.on{display:flex}
.ww-bar .gearmenu button{text-align:start;width:100%;min-height:36px}
.ww-bar .gearmenu .lbl{display:inline!important}
[dir=rtl] .ww-bar .gearmenu,.ww-frame[dir=rtl] .gearmenu{right:auto;left:0}
/* the five theme bars: a word under each, tap one for its name and number */
.meter{background:none;border:0;padding:0 2px;color:inherit;cursor:pointer;font:inherit}
.meter .mcol{display:inline-flex;flex-direction:column;align-items:center;gap:1px}
.meter .mlab{font-family:var(--read);font-size:10px;color:var(--muted);line-height:1;white-space:nowrap;max-width:64px;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1100px){.meter .mlab{display:none}}
/* a bigger quest line: the goal right now is the most important words on the screen */
.quest{font-size:16px;padding:5px 10px}
.quest .qnow{color:#fff3b0}
@media (max-width:520px){.quest{font-size:15px}}
/* phones: bigger top buttons for thumbs, and a bigger arrow pad in the space under the map */
@media (pointer:coarse){.ww-bar button{min-height:40px;min-width:40px;font-size:15px}.ww-bar .langs button{min-width:40px}}
.ww-frame.narrow .dpad{grid-template-columns:repeat(3,72px);grid-template-rows:repeat(3,60px);gap:6px;margin:auto auto 10px}
.ww-frame.narrow .dpad button{font-size:26px}
/* PLAYTEST-3: the Now card in the empty side of a wide screen */
.nowcard{display:none;position:absolute;top:0;z-index:3;background:#0b0a14;color:var(--text);border:3px solid #000;outline:2px solid var(--line);border-radius:6px;padding:10px 12px;font-size:14px;line-height:1.45}
.nowcard.on{display:block}
.nowcard .nc-h{font-family:var(--pix);font-size:11px;color:var(--gold);margin-bottom:6px}
.nowcard .nc-goal{font-size:17px;font-weight:700;color:#fff3b0;margin-bottom:6px}
.nowcard .nc-next{font-size:14px;color:#fff;margin-bottom:8px;padding:6px 8px;background:#1d1b2e;border-radius:4px}
.nowcard ol{margin:0;padding-inline-start:20px;color:var(--muted)}.nowcard .qdone{color:#7cc451}.nowcard .qnow{color:#fff;font-weight:700}
.nowcard .nc-scr{margin-top:6px;font-size:13px;color:#c9b064}
/* PLAYTEST-3: 🔊 read aloud */
.speak{background:#fff3c4;border:2px solid var(--ink);border-radius:6px;font-size:16px;line-height:1;padding:4px 6px;cursor:pointer;margin-inline-start:auto;margin-inline-end:6px}
.cbubble .cb-name{display:flex;align-items:center;gap:6px}
.cbubble .speak{font-size:12px;padding:2px 4px;margin-inline-end:0}
.hud-streak{color:#ffb24a;margin-left:8px}
/* PLAYTEST-3: a sideways phone: the tool bar stands in the left margin, beside the map (never over it) */
.ww-frame.side .stage>.toolbar{position:absolute;left:4px;top:4px;transform:none;margin:0;flex-direction:column;flex-wrap:nowrap;gap:4px;padding:4px;z-index:5;max-height:calc(100% - 8px);overflow:auto;width:max-content}
.ww-frame.side .stage>.toolbar .tslot{width:40px;height:40px}
.ww-frame.side .stage>.toolbar .tbag{flex-direction:column;gap:4px;margin:0;font-size:12px}
.ww-frame.side .stage>.toolbar .tcarry{display:none}
/* PLAYTEST-3: on a wide screen (a Chromebook) the frame uses the whole width, so the Now card has room beside the map */
@media (min-width:1280px){.ww-frame{max-width:none}}
/* cut scenes (fun-pass-4): the world map, then one fact card at a time */
.cutov .ov-box{max-width:620px;background:#fffbe8}
.cut-h{font-size:15px;color:#6b5a2a;margin:0 0 8px}
.cut-h b{color:var(--ink)}
.cut-cv{display:block;width:100%;height:auto;image-rendering:pixelated;border:3px solid var(--ink);border-radius:4px;background:#1d4f8a}
.cut-card{display:flex;align-items:flex-start;gap:6px;margin:12px 0 4px;flex-wrap:wrap}
.cut-card p{flex:1 1 80%;font-size:21px;line-height:1.4;margin:0}
.cut-dots{flex-basis:100%;display:flex;gap:6px;justify-content:center;margin-top:8px}
.cut-dots i{width:9px;height:9px;border-radius:50%;background:#d8cfae;border:1px solid #b7a77e}
.cut-dots i.on{background:var(--gold, #f2c14e);border-color:var(--ink)}
@media (max-width:480px){.cut-card p{font-size:18px}}
/* inside a house (fun-pass-4): the person's face, name and one line at a time */
.roomtalk .ov-box{max-width:560px}
.rt-top{display:flex;gap:12px;align-items:flex-start}
.rt-face{width:64px;height:44px;image-rendering:pixelated;border:3px solid var(--ink);border-radius:4px;background:#efe3cf;flex:none}
.rt-name{font-weight:800;color:#6b5a2a;font-size:15px}
.rt-say{font-size:20px;line-height:1.4;margin:4px 0 0}
/* Christopher's corner (fun-pass-4): his portrait and his words beside the map (left), or under it on a phone */
.cpanel{display:none;background:#0b0a14;color:var(--text);border:3px solid #000;outline:2px solid var(--line);border-radius:6px;padding:8px;z-index:3}
.cpanel.on{display:block}
.cpanel.side{position:absolute;top:0}
.cpanel canvas{display:block;image-rendering:pixelated;border:3px solid #c79a3a;border-radius:8px;background:#17152a}
.cpanel.side canvas{width:100%;max-width:176px;height:auto;aspect-ratio:1;margin:0 auto}
.cpanel.dock{display:none;width:var(--gw);margin:8px auto 0;box-sizing:border-box}
.cpanel.dock.on{display:flex;gap:10px;align-items:flex-start}
.cpanel.dock canvas{width:76px;height:76px;flex:none}
.cp-slot{flex:1;min-width:0}
.cpanel.side .cp-slot{margin-top:8px}
.cp-idle{font-size:14px;line-height:1.4;color:#cfc8ff;opacity:.85;padding:4px 2px}
.cbubble.incorner{position:static;max-width:none;width:auto;box-shadow:none;margin:0;animation:none}
.cbubble.incorner::after{display:none}
.cpanel.new{animation:cpnew .9s ease-out}
@keyframes cpnew{0%{outline-color:#fff1a8;box-shadow:0 0 0 6px rgba(242,193,78,.55)}100%{outline-color:var(--line);box-shadow:0 0 0 0 rgba(242,193,78,0)}}
@media (prefers-reduced-motion:reduce){.cpanel.new{animation:none}}
.nowcard.on{overflow:auto}
/* phones: his corner under the map has a fixed height (long words scroll inside it), so the map never resizes when he talks */
.cpanel.dock.on{height:92px;overflow:hidden}
.cpanel.dock .cp-slot{height:100%;overflow:auto;overscroll-behavior:contain}
.cpanel.dock canvas{width:68px;height:68px}
.cpanel.dock .cbubble{font-size:14px;padding:5px 8px}
/* a short screen (a phone turned sideways): the cut scene map gets smaller so the words and buttons still fit */
@media (max-height:480px){.cut-cv{max-height:34vh;width:auto;max-width:100%;margin:0 auto}.cut-card p{font-size:16px}.cutov .ov-box{padding:8px 10px}.cut-h{margin-bottom:4px}}
/* a small phone held upright: a smaller arrow pad, a shorter corner; and nothing under the map may spill onto the pad */
.ww-frame.narrow .stage{overflow:hidden}
.ww-frame.narrow.short .dpad{grid-template-columns:repeat(3,60px);grid-template-rows:repeat(3,48px);gap:5px;margin:auto auto 6px}
.ww-frame.narrow.short .dpad button{font-size:22px}
.ww-frame.short .cpanel.dock.on{height:80px;padding:6px}
.ww-frame.short .cpanel.dock canvas{width:58px;height:58px}
/* a phone turned sideways: the tools in two short columns (all of them reachable, no scrolling), his corner under them */
.ww-frame.side .stage>.toolbar{display:grid;grid-template-columns:repeat(3,40px);overflow:visible;max-height:none}
.ww-frame.side .stage>.toolbar .tbag{grid-column:1 / -1;flex-direction:row;justify-content:center}
.cpanel.lside{position:absolute;left:4px;bottom:4px;padding:5px;overflow:hidden;display:none;box-sizing:border-box}
.cpanel.lside.on{display:flex;gap:6px;align-items:flex-start}
.cpanel.lside canvas{width:40px;height:40px;flex:none;border-width:2px}
.cpanel.lside .cp-slot{max-height:100%;overflow:auto;overscroll-behavior:contain}

.cpanel.lside .cbubble .cb-acts .pbtn{font-size:11px;padding:2px 6px;min-height:26px}
/* the whole episode as a small map (fun-pass-4): in the Now card, and in the ☰ goals */
.nc-mini{margin-top:8px}
.nc-mh{font-size:12px;color:var(--gold);margin-bottom:3px}
canvas.minimap{display:block;width:100%;max-width:240px;height:auto;image-rendering:pixelated;border:2px solid #3a3560;border-radius:4px;background:#17152a}
.qpop canvas.minimap{max-width:200px;margin-top:6px}

.ww-frame.narrow .qpop canvas.minimap,.ww-frame.side .qpop canvas.minimap{max-width:150px}

.ww-frame.narrow .qpop.on{display:grid;grid-template-columns:1fr 112px;column-gap:8px;align-items:start}

/* the guess at the end of a cut scene (fun-pass-4): two big choices, then a short why */
.cut-choices{flex-basis:100%;display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.cut-choices .pbtn.big{font-size:19px;padding:12px 10px;min-height:56px;white-space:normal}

<script>
/* WORLDWALKER engine · art (tiles + characters, all drawn in code)
   (grew out of mockups/kit.js)
   Everything here is drawn in code: no picture files.
   World = <canvas> (pixel art). Words, buttons, HUD = HTML on top (easy to read,
   easy to translate, Dari can run right-to-left).                              */
(function () {
  const T = 16; // one tile = 16 x 16 pixels

  const P = {
    k: '#22202e', // outline
    grass: '#5aa83b', grassD: '#3f8a2e', grassL: '#7cc451',
    water: '#2f7fd1', waterL: '#5fb0ee', waterD: '#1d5aa8', foam: '#d8f0ff',
    sand: '#e8d18a', sandD: '#c9b064',
    path: '#c79a5b', pathD: '#a87c45',
    leaf: '#2e7d32', leafD: '#1b5e20', leafL: '#43a047', trunk: '#6d4c2f',
    stone: '#8a8f98', stoneD: '#5e636b', stoneL: '#b5bac2',
    snow: '#f4f8fb', snowD: '#c9dbe8',
    roof: '#c0392b', roofD: '#8e2a20', wall: '#e9d8b4', wallD: '#c9b48c', wood: '#8b5a2b', woodD: '#5f3d1d',
    soil: '#7a4e2d', soilD: '#5c3a20',
    dFloor: '#3a3550', dFloorL: '#47416a', dWall: '#5b5479', dWallD: '#2b2740',
    gold: '#f2c14e', goldD: '#c08a1e', red: '#e04848', white: '#ffffff', ink: '#2b2b3a',
    dune: '#e9b86a', duneD: '#c98f45'
  };

  // stable "random" from tile position, so every redraw looks the same
  function hash(x, y, s = 0) {
    let h = (x * 374761393 + y * 668265263 + s * 2147483647) | 0;
    h = (h ^ (h >>> 13)) * 1274126177;
    return ((h ^ (h >>> 16)) >>> 0) / 4294967295;
  }
  const R = (c, x, y, w, h, col) => { c.fillStyle = col; c.fillRect(x, y, w, h); };

  /* ---------- tiles ---------- */
  function grassBase(c, x, y, gx, gy) {
    R(c, x, y, T, T, P.grass);
    for (let i = 0; i < 5; i++) {
      const a = hash(gx, gy, i), b = hash(gx, gy, i + 9);
      R(c, x + ((a * 14) | 0), y + ((b * 14) | 0), 1, 2, i % 2 ? P.grassD : P.grassL);
    }
  }
  const tiles = {
    '.': grassBase,
    ',': (c, x, y, gx, gy) => { // flowers
      grassBase(c, x, y, gx, gy);
      const cols = ['#ffe36e', '#ff8fb1', '#ffffff', '#b89cff'];
      for (let i = 0; i < 3; i++) {
        const fx = x + 2 + ((hash(gx, gy, i + 3) * 11) | 0), fy = y + 2 + ((hash(gx, gy, i + 7) * 11) | 0);
        R(c, fx, fy, 2, 2, cols[(hash(gx, gy, i) * 4) | 0]);
      }
    },
    '"': (c, x, y, gx, gy) => { // tall grass
      grassBase(c, x, y, gx, gy);
      for (let i = 0; i < 4; i++) {
        const fx = x + 1 + i * 4;
        R(c, fx, y + 6, 1, 7, P.grassD); R(c, fx + 1, y + 4, 1, 9, P.leafL); R(c, fx + 2, y + 7, 1, 6, P.grassD);
      }
    },
    '~': (c, x, y, gx, gy, t, m) => water(c, x, y, gx, gy, t, m, P.water),
    '=': (c, x, y, gx, gy, t, m) => water(c, x, y, gx, gy, t, m, P.waterD),
    's': (c, x, y, gx, gy) => {
      R(c, x, y, T, T, P.sand);
      for (let i = 0; i < 4; i++) R(c, x + ((hash(gx, gy, i) * 15) | 0), y + ((hash(gx, gy, i + 4) * 15) | 0), 1, 1, P.sandD);
    },
    'u': (c, x, y, gx, gy) => { // dune
      R(c, x, y, T, T, P.dune);
      const o = (hash(gx, gy) * 6) | 0;
      for (let i = 0; i < 16; i++) { const yy = 9 + Math.round(Math.sin((i + o) / 2.6) * 3); R(c, x + i, y + yy, 1, 16 - yy, P.duneD); }
    },
    ':': (c, x, y, gx, gy) => {
      R(c, x, y, T, T, P.path);
      for (let i = 0; i < 5; i++) R(c, x + ((hash(gx, gy, i) * 14) | 0), y + ((hash(gx, gy, i + 5) * 14) | 0), 2, 1, P.pathD);
    },
    'T': (c, x, y, gx, gy) => { // round tree
      grassBase(c, x, y, gx, gy);
      R(c, x + 3, y + 14, 10, 2, 'rgba(0,0,0,.18)');
      R(c, x + 7, y + 10, 2, 5, P.trunk);
      R(c, x + 2, y + 3, 12, 8, P.leaf); R(c, x + 3, y + 1, 10, 11, P.leaf); R(c, x + 1, y + 5, 14, 5, P.leaf);
      R(c, x + 4, y + 2, 4, 3, P.leafL); R(c, x + 3, y + 4, 2, 2, P.leafL);
      R(c, x + 9, y + 8, 4, 2, P.leafD); R(c, x + 4, y + 10, 8, 1, P.leafD);
    },
    'P': (c, x, y, gx, gy, t, m, base) => { // pine
      (base === 'n' ? tiles.n : grassBase)(c, x, y, gx, gy);
      R(c, x + 7, y + 12, 2, 4, P.trunk);
      for (let r = 0; r < 12; r++) { const w = 2 + ((r % 4) + (r >> 2)) * 1.6 | 0; R(c, x + 8 - w, y + 1 + r, w * 2, 1, r % 4 === 3 ? P.leafD : '#25693a'); }
      if (base === 'n') { R(c, x + 6, y + 1, 4, 2, P.snow); R(c, x + 4, y + 5, 3, 1, P.snow); R(c, x + 9, y + 9, 4, 1, P.snow); }
    },
    'p': (c, x, y, gx, gy) => { // palm on sand
      tiles.s(c, x, y, gx, gy);
      for (let i = 0; i < 10; i++) R(c, x + 7 + Math.round(Math.sin(i / 4) * 2), y + 5 + i, 2, 1, P.trunk);
      R(c, x + 2, y + 3, 12, 2, P.leaf); R(c, x + 1, y + 5, 3, 2, P.leaf); R(c, x + 12, y + 5, 3, 2, P.leaf);
      R(c, x + 5, y + 1, 6, 2, P.leafL); R(c, x + 7, y + 5, 2, 2, '#7a4b1e');
    },
    'c': (c, x, y, gx, gy) => { // cactus
      tiles.s(c, x, y, gx, gy);
      R(c, x + 6, y + 2, 4, 13, '#3b8f4a'); R(c, x + 2, y + 6, 3, 5, '#3b8f4a'); R(c, x + 11, y + 4, 3, 5, '#3b8f4a');
      R(c, x + 4, y + 9, 2, 2, '#3b8f4a'); R(c, x + 10, y + 7, 2, 2, '#3b8f4a'); R(c, x + 7, y + 3, 1, 11, '#5fb86c');
    },
    'M': (c, x, y, gx, gy, t, m, base) => mountain(c, x, y, gx, gy, false, base),
    'A': (c, x, y, gx, gy, t, m, base) => mountain(c, x, y, gx, gy, true, base),
    'r': (c, x, y, gx, gy) => {
      grassBase(c, x, y, gx, gy);
      R(c, x + 2, y + 5, 12, 9, P.stoneD); R(c, x + 3, y + 4, 10, 9, P.stone); R(c, x + 4, y + 5, 4, 2, P.stoneL);
    },
    'n': (c, x, y, gx, gy) => {
      R(c, x, y, T, T, P.snow);
      for (let i = 0; i < 3; i++) R(c, x + ((hash(gx, gy, i) * 13) | 0), y + ((hash(gx, gy, i + 3) * 14) | 0), 3, 1, P.snowD);
    },
    'i': (c, x, y, gx, gy) => { R(c, x, y, T, T, '#bfe6f5'); R(c, x + 2, y + 3, 6, 1, '#ffffff'); R(c, x + 9, y + 10, 4, 1, '#ffffff'); },
    'W': (c, x, y, gx, gy) => { // stone wall
      R(c, x, y, T, T, P.stoneD);
      for (let r = 0; r < 4; r++) for (let k = 0; k < 2; k++) {
        const o = r % 2 ? 4 : 0; R(c, x + ((k * 8 + o) % 16), y + r * 4, 7, 3, hash(gx * 3 + k, gy * 4 + r) > .5 ? P.stone : '#7d828b');
      }
    },
    'D': (c, x, y, gx, gy) => { // dungeon wall

  WW.spriteCanvas = (name, pal, scale = 4, crop = 16) => {
    const c = document.createElement('canvas'); c.width = 16 * scale; c.height = crop * scale;
    const x = c.getContext('2d'); x.imageSmoothingEnabled = false;

  /* ---------------- 🔊 read aloud (PLAYTEST-3) ----------------
     The browser's own voices (speechSynthesis). The button only shows when this computer has a voice for the language:
     many Chromebooks have no Dari voice, and an English voice reading Dari letters would only confuse. */
  const VOICE = { en: ['en'], es: ['es'], fa: ['fa', 'prs', 'ps'] };
  WW.voiceFor = (lang = WW.lang) => { try { const vs = speechSynthesis.getVoices(); return vs.find(v => VOICE[lang].some(p => v.lang.toLowerCase().startsWith(p))) || null; } catch (e) { return null; } };
  WW.canSpeak = (lang = WW.lang) => !!(window.speechSynthesis && WW.voiceFor(lang));
  WW.speak = (text) => {
    if (!WW.canSpeak()) return false;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(String(text).replace(/[🧭🧩📜✅❌▶🚶]/gu, '')); const v = WW.voiceFor(); u.voice = v; u.lang = v.lang; u.rate = 0.9; speechSynthesis.speak(u); return true; } catch (e) { return false; }
  };
  try { if (window.speechSynthesis) speechSynthesis.onvoiceschanged = () => { const t = ui.top(); if (t && t.opts.cls === 'talkov') t.render(); }; } catch (e) { }
  WW.speakBtn = (getText) => { if (!WW.canSpeak()) return null; const b = document.createElement('button'); b.className = 'speak'; b.textContent = '🔊'; b.title = T('readAloud'); b.setAttribute('aria-label', T('readAloud')); b.onclick = e => { e.stopPropagation(); WW.speak(getText()); }; return b; };

  /* ---------------- talking to a person ---------------- */

    ui.open({

        const face = WW.spriteCanvas(WW.personSprite ? WW.personSprite(npc) : 'npc', WW.lookPal(npc.look), 4, 11);

        head.appendChild(face);
        head.insertAdjacentHTML('beforeend', `<div><div class="who">${esc(L(npc.name))}</div><div class="role">${esc(L(npc.role))}</div></div>`);
        // ✕ leaves the talk at any time; the person stays not-talked-to until the student finishes
        const x = document.createElement('button'); x.className = 'talkx'; x.textContent = '✕'; x.title = T('leave'); x.setAttribute('aria-label', T('leave'));
        x.onclick = () => h.close();
        const sp = WW.speakBtn(() => [...box.querySelectorAll('.talk-body .say, .talk-body .choices button, .talk-body .fb')].map(e => e.innerText).join('. '));

        box.appendChild(body);
        if (stage === 'read') {
          const ln = lines[page] || {};

          body.innerHTML = `<p class="say">${WW.rich(txt)}</p><p class="hint">${page === 0 && /\[\[/.test(L(ln)) ? esc(T('tapWord')) : ''}</p>`;
          const acts = document.createElement('div'); acts.className = 'acts';
          if (page > 0) acts.appendChild(btn(T('back'), 'ghost', () => { page--; h.render(); }));
          acts.appendChild(btn(page < lines.length - 1 ? T('next') + ' ▶' : (npc.ask ? T('answer') + ' ▶' : npc.doneLabel ? esc(npc.doneLabel) + ' ▶' : T('close')), 'gold', () => {
            WW.sfx('blip');
            if (page < lines.length - 1) { page++; h.render(); }

            b.onclick = () => {

              if (ch.ok) {
                WW.sfx('good'); WW.chris.mood && WW.chris.mood('spin');
                if (!WW.run.asked.has(npc.id)) WW.answered(true, !(WW.run.tries[npc.id] > 0));
                if (!WW.run.asked.has(npc.id)) { WW.run.asked.add(npc.id); WW.gain(a.stat || 'pla', 1, 2, T('why_talk') + ' ' + WW.plain(npc.name)); WW.run.log.push({ who: WW.plain(npc.name), q: WW.plain(a.q), a: WW.plain(ch.t || ch), tries: (WW.run.tries[npc.id] || 0) + 1 }); }
              } else { WW.sfx('bad'); WW.chris.mood && WW.chris.mood('droop'); WW.answered(false); WW.run.tries[npc.id] = (WW.run.tries[npc.id] || 0) + 1; }

  WW.copy = (text) => {
    if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text).catch(() => fallback());
    return Promise.resolve(fallback());
    function fallback() {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); } catch (e) { } ta.remove();
    }
  };

          <h2>${esc(T('done'))}</h2><div class="stars">${'★'.repeat(st)}<span class="dim">${'★'.repeat(3 - st)}</span></div><div class="small">${esc(T('starWhy'))}</div></div></div>`;

        const starter = document.createElement('button'); starter.className = 'starter'; starter.innerHTML = esc(L(ep.reflect.starter)) + '…';
        starter.onclick = () => { const ta = box.querySelector('textarea'); if (!ta.value.trim()) { ta.value = WW.plain(ep.reflect.starter) + ' '; r.reflection = ta.value; } ta.focus(); };
        box.appendChild(starter);

        if (r.newTool) box.insertAdjacentHTML('beforeend', `<div class="newtool">${r.newTool.icon} <b>${esc(T('gotTool'))}:</b> ${esc(L(r.newTool.name))}</div>`);
        const earned = (r.gains || []).filter(g => g.stat).map(g => { const th = WW.THEMES.find(t => t.k === g.stat); return `<li><span style="color:${th.col}">${th.icon}</span> <b>+${g.n} ${esc(L(th.full))}</b> · ${esc(g.why)}</li>`; }).join('');

      }

    { const cf = document.querySelectorAll('.confetti'); if (cf.length) cf[cf.length - 1].style.zIndex = 4; } // behind the panel: never over the typing box
    if (sheet === 'saving') {
      WW.sheetSave(logEntry()).then(res => {
        sheet = res.ok ? 'ok' : 'down'; const t = ui.top(); if (t) t.render();

        if (res.ok) WW.classAtlas().then(d => { board = WW.topBoard(d); const sb = document.querySelector('.finov .savebox'); if (board && sb) sb.insertAdjacentHTML('afterend', board); }).catch(() => { });

  };
  function logEntry() {
    const r = WW.run;

  function workText() {
    const r = WW.run, ep = WW.ep, s = WW.save;
    const en = t => (t && t.en) || WW.plain(t);
    const lines = [];
    lines.push(`${WW.TITLE} — Episode ${ep.id}: ${WW.plain({ en: en(ep.title) })}`);
    lines.push(`Name: ${s.name || ''}   Class: ${s.cls || ''}   Date: ${new Date().toLocaleDateString()}`);
    lines.push(`Stars: ${r.stars} of 3   Atlas scraps: ${r.scraps.size}/${ep.scraps.length}   Hearts lost: ${r.heartsLost}   Hints used: ${r.hints || 0}   Minutes: ${Math.round((Date.now() - r.t0) / 60000)}`);
    lines.push('');
    lines.push('TALKS (question — my answer — tries)');
    r.log.forEach(l => lines.push(`- ${l.who}: ${l.q} — ${l.a} (${l.tries} ${l.tries === 1 ? 'try' : 'tries'})`));
    lines.push('');
    if (WW.quest.on()) lines.push(WW.quest.log());
    lines.push(`CHALLENGE: ${WW.plain(ep.challenge.title)} — solved in ${r.challengeTries} ${r.challengeTries === 1 ? 'try' : 'tries'}`);
    lines.push(`GRUMP TRIAL: ${r.missed.length} missed ${r.missed.length ? '(' + r.missed.map(i => WW.plain(ep.boss.questions[i].q)).join(' | ') + ')' : ''}`);
    lines.push('');
    if (r.guesses && r.guesses.length) { // fun-pass-4: the guesses at the end of the cut scenes
      lines.push(`MY GUESSES (${r.guesses.filter(g => g.ok).length} of ${r.guesses.length} matched)`);
      r.guesses.forEach(g => lines.push(`- ${g.q} — my guess: ${g.a}${g.ok ? ' ✓' : ''}`));
      lines.push('');
    }
    lines.push('REFLECTION');
    lines.push('Q: ' + WW.plain(ep.reflect.q));
    lines.push('A: ' + (r.reflection || '(blank)'));
    lines.push('');
    lines.push('POWERS: ' + WW.THEMES.map(t => `${WW.plain(t.full)} ${s.stats[t.k] || 0}`).join(' · '));
    lines.push('PASSPORT CODE: ' + WW.passportCode());
    return lines.join('\n');
  }
  WW.workText = workText;
})();

/* WORLDWALKER engine · the compass-stone challenges and the Grump trial
   Challenge types (set by ep.challenge.type):
     sort   – put each card in the right group (style:'bands' draws groups as land bands, e.g. elevation)
     order  – tap the cards in the right order
     claim  – choose one option, then back it up with one reason of each kind
     combo  – set switches; some settings work and some do not
     table  – read a small table of facts, answer questions about it
     build  – the stone moved into the world: place signposts where they point (tools.js); fallback: a card version  */
(function () {
  const L = t => WW.L(t), T = k => WW.T(k), esc = s => WW.esc(s), btn = (a, b, c) => WW.btn(a, b, c);
  const shuffle = (a, seed = 7) => { a = a.slice(); let s = seed; for (let i = a.length - 1; i > 0; i--) { s = (s * 9301 + 49297) % 233280; const j = Math.floor((s / 233280) * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  WW.shuffle = shuffle;

  function header(box, ch) {
    const pip = WW.spriteCanvas('stone', { W: '#9aa3ad', G: '#5e636b', y: '#f2c14e', r: '#e04848', n: '#2f6fd6' }, 3); pip.className = 'chface';
    const hd = document.createElement('div'); hd.className = 'ch-head';
    hd.appendChild(pip);
    hd.insertAdjacentHTML('beforeend', `<div><h3>${esc(L(ch.title))}</h3></div>`);
    if (ch.intro) WW.introInto(hd.lastElementChild, ch.intro, ch, box); // long words: one short step at a time
    box.appendChild(hd);
  }
  function solved(h, ch, okText) {
    const r = WW.run;
    if (!r.challengeDone) {
      r.challengeDone = true;
      WW.gain(ch.stat || 'hei', 2, 5, T('why_stone')); WW.sheetSync();
      WW.sfx('win');
      WW.game.onChallengeDone();
    }
    return okText;
  }
  function doneBlock(box, h, ch) {
    const d = document.createElement('div'); d.className = 'fb right';
    d.innerHTML = `<b>${esc(T('allRight'))}</b> ${WW.rich(ch.success || '')}`;
    box.appendChild(d);
    const acts = document.createElement('div'); acts.className = 'acts';
    acts.appendChild(btn(T('cont') + ' ▶', 'gold', () => h.close()));
    box.appendChild(acts);
  }

  /* ---------------- sort ---------------- */
  function sortUI(ch) {
    const place = {}; // item index -> bin id
    let sel = null, checked = false;
    const order = shuffle(ch.items.map((_, i) => i), ch.items.length * 13 + 5);
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        header(box, ch);
        const done = WW.run.challengeDone;
        box.insertAdjacentHTML('beforeend', `<p class="hint">${esc(T('pickItem'))}</p>`);
        const pool = document.createElement('div'); pool.className = 'pool';
        order.filter(i => place[i] == null).forEach(i => pool.appendChild(card(i)));
        box.appendChild(pool);
        const bins = document.createElement('div'); bins.className = 'bins ' + (ch.style === 'bands' ? 'bands' : '');
        ch.bins.forEach(b => {
          const el = document.createElement('div'); el.className = 'bin';
          if (b.tile && ch.style === 'bands') {
            const cv = document.createElement('canvas'); cv.width = 16 * 6; cv.height = 16; cv.className = 'bintile';
            const x = cv.getContext('2d'); for (let i = 0; i < 6; i++) WW.tiles[b.tile](x, i * 16, 0, i, 1, 0);
            el.appendChild(cv);
          }
          el.insertAdjacentHTML('beforeend', `<div class="binlabel">${b.icon ? b.icon + ' ' : ''}${WW.rich(b.label)}${b.sub ? `<span class="small"> · ${WW.rich(b.sub)}</span>` : ''}</div>`);
          const inside = document.createElement('div'); inside.className = 'binin';
          order.filter(i => place[i] === b.id).forEach(i => inside.appendChild(card(i)));
          el.appendChild(inside);
          el.onclick = e => {
            if (e.target.closest('.card') || done) return;
            if (sel != null) { place[sel] = b.id; sel = null; checked = false; WW.sfx('blip'); h.render(); }
          };
          el.classList.toggle('target', sel != null);
          bins.appendChild(el);
        });
        box.appendChild(bins);
        if (done) return doneBlock(box, h, ch);
        const all = Object.keys(place).length === ch.items.length;
        const acts = document.createElement('div'); acts.className = 'acts';
        const cb = btn(T('check'), 'gold', () => {
          checked = true; WW.run.challengeTries++;
          const wrong = ch.items.filter((it, i) => place[i] !== it.bin);
          if (!wrong.length) { solved(h, ch); } else WW.sfx('bad');
          h.render();
        });
        cb.disabled = !all; acts.appendChild(cb);
        box.appendChild(acts);
        if (checked) {
          const wrong = ch.items.map((it, i) => [it, i]).filter(([it, i]) => place[i] !== it.bin);
          if (wrong.length) {
            const fb = document.createElement('div'); fb.className = 'fb wrong';
            fb.innerHTML = `<b>${esc(T('someWrong'))}</b>` + (wrong[0][0].why ? ` ${WW.rich(wrong[0][0].why)}` : '');
            box.appendChild(fb);
          }
        }
        function card(i) {
          const it = ch.items[i];
          const c = document.createElement('button'); c.className = 'card';
          if (sel === i) c.classList.add('sel');
          if (checked && place[i] != null) c.classList.add(place[i] === it.bin ? 'right' : 'wrong');
          c.innerHTML = (it.icon ? `<span class="ic">${it.icon}</span>` : '') + WW.rich(it.t);
          c.onclick = (e) => {
            e.stopPropagation(); if (done) return;
            if (sel != null && sel !== i && place[i] != null) { place[sel] = place[i]; sel = null; } // drop the chosen card into this card's group
            else if (place[i] != null) { delete place[i]; sel = i; } else sel = sel === i ? null : i;
            checked = false; WW.sfx('blip'); h.render();
          };
          c.dataset.i = i;
          return c;
        }
      }
    });
  }

  /* ---------------- order ---------------- */
  function orderUI(ch) {
    let seq = [], checked = false;
    const order = shuffle(ch.items.map((_, i) => i), ch.items.length * 7 + 3);
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        header(box, ch);
        const done = WW.run.challengeDone;
        box.insertAdjacentHTML('beforeend', `<p class="hint">${esc(T('pickOrder'))}</p>`);
        const line = document.createElement('ol'); line.className = 'seq';
        seq.forEach((i, pos) => {
          const li = document.createElement('li');
          li.className = 'card' + (checked ? (i === pos ? ' right' : ' wrong') : '');
          li.innerHTML = (ch.items[i].icon ? `<span class="ic">${ch.items[i].icon}</span>` : '') + WW.rich(ch.items[i].t);
          line.appendChild(li);
        });
        box.appendChild(line);
        const pool = document.createElement('div'); pool.className = 'pool';
        order.filter(i => !seq.includes(i)).forEach(i => {
          const c = document.createElement('button'); c.className = 'card'; c.dataset.i = i;
          c.innerHTML = (ch.items[i].icon ? `<span class="ic">${ch.items[i].icon}</span>` : '') + WW.rich(ch.items[i].t);
          c.onclick = () => { if (done) return; seq.push(i); checked = false; WW.sfx('blip'); h.render(); };
          pool.appendChild(c);
        });
        box.appendChild(pool);
        if (done) return doneBlock(box, h, ch);
        const acts = document.createElement('div'); acts.className = 'acts';
        const cb = btn(T('check'), 'gold', () => {
          checked = true; WW.run.challengeTries++;
          if (seq.every((v, k) => v === k)) solved(h, ch); else WW.sfx('bad');
          h.render();
        });
        cb.disabled = seq.length !== ch.items.length; acts.appendChild(cb);
        acts.appendChild(btn(T('reset'), 'ghost', () => { seq = []; checked = false; h.render(); }));
        box.appendChild(acts);
        if (checked && !WW.run.challengeDone) {
          const first = seq.findIndex((v, k) => v !== k);
          const fb = document.createElement('div'); fb.className = 'fb wrong';
          fb.innerHTML = `<b>${esc(T('wrong'))}</b> ${WW.rich(ch.why || '')} <span class="small">(#${first + 1})</span>`;
          box.appendChild(fb);
        }
      }
    });
  }

  /* a stimulus for an AP-style question: a source excerpt with its author and date, or a small table */
  WW.stimHTML = st => {
    const esc2 = v => WW.rich(v);
    let body = '';
    if (st.text) body += `<div class="stimtext">${esc2(st.text)}</div>`;
    if (st.rows) body += `<table class="stimtab">${st.rows.map((r, i) => `<tr>${r.map(cell => i === 0 ? `<th>${esc2(cell)}</th>` : `<td>${esc2(cell)}</td>`).join('')}</tr>`).join('')}</table>`;
    return `<div class="stim">${st.title ? `<div class="stimtitle">${esc2(st.title)}</div>` : ''}${body}${st.src ? `<div class="stimsrc">${esc2(st.src)}</div>` : ''}</div>`;
  };

  /* ---------------- claim ---------------- */
  function claimUI(ch) {
    let pick = ch.pickAt ?? null, why = {}, checked = false; // pickAt: the site the student is standing at (world version)
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        header(box, ch);
        const done = WW.run.challengeDone;
        box.insertAdjacentHTML('beforeend', `<h4>1 · ${esc(T('choose'))}</h4>`);
        const opts = document.createElement('div'); opts.className = 'opts';
        ch.options.forEach((o, i) => {
          const b = document.createElement('button'); b.className = 'opt' + (pick === i ? ' sel' : ''); b.dataset.i = i;
          b.innerHTML = `<b>${o.icon ? o.icon + ' ' : ''}${WW.rich(o.name)}</b>${o.desc ? `<span>${WW.rich(o.desc)}</span>` : ''}`;
          b.onclick = () => { if (done) return; pick = i; why = {}; checked = false; WW.sfx('blip'); h.render(); };
          opts.appendChild(b);
        });
        box.appendChild(opts);
        if (pick != null) {
          box.insertAdjacentHTML('beforeend', `<h4>2 · ${esc(T('because'))}</h4>`);
          ch.kinds.forEach(k => {
            const grp = document.createElement('div'); grp.className = 'kind';
            grp.innerHTML = `<div class="klabel">${WW.rich(k.label)}</div>`;
            ch.reasons.forEach((r, ri) => {
              if (r.kind !== k.id) return;
              const b = document.createElement('button'); b.className = 'reason' + (why[k.id] === ri ? ' sel' : ''); b.dataset.r = ri;
              if (checked && why[k.id] === ri) b.classList.add(r.fits.includes(pick) ? 'right' : 'wrong');
              b.innerHTML = WW.rich(r.t);
              b.onclick = () => { if (done) return; why[k.id] = why[k.id] === ri ? null : ri; checked = false; WW.sfx('blip'); h.render(); }; // tap again to un-pick
              grp.appendChild(b);
            });
            box.appendChild(grp);
          });
        }
        if (done) {
          const o = ch.options[pick ?? WW.run.claimPick ?? 0];
          if (o && o.result) box.insertAdjacentHTML('beforeend', `<div class="fb right">${WW.rich(o.result)}</div>`);
          return doneBlock(box, h, ch);
        }
        const ready = pick != null && ch.kinds.every(k => why[k.id] != null);
        const acts = document.createElement('div'); acts.className = 'acts';
        const cb = btn(T('check'), 'gold', () => {
          checked = true; WW.run.challengeTries++;
          const ok = ch.kinds.every(k => ch.reasons[why[k.id]].fits.includes(pick));
          if (ok) { WW.run.claimPick = pick; solved(h, ch); } else WW.sfx('bad');
          h.render();
        });
        cb.disabled = !ready; acts.appendChild(cb);
        box.appendChild(acts);
        if (checked && !WW.run.challengeDone) {
          const bad = ch.kinds.map(k => ch.reasons[why[k.id]]).find(r => !r.fits.includes(pick));
          box.insertAdjacentHTML('beforeend', `<div class="fb wrong"><b>${esc(T('wrong'))}</b> ${WW.rich(ch.mismatch || '')} ${bad && bad.why ? WW.rich(bad.why) : ''}</div>`);
        }
      }
    });
  }

  /* ---------------- combo ---------------- */
  function comboUI(ch) {
    const set = ch.switches.map(s => s.start || 0);
    let tried = false;
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        header(box, ch);
        const done = WW.run.challengeDone;
        const sw = document.createElement('div'); sw.className = 'switches';
        ch.switches.forEach((s, i) => {
          const g = document.createElement('div'); g.className = 'sw-g';
          g.innerHTML = `<div class="klabel">${s.icon ? s.icon + ' ' : ''}${WW.rich(s.name)}</div>`;
          s.states.forEach((st, k) => {
            const b = document.createElement('button'); b.className = 'reason' + (set[i] === k ? ' sel' : ''); b.dataset.s = i + ':' + k;
            b.innerHTML = WW.rich(st);
            b.onclick = () => { if (done) return; set[i] = k; tried = false; WW.sfx('blip'); h.render(); };
            g.appendChild(b);
          });
          sw.appendChild(g);
        });
        box.appendChild(sw);
        const key = set.join(',');
        const res = ch.results[key] || ch.otherwise || { t: '' , ok: false };
        if (res.show) {
          const out = document.createElement('div'); out.className = 'outs';
          res.show.forEach(o => out.insertAdjacentHTML('beforeend', `<span class="out ${o.ok ? 'good' : 'badp'}">${o.icon || ''} ${WW.rich(o.t)}</span>`));
          box.appendChild(out);
        }
        if (done) return doneBlock(box, h, ch);
        const acts = document.createElement('div'); acts.className = 'acts';
        acts.appendChild(btn(T('check'), 'gold', () => {
          tried = true; WW.run.challengeTries++;
          if (res.ok) solved(h, ch); else WW.sfx('bad');
          h.render();
        }));
        box.appendChild(acts);
        if (tried && !WW.run.challengeDone) box.insertAdjacentHTML('beforeend', `<div class="fb wrong"><b>${esc(T('wrong'))}</b> ${WW.rich(res.t)}</div>`);
      }
    });
  }

  /* ---------------- table ---------------- */
  function tableUI(ch) {
    let qi = 0, picked = null;
    WW.ui.open({
      cls: 'chov',
      render(box, h) {
        header(box, ch);
        const done = WW.run.challengeDone;
        let t = '<div class="tblwrap"><table class="dtbl"><thead><tr>' + ch.table.head.map(c => `<th>${WW.rich(c)}</th>`).join('') + '</tr></thead><tbody>';
        ch.table.rows.forEach(r => (t += '<tr>' + r.map(c => `<td>${WW.rich(c)}</td>`).join('') + '</tr>'));
        t += '</tbody></table></div>';
        if (ch.table.note) t += `<p class="small">${WW.rich(ch.table.note)}</p>`;
        box.insertAdjacentHTML('beforeend', t);
        if (done) return doneBlock(box, h, ch);
        const q = ch.questions[qi]; box.dataset.q = qi;
        box.insertAdjacentHTML('beforeend', `<h4>${qi + 1} / ${ch.questions.length}</h4><p class="say q">${WW.rich(q.q)}</p>`);
        const list = document.createElement('div'); list.className = 'choices';
