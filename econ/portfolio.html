od: pick the axe (2) and face a small tree or bush, then press Space.",es:"Consigue madera: elige el hacha (2), mira a un árbol pequeño o arbusto y pulsa Espacio.",fa:"چوب بگیر: تبر (۲) را انتخاب کن، رو به درخت کوچک یا بوته بایست و Space را بزن."},how_fiber:{en:"Get fiber: pick the sickle (3) and face tall grass, then press Space.",es:"Consigue fibra: elige la hoz (3), mira al pasto alto y pulsa Espacio.",fa:"الیاف بگیر: داس (۳) را انتخاب کن، رو به علف بلند بایست و Space را بزن."},axeWhat:{en:"The axe works on small trees and bushes. Face one and press Space.",es:"El hacha sirve para árboles pequeños y arbustos. Mira a uno y pulsa Espacio.",fa:"تبر برای درخت‌های کوچک و بوته‌هاست. رو به یکی بایست و Space را بزن."},borderTree:{en:"This tree keeps the edge of the map safe, so we leave it. Try a tree inside the map.",es:"Este árbol cuida el borde del mapa, así que lo dejamos. Prueba con un árbol de adentro.",fa:"این درخت لبهٔ نقشه را نگه می‌دارد، پس آن را نمی‌بُریم. یک درخت داخل نقشه را امتحان کن."},sickleWhat:{en:"The sickle cuts tall grass and picks ripe crops. Face one and press Space.",es:"La hoz corta pasto alto y cosecha. Mira uno y pulsa Espacio.",fa:"داس علف بلند را می‌بُرد و محصول رسیده را می‌چیند. رو به یکی بایست و Space را بزن."},noSeeds:{en:"No seeds yet. Cut tall grass with the sickle: sometimes a seed falls out.",es:"Aún no tienes semillas. Corta pasto alto con la hoz: a veces sale una semilla.",fa:"هنوز تخم نداری. علف بلند را با داس ببُر: گاهی یک تخم بیرون می‌افتد."},needSoil:{en:"Seeds need farm soil: the brown rows by the farm.",es:"Las semillas necesitan tierra de cultivo: las filas cafés de la granja.",fa:"تخم‌ها خاک مزرعه لازم دارند: ردیف‌های قهوه‌ای کنار مزرعه."},planted:{en:"Planted! Come back in a little while.",es:"¡Sembrado! Vuelve en un rato.",fa:"کاشته شد! کمی بعد برگرد."},notRipe:{en:"Not ripe yet. Wait until it turns gold.",es:"Todavía no está listo. Espera a que se ponga dorado.",fa:"هنوز نرسیده. صبر کن تا طلایی شود."},why_harvest:{en:"harv
